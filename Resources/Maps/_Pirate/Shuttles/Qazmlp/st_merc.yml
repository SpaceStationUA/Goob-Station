      content: >2
                                          Кодекс найманця

        -Найманець не має права позбавляти життя особу, яка не несе для нього жодної загрози та не є ціллю, за яку було заплачено.


        -Найманець може виконувати майже будь-яку роботу за розумну винагороду.


        -Найманець має право відхилити замовлення, але після відмови він зобов’язаний повернути всі кошти, надані замовником.

        Виключення: якщо виконано половину завдання, найманець повертає 50% від сплаченої суми.


        -Найманцю категорично забороняється розголошувати ім’я замовника.

        Виключення: наявність прямого дозволу замовника на розкриття його особи.


        -Найманець має право на вільне пересування станцією з не більше ніж трьома видами озброєння.

        Виключення: бензопила та ножі.


        -Найманець може відкрити вогонь по особі, яка безпосередньо загрожує його життю.


        -Найманець має право самостійно обирати, яке завдання виконувати.


        -У разі порушення будь-якого з пунктів контракт із чорним ринком буде розірвано, а на найманця накладено санкції.
