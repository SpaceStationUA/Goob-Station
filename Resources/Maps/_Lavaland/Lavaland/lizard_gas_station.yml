      pos: 9.287701,7.465007
      parent: 1
    - type: Paper
      content: >-
        Привіт, офіційний член команди Lizard Gas! У кімнаті, де ви знайшли цього листа, стоїть плазмовий генератор, що може забезпечити заправку енергією. Встановіть його поза заправкою, а НЕ ВСЕРЕДИНІ, і покладіть туди стопку плазми, які Nanotrasen так люб'язно продав нам, і увімкніть його...


