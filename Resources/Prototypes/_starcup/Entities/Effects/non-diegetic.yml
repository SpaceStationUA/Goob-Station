- type: entity
  id: EffectNonDiegeticBase
  abstract: true
  name: "миттєвий ефект"
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _starcup/Effects/non-diegetic.rsi
    layers:
    - map: [ "effect" ]
      state: exclamation
      offset: 0,0.3
      shader: unshaded
    drawdepth: Overlays
  - type: TimedDespawn
    lifetime: 0.8
  - type: EmitSoundOnSpawn
    sound:
      collection: WindChime

- type: entity
  parent: EffectNonDiegeticBase
  id: EffectNonDiegeticExclamationMark
  description: "Коротка анімація. Може використовуватися, щоб попередити гравців про щось важливе."
  suffix: Exclamation
  components:
  - type: Sprite
    layers:
    - map: [ "effect" ]
      state: exclamation
      offset: 0,0.3
      shader: unshaded

- type: entity
  parent: EffectNonDiegeticBase
  id: EffectNonDiegeticQuestionMark
  description: "Коротка анімація. Може використовуватися, щоб вказати на підказку."
  suffix: Question
  components:
  - type: Sprite
    layers:
    - map: [ "effect" ]
      state: question
      offset: 0,0.3
      shader: unshaded

- type: entity
  parent: EffectNonDiegeticBase
  id: EffectNonDiegeticCheckmark
  description: "Коротка анімація. Може використовуватися, щоб позначити виконану ціль."
  suffix: Check
  components:
  - type: Sprite
    layers:
    - map: [ "effect" ]
      state: checkmark
      offset: 0,0.3
      shader: unshaded

- type: entity
  parent: EffectNonDiegeticBase
  id: EffectNonDiegeticXMark
  description: "Коротка анімація. Може використовуватися, щоб відвести гравців від хибного шляху чи висновку."
  suffix: X-mark
  components:
  - type: Sprite
    layers:
    - map: [ "effect" ]
      state: cross
      offset: 0,0.3
      shader: unshaded

- type: entity
  parent: EffectNonDiegeticBase
  id: EffectNonDiegeticHourglass
  description: "Коротка анімація. Може використовуватися, щоб повідомити гравцям чекати, а НЕ квапити їх."
  suffix: Hourglass
  components:
  - type: Sprite
    layers:
    - map: [ "effect" ]
      state: hourglass
      offset: 0,0.3
      shader: unshaded

- type: entity
  parent: EffectNonDiegeticBase
  id: EffectNonDiegeticSkull
  description: "Коротка анімація. Може використовуватися, щоб позначити серйозну небезпеку або точку неповернення."
  suffix: Skull
  components:
  - type: Sprite
    layers:
    - map: [ "effect" ]
      state: skull
      offset: 0,0.3
      shader: unshaded

- type: entity
  parent: EffectNonDiegeticBase
  id: EffectNonDiegeticRipple
  description: "Коротка анімація. Може використовуватися, щоб привернути увагу."
  suffix: Ripple
  components:
  - type: Sprite
    layers:
    - map: [ "effect" ]
      state: ripple
      offset: 0,0
      shader: unshaded
  - type: TimedDespawn
    lifetime: 0.9
