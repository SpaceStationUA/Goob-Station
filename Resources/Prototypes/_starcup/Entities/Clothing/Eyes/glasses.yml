## Rimless Glasses
- type: entity
  parent: ClothingEyesGlassesRimless
  id: ClothingEyesGlassesRimlessBlue
  name: blue rimless glasses
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#2C82D3"
      right:
      - state: inhand-right
        color: "#2C82D3"
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
        color: "#2C82D3"
      eyes:
      - state: equipped-EYES
        color: "#2C82D3"
  - type: Sprite
    color: "#2C82D3"

