  name: plain gray cloak
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#686859"
      right:
      - state: inhand-right
        color: "#686859"
  - type: Clothing
    clothingVisuals:
      neck:
      - state: equipped-NECK
        color: "#686859"
  - type: Sprite
    color: "#686859"
