# Pirate: ported from starcup PR #984 (feat: Fashionable Neckwear)

# Plain Cloaks
- type: entity
  parent: ClothingNeckCloakColorable
  id: ClothingNeckCloakColorableBlack
  name: plain black cloak
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#373737"
      right:
      - state: inhand-right
        color: "#373737"
  - type: Clothing
    clothingVisuals:
      neck:
      - state: equipped-NECK
        color: "#373737"
  - type: Sprite
    color: "#373737"

- type: entity
