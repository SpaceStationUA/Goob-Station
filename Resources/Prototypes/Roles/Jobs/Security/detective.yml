- type: job
  id: Detective
  name: job-name-detective
  description: job-description-detective
  playTimeTracker: JobDetective
  requirements:
  - !type:RoleTimeRequirement
    role: JobSecurityOfficer
    time: 5h
  - !type:TraitsRequirement # Pirate
    inverted: true
    traits:
    - Foreigner
    - ForeignerLight
    - DeafTrait
    - MovementImpaired
    - Blindness
    - Narcolepsy
    - Muted
    - WheelchairBound # Pirate end
  # Pirate Employment start
  - !type:CharacterEmployerRequirement
    employers:
    - NanoTrasen
    - Idris
    - Zavod
    - PMCG
  # Pirate Employment end
  startingGear: DetectiveGear
  icon: "JobIconDetective"
  ransomModifier: 2 # Pirate: security staff are worth less than heads
  supervisors: job-supervisors-hos
  canBeAntag: false
  guides: # goobstation
  - Forensics
  - Security
  - DetectiveSOP
  goobcoins: 30 #Goob content
  access:
  - Security
  - Brig
  - Maintenance
  - Detective
  - Cryogenics
  - External
  special:
  # Pirate: skill chips start
  - !type:OrganChipsSpecial
    chips:
    - SkillChipSecurityEducation # Pirate: security combat chips
    - SkillChipDetective # Pirate: security combat chips
  # Pirate: skill chips end
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial # goobstation
    components:
      - type: SecurityStaff

- type: startingGear
  id: DetectiveGear
  equipment:
    eyes: ClothingEyesGlassesSecurity
    id: DetectivePDA
    #gloves: ClothingHandsGlovesForensic - Goobstation, moved to loadouts
    ears: ClothingHeadsetAltSecurityRegular # Goobstation
  storage:
    back:
    - Flash
    - BaseSeclinkRadio # Pirate: SecLink for security staff
    - ForensicPad
    - ForensicScanner
    - ClothingMaskGasSecurity # Goobstation
    - PhotoCameraFilled # Pirate: camera
    - CameraFilm # Pirate: camera

- type: chameleonOutfit
  id: DetectiveChameleonOutfit
  job: Detective
  hasMindShield: true
  equipment:
    head: ClothingHeadHatFedoraBrown
    mask: ClothingMaskGasSecurity
    neck: ClothingNeckTieDet
    gloves: ClothingHandsGlovesForensic
