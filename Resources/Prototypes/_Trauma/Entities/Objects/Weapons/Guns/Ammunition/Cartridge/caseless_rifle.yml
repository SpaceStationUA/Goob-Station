- type: entity
  parent: BaseCartridgeCaselessRifle
  id: CartridgeCaselessRifleTranquilizer
  name: "набій (.25 безгільзовий транквілізатор)"
  description: "Малокаліберний набій, що використовує безгільзову технологію: замість звичайної латунної гільзи застосовано затверділий метальний заряд. Резервуар вводить у ціль суміш седативної речовини й німого токсину для справді безшумного усунення."
  components:
  - type: CartridgeAmmo
    proto: BulletCaselessRifleTranquilizer
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#49cece"
  - type: ChemicalAmmo
  - type: SolutionContainerManager
    solutions:
      ammo:
        reagents:
        - ReagentId: Nocturine
          Quantity: 2.5
        - ReagentId: MuteToxin
          Quantity: 1
  - type: SolutionTransfer
    maxTransferAmount: 3.5

- type: entity
  parent: BaseCartridgeCaselessRifle
  id: CartridgeCaselessRiflePoison
  name: "набій (.25 безгільзовий токсин)"
  description: "Малокаліберний набій, що використовує безгільзову технологію: замість звичайної латунної гільзи застосовано затверділий метальний заряд. Токсичний заряд повільно вбиває ціль."
  components:
  - type: CartridgeAmmo
    proto: BulletCaselessRiflePoison
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: tip
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: "#5f959c"
  - type: ChemicalAmmo
  - type: SolutionContainerManager
    solutions:
      ammo:
        reagents:
        - ReagentId: Lexorin
          Quantity: 1.5
  - type: SolutionTransfer
    maxTransferAmount: 1.5
