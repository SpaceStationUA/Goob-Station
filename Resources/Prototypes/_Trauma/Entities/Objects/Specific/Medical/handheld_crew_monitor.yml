- type: entity
  parent: [ BaseSyndicateContraband, HandheldCrewMonitor ]
  id: SyndiCrewMonitor
  name: "монітор екіпажу Синдикату"
  description: "Версія монітора екіпажу для Синдикату, що перехоплює інформацію із сервера."
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/syndihandheldcrewmonitor.rsi
    layers:
    - state: syndiscanner
  - type: Item
    sprite: Objects/Specific/Medical/syndihandheldcrewmonitor.rsi
    heldPrefix: syndiscanner
    storedSprite: null
  - type: PowerCellDraw
    useCharge: 0

- type: entity
  parent: SyndiCrewMonitor
  id: SyndiCrewMonitorEmpty
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
