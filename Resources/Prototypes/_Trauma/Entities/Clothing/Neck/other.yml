- type: entity
  parent: [ ClothingNeckBase, BaseSyndicateContraband ] # TODO: Make it ClothingNeckUnbutcherableBase once upstream happens
  id: ClothingNeckBombCollar
  name: "вибуховий нашийник"
  description: "Нашийник із бомбою, що вибухає."
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Trauma/Clothing/Neck/bombcollar.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/Neck/bombcollar.rsi
    stripDelay: 10
    equipDelay: 5
  - type: SelfUnremovableClothing
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Minibomb
    maxIntensity: 30 # Pirate edit - was 50
    intensitySlope: 20
    totalIntensity: 25 # Pirate edit - was 100
    canCreateVacuum: false
  - type: TriggerOnSignal
  - type: DeviceLinkSink
    ports:
    - Trigger

- type: entity
  parent: [ ClothingNeckBase, SurveillanceWirelessCameraBodyEntertainment, BaseSyndicateContraband ] # TODO: Make it ClothingNeckUnbutcherableBase once upstream happens
  id: ClothingNeckSlayerCoat
  name: "плащ «Слеєр»"
  description: "Синдикатський легкоброньований, але вибухостійкий плащ, або скорочено «Слеєр», є єдиним плащем Мародерів Горлексу, здатним захистити кінцівки власника від вибухової шкоди, якщо носити його на плечах. Його внутрішня сторона вкрита гачками. Оснащений фірмовою технологією, яка дає змогу під'єднуватися до систем НаноТрейзен, наприклад камер. Не для слабкодухих. Використовується, щоб розважати й відволікати екіпаж, поки ви робите те, що необхідно."
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _Trauma/Clothing/Neck/slayer_coat.rsi
  - type: Clothing
    sprite: _Trauma/Clothing/Neck/slayer_coat.rsi
  - type: SelfUnremovableClothing
  - type: FactionClothing
    faction: Syndicate
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Tail
    - Arm
    - Leg
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
        Heat: 0.95
  - type: ExplosionResistance
    damageCoefficient: 0.3
  - type: SurveillanceCamera
    id: Slayer
  - type: TelecomExempt
  - type: RadioMicrophone
    broadcastChannel: RadioShow
    listenRange: 1
    enabled: false
    toggleOnInteract: true
    unobstructedRequired: true
