- type: entity
  id: BaseDionaOrganUnGibbable
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Diona/organs.rsi
  - type: Organ
    intCap: 120
    integrity: 120
    integrityThresholds:
      Normal: 120
      Damaged: 75
      Destroyed: 0
  - type: Edible
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionContainerManager
    solutions:
      organ:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      food:
        maxVol: 5
        reagents:
        - ReagentId: Cellulose
          Quantity: 5
  - type: FlavorProfile
    flavors:
      - people
  - type: Tag # goob edit
    tags:
    - Meat
    - Organ

- type: entity
  id: BaseDionaOrgan
  parent: BaseDionaOrganUnGibbable
  abstract: true
  components:
  - type: Gibbable
  - type: PhysicalComposition #Goobstation - Recycle update
    materialComposition:
      Biomass: 5

- type: entity
  id: OrganDionaBrain
  parent: BaseDionaOrganUnGibbable
  name: "мозок"
  description: "Центральний осередок псевдоневрологічної активності діони, її коренеподібні вусики шукають своє колишнє тіло."
  components:
  - type: MindContainer # Goob start
  - type: MindExaminable
    state: Catatonic # modified component on spawn otherwise
  - type: Speech
    enabled: false
  - type: TypingIndicator
    proto: empty
  - type: Emoting
    enabled: false # Goob end
  - type: Item
    size: Small
    heldPrefix: brain
  - type: Sprite
    state: brain
  - type: Organ # Shitmed
    intCap: 140
    integrity: 140
    integrityThresholds:
      Normal: 140
      Damaged: 80
      Destroyed: 0
    slotId: brain
  - type: Brain # Shitmed
  - type: SolutionContainerManager
    solutions:
      organ:
        maxVol: 20 # goob edit
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Cognizine # goob edit
          Quantity: 5 # goob edit
        - ReagentId: GreyMatter #Goob
          Quantity: 5 #Goob
      Lung:
        maxVol: 100
        canReact: False
      food:
        maxVol: 15 #Goob
        reagents:
        - ReagentId: Nutriment #Goob
          Quantity: 10 #Goob
        - ReagentId: GreyMatter
          Quantity: 5
  - type: Tag # goob edit
    tags:
    - Meat
    - Organ
    - Brain
  - type: NerveSystem # backmen: wounding
  - type: ConsciousnessRequired
    identifier: "nerveSystem"

- type: entity
  id: OrganDionaEyes
  parent: BaseDionaOrgan
  name: "очі"
  description: "Я тебе бачу!"
  components:
  - type: Sprite
    layers:
      - state: eyeball-l
      - state: eyeball-r
  - type: Organ # Shitmed
    intCap: 85 # dionas will have better eyes. :fort:
    integrity: 85
    integrityThresholds:
      Normal: 85
      Damaged: 40
      Destroyed: 0
    slotId: eyes
  - type: Tag # goob edit
    tags:
    - Meat
    - Organ
    - Eyes

- type: entity
  id: OrganDionaStomach
  parent: BaseDionaOrgan
  name: "шлунок"
  description: "Еквівалент шлунку діони, пахне спаржею та оцтом."
  components:
  - type: Sprite
    state: stomach
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: Cellulose
          Quantity: 5
  - type: Organ # Shitmed
    intCap: 175
    integrity: 175
    integrityThresholds:
      Normal: 175
      Damaged: 95
      Destroyed: 0
    slotId: stomach
  - type: Stomach
  - type: Metabolizer
    maxPoisonsProcessable: 6
    metabolizerTypes: [ Plant ]
    removeEmpty: true
    groups:
      - id: Food
      - id: Drink
      - id: Medicine
      - id: Poison
      - id: Narcotic
      - id: Alcohol
  - type: Tag # goob edit
    tags:
    - Meat
    - Organ
    - Stomach
  - type: Item
    size: Small
    heldPrefix: stomach

- type: entity
  id: OrganDionaLungs
  parent: BaseDionaOrgan
  name: "легені"
  description: "Губчастий безлад слизових, схожих на листя структур. Здатні дихати як вуглекислим газом, так і киснем."
  components:
  - type: Sprite
    state: lungs
  - type: Organ # Shitmed
    intCap: 105
    integrity: 105
    integrityThresholds:
      Normal: 105
      Damaged: 60
      Destroyed: 0
    slotId: lungs
  - type: Item
    size: Small
    heldPrefix: lungs
  - type: Lung
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: "Lung"
    metabolizerTypes: [ Plant ]
    groups:
    - id: Gas
      rateModifier: 100.0
  - type: SolutionContainerManager
    solutions:
      organ:
        maxVol: 10
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      Lung:
        maxVol: 100
        canReact: False
      food:
        maxVol: 5
        reagents:
        - ReagentId: Cellulose
          Quantity: 5
  - type: Tag # goob edit
    tags:
    - Meat
    - Organ
    - Lungs

# Organs that turn into nymphs on removal
- type: entity
  id: OrganDionaBrainNymph
  parent: OrganDionaBrain
  categories: [ HideSpawnMenu ]
  name: "мозок"
  description: "Джерело неймовірного, нескінченного інтелекту. Хонк."
  components:
  - type: Brain
  - type: Nymph # This will make the organs turn into a nymph when they're removed.
    entityPrototype: OrganDionaNymphBrain
    transferMind: true
  - type: Tag # goob edit
    tags:
    - Meat
    - Organ
    - Brain


- type: entity
  id: OrganDionaStomachNymph
  parent: OrganDionaStomach
  categories: [ HideSpawnMenu ]
  name: "шлунок"
  description: "Гидота. Це складно переварити."
  components:
  - type: Nymph
    entityPrototype: OrganDionaNymphStomach
  - type: Tag # goob edit
    tags:
    - Meat
    - Organ
    - Stomach

- type: entity
  id: OrganDionaLungsNymph
  parent: OrganDionaLungs
  categories: [ HideSpawnMenu ]
  name: "легені"
  description: "Фільтрують кисень з атмосфери, який потім потрапляє в кровотік і використовується як переносник електронів."
  components:
  - type: Nymph
    entityPrototype: OrganDionaNymphLungs
  - type: Tag # goob edit
    tags:
    - Meat
    - Organ
    - Lungs

# Nymphs that the organs will turn into
- type: entity
  id: OrganDionaNymphBrain
  parent: MobDionaNymph
  categories: [ HideSpawnMenu ]
  name: "німфа діони"
  suffix: Brain
  description: "Містить мозок колись повністю сформованої Діони. Вбивство цього вб'є Діону назавжди. Ти монстр."
  components:
  - type: IsDeadIC
  - type: Body
    prototype: AnimalNymphBrain

- type: entity
  id: OrganDionaNymphStomach
  parent: MobDionaNymphAccent
  categories: [ HideSpawnMenu ]
  name: "німфа діони"
  suffix: Stomach
  description: "Містить шлунок колись повністю сформованої Діони. Від цього він не стає смачнішим."
  components:
  - type: IsDeadIC
  - type: Body
    prototype: AnimalNymphStomach

- type: entity
  id: OrganDionaNymphLungs
  parent: MobDionaNymphAccent
  categories: [ HideSpawnMenu ]
  name: "німфа діони"
  suffix: Lungs
  description: "Містить легені колись повністю сформованої Діони. Захоплює дух."
  components:
  - type: IsDeadIC
  - type: Body
    prototype: AnimalNymphLungs
