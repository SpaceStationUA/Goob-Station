- type: entity
  id: OrganDwarfHeart
  parent: OrganHumanHeart
  name: "серце дворфа"
  components:
  - type: Metabolizer
    metabolizerTypes: [Dwarf]

- type: entity
  id: OrganDwarfLiver
  parent: OrganHumanLiver
  name: "печінка дворфа"
  components:
  - type: Metabolizer
    metabolizerTypes: [Dwarf]

- type: entity
  id: OrganDwarfStomach
  parent: OrganHumanStomach
  name: "шлунок дворфа"
  components:
  - type: Sprite
    state: stomach
  - type: Organ
    intCap: 190
    integrity: 190
    integrityThresholds:
      Normal: 190
      Damaged: 110
      Destroyed: 0
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 75
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Stomach
  - type: Metabolizer
    # mm very yummy
    maxPoisonsProcessable: 5
    metabolizerTypes: [Dwarf]
