# Actions
- type: entity
  parent: BaseMentalAction
  id: ActionExitConsole
  name: "Вийти "
  description: "Вийти з консолі"
  components:
  - type: Action
    checkCanInteract: false
    priority: -20
    itemIconStyle: BigAction
    icon:
      sprite: _Shitmed/Interface/Actions/actions_abductor.rsi
      state: exit
  - type: InstantAction
    event: !type:ExitConsoleEvent

- type: entity
  parent: BaseMentalAction
  id: ActionSendYourself
  name: "Надслати себе"
  description: "Щоб скористатися цією здатністю, вам потрібно прискоритися до тієї самої мапи, що й станція!"
  components:
  - type: Action
    itemIconStyle: BigAction
    checkCanInteract: false
    icon:
      sprite: _Shitmed/Interface/Actions/actions_abductor.rsi
      state: send-yourself
    useDelay: 10
    priority: -19
  - type: TargetAction
    checkCanAccess: false
    range: -1
  - type: WorldTargetAction
    event: !type:SendYourselfEvent

# Pirate: multiz (start)
- type: entity
  parent: BaseMentalAction
  id: ActionAbductorViewUp
  name: "Переглянути поверх вище"
  description: "Перемістити оглядову камеру на поверх вище."
  components:
  - type: Action
    checkCanInteract: false
    priority: -18
    itemIconStyle: BigAction
    icon:
      sprite: _Pirate/Actions/misc.rsi
      state: up
  - type: InstantAction
    event: !type:CEZViewUpEvent

- type: entity
  parent: BaseMentalAction
  id: ActionAbductorViewDown
  name: "Переглянути поверх нижче"
  description: "Перемістити оглядову камеру на поверх нижче."
  components:
  - type: Action
    checkCanInteract: false
    priority: -17
    itemIconStyle: BigAction
    icon:
      sprite: _Pirate/Actions/misc.rsi
      state: down
  - type: InstantAction
    event: !type:CEZViewDownEvent
# Pirate: multiz (end)

- type: entity
  parent: BaseAction
  id: ActionReturnToShip
  name: "повернутися"
  description: "повернутися на корабель."
  components:
  - type: Action
    useDelay: 30
    icon:
      sprite: _Shitmed/Interface/Actions/actions_abductor.rsi
      state: take
    priority: -12
  - type: InstantAction
    event: !type:AbductorReturnToShipEvent
