# Pirate: secret door - legacy assembly graph. Secret doors are built from a displaced girder in the
# Girder graph now (SS13 falsewall), but BaseSecretDoorAssembly is still placed on some maps, so this
# keeps those instances finishable and removable. The old cable + power cell steps are gone; nothing
# ever read the cell. Finishing here hands the entity over to the Girder graph.
- type: constructionGraph
  id: SecretDoor
  start: start
  graph:
  - node: start
    edges:
    - to: assembly
      completed:
      - !type:SetAnchor
        value: false
      steps:
      - material: Steel
        amount: 4
        doAfter: 4
      - material: MetalRod
        amount: 4
        doAfter: 4

  - node: assembly
    entity: BaseSecretDoorAssembly
    actions:
    - !type:SnapToGrid {}
    - !type:SetAnchor {}
    edges:
    - to: solidSecretDoor
      conditions:
      - !type:EntityAnchored {}
      steps:
      - tool: Screwing
        doAfter: 2
    - to: start
      conditions:
      - !type:EntityAnchored
        anchored: false
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 4
      - !type:SpawnPrototype
        prototype: PartRodMetal1
        amount: 4
      - !type:DeleteEntity {}
      steps:
      - tool: Welding
        doAfter: 3

  - node: solidSecretDoor
    entity: SolidSecretDoor
