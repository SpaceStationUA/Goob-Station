# Pirate: secret door - legacy assembly graph, kept for any mapped ReinforcedSecretDoorAssembly.
# Reinforced secret doors are built from a displaced girder in the Girder graph now (SS13 falsewall);
# the old cable + power cell steps are gone. Finishing here hands the entity to the Girder graph.
- type: constructionGraph
  id: ReinforcedSecretDoor
  start: start
  graph:
  - node: start
    edges:
    - to: assembly
      completed:
      - !type:SetAnchor
        value: false
      steps:
      - material: Steel
        amount: 4
        doAfter: 4
      - material: MetalRod
        amount: 4
        doAfter: 4

  - node: assembly
    entity: ReinforcedSecretDoorAssembly
    actions:
    - !type:SnapToGrid {}
    - !type:SetAnchor {}
    edges:
    - to: ReinforcedSecretDoor
      conditions:
      - !type:EntityAnchored {}
      steps:
      - material: Plasteel
        amount: 4
        doAfter: 2
      - tool: Screwing
        doAfter: 2
    - to: start
      conditions:
      - !type:EntityAnchored
        anchored: false
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 4
      - !type:SpawnPrototype
        prototype: PartRodMetal1
        amount: 4
      - !type:DeleteEntity {}
      steps:
      - tool: Welding
        doAfter: 3

  - node: ReinforcedSecretDoor
    entity: ReinforcedSecretDoor
