- type: entity
  id: DiseaseBehaviorCough
  parent: DiseaseBehaviorBase
  name: "Кашель"
  description: "Змушує вас кашляти. Заразний."
  components:
  - type: DiseaseEffect
    complexity: 6
  - type: DiseasePeriodicCondition
    delayMin: 2
    delayMax: 20
  - type: DiseaseEmoteEffect
    emote: Cough
  - type: DiseaseSpreadEffect
    arc: 180
    range: 3.5
    timeScale: false
    spreadParams:
      power: 1
      chance: 0.5
      spreadType: Aerial

- type: entity
  id: DiseaseBehaviorHonk
  parent: DiseaseBehaviorBase
  name: "ХОНК!"
  description: "ХОНК! Дуже заразно."
  components:
  - type: DiseaseEffect
    complexity: 14
  - type: DiseasePeriodicCondition
    delayMin: 1
    delayMax: 20
  - type: DiseaseEmoteEffect
    emote: Honk
  - type: DiseaseSpreadEffect
    arc: 360
    range: 2
    timeScale: false
    spreadParams:
      power: 0.5
      chance: 0.33
      spreadType: Aerial

- type: entity
  id: DiseaseBehaviorPneumonia
  parent: DiseaseBehaviorBase
  name: "Пневмонія"
  description: "Спричиняє болісний кашель."
  components:
  - type: DiseaseEffect
    complexity: 20
  - type: DiseasePeriodicCondition
    delayMin: 0
    delayMax: 20
  - type: DiseaseEmoteEffect
    emote: Cough
  - type: DiseaseSpreadEffect
    arc: 180
    range: 3.5
    timeScale: false
    spreadParams:
      power: 1
      chance: 0.5
      spreadType: Aerial
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      damage:
        types:
          Piercing: 4
  - type: DiseaseProgressCondition
    minProgress: 0.5

- type: entity
  id: DiseaseBehaviorSneeze
  parent: DiseaseBehaviorBase
  name: "Чхання"
  description: "Викликає чхання. Дуже заразно."
  components:
  - type: DiseaseEffect
    complexity: 20 #very infective
  - type: DiseasePeriodicCondition
    delayMin: 5
    delayMax: 20
  - type: DiseaseEmoteEffect
    emote: Cough
  - type: DiseaseSpreadEffect
    arc: 180
    range: 5
    timeScale: false
    spreadParams:
      power: 1.5
      chance: 0.7
      spreadType: Aerial

- type: entity
  id: DiseaseBehaviorSkinLesion
  parent: DiseaseBehaviorBase
  name: "Ураження шкіри"
  description: "Завдає ріжучої шкоди. Заразно."
  components:
  - type: DiseaseEffect
    complexity: 20
  - type: DiseasePeriodicCondition
    delayMin: 4
    delayMax: 60
  - type: DiseaseSpreadEffect
    arc: 360
    range: 2
    timeScale: false
    spreadParams:
      power: 1
      chance: 0.6
      spreadType: Aerial
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      damage:
        types:
          Slash: 5
  - type: DiseaseProgressCondition
    minProgress: 0.7


- type: entity
  id: DiseaseBehaviorAbscesses
  parent: DiseaseBehaviorBase
  name: "Абсцеси"
  description: "На останніх стадіях завдає значної ріжучої шкоди. Заразно."
  components:
  - type: DiseaseEffect
    complexity: 40
  - type: DiseasePeriodicCondition
    delayMin: 20
    delayMax: 180
  - type: DiseaseSpreadEffect
    arc: 360
    range: 3.5
    timeScale: false
    spreadParams:
      power: 1
      chance: 0.8
      spreadType: Aerial
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      damage:
        types:
          Slash: 20
  - type: DiseaseProgressCondition
    minProgress: 0.9
