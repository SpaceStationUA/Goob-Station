- type: entity
  id: DiseaseBehaviorVomit
  parent: DiseaseBehaviorBase
  name: "Блювання"
  description: "Змушує вас періодично блювати."
  components:
  - type: DiseaseEffect
    complexity: 8 # can make you constantly hungry
  - type: DiseaseReagentEffect
    timeScale: false
    effects:
    - !type:Vomit
  # also a low-power infect
  - type: DiseaseSpreadEffect
    arc: 360
    range: 2
    timeScale: false
    spreadParams:
      power: 0.5
      chance: 0.5
      spreadType: Aerial
  - type: DiseasePeriodicCondition
    delayMin: 20
    delayMax: 60

- type: entity
  id: DiseaseBehaviorFeelUnwell
  parent: DiseaseBehaviorBase
  name: "Нездужання"
  description: "Викликає нездужання."
  components:
  - type: DiseaseEffect
    complexity: 4 # just an annoyance
  - type: DiseasePopupEffect
    string: disease-effect-popup-default
  - type: DiseasePeriodicCondition
    delayMin: 30
    delayMax: 60
  - type: DiseaseProgressCondition
    minProgress: 0.4

- type: entity
  id: DiseaseBehaviorHeadache
  parent: DiseaseBehaviorBase
  name: "Головний біль"
  description: "Викликає головний біль, що може ускладнити роботу."
  components:
  - type: DiseaseEffect
    complexity: 8 # very annoying
  - type: DiseasePopupEffect
    string: disease-effect-popup-headache
  - type: DiseasePeriodicCondition
    delayMin: 3
    delayMax: 12
  - type: DiseaseFlashEffect
    timeScale: false
  - type: DiseaseProgressCondition
    minProgress: 0.5

- type: entity
  id: DiseaseBehaviorGravitosisA
  parent: DiseaseBehaviorBase
  name: "Гравітозис А"
  description: "Рідкісний і екзотичний симптом хвороби, який змушує предмети закручуватися навколо вас."
  components:
  - type: DiseaseEffect
    complexity: 14 # doesn't do that much but very annoying
  - type: DiseaseGenericEffect
    timeScale: false
    component: GravityWell
    defaults:
      BaseTangentialAcceleration: 6
  - type: GravityWell
    maxRange: 4

- type: entity
  id: DiseaseBehaviorGravitosisB
  parent: DiseaseBehaviorBase
  name: "Гравітозис Б"
  description: "Рідкісний і екзотичний симптом хвороби, який змушує предмети рухатися до вас."
  components:
  - type: DiseaseEffect
    complexity: 14 # doesn't do that much but very annoying
  - type: DiseaseGenericEffect
    timeScale: false
    component: GravityWell
    defaults:
      BaseRadialAcceleration: 6
  - type: GravityWell
    maxRange: 4

- type: entity
  id: DiseaseBehaviorGravitosisC
  parent: DiseaseBehaviorBase
  name: "Гравітозис С"
  description: "Рідкісний і екзотичний симптом хвороби, який змушує предмети віддалятися від вас."
  components:
  - type: DiseaseEffect
    complexity: 14 # doesn't do that much but very annoying
  - type: DiseaseGenericEffect
    timeScale: false
    component: GravityWell
    defaults:
      BaseRadialAcceleration: -6
  - type: GravityWell
    maxRange: 4

- type: entity
  id: DiseaseBehaviorOwO
  parent: DiseaseBehaviorBase
  name: "ОвО-фікація"
  description: "Рідкісний та екзотичний симптом хвороби, який змушує вас мовити як кіт."
  components:
  - type: DiseaseEffect
    complexity: 14 # doesn't do that much but very annoying
  - type: DiseaseGrantComponentEffect
    components:
    - type: OwOAccent

- type: entity
  id: DiseaseBehaviorBlindness
  parent: DiseaseBehaviorBase
  name: "Сліпота"
  description: "Рідкісний симптом, що спричиняє повну сліпоту."
  components:
  - type: DiseaseEffect
    complexity: 12
  - type: DiseaseGrantComponentEffect
    components:
    - type: PermanentBlindness
  - type: DiseaseProgressCondition
    minProgress: 0.5

- type: entity
  id: DiseaseBehaviorPainNumbness
  parent: DiseaseBehaviorBase
  name: "Знеболення"
  description: "Рідкісний симптом, що позбавляє чутливості до болю."
  components:
  - type: DiseaseEffect
    complexity: 12
  - type: DiseaseReagentEffect
    timeScale: false
    effects:
    - !type:ModifyStatusEffect
      effectProto: PainNumbnessTraitStatusEffect
      time: 20

- type: entity
  id: DiseaseBehaviorDeaf
  parent: DiseaseBehaviorBase
  name: "Глухота"
  description: "Рідкісний симптом, що спричиняє повну глухоту."
  components:
  - type: DiseaseEffect
    complexity: 14 # VERY annoying
  - type: DiseaseGrantComponentEffect
    components:
    - type: Deaf
  - type: DiseaseProgressCondition
    minProgress: 0.6

- type: entity
  id: DiseaseBehaviorAnxiety
  parent: DiseaseBehaviorBase
  name: "Тривога"
  description: "Викликає тривожність і страх обіймів."
  components:
  - type: DiseaseEffect
    complexity: 2
  - type: DiseaseGrantComponentEffect
    components:
    - type: SocialAnxiety

- type: entity
  id: DiseaseBehaviorDrowsiness
  parent: DiseaseBehaviorBase
  name: "Сонливість"
  description: "Викликає сильне бажання спати."
  components:
  - type: DiseaseEffect
    complexity: 10
  - type: DiseaseReagentEffect
    timeScale: true
    effects:
    - !type:ModifyStatusEffect
      effectProto: StatusEffectDrowsiness
      time: 30
  - type: DiseaseEmoteEffect
    emote: Yawn
  - type: DiseasePeriodicCondition
    delayMin: 15
    delayMax: 60

- type: entity
  id: DiseaseBehaviorEuphoria
  parent: DiseaseBehaviorBase
  name: "Ейфорія"
  description: "Симптом, що викликає радість!"
  components:
  - type: DiseaseEffect
    complexity: 5
  - type: DiseaseReagentEffect
    timeScale: false
    effects:
    - !type:ModifyStatusEffect
      effectProto: StatusEffectSeeingRainbow
      time: 20
  - type: DiseasePeriodicCondition
    delayMin: 10
    delayMax: 50
  - type: DiseaseEmoteEffect
    emote: Laugh

- type: entity
  id: DiseaseBehaviorApathy
  parent: DiseaseBehaviorBase
  name: "Апатія"
  description: "Симптом, через який світ поступово втрачає кольори."
  components:
  - type: DiseaseEffect
    complexity: 5
  - type: DiseaseGrantComponentEffect
    components:
    - type: BlackAndWhiteOverlay
  - type: DiseaseProgressCondition
    minProgress: 0.5

- type: entity
  id: DiseaseBehaviorBS
  parent: DiseaseBehaviorBase
  name: "Блюспейсова нестабільність"
  description: "Надзвичайно рідкісний симптом, що викликає хаотичну телепортацію."
  components:
  - type: DiseaseEffect
    complexity: 40 #there is a chance of ending up in a wall or in space
  - type: DiseaseGrantComponentEffect
    components:
    - type: ChaoticJump
      jumpMinInterval: 0
      jumpMaxInterval: 60
      rangeMin: 0.2
      rangeMax: 2
  - type: DiseaseProgressCondition
    minProgress: 0.5
