- type: entity
  id: DiseaseBehaviorCancer
  parent: DiseaseBehaviorBase
  name: "Рак"
  description: "Завдає генетичної шкоди з часом."
  components:
  - type: DiseaseEffect
    complexity: 40
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      damage:
        types:
          Cellular: 0.2

- type: entity
  id: DiseaseBehaviorPoison
  parent: DiseaseBehaviorBase
  name: "Отруєння"
  description: "Завдає отруйної шкоди з часом."
  components:
  - type: DiseaseEffect
    complexity: 20
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      damage:
        types:
          Poison: 0.3

- type: entity
  id: DiseaseBehaviorBlunt
  parent: DiseaseBehaviorBase
  name: "Деградація тканин"
  description: "Завдає тупої шкоди з часом."
  components:
  - type: DiseaseEffect
    complexity: 15
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      damage:
        types:
          Blunt: 0.5

- type: entity
  id: DiseaseBehaviorNecrosis
  parent: DiseaseBehaviorBase
  name: "Некроз"
  description: "На останніх стадіях з часом завдає значної отруйної шкоди та спричиняє крововтрату."
  components:
  - type: DiseaseEffect
    complexity: 40
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      damage:
        types:
          Poison: 1.5
          Bloodloss: 5
  - type: DiseaseProgressCondition
    minProgress: 0.8

- type: entity
  id: DiseaseBehaviorPulmonaryEdema
  parent: DiseaseBehaviorBase
  name: "Набряк легень"
  description: "З часом завдає шкоди від задухи."
  components:
  - type: DiseaseEffect
    complexity: 14
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      damage:
        types:
          Asphyxiation: 3
  - type: DiseaseProgressCondition
    minProgress: 0.5

- type: entity
  id: DiseaseBehaviorInternalBleeding
  parent: DiseaseBehaviorBase
  name: "Внутрішня кровотеча"
  description: "На останніх стадіях з часом завдає колючої шкоди й зменшує кількість крові в організмі."
  components:
  - type: DiseaseEffect
    complexity: 14
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      damage:
        types:
          Piercing: 0.5
    - !type:ModifyBloodLevel
      amount: -8
  - type: DiseaseProgressCondition
    minProgress: 0.8

- type: entity
  id: DiseaseBehaviorAnemia
  parent: DiseaseBehaviorBase
  name: "Анемія"
  description: "На останніх стадіях з часом завдає значної шкоди від задухи."
  components:
  - type: DiseaseEffect
    complexity: 40
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      damage:
        types:
          Asphyxiation: 8
    - !type:ModifyBloodLevel
      amount: -3
  - type: DiseaseProgressCondition
    minProgress: 0.9

- type: entity
  id: DiseaseBehaviorOrganFailure
  parent: DiseaseBehaviorBase
  name: "Відмова органів"
  description: "На останній стадії може спричинити миттєву смерть"
  components:
  - type: DiseaseEffect
    complexity: 40
  - type: DiseaseReagentEffect
    effects:
    - !type:HealthChange
      useTargeting: false
      probability: 0.01
      damage:
        types:
          Bloodloss: 200
  - type: DiseaseProgressCondition
    minProgress: 1

# this is broken and hits the owning entity but i'm leaving it here so someone can fix it
- type: entity
  id: DiseaseBehaviorGunemia
  parent: DiseaseBehaviorBase
  name: "Гунемія"
  description: "Змушує вас кашляти кулями. Механізм невідомий."
  components:
  - type: DiseaseEffect
    complexity: 30
  - type: DiseaseGenericEffect
    component: Gun
    timeScale: false
    defaults:
      FireRate: 0.2
  - type: HTN
    rootTask:
      task: TurretCompound
    blackboard:
      RotateSpeed: !type:Single
        3.141
  - type: CombatMode
    toggleMouseRotator: false
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Gun
    fireRate: 0.1
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/Voice/Human/male_cough_1.ogg
  - type: BallisticAmmoProvider
    proto: CartridgeCaselessRifle
    capacity: 1000000
