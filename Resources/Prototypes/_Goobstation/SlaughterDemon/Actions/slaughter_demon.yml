- type: entity
  id: BloodCrawlAction
  name: "Криваве переміщення"
  description: "ТЕЛЕПОРТУЙТЕСЯ КУДИ ЗАВГОДНО, КОЛИ ВИ НА КРОВІ"
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: _Goobstation/SlaughterDemon/abilities.rsi
      state: crawl
    useDelay: 4
  - type: InstantAction
    event: !type:BloodCrawlEvent

- type: entity
  id: DemonicWhisperAction
  name: "Демонічний шепіт"
  parent: ActionTelepathy
  description: "НАДІШЛІТЬ ПОВІДОМЛЕННЯ ЇХНІЙ ДУШІ, З ПЕКЛА"
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon:
      sprite: _Goobstation/SlaughterDemon/abilities.rsi
      state: whisper
  - type: EntityTargetAction
    canTargetSelf: true
    event: !type:TelepathyWhisperEvent
  - type: TelepathyAction
    dialogueTitle: demonic-whisper-title
    popupWhisperSelf: demonic-whisper-self
    popupWhisperFlavor: demonic-whisper-flavor
    popupType: MediumCaution
