- type: entity
  id: MetalSlimeExtract
  parent: BaseSlimeExtract
  name: "металевий екстракт слайма"
  components:
  - type: Sprite
    layers:
    - sprite: _Goobstation/Xenobiology/Specific/Xenobiology/extract.rsi
      state: core
      color: "#595959"
      shader: XenoMetallic
  - type: Reactive
    reactions:
    - reagents: [ Water ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractReaction
      - !type:SpawnEntity
        entity: SheetGlass1
        number: 15
      - !type:SpawnEntity
        entity: SheetRGlass1
        number: 5
    - reagents: [ Plasma ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractReaction
      - !type:SpawnEntity
        entity: SheetSteel1
        number: 15
        shouldScale: false # Pirate: keep the steel output fixed like the other extract products.
      - !type:SpawnEntity
        entity: SheetPlasteel1
        number: 5
    - reagents: [ Blood ]
      methods: [ Touch, Injection ]
      effects:
      - !type:NestedEffect
        proto: XenobioExtractFail
  - type: Tag
    tags:
    - XenobiologyMetalExtract
