- type: entity
  parent: ClothingNeckBase
  id: SurveillanceWirelessCameraBodySecurity
  name: "нагрудна камера служби безпеки"
  description: "Натільна камера. Вона стежить за вами."
  components:
  - type: DeviceNetwork
    deviceNetId: Wired # :clueless:
    receiveFrequencyId: SurveillanceCameraSecurity
    transmitFrequencyId: SurveillanceCamera
  - type: SurveillanceCamera
    networkSet: true
    nameSet: True
    mobile: True  # Goobstation - mobile cameras fix
    id: Bodycam
  - type: Eye
  - type: WirelessNetworkConnection
    range: 200
  - type: SurveillanceCameraMicrophone
    blacklist:
      components:
      - SurveillanceCamera
      - SurveillanceCameraMonitor
      - RadioSpeaker
  - type: ActiveListener
    range: 10
  - type: StationAiVision # Pirate: syndicate remote monitoring - bodycams provide vision wherever the camera item is
    range: 4 # Pirate: syndicate remote monitoring
  - type: CameraActiveVision # Pirate: syndicate remote monitoring - EMP-disabled bodycams stop providing vision
  - type: Sprite
    sprite: _Pirate/Clothing/Neck/Misc/bodycam.rsi # Pirate bodycam resprite
  - type: Clothing
    sprite: _Pirate/Clothing/Neck/Misc/bodycam.rsi # Pirate bodycam resprite
    quickEquip: true

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckFellForItAward
  name: "нагорода Nanotrasen за довірливість"
  description: "Нагорода, що видається Nanotrasen для відзначення екстремальних випадків довірливості"
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Neck/Misc/fellforitaward.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Neck/Misc/fellforitaward.rsi
