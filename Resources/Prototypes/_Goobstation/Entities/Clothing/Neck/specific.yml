- type: entity
  parent: ClothingNeckBase
  id: SurveillanceWirelessCameraBodySecurity
  name: security bodycam
  description: A body mounted camera. It's watching you.
  components:
  - type: ClothingAccessory # Pirate: clothing accessories
    category: Bodycam # Pirate: clothing accessories
  - type: DeviceNetwork
    deviceNetId: Wired # :clueless:
    receiveFrequencyId: SurveillanceCameraSecurity
    transmitFrequencyId: SurveillanceCamera
  - type: SurveillanceCamera
    networkSet: true
    nameSet: True
    mobile: True  # Goobstation - mobile cameras fix
    id: Bodycam
  - type: Eye
  - type: WirelessNetworkConnection
    range: 200
  - type: SurveillanceCameraMicrophone
    blacklist:
      components:
      - SurveillanceCamera
      - SurveillanceCameraMonitor
      - RadioSpeaker
  - type: ActiveListener
    range: 10
  - type: StationAiVision # Pirate: syndicate remote monitoring - bodycams provide vision wherever the camera item is
    range: 4 # Pirate: syndicate remote monitoring
  - type: CameraActiveVision # Pirate: syndicate remote monitoring - EMP-disabled bodycams stop providing vision
  - type: Sprite
    sprite: _Pirate/Clothing/Neck/Misc/bodycam.rsi # Pirate bodycam resprite
    layers: # Pirate: bodycam toggle
    - state: icon # Pirate: bodycam toggle
      map: [ "enum.ToggleableVisuals.Layer" ] # Pirate: bodycam toggle
  - type: Clothing
    sprite: _Pirate/Clothing/Neck/Misc/bodycam.rsi # Pirate bodycam resprite
    quickEquip: true
  #region Pirate: bodycam toggle
  - type: ItemToggle
    activated: true
    soundActivate:
      path: /Audio/Items/flashlight_on.ogg
    soundDeactivate:
      path: /Audio/Items/flashlight_off.ogg
  - type: ToggleClothing
    action: ActionPirateToggleBodycam
  - type: ToggleClothingPrefix
    prefixOn: null
    prefixOff: off
  - type: ToggleableCamera
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: icon }
          False: { state: icon-off }
  #endregion

- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckFellForItAward
  name: nanotrasen gullibility award
  description: An award given out by nanotrasen to mark extreme cases of gullibility
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Neck/Misc/fellforitaward.rsi
  - type: Clothing
    sprite: _Goobstation/Clothing/Neck/Misc/fellforitaward.rsi
