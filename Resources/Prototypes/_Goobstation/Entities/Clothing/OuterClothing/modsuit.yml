## Parent File to easily add more attributes, here it's used for plasmaman mostly
- type: entity
  parent: [ClothingOuterBase, ClothingArmorPlate] # Pirate: armor plates.
  id: ClothingOuterModsuitBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
  - type: AllowSuitStorage
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/standard.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      map: [ "sealed" ]
  - type: Tag
    tags:
    - PlasmamanSafe
  - type: IgniteFromGasImmunity
    parts:
    - BodyMiddle
    - Legs


- type: entity
  parent: [ClothingOuterBase, ClothingArmorPlate] # Pirate: armor plates.
  id: ClothingModsuitChestplateStandard
  name: standard modsuit chestplate
  description: A special modular suit spaceproof cover designed for compact folding inside modular suit control.
  categories: [ HideSpawnMenu ]
  components:
  #region Pirate: suit wrap
  - type: SuitWrap
    ramp: [ "#151515", "#1A1A1A", "#3A3A3A", "#585858" ]
    accent: "#585858"
  #endregion Pirate: suit wrap
  - type: Appearance
  - type: AllowSuitStorage
  - type: Sprite
    sprite: _Goobstation/Clothing/OuterClothing/Modsuits/standard.rsi
    layers:
    - state: chestplate
    - state: chestplate-sealed
      visible: false
      map: [ "sealed" ]
  - type: Clothing
    equipSound: /Audio/Mecha/mechmove03.ogg
    unequipSound: /Audio/Mecha/mechmove03.ogg
    slots: [ outerClothing ]
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: ContainerContainer
    containers:
      mod-part-stored: !type:ContainerSlot
      storagebase: !type:Container # Pirate: inherited armor-plate storage must exist before initialization.
  - type: ModPart
    sealUpPopup: modsuit-part-seal-up-chestplate
    sealDownPopup: modsuit-part-seal-down-chestplate
  #region Pirate: wetness
  # Sealed modsuit body stays dry and protects inner clothing.
  - type: WetnessBlocker
    slots: [OUTERCLOTHING, INNERCLOTHING]
    requiresSealed: true
  #endregion Pirate: wetness
  - type: ModSuitSealedVisuals
    spriteLayer: sealed
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING-sealed
      outerClothing-resomi:
      - state: equipped-OUTERCLOTHING-sealed-resomi
  - type: StaminaResistance
    damageCoefficient: 0.9
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    - Other
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.85
        Slash: 0.85
        Piercing: 0.85
        Heat: 0.85
        Radiation: 0.2
  - type: ModSealedComponents
    components:
    - type: PressureProtection
      highPressureMultiplier: 0.3
      lowPressureMultiplier: 1000
    - type: TemperatureProtection
      coolingCoefficient: 0.01
      heatingCoefficient: 0.01
  - type: FireProtection
    reduction: 0.5

