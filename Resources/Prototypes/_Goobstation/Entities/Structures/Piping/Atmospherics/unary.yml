#region Pirate: heat exchange pipes
- type: entity
  parent: PirateHeatExchangePipeBase
  id: HeatExchangerInline
  name: "вбудований радіатор"
  suffix: Straight
  components:
  - type: AtmosPipeLayers
    alternativePrototypes:
      Primary: HeatExchangerInline
      Secondary: HeatExchangerInlineAlt1
      Tertiary: HeatExchangerInlineAlt2
  - type: Construction
    graph: PirateHeatExchangePipe
    node: heStraight

- type: entity
  parent: HeatExchangerInline
  id: HeatExchangerInlineBend
  suffix: Bend
  components:
  - type: Sprite
    layers:
    - state: pipeBend
      map: [ "enum.PipeVisualLayers.Pipe", "enum.SubfloorLayers.FirstLayer" ]
  - type: NodeContainer
    nodes:
      pipe:
        !type:HeatExchangePipeNode
        nodeGroupID: Pipe
        pipeDirection: SWBend
  - type: AtmosPipeLayers
    alternativePrototypes:
      Primary: HeatExchangerInlineBend
      Secondary: HeatExchangerInlineBendAlt1
      Tertiary: HeatExchangerInlineBendAlt2
  - type: Construction
    graph: PirateHeatExchangePipe
    node: heBend
#endregion
