# Halloween event candies made by the SpaceStationUA community.

# Wrapped bar: unwraps into the edible invisible chocolate bar.
- type: entity
  parent: BaseItem
  id: FoodSnackChocolateInvis
  name: invisible chocolate bar
  description: The wrapper is real. Probably.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/invisible_bar.rsi
    state: invisible-chocolatebar
  - type: Item
    sprite: _Goobstation/Objects/Consumable/Food/invisible_bar.rsi
    heldPrefix: invisible-chocolatebar
    size: Tiny
    storedOffset: 1,-1
  - type: Tag
    tags:
    - FoodSnack
  - type: SpawnItemsOnUse
    items:
    - id: FoodPacketChocolateTrash
    - id: FoodSnackChocolateBarInvis
    sound:
      path: /Audio/Effects/unwrap.ogg

# The bar itself: eating it grants a short window of invulnerability.
- type: entity
  parent: FoodSnackBase
  id: FoodSnackChocolateBarInvis
  name: invisible chocolate bar
  description: Tastes like cardboard. You feel strangely untouchable...
  components:
  - type: FlavorProfile
    flavors:
    - chocolate
  - type: Sprite
    sprite: _Goobstation/Objects/Consumable/Food/invisible_bar.rsi
    state: invisible-chocolatebar-open
  - type: Item
    sprite: _Goobstation/Objects/Consumable/Food/invisible_bar.rsi
    heldPrefix: invisible-chocolatebar-open
    storedOffset: 1,-2
  - type: Tag
    tags:
    - FoodSnack
    - ReptilianFood
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Theobromine
          Quantity: 3
        - ReagentId: CocoaPowder
          Quantity: 1
        - ReagentId: PhantomCocoa
          Quantity: 5
