- type: entity
  id: SpawnerChristmasLightsWhite
  name: "спавнер різдвяних гірлянд"
  suffix: White
  parent: MarkerBase
  components:
  - type: Sprite
    layers:
      - state: green
      - sprite: _Goobstation/Objects/Specific/Christmas/lights.rsi
        state: base1
