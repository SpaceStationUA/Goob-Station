- type: entity
  id: CigarGoldenGang
  parent: CigarGold
  name: "золотий сигар"
  suffix: Gang
  description: "Розкішний сигар із золотим листям, просочений заспокійливою лікувальною сумішшю. Лише найкраще від боса."
  components:
  - type: SolutionContainerManager
    solutions:
      smokable:
        maxVol: 35
        reagents:
          - ReagentId: Nicotine
            Quantity: 15
          - ReagentId: Omnizine
            Quantity: 10

