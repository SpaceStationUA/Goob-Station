- type: entity
  id: GangGL06Bundle
  parent: ClothingBackpackSatchel
  name: "набір ГЛ-06 РГЛ"
  suffix: Gang
  description: "Сумка з ручним гранатометом ГЛ-06, зарядженим двома світлошумовими гранатами."
  components:
  - type: StorageFill
    contents:
    - id: WeaponLauncherNonLethal
    - id: GrenadeFlash
      amount: 2

- type: entity
  parent: [BaseItem, BaseMajorContraband]
  id: Quickhack
  name: "квікхак"
  description: "Прихований пристрій, що підробляє сигнали «відкрити» ШІ, щоб відчиняти незаблоковані двері. Розрахований на 5 використань."
  components:
  - type: Quickhack
  - type: UseDelay
    delay: 1
  - type: LimitedCharges
    maxCharges: 5
  - type: Sprite
    sprite: _Goobstation/Gangs/quickhack.rsi
    state: icon
  - type: Item
    sprite: _Goobstation/Gangs/quickhack.rsi
  - type: Appearance
  - type: StaticPrice
    price: 800

- type: entity
  parent: [EncryptionKey, BaseMajorContraband]
  id: EncryptionKeyGang
  name: "криптографічний ключ банди"
  suffix: Gang
  description: "Ключ шифрування для зв’язку з бандами."
  components:
  - type: EncryptionKey
    channels:
    - Gang
    defaultChannel: Gang
  - type: Sprite
    layers:
    - state: crypt_red
    - state: synd_label

- type: entity
  id: GangSprayCan
  name: "балончик банди"
  suffix: Gang
  description: "Балончик для позначення території своєї банди. Працює, лише якщо ти належиш до банди."
  parent: [BaseItem, BaseMinorContraband]
  components:
  - type: Sprite
    sprite: _Goobstation/Gangs/spray_cans.rsi
    layers:
    - state: icon
  - type: Item
    sprite: _Goobstation/Gangs/spray_cans.rsi
    size: Small
  - type: Appearance
  - type: GangSprayCan
  - type: LimitedCharges
    maxCharges: 5

