# Gang member action: toggle territory overlay
- type: entity
  id: ActionGangMemberToggleOverlay
  name: "Перемкнути бачення"
  description: "Перемкнути бачення території."
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 1
    itemIconStyle: BigAction
    icon: { sprite: _Goobstation/Gangs/actions.rsi, state: toggle_overlay }
  - type: InstantAction
    event: !type:GangMemberToggleOverlayEvent

# Gang Leader action: summon / relocate personal gang locker
- type: entity
  id: ActionGangLeaderSummonLocker
  name: "Викликати шафку"
  description: "Викликає шафку банди. Якщо її вже розміщено, переміщує її."
  components:
  - type: Action
    raiseOnUser: true
    useDelay: 900 # 15 minutes
    itemIconStyle: BigAction
    icon: { sprite: _Goobstation/Gangs/actions.rsi, state: set_base }
  - type: InstantAction
    event: !type:GangLeaderSummonLockerEvent

- type: entity
  id: ActionGangLeaderMemberOffer
  name: "Вербувати"
  description: Offer someone a place in your gang. You can only recruit ten members. # Pirate: gang recruit cap - was three
  components:
  - type: Action
    useDelay: 5
    itemIconStyle: BigAction
    icon: { sprite: _Goobstation/Gangs/actions.rsi, state: invite }
  - type: TargetAction
    range: 3.5
    interactOnMiss: false
  - type: EntityTargetAction
    canTargetSelf: false
    whitelist:
      components:
      - HumanoidAppearance
    blacklist:
      components:
      - AntagImmune
    event: !type:GangLeaderMemberOfferEvent
