# The standard baton deliberately inherits the local Pirate/Goobstation baton.  The
# SecLink variant only adds its token price so the global Stunbaton stays unchanged.
- type: entity
  name: "електрокийок SecLink"
  parent: Stunbaton
  id: StunbatonSeclink
  components:
  - type: Currency
    price:
      BatonToken: 1

- type: entity
  name: "веселий кийок"
  parent: StunbatonSeclink
  id: Funbaton
  description: "Електрифікований засіб, здатний безпечно розважити будь-якого злочинця. Не забудьте про перемикач живлення."
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Melee/funbaton.rsi
    layers:
    - state: stunbaton_off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: StaminaDamageOnHit
    sound: /Audio/_Pirate/Items/Security/SecLink/funbaton.ogg
  - type: Clothing
    sprite: _Pirate/Objects/Weapons/Melee/funbaton.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Currency
    price:
      BatonToken: 1

- type: entity
  name: "електробита"
  parent: StunbatonSeclink
  id: Stunbat
  description: "Електрокийок для спортивного офіцера СБ. Використання без живлення гарантовано принесе штрафний удар."
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Melee/stunbat.rsi
    layers:
    - state: stunbaton_off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: _Pirate/Objects/Weapons/Melee/stunbat.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Currency
    price:
      BatonToken: 1

- type: entity
  name: "електрошабля"
  parent: StunbatonSeclink
  id: Stunsabre
  description: "Сучасний електрокийок, натхненний зброєю підпільних убивць. Без живлення це лише палиця."
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Melee/stunsabre.rsi
    layers:
    - state: stunbaton_off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Clothing
    sprite: _Pirate/Objects/Weapons/Melee/stunsabre.rsi
    quickEquip: false
    slots:
    - Belt
  - type: Currency
    price:
      BatonToken: 1
