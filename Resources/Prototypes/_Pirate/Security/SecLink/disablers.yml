# Impstation's disabler bolt base, kept under a Pirate ID so the global Goobstation
# BulletDisabler (which has its own ion damage and stamina tuning) is untouched.
- type: entity
  name: disabler bolt
  id: BaseBulletDisablerSeclink
  parent: BaseBullet
  abstract: true
  categories: [HideSpawnMenu]
  components:
  - type: Reflective
    reflective:
    - Energy
  - type: FlyBySound
    sound:
      collection: EnergyMiss
      params:
        volume: 5
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/Projectiles/energybolts.rsi
    layers:
    - state: mediumstun
      shader: unshaded
  - type: Physics
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.3,0.15,0.3"
        hard: false
        mask:
        - Opaque
        - Impassable
        - BulletImpassable
      fly-by:
        shape: !type:PhysShapeCircle
          radius: 1.5
        layer:
        - Impassable
        - MidImpassable
        - HighImpassable
        - LowImpassable
        hard: false
  - type: Ammo
    muzzleFlash: MuzzleFlashEffectOmnilaser
  - type: StaminaDamageOnCollide
    damage: 30
  - type: Projectile
    impactEffect: BulletImpactEffectDisabler
    damage:
      types:
        Heat: 0
    soundHit:
      collection: WeakHit
    forceSound: true

- type: entity
  name: disabler bolt
  id: BulletDisablerSeclink
  parent: BaseBulletDisablerSeclink
  categories: [HideSpawnMenu]

- type: entity
  name: auto disabler bolt
  id: BulletAutoDisabler
  parent: BaseBulletDisablerSeclink
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/Projectiles/energybolts.rsi
    layers:
    - state: lightstun
      shader: unshaded
  - type: StaminaDamageOnCollide
    damage: 17

- type: entity
  name: disabler magnum bolt
  id: BulletMagnumDisabler
  parent: BaseBulletDisablerSeclink
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/Projectiles/energybolts.rsi
    layers:
    - state: heavystun
      shader: unshaded
  - type: StaminaDamageOnCollide
    damage: 40

# The target has no Impstation BaseDisablerPistol, so the standard SecLink pistol
# starts from the local WeaponDisabler and overrides the source's charge/fire data.
- type: entity
  name: disabler
  parent: WeaponDisabler
  id: WeaponDisablerSeclink
  description: A self-defense weapon that exhausts organic targets, weakening them until they collapse.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/Disablers/disabler.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-0
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: _Pirate/Objects/Weapons/Guns/Disablers/disabler.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Gun
    projectileSpeed: 25
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/taser2.ogg
  - type: BatteryAmmoProvider
    proto: BulletDisablerSeclink
    fireCost: 100
  - type: StaticPrice
    price: 420
  - type: GuideHelp
    guides:
    - Security
    - Antagonists
  - type: Currency
    price:
      DisablerToken: 1

- type: entity
  name: discombobulator
  parent: WeaponDisablerSeclink
  id: WeaponFunnyDisabler
  description: A self-defense weapon that humours organic targets, entertaining them until they collapse.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/Disablers/clowndisabler.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-0
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Clothing
    sprite: _Pirate/Objects/Weapons/Guns/Disablers/clowndisabler.rsi
  - type: Gun
    projectileSpeed: 25
    soundGunshot:
      path: /Audio/_Pirate/Weapons/Guns/Gunshots/SecLink/clowndisabler.ogg
  - type: Appearance
  - type: Currency
    price:
      DisablerToken: 1

