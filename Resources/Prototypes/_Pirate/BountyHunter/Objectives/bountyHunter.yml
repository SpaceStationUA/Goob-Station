- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseBountyHunterObjective
  components:
  - type: Objective
    issuer: objective-issuer-thief
    difficulty: 1
  - type: RoleRequirement
    roles:
    - BountyHunterRole

- type: entity
  parent: [BaseKillObjective, BaseBountyHunterObjective]
  id: BountyHunterKillRandomAntagObjective
  description: "Ви не знаєте, хто її замовив і навіщо, та вам байдуже. За живу ціль заплатять більше, якщо вона опиниться на вашому шатлі."
  components:
  - type: TargetObjective
    title: objective-condition-kill-person-title
  - type: PickRandomPerson
    filters:
    - !type:AntagonistMindFilter
    - !type:ConnectedMindFilter
  - type: KillPersonCondition
    requireMaroon: true

- type: entity
  parent: [BaseBountyHunterObjective, BaseSurviveObjective]
  id: BountyHunterSurviveObjective
  name: "Вижити"
  description: "Мертвим не платять."
  components:
  - type: Objective
    icon:
      sprite: Clothing/Eyes/Glasses/sunglasses.rsi
      state: icon
