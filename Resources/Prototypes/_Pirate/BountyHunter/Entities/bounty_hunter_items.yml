# Bounty Hunter Kits
- type: entity
  parent: ToolboxThief
  id: BountyHunterGear
  name: "ящик мисливця за головами"
  description: "Набір контрабанди, яку ви зібрали за свою кар'єру; деякі речі незаконніші за інші."
  components:
  - type: ThiefUndeterminedBackpack
    maxSelectedSets: 2
    toolName: bounty-hunter-backpack-window-title
    possibleSets:
    - BountyHunterRaider
    - BountyHunterHardsuit
    - BountyHunterDisguise
    - BountyHunterSubverter
    - BountyHunterRoboticist
    - BountyHunterPirate
    - BountyHunterSamurai
    - BountyHunterSyndie
    - BountyHunterCaptain
    - BountyHunterClown
    spawnedStoragePrototype: ClothingBackpackDuffelCargo

# Bounty Hunter Thermal + Flash Protection Glasses
- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesBountyHunterGlasses
  name: "окуляри мисливця за головами"
  description: "Високотехнологічні сонцезахисні окуляри, що забезпечують імунітет до спалахів і тепловий зір."
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Eyes/Glasses/bountyhunterglasses.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Eyes/Glasses/bountyhunterglasses.rsi
  - type: ThermalVision
    isEquipment: true
    pulseTime: 2
    toggleAction: PulseThermalVision
  - type: FlashImmunity
  - type: EyeProtection
    protectionTime: 5

# Companion Cyborg Reinforcement Radio, borgdisabler, and nonlethal module
- type: entity
  parent: ReinforcementRadio
  id: ReinforcementRadioBountyHunterCyborg
  name: "радіо підкріплення переробленого кіборга"
  description: "Викличте перебудованого кіборга, оснащеного найновішими технологіями!"
  components:
    - type: GhostRole
      name: ghost-role-information-bounty-hunter-cyborg-name
      description: ghost-role-information-bounty-hunter-cyborg-description
      rules: ghost-role-information-silicon-rules
      mindRoles:
      - MindRoleGhostRoleSilicon
      raffle:
        settings: default
    - type: GhostRoleMobSpawner
      prototype: PlayerBorgBountyHunter

- type: entity
  name: "дизейблер"
  parent: [ WeaponDisablerPractice, BaseMajorContraband ]
  id: WeaponBorgDisabler
  description: "Дизейблер, модифікований для повільного перезаряджання від внутрішньої батареї кіборга."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Battery/practice_disabler.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-unshaded-0
        map: ["enum.GunVisualLayers.MagUnshaded"]
        shader: unshaded
  - type: BatteryAmmoProvider
    proto: BulletDisabler
    fireCost: 10
  - type: BatterySelfRecharger
    autoRechargeRate: 5

- type: entity
  name: "електрошокова палиця"
  parent: [BaseItem, BaseMajorContraband]
  id: WeaponBorgStunBaton
  description: "Пристрій із внутрішнім зберіганням, здатний безпечно знерухомити будь-якого злочинця; модифікований для самозаряджання ціною заряду батареї."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/stunbaton.rsi
    layers:
    - state: stunbaton_off
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Stunbaton
    energyPerUse: 1
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: sparks
      params:
        variation: 0.250
    soundDeactivate:
      collection: sparks
      params:
        variation: 0.250
    soundFailToActivate:
      path: /Audio/Machines/button.ogg
      params:
        variation: 0.250
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Blunt: 0
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 7
    bluntStaminaDamageFactor: 2.0
    angle: 60
    animation: WeaponArcThrust
  - type: StaminaDamageOnHit
    damage: 35
    sound: /Audio/Weapons/egloves.ogg
  - type: Battery
    maxCharge: 10
    startingCharge: 10
  - type: UseDelay
  - type: Item
    heldPrefix: off
    size: Normal
  - type: DisarmMalus
    malus: 0.225
  - type: Appearance
  - type: GenericVisualizer
    visuals:
     enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: stunbaton_on}
          False: {state: stunbaton_off}
  - type: GuideHelp
    guides:
    - Security
    - Antagonists
  - type: BatterySelfRecharger
    autoRechargeRate: 0.5


- type: entity
  id: BorgModuleDisabler
  parent: [ BaseBorgModule, BaseProviderBorgModule, BaseMajorContraband ]
  name: "модуль дизейблера кіборга"
  components:
  - type: Sprite
    layers:
    - state: security
    - state: icon-grappling-gun # Reuse the local module silhouette; the action icon is custom.
  - type: ItemBorgModule
    hands:
    - item: WeaponBorgDisabler
    - item: WeaponBorgStunBaton
  - type: BorgModuleIcon
    icon: { sprite: _Pirate/BountyHunter/Interface/Actions/actions_borg.rsi, state: disabler-module }


# Mercenary Hardsuit
- type: entity
  parent: [ ClothingOuterHardsuitBase, BaseMajorContraband ]
  id: ClothingOuterHardsuitMercenary
  name: "скафандр найманця"
  description: "Стильний скафандр із легкою бронею."
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/OuterClothing/Hardsuits/bounty_merc.rsi
  - type: Item
    size: Huge
  - type: Clothing
    sprite: _Pirate/Clothing/OuterClothing/Hardsuits/bounty_merc.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.4
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.6
        Caustic: 0.7
  - type: ToggleableClothing
