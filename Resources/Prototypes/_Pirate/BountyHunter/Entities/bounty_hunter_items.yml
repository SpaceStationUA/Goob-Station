# Chloral and Mute Toxin medipens
- type: entity
  name: "аварійний медіпен"
  parent: ChemicalMedipen
  id: ChloralAutoInjector
  suffix: Chloral Hydrate
  description: "Швидкий і безпечний спосіб стабілізувати пацієнтів у критичному стані для персоналу без поглиблених медичних знань. Обережно: епінефрином і транексамовою кислотою легко передозуватися."
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#000067"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#000067"
      - state: base-colorB-inhand-right
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: medipen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: medipen_empty
  - type: Injector
    currentTransferAmount: null
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: ChloralHydrate
          Quantity: 15

- type: entity
  name: "аварійний медіпен"
  parent: ChemicalMedipen
  id: MuteAutoInjector
  suffix: Mute Toxin
  description: "Швидкий і безпечний спосіб стабілізувати пацієнтів у критичному стані для персоналу без поглиблених медичних знань. Обережно: епінефрином і транексамовою кислотою легко передозуватися."
  components:
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#000000"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#000000"
      - state: base-colorB-inhand-right
  - type: Sprite
    sprite: Objects/Specific/Medical/medipen.rsi
    layers:
    - state: medipen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: medipen_empty
  - type: Injector
    currentTransferAmount: null
    activeModeProtoId: HyposprayInjectMode
    allowedModes:
    - HyposprayInjectMode
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15 #15 instead of 5 to match other emergency medipens
        reagents:
        - ReagentId: MuteToxin
          Quantity: 5
        - ReagentId: SpaceDrugs # to fill the rest of the container with another syrupy reagent
          Quantity: 10

#injector boxes
- type: entity
  parent: [ BaseItem, BaseMajorContraband ]
  id: ChloralInjectorBox
  name: "коробка ін'єкторів заспокійливого"
  description: "Невелика коробка з ін'єктором хлоралгідрату, замаскованим під аварійний медіпен. Упаковка розпадається після відкриття, не залишаючи доказів."
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Pirate/Objects/Storage/penbox.rsi
    state: chloral_injector
  - type: SpawnItemsOnUse
    items:
    - id: ChloralAutoInjector
    sound:
      path: /Audio/Effects/unwrap.ogg

- type: entity
