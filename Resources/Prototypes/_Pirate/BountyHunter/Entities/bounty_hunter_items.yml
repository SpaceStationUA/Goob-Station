# Rocket Magboots
- type: entity
  parent: [ClothingShoesBootsMagBase, BaseJetpack, BaseMajorContraband]
  id: ClothingShoesBootsMagRocket
  name: "ракетні магнітні чоботи"
  description: "Спеціально виготовлені магнітні чоботи з вбудованими рушіями. Містять 0.75 л газу."
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Shoes/Boots/bountyhuntermagboots.rsi
    state: icon
  - type: Clothing
    sprite: _Pirate/Clothing/Shoes/Boots/bountyhuntermagboots.rsi
  - type: ClothingSpeedModifier
    walkModifier: 0.95
    sprintModifier: 0.9
  - type: GasTank
    outputPressure: 42.6
    air:
      # 2 minutes of thrust
      volume: 0.75
      temperature: 293.15
      moles:
      - 0.153853429 # oxygen
      - 0.153853429 # nitrogen
  - type: Item
    sprite: null
    size: Normal
  - type: DamageOtherOnHit # Pirate: local component only supports thrown damage.
    damage:
      types:
        Blunt: 20

# Damaged Laser Pistol
- type: entity
