#
# Secret Salt 1.4-only adaptations of existing rules.
# Do not change the gameplay of other server presets.

# The fork's Conspirators rule has no chaos cost, and is therefore
# ineligible for SecretSaltPlus roundstart selection. Give this Salt-only
# variant the cost used by SpaceStationUA's Conspirators rule while
# retaining the fork's existing selection and population settings.
- type: entity
  parent: Conspirators
  id: SecretSaltConspirators
  components:
  - type: GameRule
    chaosScore: 650

# The fork's SiliconLiberation uses DynamicRuleCost only, not the chaos
# score that SecretSaltPlus checks. Match SpaceStationUA's 125 per agent
# without changing the globally used SiliconLiberation rule.
- type: entity
  parent: SiliconLiberation
  id: SecretSaltSiliconLiberation
  components:
  - type: AntagSelection
    definitions:
    - prefRoles: [ SELFAgent ]
      max: 3
      playerRatio: 31
      chaosScore: 125
      lateJoinAdditional: true
      allowNonHumans: true
      jobBlacklist: [ Roboticist ]
      blacklist:
        components:
        - AntagImmune
      startingGear: SELFAgentGear
      mindRoles:
      - MindRoleSELFAgent
      briefing:
        sound: "/Audio/_Pirate/Ambience/Antag/self_greeting.ogg"

# The fork's BloodCult has no chaosScore; the upstream uses 1000.
- type: entity
  parent: BloodCult
  id: SecretSaltBloodCult
  components:
  - type: GameRule
    chaosScore: 1000

# TerrorSpidersSpawn is a standalone game rule with no StationEvent.
# Salt's event scheduler only draws from StationEvent rules; make an
# eligible Salt-only derived event instead of changing the standalone mode.
- type: entity
  parent: TerrorSpidersSpawn
  id: SecretSaltTerrorSpidersSpawn
  components:
  - type: StationEvent
    weight: 1
    earliestStart: 20
    minimumPlayers: 50
    maxOccurrences: 1
    duration: null
    eventType: HostilesSpawn
    chaos:
      Hostile: 200
      Combat: 100
      Death: 50
