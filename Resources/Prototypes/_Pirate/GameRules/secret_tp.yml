- type: entityTable
  id: SecretTPTable
  table: !type:AllSelector
    children:
      - !type:NestedSelector
        tableId: SpaceTrafficControlTable
      - !type:NestedSelector
        tableId: SecretTPGameRulesTable

- type: entityTable
  id: SecretTPGameRulesTable
  table: !type:AllSelector
    children:
      - !type:NestedSelector
        tableId: BasicCalmEventsTable
      - !type:NestedSelector
        tableId: SecretTPAntagEventsTable
      - !type:NestedSelector
        tableId: CargoGiftsTable
      - !type:NestedSelector
        tableId: CalmPestEventsTable
      - !type:NestedSelector
        tableId: SpicyPestEventsTable

- type: entityTable
  id: SecretTPAntagEventsTable
  table: !type:AllSelector
    children:
      - id: DragonSpawn
      - id: AsakimShuttle
      - id: SleeperAgents
      - id: ColossusSpawn
      - id: SkiaSpawn
      - id: Fugitive
      - id: TraitorMidround
      - id: BorerSpawn
      - id: BountyHunterSpawn
        conditions:
        - !type:BountyHunterTargetCondition

- type: weightedRandom
  id: SecretTPPrimary
  weights:
    Gangwars: 1.5
    Revolutionary: 1.5
    Nukeops: 1.5
    Conspirators: 1
    BlobGameMode: 1
    XenomorphsInfestationRoundstart: 1

- type: weightedRandom
  id: SecretTPRoundstart
  weights:
    Traitor: 1
    Thief: 1
    Devil: 1
    SiliconLiberation: 0.75
    BloodBrothers: 0.75
    Vampire: 0.5
    Changeling: 0.5
    Conspirators: 0.25

- type: entity
  id: SecretTP
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 11
    maxStartingChaos: 20
    livingChaosChange: -0.018
    deadChaosChange: 0.048
    chaosChangeVariationMin: 0.65
    chaosChangeVariationMax: 1.3
    eventIntervalMin: 180
    eventIntervalMax: 450
    primaryAntagsWeightTable: SecretTPPrimary
    roundStartAntagsWeightTable: SecretTPRoundstart
  - type: SecretTP
    jobPoints:
      HeadOfSecurity: 5
      Warden: 4
      SecurityInstructor: 3
      Detective: 3
      SecurityOfficer: 3
      Brigmedic: 2
      SecurityCadet: 2
    antagPoints:
      Dragon: 15
      CosmicAntagColossus: 6
      Skia: 5
      Vampire: 4
      Changeling: 4
      Hitman: 3
      Asakim: 3
      SELFAgent: 3
      Traitor: 2
      TraitorSleeper: 2
      Fugitive: 2
      Conspirator: 2
      BloodBrother: 1
    ruleMinimumAliveDepartments:
      Revolutionary:
        Security: 3
        Command: 3
      BlobGameMode:
        Security: 5
        Command: 1
      TokenBlobMidround:
        Security: 8
        Command: 1
      TokenDragonSpawn:
        Security: 8
      DragonSpawn:
        Security: 5
      XenomorphsInfestationRoundstart:
        Security: 5
      Nukeops:
        Security: 4
        Command: 1
      Deserters:
        Security: 4
      Gangwars:
        Security: 3
        Command: 1
      Conspirators:
        Security: 2
    ruleBlacklist:
      ### Мех
      - AbductorVictim
      - LoneAbductorSpawn
      - DuoAbductorSpawn
      - TokenLoneAbductorSpawn
      - CalmHeretic
      - Heretic
      - TokenLaughterDemon
      - TokenSlaughterDemon
      - LaughterDemonSummon
      - SlaughterDemonMidround
      - SlaughterDemonSummon
      - ParadoxCloneSpawn
      - SleeperAgentsWizard
      - TerrorSpidersSpawn
      - WraithMidround
      - SpacePirates
      - PiratesSpawn
      - ReplicatorSpawn
      - BloodCult
      ### Хрінь через яку раунд закінчеться в 95%
      - CosmicCult
      - TokenWizard
      - Wizard
      - Honkops
      - TokenLoneOpsSpawn
      - LoneOpsSpawn
      - TokenNinjaSpawn
      - NinjaSpawn
      - Shadowling
      - Xenoborgs
      - WizardMidround
      - XenomorphsInfestation
      - Zombie
      - ZombieOutbreak
      - BlobMidround
      - BlobSpawn
      ### ЛРПшні / Не лорні
      - CorporateAgent
      - DarkLordMidround
      - DarkPriestMidround
      - MimeAssassinMidround
      - SingulothKnightsMidround
      - TunnelClownMidround
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: SecretTPTable
