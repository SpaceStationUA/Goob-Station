- type: entityTable
  id: SecretSaltTable
  table: !type:AllSelector
    children:
      - !type:NestedSelector
        tableId: SpaceTrafficControlTable
      - !type:NestedSelector
        tableId: BasicGameRulesTableNoAntag
      - !type:NestedSelector
        tableId: SecretSaltAntagEventsTable

- type: entityTable
  id: SecretSaltAntagEventsTable
  table: !type:AllSelector
    children:
      # Keep the existing encounters without inheriting SkiaSpawn from BasicAntagEventsTable.
      - id: ClosetSkeleton
      - id: KingRatMigration
      - id: Fugitive
      - id: BorerSpawn
      - id: ListeningPost
      - id: EeepEvent
      - id: SyndicateDeadDrop
      - id: BountyHunterSpawn
        conditions:
        - !type:BountyHunterTargetCondition
      - !type:NestedSelector
        tableId: DerelictBorgEventTable

      - id: DragonSpawn
      - id: ColossusSpawn
      - id: NinjaSpawn
      - id: ParadoxCloneSpawn
      - id: SleeperAgents
      - id: TraitorMidround
      - id: BlobSpawn
      - id: LoneAbductorSpawn
      - id: DuoAbductorSpawn
      - id: BingleSpawn
      - id: ReplicatorSpawn
      - id: SlaughterDemonMidround
      - id: XenomorphsInfestation
      - id: SpacePirates
      - id: SingulothKnightsMidround
      - id: MimeAssassinMidround
      - id: DarkPriestMidround
      - id: VoxRaidersMidround
      - id: TunnelClownMidround

      - id: ZombieOutbreak
      - id: LoneOpsSpawn

- type: weightedRandom
  id: SecretSaltRoundstart
  # Shadowlings and xenomorphs are primary scenarios, not additional roundstart threats.
  weights:
    # subgamemodes
    Thief: 0.2
    Devil: 0.05 # Pirate
    BloodBrothers: 0.2 # Pirate
    SiliconLiberation: 0.05 # Pirate: SELF

    # normal
    Traitor: 0.18 # Pirate
    Changeling: 0.06 # Pirate
    Heretic: 0.11
    Vampire: 0.04 # Pirate
    CorporateAgent: 0.025

- type: weightedRandom
  id: SecretSaltPrimary
  weights:
    # Relative selection weights; population and chaos checks also affect the final outcome.
    Traitor: 0.18 # Pirate
    Changeling: 0.06 # Pirate
    Heretic: 0.11
    Vampire: 0.04 # Pirate
    Conspirators: 0.06 # Pirate
    BloodCult: 0.03 # Pirate
    Nukeops: 0.03 # Pirate
    Revolutionary: 0.10 # Pirate
    Zombie: 0.02 # Pirate
    BlobGameMode: 0.05
    Wizard: 0.04 # Pirate
    CosmicCult: 0.03 # Pirate
    CorporateAgent: 0.025
    XenomorphsInfestationRoundstart: 0.04
    OopsAllThieves: 0.02
    Shadowling: 0.04

- type: entity
  id: SecretSalt
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretSaltPlus
    minStartingChaos: 11
    maxStartingChaos: 22
    livingChaosChange: -0.018
    deadChaosChange: 0.048
    chaosChangeVariationMin: 0.65
    chaosChangeVariationMax: 1.3
    eventIntervalMin: 180
    eventIntervalMax: 450
    primaryAntagsWeightTable: SecretSaltPrimary
    roundStartAntagsWeightTable: SecretSaltRoundstart
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: SecretSaltTable
