# Cheap chaos costs made goblins appear in over 80% of rounds; target about 30%.
- type: entity
  id: BlueshiftFloorGoblinMidRound
  parent: FloorGoblinMidRound
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 2.5
    maxOccurrences: 1

- type: entity
  id: BlueshiftClownGoblinMigration
  parent: ClownGoblinMigration
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 2.5
    maxOccurrences: 1

- type: entity
  id: BlueshiftMalignRiftSpawn
  parent: MalignRiftSpawn
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    earliestStart: 15
    minimumPlayers: 15
    weight: 0.8
    eventType: Neutral
    startAnnouncement: cosmiccult-announce-tier2-warning
    startAnnouncementColor: "#cae8e8"
    startAudio:
      path: /Audio/_DV/CosmicCult/tier2.ogg

# Inheritance replaces the entire AntagSelection definitions list.
# Keep these copies in sync with their parents when changing counts or chaos costs.

- type: entity
  id: BlueshiftChangeling
  parent: Changeling
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    agentName: changeling-roundend-name
    definitions:
    - prefRoles: [ Changeling ]
      max: 4
      playerRatio: 15
      chaosScore: 200
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
      lateJoinAdditional: true
      mindRoles:
      - MindRoleChangeling

- type: entity
  id: BlueshiftThief
  parent: Thief
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagSelection
    agentName: thief-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Thief ]
      max: 3
      playerRatio: 10
      chaosScore: 100
      lateJoinAdditional: true
      allowNonHumans: true
      multiAntagSetting: NotExclusive
      startingGear: ThiefGear
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
      components:
      - type: Pacified
      - type: Thieving
        stripTimeReduction: 2
        stealthy: true
      mindRoles:
      - MindRoleThief
      briefing:
        sound: "/Audio/Misc/thief_greeting.ogg"

- type: entity
  id: BlueshiftVampire
  parent: Vampire
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    agentName: vampire-roundend-name
    definitions:
    - prefRoles: [ Vampire ]
      max: 1
      playerRatio: 10
      chaosScore: 200
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
        - AntagImmune
        - Changeling
        - BibleUser
      lateJoinAdditional: true
      mindRoles:
      - MindRoleVampire

# A separate id lets incompatibleModes target the Blueshift copies.
- type: entity
  id: BlueshiftHeretic
  parent: Heretic
  categories: [ HideSpawnMenu ]

# incompatibleModes is keyed by the selected rule id; include the Blueshift copies.
- type: incompatibleModes
  id: BlueshiftChangeling
  modes:
  - Heretic
  - BlueshiftHeretic
  - CosmicCult
  - BlueshiftCosmicCult

- type: incompatibleModes
  id: BlueshiftHeretic
  modes:
  - Heretic
  - BlueshiftHeretic
  - CosmicCult
  - BlueshiftCosmicCult
  - Changeling
  - BlueshiftChangeling

- type: entity
  id: BlueshiftCosmicCult
  parent: CosmicCult
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 20

- type: incompatibleModes
  id: BlueshiftCosmicCult
  modes:
  - Nukeops
  - Honkops
  - Zombie
  - Revolutionary
  - BlobGameMode
  - CosmicCult
  - BlueshiftCosmicCult
  - Heretic
  - BlueshiftHeretic

- type: weightedRandom
  id: BlueshiftPrimary
  weights:
    Traitor: 0.30
    BlueshiftVampire: 0.15
    BloodBrothers: 0.15
    Revolutionary: 0.0525
    BloodCult: 0.0375
    BlueshiftCosmicCult: 0.0375
    Nukeops: 0.015

- type: weightedRandom
  id: BlueshiftRoundstart
  weights:
    Traitor: 0.30
    BlueshiftVampire: 0.15
    BloodBrothers: 0.15
    BlueshiftChangeling: 0.08
    BlueshiftHeretic: 0.08
    # Cheap antags pass budget rolls more often; keep weights low.
    BlueshiftThief: 0.015
    Devil: 0.01
    SiliconLiberation: 0.01

- type: entity
  id: BlueshiftScheduler
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 6 # Per connected player, including the lobby.
    maxStartingChaos: 12
    livingChaosChange: -0.018
    deadChaosChange: 0.048
    chaosChangeVariationMin: 0.65
    chaosChangeVariationMax: 1.3
    eventIntervalMin: 180
    eventIntervalMax: 450
    primaryAntagsWeightTable: BlueshiftPrimary
    roundStartAntagsWeightTable: BlueshiftRoundstart
    disallowedEvents:
    - FriendlySpawn
    - Psionic
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: BlueshiftEventsTable
