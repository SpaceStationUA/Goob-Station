# Keep antag pacing separate from chaos-driven events so low chaos cannot bunch antag arrivals.
# Favor minor antags; confine majors to the first pick so a round gets at most one.

- type: entityTable
  id: BlueshiftEventsTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: BlueshiftCalmEventsTable
    - !type:NestedSelector
      tableId: CalmPestEventsTable
    - !type:NestedSelector
      tableId: CargoGiftsTable

# Keep this copy in sync with BasicCalmEventsTable; ghost-role antags use the antag pool.
- type: entityTable
  id: BlueshiftCalmEventsTable
  table: !type:AllSelector
    children:
    - id: AnomalySpawn
    - id: BluespaceArtifact
    - id: BluespaceLocker
    - id: BreakerFlip
    - id: BureaucraticError
    - id: ClericalError
    - id: CockroachMigration
    - id: GasLeak
    - id: GreytideVirus
    - id: IonStorm
    - id: JobDistributionError
    - id: BlueshiftKudzuGrowth
    - id: MassHallucinations
    - id: MimicVendorRule
    - id: MouseMigration
    - id: RandomVirus
    - id: PowerGridCheck
    - id: RandomSentience
    - id: SlimesSpawn
    - id: SolarFlare
    - id: SnakeSpawn
    - id: SpiderClownSpawn
    - id: SpiderSpawn
    - id: VentClog
    - id: TidemindDevelop
    - id: MothroachSpawn
    - id: BlueshiftMalignRiftSpawn
    - id: BlueshiftFloorGoblinMidRound
    - id: BlueshiftClownGoblinMigration
    - id: EeepEvent
    - id: SnailMigration

# Use TraitorMidround rather than SleeperAgents to respect the Traitor preference and ban.
- type: entityTable
  id: BlueshiftAntagEventsTable
  table: !type:AllSelector
    children:
    - id: BlueshiftTraitorMidround
    - id: BlueshiftVampireMidround
    - id: BlueshiftBountyHunterSpawn
      conditions:
      - !type:BountyHunterTargetCondition
    - id: HitmanShuttle
    # Both copies share the single-AI exclusion.
    - id: BlueshiftMalfAiMidround
      conditions:
      - !type:MalfAiAvailableCondition
    - id: BlueshiftMalfAiDoomsdayMidround
      conditions:
      - !type:MalfAiAvailableCondition
    - id: TunnelClownMidround
    - id: MimeAssassinMidround
    - id: BlueshiftDarkPriestMidround
    - id: BorerSpawn
    - id: ParadoxCloneSpawn
    # VentCrittersRule ignores specialEntry probability, so this belongs in the antag pool.
    - id: KingRatMigration

- type: entity
  id: BlueshiftAntagScheduler
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 1500
    minMaxEventTiming:
      min: 1800
      max: 2400
    scheduledGameRules: !type:NestedSelector
      tableId: BlueshiftAntagEventsTable

# Extra TC offsets less time for contracts.
# Remove the inherited start delay so selection coincides with the interception announcement.
- type: entity
  id: BlueshiftTraitorMidround
  parent: TraitorMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    delay:
      min: 0
      max: 0
  - type: TraitorRule
    startingBalance: 75
  - type: StationEvent
    earliestStart: 15
    weight: 20

- type: entity
  id: BlueshiftVampireMidround
  parent: VampireMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    earliestStart: 15
    weight: 20

- type: entity
  id: BlueshiftBountyHunterSpawn
  parent: BountyHunterSpawn
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    earliestStart: 15
    weight: 20

- type: entity
  id: BlueshiftDarkPriestMidround
  parent: DarkPriestMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 0.3

# Cheap chaos costs made goblins appear in over 80% of rounds; target about 30%.
- type: entity
  id: BlueshiftFloorGoblinMidRound
  parent: FloorGoblinMidRound
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 2.5
    maxOccurrences: 1

- type: entity
  id: BlueshiftClownGoblinMigration
  parent: ClownGoblinMigration
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 2.5
    maxOccurrences: 1

# The rare copy guarantees doomsday; the common copy cannot unlock it.
# Inheritance replaces the whole objective sets list.
- type: weightedRandom
  id: BlueshiftMalfAiSabotageObjectives
  weights:
    MalfAiAssassinateObjective: 4
    MalfAiProtectObjective: 3
    MalfAiControlBorgsObjective: 2

- type: entity
  id: BlueshiftMalfAiMidround
  parent: MalfAiMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagRandomObjectives
    sets:
    - groups: BlueshiftMalfAiSabotageObjectives
      maxPicks: 3
    maxDifficulty: 8
  - type: StationEvent
    weight: 9.3

- type: entity
  id: BlueshiftMalfAiDoomsdayMidround
  parent: MalfAiMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagObjectives
    objectives:
    - MalfAiSurviveObjective
    - MalfAiDoomsdayObjective
  - type: AntagRandomObjectives
    sets:
    - groups: BlueshiftMalfAiSabotageObjectives
      maxPicks: 2
    maxDifficulty: 5 # 8 minus doomsday's 3
  - type: StationEvent
    weight: 1.6

# Target about half of rounds instead of the observed 70%.
- type: entity
  id: BlueshiftKudzuGrowth
  parent: KudzuGrowth
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 4.2

- type: entity
  id: BlueshiftMalignRiftSpawn
  parent: MalignRiftSpawn
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    earliestStart: 15
    minimumPlayers: 15
    weight: 0.8
    eventType: Neutral
    startAnnouncement: cosmiccult-announce-tier2-warning
    startAnnouncementColor: "#cae8e8"
    startAudio:
      path: /Audio/_DV/CosmicCult/tier2.ogg

# Inheritance replaces the entire AntagSelection definitions list.
# Keep these copies in sync with their parents when changing counts or chaos costs.

- type: entity
  id: BlueshiftChangeling
  parent: Changeling
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    agentName: changeling-roundend-name
    definitions:
    - prefRoles: [ Changeling ]
      max: 1
      playerRatio: 15
      chaosScore: 200
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
      lateJoinAdditional: true
      mindRoles:
      - MindRoleChangeling

- type: entity
  id: BlueshiftThief
  parent: Thief
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagSelection
    agentName: thief-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Thief ]
      max: 3
      playerRatio: 10
      chaosScore: 100
      lateJoinAdditional: true
      allowNonHumans: true
      multiAntagSetting: NotExclusive
      startingGear: ThiefGear
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
      components:
      - type: Pacified
      - type: Thieving
        stripTimeReduction: 2
        stealthy: true
      mindRoles:
      - MindRoleThief
      briefing:
        sound: "/Audio/Misc/thief_greeting.ogg"

# Lower chaos cost leaves budget for more than blood brothers in vampire-first rounds.
- type: entity
  id: BlueshiftVampire
  parent: Vampire
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    agentName: vampire-roundend-name
    definitions:
    - prefRoles: [ Vampire ]
      max: 1
      playerRatio: 10
      chaosScore: 100
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
        - AntagImmune
        - Changeling
        - BibleUser
      lateJoinAdditional: true
      mindRoles:
      - MindRoleVampire

# A separate id lets incompatibleModes target the Blueshift copies.
- type: entity
  id: BlueshiftHeretic
  parent: Heretic
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    agentName: heretic-roundend-name
    definitions:
    - prefRoles: [ Heretic ]
      max: 1
      playerRatio: 15
      chaosScore: 250
      lateJoinAdditional: true
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
      mindRoles:
      - MindRoleHeretic

# incompatibleModes is keyed by the selected rule id; include the Blueshift copies.
- type: incompatibleModes
  id: BlueshiftChangeling
  modes:
  - Heretic
  - BlueshiftHeretic
  - CosmicCult
  - BlueshiftCosmicCult

- type: incompatibleModes
  id: BlueshiftHeretic
  modes:
  - Heretic
  - BlueshiftHeretic
  - CosmicCult
  - BlueshiftCosmicCult
  - Changeling
  - BlueshiftChangeling

- type: entity
  id: BlueshiftCosmicCult
  parent: CosmicCult
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 20

- type: incompatibleModes
  id: BlueshiftCosmicCult
  modes:
  - Nukeops
  - Honkops
  - Zombie
  - Revolutionary
  - BlobGameMode
  - CosmicCult
  - BlueshiftCosmicCult
  - Heretic
  - BlueshiftHeretic

- type: weightedRandom
  id: BlueshiftPrimary
  weights:
    Traitor: 0.30
    BlueshiftVampire: 0.15
    BloodBrothers: 0.15
    # Expensive antags fail more budget rolls; higher weights target about 5% of rounds each.
    Revolutionary: 0.055
    BloodCult: 0.06
    BlueshiftCosmicCult: 0.07
    Nukeops: 0.085
    Wizard: 0.06

- type: weightedRandom
  id: BlueshiftRoundstart
  weights:
    Traitor: 0.30
    BlueshiftVampire: 0.15
    BloodBrothers: 0.15
    BlueshiftChangeling: 0.045
    BlueshiftHeretic: 0.045
    # Cheap antags pass budget rolls more often; keep weights low.
    BlueshiftThief: 0.031
    Devil: 0.0195
    SiliconLiberation: 0.018

- type: entity
  id: BlueshiftScheduler
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 6 # Per connected player, including the lobby.
    maxStartingChaos: 12
    livingChaosChange: -0.018
    deadChaosChange: 0.048
    chaosChangeVariationMin: 0.65
    chaosChangeVariationMax: 1.3
    # Space out non-antag events now that antags no longer consume these picks.
    eventIntervalMin: 210
    eventIntervalMax: 525
    primaryAntagsWeightTable: BlueshiftPrimary
    roundStartAntagsWeightTable: BlueshiftRoundstart
    disallowedEvents:
    - FriendlySpawn
    - Psionic
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: BlueshiftEventsTable
