# A separate id lets incompatibleModes target the Blueshift copies.
- type: entity
  id: BlueshiftHeretic
  parent: Heretic
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 20
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    agentName: heretic-roundend-name
    definitions:
    - prefRoles: [ Heretic ]
      max: 1
      playerRatio: 3 # max 1 limits this to late joins (1 per 3 eligible players)
      chaosScore: 150
      lateJoinAdditional: true
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
      mindRoles:
      - MindRoleHeretic

# incompatibleModes is keyed by the selected rule id; include the Blueshift copies.
# Changeling and Heretic can coexist; both exclude Cosmic Cult.
- type: incompatibleModes
  id: BlueshiftChangeling
  modes:
  - CosmicCult
  - BlueshiftCosmicCult

- type: incompatibleModes
  id: BlueshiftHeretic
  modes:
  - Heretic
  - BlueshiftHeretic
  - CosmicCult
  - BlueshiftCosmicCult

- type: entity
  id: BlueshiftCosmicCult
  parent: CosmicCult
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 20

- type: incompatibleModes
  id: BlueshiftCosmicCult
  modes:
  - Nukeops
  - Honkops
  - Zombie
  - Revolutionary
  - BlobGameMode
  - CosmicCult
  - BlueshiftCosmicCult
  - Heretic
  - BlueshiftHeretic

- type: entity
  id: BlueshiftDraft
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagDraft
    playersPerAntagMin: 10
    playersPerAntagMax: 12
    firstPick:
    - rule: BlueshiftTraitor
      weight: 0.33
      maxPicks: 3
    - rule: BlueshiftVampire
      weight: 0.15
      antags: 2
    - rule: BloodBrothers
      weight: 0.16
    # Majors use their rule's count and end the draft; weights target 25% at 30+ players.
    - rule: Revolutionary
      weight: 0.0427
      major: true
    - rule: BloodCult
      weight: 0.0427
      major: true
    - rule: BlueshiftCosmicCult
      weight: 0.0427
      major: true
    - rule: Nukeops
      weight: 0.0427
      minPlayers: 30
      major: true
    - rule: Wizard
      weight: 0.0427
      major: true
    picks:
    - rule: BlueshiftTraitor
      weight: 0.15
      maxPicks: 3
    - rule: BlueshiftVampire
      weight: 0.065
      antags: 2
    - rule: BloodBrothers
      weight: 0.07
    - rule: BlueshiftChangeling
      weight: 0.08
      maxPicks: 2
    - rule: BlueshiftHeretic
      weight: 0.045
    - rule: BlueshiftThief
      weight: 0.013
    - rule: BlueshiftDevil
      weight: 0.014
    - rule: BlueshiftSiliconLiberation
      weight: 0.015

- type: entity
  id: BlueshiftDirector
  parent: GameDirector
  categories: [ HideSpawnMenu ]
  components:
  - type: GameDirector
    noRoundstartAntags: true
    maxDestructionBudget: 2
    destructionRegenPerMinute: 0.075
    repeatWindow: 25m
    stories:
    - RelaxedAttack
    - SlowBurn
    - Infestation
    - Blackout
    - SkeletonCrew
    - QuietShift
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: BlueshiftEventsTable
