# Copy the rule because inheritance cannot remove Hostile: 20, which would make this neutral event hostile.
# Weight targets about 40% of rounds.
- type: entity
  parent: BaseGameRule
  id: BlueshiftParadoxCloneSpawn
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 2.2
    duration: null
    earliestStart: 20
    reoccurrenceDelay: 20
    minimumPlayers: 15
    eventType: Neutral
  - type: GameRule
    chaosScore: 80
  - type: ParadoxCloneRule
    objectiveBlacklist:
      tags:
      - ParadoxCloneObjectiveBlacklist
    targetBlacklist:
      components:
      - BorgBrain
      - AntagImmune
  - type: AntagObjectives
    objectives:
    - ParadoxCloneFriendObjective
    - ParadoxCloneLivingObjective
  - type: AntagRandomSpawn
  - type: AntagSelection
    agentName: paradox-clone-round-end-agent-name
    definitions:
    - spawnerPrototype: SpawnPointGhostParadoxClone
      min: 1
      max: 1
      pickPlayer: false
      startingGear: ParadoxCloneGear
      roleLoadout:
      - RoleSurvivalVoxTank
      - RoleSurvivalPlasmaTank
      briefing:
        text: paradox-clone-role-greeting
        color: lightblue
        sound: /Audio/Misc/paradox_clone_greeting.ogg
      mindRoles:
      - MindRoleParadoxClone
  - type: DynamicRuleCost
    cost: 50

- type: entity
  id: BlueshiftHitmanShuttle
