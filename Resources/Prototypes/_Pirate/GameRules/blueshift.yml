# Keep antag pacing separate from chaos-driven events so low chaos cannot bunch antag arrivals.
# Favor minor antags; confine majors to the first pick so a round gets at most one.

- type: entityTable
  id: BlueshiftEventsTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: BlueshiftCalmEventsTable
    - !type:NestedSelector
      tableId: CalmPestEventsTable
    - !type:NestedSelector
      tableId: CargoGiftsTable
    # Schedule paradox clones through Secret+ (~40% of rounds) to free timed antag slots.
    - id: BlueshiftParadoxCloneSpawn

# Keep this copy in sync with BasicCalmEventsTable; ghost-role antags use the antag pool.
- type: entityTable
  id: BlueshiftCalmEventsTable
  table: !type:AllSelector
    children:
    - id: AnomalySpawn
    - id: BluespaceArtifact
    - id: BluespaceLocker
    - id: BreakerFlip
    - id: BureaucraticError
    - id: ClericalError
    - id: CockroachMigration
    - id: GasLeak
    - id: GreytideVirus
    - id: IonStorm
    - id: JobDistributionError
    - id: BlueshiftKudzuGrowth
    - id: MassHallucinations
    - id: MimicVendorRule
    - id: MouseMigration
    - id: RandomVirus
    - id: PowerGridCheck
    - id: RandomSentience
    - id: SlimesSpawn
    - id: SolarFlare
    - id: SnakeSpawn
    - id: SpiderClownSpawn
    - id: SpiderSpawn
    - id: VentClog
    - id: TidemindDevelop
    - id: MothroachSpawn
    - id: BlueshiftMalignRiftSpawn
    - id: BlueshiftFloorGoblinMidRound
    - id: BlueshiftClownGoblinMigration
    - id: EeepEvent
    - id: SnailMigration

# Target rounds: traitor/bounty ~70%, vampire ~50%, extras ~30%, pirates ~25%, clown/mime/priest ~20%.
# Use TraitorMidround rather than SleeperAgents to respect the Traitor preference and ban.
- type: entityTable
  id: BlueshiftAntagEventsTable
  table: !type:AllSelector
    children:
    - id: BlueshiftTraitorMidround
    - id: BlueshiftVampireMidround
    - id: BlueshiftBountyHunterSpawn
      conditions:
      - !type:BountyHunterTargetCondition
    - id: BlueshiftSpacePirates
    - id: BlueshiftHitmanShuttle
    # Both copies share the single-AI exclusion.
    - id: BlueshiftMalfAiMidround
      conditions:
      - !type:MalfAiAvailableCondition
    - id: BlueshiftMalfAiDoomsdayMidround
      conditions:
      - !type:MalfAiAvailableCondition
    - id: BlueshiftTunnelClownMidround
    - id: BlueshiftMimeAssassinMidround
    - id: BlueshiftDarkPriestMidround
    - id: BorerSpawn
    # VentCrittersRule ignores specialEntry probability, so this belongs in the antag pool.
    - id: BlueshiftKingRatMigration

# Rules with duration: null stay active and cannot be picked again.
- type: entity
  id: BlueshiftAntagScheduler
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
  - type: BasicStationEventScheduler
    minimumTimeUntilFirstEvent: 1500
    minMaxEventTiming:
      min: 1800
      max: 2400
    scheduledGameRules: !type:NestedSelector
      tableId: BlueshiftAntagEventsTable

# Extra TC offsets less time for contracts.
# Remove the inherited start delay so selection coincides with the interception announcement.
- type: entity
  id: BlueshiftTraitorMidround
  parent: TraitorMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    delay:
      min: 0
      max: 0
  - type: TraitorRule
    startingBalance: 75
  - type: StationEvent
    earliestStart: 15
    weight: 20

- type: entity
  id: BlueshiftVampireMidround
  parent: VampireMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    earliestStart: 15
    weight: 12

- type: entity
  id: BlueshiftBountyHunterSpawn
  parent: BountyHunterSpawn
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    earliestStart: 15
    weight: 20

- type: entity
  id: BlueshiftTunnelClownMidround
  parent: TunnelClownMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 4.0

- type: entity
  id: BlueshiftMimeAssassinMidround
  parent: MimeAssassinMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 4.35

- type: entity
  id: BlueshiftDarkPriestMidround
  parent: DarkPriestMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 4.3

- type: entity
  id: BlueshiftParadoxCloneSpawn
  parent: ParadoxCloneSpawn
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 3.4

- type: entity
  id: BlueshiftHitmanShuttle
  parent: HitmanShuttle
  categories: [ HideSpawnMenu ]
  components:
