    startAnnouncementColor: "#cae8e8"
    startAudio:
      path: /Audio/_DV/CosmicCult/tier2.ogg

# Inheritance replaces the entire AntagSelection definitions list.
# Keep these copies in sync with their parents when changing counts or chaos costs.

# Guaranteed traitors at 1 per 15 instead of 1 per 10; the Extra copies can add 0-2 more.
# All copies share the round's traitor codewords.
- type: entity
  id: BlueshiftTraitor
  parent: Traitor
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Traitor ]
      max: 8
      playerRatio: 15
      chaosScore: 100 # Traitor: 150
      blacklist:
        components:
        - CommandStaff
        - AntagImmune
        - Changeling
      lateJoinAdditional: true
      mindRoles:
      - MindRoleTraitor

- type: entity
  id: BlueshiftTraitorExtra1
  parent: Traitor
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Traitor ]
      max: 1
      playerRatio: 3 # max 1 keeps this at one traitor; 3 sets the late-join backup to 1 in 3
      chaosScore: 100 # Traitor: 150
      blacklist:
        components:
        - CommandStaff
        - AntagImmune
        - Changeling
      lateJoinAdditional: true
      mindRoles:
      - MindRoleTraitor

- type: entity
  id: BlueshiftTraitorExtra2
  parent: Traitor
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Traitor ]
      max: 1
      playerRatio: 3 # max 1 keeps this at one traitor; 3 sets the late-join backup to 1 in 3
      chaosScore: 100 # Traitor: 150
      blacklist:
        components:
