# Favor minor antags; confine majors to the first pick so a round gets at most one.
# Separate rule ids permit later antag waves while each rule lasts the whole round.

- type: entityTable
  id: BlueshiftEventsTable
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: BlueshiftCalmEventsTable
    - !type:NestedSelector
      tableId: CalmPestEventsTable
    - !type:NestedSelector
      tableId: CargoGiftsTable
    - !type:NestedSelector
      tableId: BlueshiftAntagEventsTable

# Keep this copy in sync with BasicCalmEventsTable; ghost-role antags use the antag pool.
- type: entityTable
  id: BlueshiftCalmEventsTable
  table: !type:AllSelector
    children:
    - id: AnomalySpawn
    - id: BluespaceArtifact
    - id: BluespaceLocker
    - id: BreakerFlip
    - id: BureaucraticError
    - id: ClericalError
    - id: CockroachMigration
    - id: GasLeak
    - id: GreytideVirus
    - id: IonStorm
    - id: JobDistributionError
    - id: KudzuGrowth
    - id: MassHallucinations
    - id: MimicVendorRule
    - id: MouseMigration
    - id: RandomVirus
    - id: PowerGridCheck
    - id: RandomSentience
    - id: SlimesSpawn
    - id: SolarFlare
    - id: SnakeSpawn
    - id: SpiderClownSpawn
    - id: SpiderSpawn
    - id: VentClog
    - id: TidemindDevelop
    - id: MothroachSpawn
    - id: BlueshiftMalignRiftSpawn
    - id: BlueshiftFloorGoblinMidRound
    - id: BlueshiftClownGoblinMigration
    - id: EeepEvent
    - id: SnailMigration

# Mutual occurrence checks limit each wave to one event.
# The shared cooldown also spaces rare extras, preventing clustered antag arrivals.
- type: entityTable
  id: BlueshiftAntagEventsTable
  table: !type:AllSelector
    conditions:
    - !type:RulesCooldownCondition
      cooldown: 900
      rules:
      - BlueshiftTraitorMidround
      - BlueshiftVampireMidround
      - BlueshiftSleeperAgents
      - BlueshiftBountyHunterSpawn
      - BlueshiftTraitorMidroundLate
      - BlueshiftVampireMidroundLate
      - BlueshiftBountyHunterSpawnLate
      - HitmanShuttle
      - MalfAiMidround
      - TunnelClownMidround
      - MimeAssassinMidround
      - BlueshiftDarkPriestMidround
      - BorerSpawn
      - ParadoxCloneSpawn
      - KingRatMigration
    children:
    - id: BlueshiftTraitorMidround
      conditions:
      - !type:RoundDurationCondition
        max: 3300
      - !type:MaxRuleOccurenceCondition
        ruleOverride: BlueshiftVampireMidround
    - id: BlueshiftVampireMidround
      conditions:
      - !type:RoundDurationCondition
        max: 3300
      - !type:MaxRuleOccurenceCondition
        ruleOverride: BlueshiftTraitorMidround
    - id: BlueshiftSleeperAgents
      conditions:
      - !type:RoundDurationCondition
        max: 5100
      - !type:MaxRuleOccurenceCondition
        ruleOverride: BlueshiftBountyHunterSpawn
    - id: BlueshiftBountyHunterSpawn
      conditions:
      - !type:BountyHunterTargetCondition
      - !type:RoundDurationCondition
        max: 5100
      - !type:MaxRuleOccurenceCondition
        ruleOverride: BlueshiftSleeperAgents
    - id: BlueshiftTraitorMidroundLate
      conditions:
      - !type:RoundDurationCondition
        max: 7500
      - !type:MaxRuleOccurenceCondition
        ruleOverride: BlueshiftVampireMidroundLate
      - !type:MaxRuleOccurenceCondition
        ruleOverride: BlueshiftBountyHunterSpawnLate
    - id: BlueshiftVampireMidroundLate
      conditions:
      - !type:RoundDurationCondition
        max: 7500
      - !type:MaxRuleOccurenceCondition
        ruleOverride: BlueshiftTraitorMidroundLate
      - !type:MaxRuleOccurenceCondition
        ruleOverride: BlueshiftBountyHunterSpawnLate
    - id: BlueshiftBountyHunterSpawnLate
      conditions:
      - !type:BountyHunterTargetCondition
      - !type:RoundDurationCondition
        max: 7500
      - !type:MaxRuleOccurenceCondition
        ruleOverride: BlueshiftTraitorMidroundLate
      - !type:MaxRuleOccurenceCondition
        ruleOverride: BlueshiftVampireMidroundLate
    - id: HitmanShuttle
    - id: MalfAiMidround
      conditions:
      - !type:MalfAiAvailableCondition
    - id: TunnelClownMidround
    - id: MimeAssassinMidround
    - id: BlueshiftDarkPriestMidround
    - id: BorerSpawn
    - id: ParadoxCloneSpawn
    # VentCrittersRule ignores specialEntry probability, so this belongs in the antag pool.
    - id: KingRatMigration

- type: entity
  id: BlueshiftTraitorMidround
  parent: TraitorMidround
  categories: [ HideSpawnMenu ]
  components:
  # Pending rules are invisible to occurrence checks; remove the inherited delay to prevent duplicate waves.
  - type: GameRule
    delay:
      min: 0
      max: 0
  - type: StationEvent
    earliestStart: 25
    weight: 40
    minimumPlayers: 15
    maxOccurrences: 1
    startAnnouncement: station-event-communication-interception
    startAudio:
      path: /Audio/Announcements/intercept.ogg
    duration: null
    occursDuringRoundEnd: false
    chaos:
      Hostile: 100
      Medical: 100
      Death: 100
    eventType: HostilesSpawn

- type: entity
  id: BlueshiftTraitorMidroundLate
  parent: BlueshiftTraitorMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    earliestStart: 95
    weight: 35
    minimumPlayers: 15
    maxOccurrences: 1
    startAnnouncement: station-event-communication-interception
    startAudio:
      path: /Audio/Announcements/intercept.ogg
    duration: null
    occursDuringRoundEnd: false
    chaos:
      Hostile: 100
      Medical: 100
      Death: 100
    eventType: HostilesSpawn

