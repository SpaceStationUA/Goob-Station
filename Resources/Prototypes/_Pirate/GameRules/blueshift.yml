# The rare copy guarantees doomsday; the common copy cannot unlock it.
# Inheritance replaces the whole objective sets list.
- type: weightedRandom
  id: BlueshiftMalfAiSabotageObjectives
  weights:
    MalfAiAssassinateObjective: 4
    MalfAiProtectObjective: 3
    MalfAiControlBorgsObjective: 2

- type: entity
  id: BlueshiftMalfAiMidround
  parent: MalfAiMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagRandomObjectives
    sets:
    - groups: BlueshiftMalfAiSabotageObjectives
      maxPicks: 3
    maxDifficulty: 8
  - type: StationEvent
    weight: 6.0

- type: entity
  id: BlueshiftMalfAiDoomsdayMidround
  parent: MalfAiMidround
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagObjectives
    objectives:
    - MalfAiSurviveObjective
    - MalfAiDoomsdayObjective
  - type: AntagRandomObjectives
    sets:
    - groups: BlueshiftMalfAiSabotageObjectives
      maxPicks: 2
    maxDifficulty: 5 # 8 minus doomsday's 3
  - type: StationEvent
    weight: 3.2

