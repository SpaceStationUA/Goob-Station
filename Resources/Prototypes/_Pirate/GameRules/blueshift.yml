# Inheritance replaces the entire AntagSelection definitions list.
# Keep these copies in sync with their parents when changing counts or chaos costs.

# Each draft pick adds one traitor, up to three.
- type: entity
  id: BlueshiftTraitor
  parent: Traitor
  categories: [ HideSpawnMenu ]
  components:
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Traitor ]
      max: 8
      playerRatio: 15
      chaosScore: 100
      blacklist:
        components:
        - CommandStaff
        - AntagImmune
        - Changeling
      lateJoinAdditional: true
      mindRoles:
      - MindRoleTraitor

- type: entity
  id: BlueshiftChangeling
  parent: Changeling
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 20
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    agentName: changeling-roundend-name
    definitions:
    - prefRoles: [ Changeling ]
      max: 2
      playerRatio: 15
      chaosScore: 150
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
      lateJoinAdditional: true
      mindRoles:
      - MindRoleChangeling

- type: entity
  id: BlueshiftThief
  parent: Thief
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 5
  - type: AntagSelection
    agentName: thief-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Thief ]
      max: 1
      playerRatio: 3
      chaosScore: 100
      lateJoinAdditional: true
      allowNonHumans: true
      multiAntagSetting: NotExclusive
      startingGear: ThiefGear
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
      components:
      - type: Pacified
      - type: Thieving
        stripTimeReduction: 2
        stealthy: true
      mindRoles:
      - MindRoleThief
      briefing:
        sound: "/Audio/Misc/thief_greeting.ogg"

- type: entity
  id: BlueshiftDevil
  parent: Devil
  categories: [ HideSpawnMenu ]
