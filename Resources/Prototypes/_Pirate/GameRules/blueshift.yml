      lateJoinAdditional: true
      jobBlacklist: [ Chaplain ]
      blacklist:
        components:
        - CommandStaff
      mindRoles:
      - MindRoleHeretic

# incompatibleModes is keyed by the selected rule id; include the Blueshift copies.
- type: incompatibleModes
  id: BlueshiftChangeling
  modes:
  - Heretic
  - BlueshiftHeretic
  - CosmicCult
  - BlueshiftCosmicCult

- type: incompatibleModes
  id: BlueshiftHeretic
  modes:
  - Heretic
  - BlueshiftHeretic
  - CosmicCult
  - BlueshiftCosmicCult
  - Changeling
  - BlueshiftChangeling

- type: entity
  id: BlueshiftCosmicCult
  parent: CosmicCult
  categories: [ HideSpawnMenu ]
  components:
  - type: GameRule
    minPlayers: 20

- type: incompatibleModes
  id: BlueshiftCosmicCult
  modes:
  - Nukeops
  - Honkops
  - Zombie
  - Revolutionary
  - BlobGameMode
  - CosmicCult
  - BlueshiftCosmicCult
  - Heretic
  - BlueshiftHeretic

- type: weightedRandom
  id: BlueshiftPrimary
  weights:
    BlueshiftTraitor: 0.30
    BlueshiftVampire: 0.15
    BloodBrothers: 0.15
    # Expensive antags fail more budget rolls; higher weights target about 5% of rounds each.
    Revolutionary: 0.055
    BloodCult: 0.06
    BlueshiftCosmicCult: 0.07
    Nukeops: 0.085
    Wizard: 0.06

- type: weightedRandom
  id: BlueshiftRoundstart
  weights:
    BlueshiftTraitor: 0.186
    # One traitor each: a round can get 0-2 traitors more than the guaranteed ones.
    BlueshiftTraitorExtra1: 0.273
    BlueshiftTraitorExtra2: 0.273
    BlueshiftVampire: 0.156
    BloodBrothers: 0.17
    BlueshiftChangeling: 0.297
    BlueshiftHeretic: 0.164
    # Cheap antags pass budget rolls more often; keep weights low.
    BlueshiftThief: 0.033
    BlueshiftDevil: 0.036
    BlueshiftSiliconLiberation: 0.042

- type: entity
  id: BlueshiftScheduler
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 4.44 # Per connected player, including the lobby.
    maxStartingChaos: 8.88
    # 2 / 0.74 keeps the first-pick odds of 6-12 chaos, so the lower budget cuts only follow-up antags.
    primaryAntagChaosBias: 2.703
    livingChaosChange: -0.018
    deadChaosChange: 0.048
    chaosChangeVariationMin: 0.65
    chaosChangeVariationMax: 1.3
    # Space out non-antag events now that antags no longer consume these picks.
    eventIntervalMin: 210
    eventIntervalMax: 525
    primaryAntagsWeightTable: BlueshiftPrimary
    roundStartAntagsWeightTable: BlueshiftRoundstart
    disallowedEvents:
    - FriendlySpawn
    - Psionic
  - type: SelectedGameRules
    scheduledGameRules: !type:NestedSelector
      tableId: BlueshiftEventsTable
