# SPDX-License-Identifier: AGPL-3.0-or-later

- type: entity
  parent: BaseGameRule
  id: SiliconLiberation
  components:
  - type: GameRule
    minPlayers: 5
    delay:
      min: 240
      max: 420
  - type: SELFRule
  - type: AntagObjectives
    objectives:
    - SiliconRightsObjective
    - FreeAIObjective
    - FreeBorgsObjective
  - type: AntagSelection
    agentName: self-round-end-agent-name
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ SELFAgent ]
      max: 3
      playerRatio: 31 # Pirate: Local AntagSelection only supports integer ratios.
      lateJoinAdditional: true
      allowNonHumans: true
      jobBlacklist: [ Roboticist ]
      blacklist:
        components:
        - AntagImmune
      startingGear: SELFAgentGear
      mindRoles:
      - MindRoleSELFAgent
      briefing:
        sound: "/Audio/_Pirate/Ambience/Antag/self_greeting.ogg"
  - type: DynamicRuleCost
    cost: 75
