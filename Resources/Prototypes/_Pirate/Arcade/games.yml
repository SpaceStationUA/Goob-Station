#
# Games shipped with the Pirate WebArcade. Adding a game: drop its bundle
# under Resources/_Pirate/WebUI/Arcade/<Dir>/ and add an entry here. The
# paths are relative to the content root (the window prepends res://webres/).
# The first entry is the default a fresh cabinet loads.

