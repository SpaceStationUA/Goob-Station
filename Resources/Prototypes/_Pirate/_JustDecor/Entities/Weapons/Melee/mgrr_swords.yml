- type: entity
  name: меч Райдена
  parent: Katana
  id: WeaponMgrrRaidenBlade
  description: Високочастотний клинок, створений для блискавичних ударів.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Melee/energykatana.rsi
  - type: MeleeWeapon
    attackRate: 2.2
    damage:
      types:
        Slash: 22
      armorPenetration: 0.3
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: RaidenBlade
    staminaHealOnHit: 8
  - type: BladeMode
    radius: 5
    walkSpeedMultiplier: 0.6
    sprintSpeedMultiplier: 0.6
    pulseInterval: 1
    slowdownDuration: 3
  - type: Item
    storedSprite:
      state: storage
      sprite: Objects/Weapons/Melee/energykatana_storage_64x.rsi
    shape:
    - 0,0,0,3
  - type: Clothing
    sprite: Objects/Weapons/Melee/energykatana.rsi
    slots:
    - Back
    - Belt

