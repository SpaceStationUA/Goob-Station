      [bold]Кодова назва:[/bold] [head=3]«ЗАЧИСТКА ЛАБОРАТОРІЇ X-7»[/head]

      [bold]Ситуація:[/bold] лабораторія захоплена ксеноморфами після інциденту.
      [bold]Ціль:[/bold] повне очищення та запуск самознищення.

      [bold]Завдання:[/bold]
      [bold]1.[/bold] Оснаститися спеціалізованою зброєю проти органіки.
      [bold]2.[/bold] Зачистити 3 рівні зараження.
      [bold]3.[/bold] Знищити ксено-королеву та гніздо.
      [bold]4.[/bold] Активувати протокол самознищення.
      [bold]5.[/bold] Евакуюватися протягом 5 хв.

