      [color=#096107]███[head=3]Бланк службового документа[/head]███[/color]
      [color=#096107]███[head=3]NanoTrasen — Внутрішня безпека[/head]███[/color]
      [color=#096107]█████████████████[/color]
      ===================================================
                     [head=2][bold]СЕКРЕТНО[/bold][/head]
