  name: Особиста нотатка
  suffix: JustDecor, Місії
  parent: Paper
  components:
  - type: Paper
    content: |2
      Я більше не можу дивитись, як це називають “наукою”.

      Я знаю, що за дверима — озброєні люди.
      Я знаю, що шансів майже немає.

      Але якщо хтось колись зайде сюди
      не з наміром стріляти —
      я піду з ними, навіть якщо це куля в спину.

      — Н. Ш.