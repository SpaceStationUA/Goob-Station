      ===================================================
                          [head=2][bold]СЕКРЕТНО[/bold][/head]
      ===================================================

      [bold]Дата та час:[/bold] [italic]██/██/2467 ██:██:██[/italic]  
      [bold]Рівень доступу:[/bold] [italic]NT-SEC/███[/italic]

      ===================================================
                          [head=2][bold]КОДОВА НАЗВА ОПЕРАЦІЇ[/bold][/head]
      ===================================================

      [head=3]«ПЕРШЕ ВИПРОБУВАННЯ»[/head]

      ===================================================
                          [head=2][bold]ЗАГАЛЬНА ІНФОРМАЦІЯ[/bold][/head]
      ===================================================

      Під прикриттям законсервованого об’єкта виявлено [bold]ворожий військово-науковий комплекс Синдикату[/bold].  
      Основний профіль об’єкта — [bold]дослідження та випробування озброєння різних класів[/bold],  
      а також [bold]утримання та експерименти над ув’язненими особами[/bold].

      Об’єкт активно функціонує. Частина персоналу — цивільні науковці, частина — озброєна охорона.

      ===================================================
                          [head=2][bold]ПРІОРИТЕТНА ЦІЛЬ[/bold][/head]
      ===================================================

      Серед утримуваних осіб ідентифіковано вченого:

      [bold]Доктор Ніколай Штайнер[/bold]  
      [italic]Провідний спеціаліст з прикладних озброєнь та військових прототипів[/italic]

      Особа має критичну цінність для NanoTrasen.  
      Існує висока ймовірність, що вчений [bold]утримується проти волі[/bold] та використовується як консультант.

      Стан — невідомий.  
      Рівень співпраці — під питанням.

      ===================================================
                          [head=2][bold]РОЗВІДУВАЛЬНІ ДАНІ[/bold][/head]
      ===================================================

      — Основний вхід до лабораторного комплексу з’єднаний з мережею [bold]прямих коридорів[/bold]  
      — Дані коридори [bold]практично не охороняються[/bold], можливе хибне відчуття безпеки  
      — Основне сховище озброєння розташоване [bold]у північно-східній частині комплексу[/bold], далі по коридору

      Друга частина об’єкта:
      — зона утримання в’язнів  
      — експериментальні приміщення  
      — внутрішні лабораторії

      [bold]Не розвідана.[/bold]  
      Доступ обмежений дверима [bold]вищого рівня авторизації[/bold].

      ===================================================
                          [head=2][bold]ДОДАТКОВІ ВІДОМОСТІ[/bold][/head]
      ===================================================

      Згідно з повідомленням агента NanoTrasen:

      — Картка доступу до закритої секції  
      — Кнопка відкриття другої частини зброярні  

      [bold]Ймовірно знаходяться неподалік білої лабораторії[/bold],  
      де постійно перебуває група вчених Синдикату.

      ===================================================
                          [head=2][bold]ОБМЕЖЕННЯ СПОРЯДЖЕННЯ[/bold][/head]
      ===================================================

      На момент входу в об’єкт доступне лише базове озброєння:

      — Легкі пістолети  
      — Мінімальний комплект спорядження

      Інше спорядження необхідно:
      — здобути безпосередньо на об’єкті  
      — або вилучити зі сховища Синдикату

      [italic]Обмеження введене навмисно. Порушення дисципліни не допускається.[/italic]

      ===================================================
                          [head=2][bold]ЗАВДАННЯ[/bold][/head]
      ===================================================

      [bold]1.[/bold] Проникнути на територію лабораторного комплексу  
      [bold]2.[/bold] Закріпитися у початкових коридорах  
      [bold]3.[/bold] Здобути доступ до розширеного озброєння  
      [bold]4.[/bold] Виявити та звільнити доктора Штайнера  
      [bold]5.[/bold] За можливості — отримати додаткові дані про діяльність об’єкта

      ===================================================

      [bold]Підпис відповідальної особи:[/bold] ___________________________

      [bold]Штамп NanoTrasen:[/bold]

