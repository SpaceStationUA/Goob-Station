- type: npcInterrogation
  id: SyndicateSoldierInterrogation
  questions:
    - "Відповідай!"
    - "Говори! Де ваші?"
    - "Куди ви сховалися?"
    - "Хто командує?"
    - "Видай інформацію!"
  answers:
    - "Я нічого не скажу! Синдикат вічний!"
    - "Ми просто виконували наказ..."
    - "Вони вб'ють мене, якщо я заговорю!"
    - "Доктор Штайнер... він у північному крилі. Будь ласка, не бийте!"
    - "Наша база... вона скрізь. Ви не зможете перемогти."
    - "Пароль? Я... я забув! Чесно!"
    - "Ви не знаєте, у що вв'язалися..."
  linked:
    - question: "Де ключ-карта?"
      answers:
        - "У офіцера в білому секторі."
        - "Я бачив її у науковця."
    - question: "Хто командує базою?"
      answers:
        - "Командир в командному блоці."
        - "Старший офіцер контролює все."

- type: npcInterrogation
  id: SyndicateScientistInterrogation
  questions:
    - "Відповідай!"
    - "Говори! Де лабораторія?"
    - "Де ключ-карта?"
    - "Хто головний тут?"
    - "Видай інформацію!"
  answers:
    - "Це все заради науки! Ви не розумієте!"
    - "Штайнер занадто м'який. Він не заслуговує на свій талант."
    - "Ми лише випробовуємо прототипи. Це робота."
    - "Ключ-карта? Вона у офіцера в білій лабораторії!"
    - "Зупиніться! Я розповім все, що знаю!"
    - "Ми працюємо над проектом 'Відплата'. Це змінить все."
  linked:
    - question: "Де прототип?"
      answers:
        - "У центральній лабораторії."
        - "Його перемістили у північне крило."
    - question: "Хто головний тут?"
      answers:
        - "Керівник сидить у білому секторі."
        - "Офіцер координує все з центру."
