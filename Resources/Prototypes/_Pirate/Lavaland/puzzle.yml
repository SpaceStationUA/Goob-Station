- type: entity
  id: LavalandSlidingPuzzle
  parent: MarkerBase
  name: sliding puzzle generator
  description: Generates a sliding puzzle around itself.
  categories: [ HideSpawnMenu ]
  components:
  - type: LavalandSlidingPuzzle
    rewardProto: LavalandPuzzleChest
    megafaunaProto: LavalandBossAshDrake

- type: entity
  id: LavalandPrisonCubePuzzle
  parent: MarkerBase
  name: prison cube generator
  categories: [ HideSpawnMenu ]
  description: Generates a prison cube puzzle around itself.
  components:
  - type: LavalandSlidingPuzzle
    megafaunaChance: 0
    emptyTileId: 5
    returnCubeProto: LavalandPrisonCube

- type: entity
  parent: BaseItem
  id: LavalandPrisonCube
  name: prison cube
  description: Dusty cube with a humanoid imprint on it.
  components:
  - type: Sprite
    sprite: _Pirate/Misc/puzzle.rsi
    state: prison_cube
  - type: StaticPrice
    price: 33333
  - type: Item
    size: Small
  - type: LavalandPrisonCube
    puzzleProto: LavalandPrisonCubePuzzle

- type: entity
  parent: LavalandCrateNecropolis
  id: LavalandPuzzleChest
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - !type:NestedSelector
          tableId: NecropolisChestLoot
        - id: LavalandPrisonCube

- type: lavalandMarkerRuin
  id: LavalandSlidingPuzzleRuin
  boundary: 5,5
  spawnedMarker: LavalandSlidingPuzzle
  priority: 0
