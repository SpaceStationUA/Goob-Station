- type: entity
  id: LavalandPuzzlePillar1
  parent: BaseStructure
  name: mysterious pillar
  description: Puzzling...
  categories: [ HideSpawnMenu ]
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Sprite
    sprite: _Pirate/Misc/puzzle.rsi
    state: pillar_1
    drawdepth: Mobs
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      puzzle:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 500
        mask:
        - MobMask
        layer:
        - MidImpassable
        - HighImpassable
  - type: LavalandSlidingPuzzleElement

