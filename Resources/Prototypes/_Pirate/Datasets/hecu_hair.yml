# SPDX-License-Identifier: AGPL-3.0-or-later
# Hair styles HECU may roll (HumanoidAppearanceOverride on HecuSoldier). Generated from the sprites, from every
# species-unrestricted Hair marking, with two rules:
#  - length: lowest pixel, in any facing, at row 16 or above, and at most 25 pixels below the shoulder line (row 13+).
#    Calibrated on Braidtail (kept) vs Impish (too long).
#  - bulk: in the front/back views, at most 16 pixels out to the sides of the head, at most 20 above it, and at
#    most 24 combined. Calibrated on RMCDreadlocks (16/0, kept) vs Triangulum (24/0) and ClassicBigAfro (16/28).
# Headwear-type entries (tichels) dropped by hand.
