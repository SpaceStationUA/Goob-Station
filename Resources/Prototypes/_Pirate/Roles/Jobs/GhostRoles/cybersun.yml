# This job is never assigned; GhostRoleRequiredJobs uses it to gate Cybersun pod roles.
# Add a player with `jobwhitelistadd <player> CybersunTeamLeader`; server-whitelisted players get it on connect.
- type: job
  id: CybersunTeamLeader
  name: job-name-cybersun-team-leader
  playTimeTracker: JobCybersunTeamLeader
  setPreference: false
  canBeAntag: false
  whitelisted: true
  icon: JobIconSyndicate

- type: job
  id: CybersunCommand
  name: job-name-cybersun-command
  playTimeTracker: JobCybersunCommand
  setPreference: false
  canBeAntag: false
  icon: JobIconSyndicate
  requirements:
  - !type:FlavorTextLengthRequirement
