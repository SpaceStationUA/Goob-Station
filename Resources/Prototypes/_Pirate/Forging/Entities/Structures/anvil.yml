# Pirate: completed anvil entity adapted from Trauma's forging anvil.

- type: entity
  parent: [ BaseMetallicSteel, BaseMachine ]
  id: AnvilComplete
  name: ковадло
  description: Використовується для перетворення злитків на готові вироби.
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Forging/anvil.rsi
    state: icon
  - type: ForgingAnvil
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 10000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 3
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: ActivatableUI
    key: enum.AnvilUiKey.Key
  - type: UserInterface
    interfaces:
      enum.AnvilUiKey.Key:
        type: ForgingAnvilBUI
  - type: Construction
    graph: Anvil
    node: anvil
  - type: PlaceableSurface
  - type: Temperature
    specificHeat: 500 # Pirate: local Temperature uses specific heat multiplied by fixture mass.
