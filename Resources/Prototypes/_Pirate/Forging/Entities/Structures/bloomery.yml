# TODO: BRUH DO THIS WITH CODE

- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseBloomery
  name: "незапалена сиродутна піч"
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Forging/bloomery.rsi
    state: cold
  - type: Animateable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Damageable
    damageModifierSet: StructuralMetallic
  - type: Construction
    graph: BloomeryCold
    node: bloomery

- type: entity
  abstract: true
  parent: BaseBloomery
  id: BaseBloomeryLit
  name: "запалена сиродутна піч"
  components:
  - type: Sprite
    state: burning
  - type: Damageable
    damageModifierSet: NormalMode
  - type: PointLight
    radius: 2
    energy: 3
    color: "#ff8227"

- type: entity
  abstract: true
  parent: BaseBloomery
  id: BaseBloomeryComplete
  name: "димна сиродутна піч"
  description: "Схоже, усе готово. Розбийте її."
  components:
  - type: Sprite
    state: complete

# Unloaded

- type: entity
  parent: BaseBloomery
  id: BloomeryCold
  name: "незапалена сиродутна піч"
  description: "Завантажте її деревним вугіллям і металевим брухтом."
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          Brick1:
            min: 13
            max: 15

