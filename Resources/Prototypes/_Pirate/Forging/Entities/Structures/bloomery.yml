# Lit

- type: entity
  parent: BaseBloomeryLit
  id: BloomeryLitBrass
  suffix: Brass
  description: "Завантажена латунню; дайте їй час прогоріти, після чого метал буде готовий."
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 60000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          BloomeryCompleteBrass:
            min: 1
            max: 1
  - type: Construction
    node: bloomerybrasslit
