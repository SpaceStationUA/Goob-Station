  components:
  - type: Sprite
    layers:
    - state: bloomsteel
      shader: Emissive
  - type: Workable
    remaining: 150 # you may want a few of the boys to help you
    result: SteelIngot

- type: entity
  parent: [ BaseWorkableSteel, BaseMetalIngot, SteelOverheatable ]
  id: SteelIngot
  name: "сталевий зливок"
  description: "Міцний метал, який можна кувати за помірно високих температур."
  components:
  - type: Sprite
    layers:
    - state: ingot_steel
      shader: Emissive
  - type: PhysicalComposition
    materialComposition:
      Steel: 250
  - type: MetallicTags
    workable: [ IngotWorkableSteel ] # needed to craft an anvil
  - type: Tag
    tags: [ IngotWorkableSteel ]

