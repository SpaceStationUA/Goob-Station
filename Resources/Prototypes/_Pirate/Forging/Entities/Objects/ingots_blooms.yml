    graph: SteelScraps

- type: entity
  parent: [ BaseForgeItem, BaseMetallicSteel ]
  id: OverheatedSteel
  name: "перегріта сталь"
  description: "Метал перегрівся й став крихким; розбийте його, щоб знову зробити придатним до використання."
