# Adamantine - 2050K -+ 50K range of error

- type: entity
  abstract: true
  parent: BaseMetallicAdamantine
  id: AdamantineOverheatable
  components:
  - type: BurnableForged
    burnTemp: 2200
    burnedPrototype: OverheatedAdamantine
    burnedPrefix: heated-name-text
    burnSound: null

- type: entity
  parent: [ BaseForgeItem, AdamantineOverheatable ]
  id: AdamantineScraps
  name: "адамантиновий брухт"
  description: "Уламки колись великого витвору дворфійського ремесла; за дуже високої температури вони знову стануть придатними до обробки."
  components:
  - type: Tag
    tags:
    - AdamantineScraps
  - type: Sprite
    layers:
    - state: adamantine
      shader: Emissive
  - type: Workable
    remaining: 500 # bring an army, you'll need it
    result: AdamantineIngot

- type: entity
  parent: [ BaseForgeItem, BaseMetallicAdamantine ]
  id: OverheatedAdamantine
  name: "перегрітий адамантин"
  description: "Метал перегрівся й утратив форму; його можна обробити знову, якщо довести до належної температури."
  components:
  - type: Sprite
    layers:
    - state: bloomadamantine # not using the overheated version because it doesn't need to be smashed
      shader: Emissive
  - type: Temperature
    currentTemperature: 2200
  - type: Workable
    remaining: 500 # bring an army, you'll need it
    result: AdamantineIngot

- type: entity
  parent: [ BaseWorkableAdamantine, BaseMetalIngot, AdamantineOverheatable ]
  id: AdamantineIngot
  name: "адамантиновий зливок"
  description: "Метал, про який пишуть частіше, ніж бачать на власні очі; для обробки потребує надзвичайно високої температури."
  components:
  - type: Sprite
    layers:
    - state: ingot_adamantine
      shader: Emissive
  - type: StaticPrice
    price: 10000
