# Base
- type: entity
  abstract: true
  parent: BaseItem
  id: BaseForgeItemNoTemp
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Specific/forging.rsi

- type: entity
  abstract: true
  parent: [ BaseForgeItemNoTemp, BaseMetallic ]
  id: BaseForgeItem

- type: entity
  abstract: true
  parent: BaseForgeItem
  id: BaseMetalScraps
  description: "Щоб зробити його придатним до використання, потрібно переплавити в сиродутній печі."
  components:
  - type: Construction
    node: scraps

- type: entity
  abstract: true
  parent: BaseForgeItem
  id: BaseMetalBloom
  description: "Надайте йому форми ударами молота!"
  components:
  - type: Metallic
    workable: true # starts with workable heat out of the bloomery
  - type: Workable
    remaining: 25
  # TODO: heat up whatever attacked it so you can't use a bat or whatever, have to use metal hammers
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ] # no ingot for you

- type: entity
  abstract: true
  parent: BaseForgeItem
  id: BaseMetalIngot
  suffix: Hot
  components:
  - type: MetallicPopups
    heatedPopup: ingot-heated-popup-text
    cooledPopup: ingot-cooled-popup-text
  - type: MetalIngot

# Brass - 850K +- 56K range of error

- type: entity
  abstract: true
  parent: BaseMetallicBrass
  id: BrassOverheatable
  components:
  - type: BurnableForged
    burnTemp: 906
    burnedPrototype: OverheatedBrass
    burnedPrefix: heated-name-text
    burnSound: null

- type: entity
  parent: [ BaseMetalScraps, BaseMetallicBrass ]
  id: BrassScraps
  name: "латунний брухт"
  components:
  - type: Tag
    tags:
    - BrassScraps # TODO: generic thing not fucking tags + lathe recipe
  - type: Sprite
    layers:
    - state: brass
      shader: Emissive
  - type: Construction
    graph: BrassScraps

- type: entity
  parent: [ BaseForgeItem, BaseMetallicBrass ]
  id: OverheatedBrass
  name: "перегріта латунь"
  description: "Метал перегрівся й став крихким; розбийте його, щоб знову зробити придатним до використання."
  components:
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTypeTrigger
        damageType: Blunt
        damage: 25
      behaviors:
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          BrassScraps:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Sprite
    layers:
    - state: brassbrittle
      shader: Emissive

- type: entity
  parent: [ BaseWorkableBrass, BaseMetalBloom, BrassOverheatable ]
  id: BrassBloom
  name: "латунна криця"
  components:
  - type: Sprite
    layers:
    - state: bloombrass
      shader: Emissive
  - type: Workable
    result: BrassIngot

- type: entity
  parent: [ BaseWorkableBrass, BaseMetalIngot, BrassOverheatable]
  id: BrassIngot
  name: "латунний зливок"
  description: "М'який метал, який можна кувати за відносно низьких температур."
  components:
  - type: Sprite
    layers:
    - state: ingot_brass
      shader: Emissive
  - type: PhysicalComposition
    materialComposition:
      Brass: 250

# Steel - 1260K +- 42K range of error

- type: entity
  abstract: true
  parent: BaseMetallicSteel
