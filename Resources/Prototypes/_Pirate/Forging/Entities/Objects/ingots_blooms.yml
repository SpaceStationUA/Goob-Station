# Gold

- type: entity
  abstract: true
  parent: BaseMetallicGold
  id: GoldOverheatable
  components:
  - type: BurnableForged
    burnTemp: 1337 # melting point since gold doesnt become brittle, it just melts
    burnedPrototype: GoldMolten
    burnedPrefix: heated-name-text
    burnSound: null

- type: entity
  parent: [ BaseMetalScraps, BaseMetallicGold ]
  id: GoldScraps
  name: "золотий брухт"
  description: "Його потрібно нагріти й надати форми придатного до використання зливка. Золото не має домішок чи оксидів, тож не потребує кричного переділу."
  components:
  - type: Sprite
    layers:
    - state: gold
      shader: Emissive
  - type: Workable
    remaining: 50 # relatively soft metal
    result: GoldIngot
  - type: Construction
    graph: GoldScraps
  - type: StaticPrice
    price: 225

- type: entity
  parent: MarkerBase
  id: GoldMolten
  name: "спавнер розплавленого золота"
  components:
  - type: PuddleSpawner
    solution:
      temperature: 1340 # a bit over the edge
      reagents:
      - ReagentId: Gold
        Quantity: 30

- type: entity
  parent: [ BaseWorkableGold, BaseMetalIngot, GoldOverheatable ]
  id: GoldIngot
  name: "золотий зливок"
  description: "Блискучий і рідкісний метал, який можна кувати за низьких температур. Кайло з нього ви б не робили."
  components:
  - type: Sprite
    layers:
    - state: ingot_gold
      shader: Emissive
  - type: PhysicalComposition
    materialComposition:
      Gold: 250
  - type: StaticPrice
    price: 225
