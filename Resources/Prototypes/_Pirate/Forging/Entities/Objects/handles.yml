# Handles

- type: entity
  abstract: true
  parent: BaseForgeItemNoTemp
  id: BaseForgingHandle
  components:
  - type: Construction
    graph: Handle

- type: entity
  parent: BaseForgingHandle
  id: WoodenHandleUnfinished
  name: "незавершене руків'я"
  description: "Груба дерев'яна жердина; обтешіть її ножем."
  components:
  - type: Sprite
    state: unfinishedhandle
  - type: Construction
    node: unfinished handle

- type: entity
  parent: BaseForgingHandle
  id: WoodenHandleShort
  name: "коротке руків'я"
  description: "Невелике руків'я для малої зброї та інструментів, як-от ножі чи викрутки. Якщо рука не тремтить, його можна розрізати на древка для стріл."
  components:
  - type: Sprite
    state: handlesmall
  - type: Tag
    tags:
    - WoodenHandleShort
  - type: Construction
    node: short handle

- type: entity
  parent: BaseForgingHandle
  id: WoodenHandleMedium
  name: "середнє руків'я"
  description: "Руків'я середнього розміру для такої зброї, як булави й кайла. Його можна вкоротити для менших руків'їв."
  components:
  - type: Sprite
    state: handlemedium
  - type: Tag
    tags:
    - WoodenHandleMedium
  - type: Construction
    node: medium handle

- type: entity
  parent: BaseForgingHandle
  id: WoodenHandleLong
  name: "дерев'яна жердина"
  description: "Довга дерев'яна жердина для великої зброї, як-от алебарди та списи. Її можна вкоротити для менших руків'їв."
  components:
  - type: Sprite
    state: handlelarge
  - type: Tag
    tags:
    - WoodenHandleLong
  - type: Construction
    graph: Handle
    node: wooden pole

- type: entity
  parent: BaseForgingHandle
  id: WoodenArrowShaft
  name: "древко стріли"
  description: "Тонкий, але міцний шматок дерева, ідеальний для саморобних стріл. До нього можна прикріпити кований наконечник."
  components:
  - type: Sprite
    state: handlesmall # TODO: sprite??
  - type: Tag
    tags:
    - WoodenArrowShaft
  - type: Construction
    node: arrow shaft

- type: Tag
  id: WoodenArrowShaft

- type: Tag
  id: WoodenHandleShort

- type: Tag
  id: WoodenHandleMedium

- type: Tag
  id: WoodenHandleLong
