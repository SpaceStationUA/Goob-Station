- type: material
  id: Charcoal
  stackEntity: Charcoal1
  name: materials-charcoal
  unit: materials-unit-piece
  icon: { sprite: Objects/Materials/ore.rsi, state: coal }
  color: "#404040"
  price: 0.1

- type: material
  id: Brick
  stackEntity: Brick1
  name: materials-brick
  unit: materials-unit-piece
  icon: { sprite: _Pirate/Objects/Materials/materials.rsi, state: brick }
  color: "#b6946d"
  price: 0.1

- type: stack
  parent: BaseMediumStack
  id: Charcoal
  name: stack-charcoal
  icon: { sprite: /Textures/Objects/Materials/ore.rsi, state: coal }
  spawn: Charcoal1

- type: stack
  parent: BaseMediumStack
  id: Brick
  name: stack-brick
  icon: { sprite: /Textures/_Pirate/Objects/Materials/materials.rsi, state: brick }
  spawn: Brick1

- type: entity
  parent: OreBase
  id: Charcoal
  name: charcoal
  suffix: Full
  description: Created by burning wood with minimal oxygen, it burns much hotter than wood.
  components:
  - type: Stack
    stackType: Charcoal
  - type: Sprite
    state: coal
  - type: Material
  - type: Extractable
    grindableSolutionName: coal
  - type: Solution
    solution:
      reagents:
      - ReagentId: Charcoal
        Quantity: 10
  - type: PhysicalComposition
    materialComposition:
      Charcoal: 100
  - type: Item
    heldPrefix: coal

- type: entity
  parent: Charcoal
  id: Charcoal1
  suffix: Single
  components:
  - type: Stack
    count: 1

- type: entity
  parent: Charcoal
  id: Charcoal5
  suffix: Five
  components:
  - type: Stack
    count: 5

- type: entity
  parent: Charcoal
  id: Charcoal10
  suffix: Ten
  components:
  - type: Stack
    count: 10

- type: entity
  parent: Charcoal
  id: Charcoal15
  suffix: Fifteen
  components:
  - type: Stack
    count: 15

- type: entity
  parent: MaterialBase
  id: Brick
  name: brick
  suffix: Full
  description: An insulative brick, perfect for a bloomery.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Materials/materials.rsi
    layers:
    - state: brick
      map: ["base"]
  - type: Appearance
  - type: Stack
    stackType: Brick
    count: 30
    baseLayer: base
    layerStates:
    - brick
    - brick_2
    - brick_3
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Brick: 100
  - type: Item
    sprite: _Pirate/Objects/Materials/materials.rsi
    heldPrefix: brick

- type: entity
  parent: Brick
  id: Brick1
  suffix: Single
  components:
  - type: Stack
    count: 1

- type: reagent
  id: Cement
  name: reagent-name-cement
  group: Pyrotechnic
  desc: reagent-desc-cement
  physicalDesc: reagent-physical-desc-pungent
  color: "#7a7866"
  metabolisms:
    Bloodstream:
      effects:
      - !type:HealthChange
        damage:
          types:
            Poison: 3

- type: reaction
  id: Cement
  reactants:
    Carbon:
      amount: 1
    Ash:
      amount: 2
    Aluminium:
      amount: 2
  products:
    Cement: 5

- type: reaction
  id: CementWetReaction
  reactants:
    Cement:
      amount: 5
    Water:
      amount: 5
  effects:
  - !type:SpawnEntity
    entity: WetCement
