- type: entity
  id: CaptureTheFlagHull
  parent: WallPlastitaniumIndestructible
  categories: [HideSpawnMenu]

- type: entity
  id: CaptureTheFlagCover
  parent: WallPlastitaniumIndestructible
  categories: [HideSpawnMenu]
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Walls/solid.rsi
  - type: Icon
    sprite: _Pirate/Structures/Walls/solid.rsi
    state: full
  - type: IconSmooth
    key: walls
    base: solid

- type: entity
  id: CaptureTheFlagArenaLight
  categories: [HideSpawnMenu]
  components:
  - type: Transform
    anchored: true
  - type: PointLight
    color: "#F2F5FF"
    radius: 10
    energy: 2.5
    falloff: 2
    castShadows: false

- type: entity
  id: CaptureTheFlagSupplyRelay
  categories: [HideSpawnMenu]
  parent: CaptureTheFlagStand
  components:
  - type: CaptureTheFlagRelay
  - type: PointLight
    color: "#FFDB8B"
    radius: 7
    energy: 1.6
    falloff: 2
    castShadows: false

- type: entity
  id: CaptureTheFlagMachineCover
  parent: BaseWall
  abstract: true
  categories: [HideSpawnMenu]
  components:
  # Fixed machine sprites need unsmoothed walls. Keep the arena's plastitanium protection.
  - type: Penetratable
    penetrateDamage: 1000
    damagePenalty: 0.8
  - type: Damageable
    damageModifierSet: StructuralMetallicStrong
  - type: RustRequiresPathStage
    pathStage: 11
  - type: RadiationBlocker
    resistance: 10

- type: entity
  id: CaptureTheFlagCollectorCover
  categories: [HideSpawnMenu]
  parent: CaptureTheFlagMachineCover
  components:
  - type: Sprite
    sprite: Structures/Power/Generation/Singularity/collector.rsi
    state: ca_off
  - type: Icon
    sprite: Structures/Power/Generation/Singularity/collector.rsi
    state: ca_off

- type: entity
  id: CaptureTheFlagGeneratorCover
  categories: [HideSpawnMenu]
