- type: entity
  id: CaptureTheFlagFlag
  abstract: true
  categories: [HideSpawnMenu]
  components:
  - type: CaptureTheFlagFlag
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Objects/Misc/Handy_Flags/blank_handy_flag.rsi
    state: icon
    drawdepth: Items
    scale: 1.4,1.4
  - type: Item
    sprite: Objects/Misc/Handy_Flags/blank_handy_flag.rsi
    size: Large

- type: entity
  id: CaptureTheFlagRedFlag
  categories: [HideSpawnMenu]
  parent: CaptureTheFlagFlag
  components:
  - type: Sprite
    color: "#FF5266"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#FF5266"
      right:
      - state: inhand-right
        color: "#FF5266"

- type: entity
  id: CaptureTheFlagBlueFlag
  categories: [HideSpawnMenu]
  parent: CaptureTheFlagFlag
  components:
  - type: Sprite
    color: "#62BAFF"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#62BAFF"
      right:
      - state: inhand-right
        color: "#62BAFF"

- type: entity
  id: CaptureTheFlagStand
  abstract: true
  categories: [HideSpawnMenu]
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Sprite
    sprite: Structures/Machines/holopad.rsi
    state: base
    drawdepth: HighFloorObjects
    scale: 1.25,1.25
  - type: PointLight
    radius: 2.5
    energy: 1.4
    softness: 0.6

- type: entity
  id: CaptureTheFlagRedStand
  categories: [HideSpawnMenu]
  parent: CaptureTheFlagStand
  components:
  - type: CaptureTheFlagBase
    team: Red
  - type: Sprite
    color: "#FF5266"
  - type: PointLight
    color: "#FF5266"

- type: entity
  id: CaptureTheFlagBlueStand
  categories: [HideSpawnMenu]
  parent: CaptureTheFlagStand
  components:
  - type: CaptureTheFlagBase
    team: Blue
  - type: Sprite
    color: "#62BAFF"
  - type: PointLight
    color: "#62BAFF"

- type: entity
