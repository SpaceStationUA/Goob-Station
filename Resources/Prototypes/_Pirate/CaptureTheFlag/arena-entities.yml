    sprite: Structures/Power/Generation/rtg.rsi
    state: rtg
  - type: Icon
    sprite: Structures/Power/Generation/rtg.rsi
    state: rtg

- type: entity
  id: CaptureTheFlagConsoleCover
  categories: [HideSpawnMenu]
  parent: CaptureTheFlagMachineCover
  components:
  - type: Sprite
    sprite: Structures/Machines/computers.rsi
    state: broken
  - type: Icon
    sprite: Structures/Machines/computers.rsi
    state: broken

- type: entity
