- type: cargoProduct
  id: PirateRandomSkillbooks
  icon:
    sprite: Objects/Misc/books.rsi
    state: book_icon
  product: PirateCrateRandomSkillbooks
  cost: 2000
  category: cargoproduct-category-name-service
  group: market

- type: entity
  parent: CrateGenericSteel
  id: PirateCrateRandomSkillbooks
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: PirateRandomSkillbook

- type: entityTable
  id: PirateRandomSkillbook
  table: !type:GroupSelector
    children:
    - id: PirateBookJanitor
    - id: PirateBookFabrication
    - id: PirateBookSurvival
    - id: PirateBookDoors
    - id: PirateBookAirlocks
    - id: PirateBookBananium
    - id: PirateBookBots
    - id: PirateBookFurniture
    - id: PirateBookInfrastructure
    - id: PirateBookElectronics
    - id: PirateBookWalls
    - id: PirateBookWindows
    - id: PirateBookSmokeables

- type: entity
  parent: BaseItem
  id: PirateBookSkillbook
  abstract: true
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Misc/skillbooks.rsi
    layers:
    - state: base
  - type: StaticPrice
    price: 20
  - type: KnowledgeGrantOnUse
    singleUse: false
    instant: false
  - type: Tag
    tags:
    - Book
  - type: Item
    size: Small

- type: entity
  parent: [PirateBookSkillbook, BaseMagicalContraband]
  id: PirateBookDebugSkills
  suffix: DEBUG
  components:
  - type: Sprite
    layers:
    - state: melee
  - type: KnowledgeGrantOnUse
    grantEverything: true
    instant: true

- type: entity
  parent: PirateBookSkillbook
  id: PirateBookSchematic
  abstract: true
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Misc/schematics.rsi

# Pirate: Trauma's BaseRevMinorContraband parent does not exist locally.
- type: entity
  parent: PirateBookSkillbook
  id: PirateBookRevolutionaryMelee
  components:
  - type: Sprite
    layers:
    - state: melee
  - type: KnowledgeGrantOnUse
    skills:
      MeleeKnowledge: 35
      WeaponsKnowledge: 35
    experience:
      MeleeKnowledge: 15
      WeaponsKnowledge: 15
    doAfter: 2

