- type: entity
  abstract: true
  parent: BaseItem
  id: BaseBrainChip
  components:
    - type: Sprite
      sprite: _Pirate/Objects/Specific/brain_chips.rsi
      scale: 0.7, 0.7
      layers:
        - state: icon
        - state: leds-rows
          color: "#ffce5b"
          shader: unshaded
    - type: Item
      size: Tiny
    - type: OrganChip
      whitelist:
        components:
          - Brain
    # EMP disables the chip without harming the host.
    - type: Cybernetics
    - type: GuideHelp
      guides:
        - PirateBrainChips

- type: entity
  abstract: true
  parent: BaseBrainChip
  id: BaseSkillChipMRAM
  components:
    - type: Sprite
      layers:
        - state: mram
        - state: leds-rows
          color: "#4fd0e8"
          shader: unshaded
    - type: KnowledgeGrantOnWear
      examinable: true

- type: entity
  abstract: true
  parent: [BaseSkillChipMRAM, BaseSecurityContraband]
  id: BaseSkillChipAPTR
  components:
    - type: Sprite
      layers:
        - state: aptr
        - state: leds-rows
          color: "#e8b040"
          shader: unshaded

- type: entity
  abstract: true
  parent: [BaseSkillChipMRAM, BaseSecurityContraband]
  id: BaseSkillChipPSON
  components:
    - type: Sprite
      layers:
        - state: pson
        - state: leds-rows
          color: "#d7a6ff"
          shader: unshaded
    - type: OrganChip
      canRemove: false

- type: entity
  abstract: true
  parent: [BaseSkillChipMRAM, BaseSecurityContraband]
  id: BaseSkillChipHPYS
  components:
    - type: Sprite
      layers:
        - state: hpys
        - state: leds-rows
          color: "#9ff0e0"
          shader: unshaded

- type: entity
  abstract: true
  parent: [BaseSkillChipMRAM, BaseSecurityContraband]
  id: BaseSkillChipSyndicate
  components:
    - type: OrganChip
      family: ChipFamilyOverwrite
      hiddenFromScanners: true
    - type: Sprite
      layers:
        - state: syndicate
        - state: leds-rows
          color: "#ff4848"
          shader: unshaded

# Keep this parent first; the first parent wins and its sprite overrides the chip type's.
- type: entity
  abstract: true
  id: BaseSkillChipNanotrasen
  components:
    - type: Sprite
      layers:
        - state: icon
        - state: leds-rows
          color: "#ffce5b"
          shader: unshaded
