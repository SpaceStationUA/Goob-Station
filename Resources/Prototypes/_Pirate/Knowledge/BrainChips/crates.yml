    containers:
      entity_storage: !type:GroupSelector
        rolls: 8
        children:
        - !type:GroupSelector
          weight: 0.5
          children:
          - id: SkillChipUnarmed
          - id: SkillChipBludgeon
          - id: SkillChipShortBlade
          - id: SkillChipLongBlade
          - id: SkillChipPolearm
          - id: SkillChipNonLethal
          - id: SkillChipTool
          - id: SkillChipEnergy
