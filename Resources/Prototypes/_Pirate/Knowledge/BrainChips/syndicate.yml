# Separate families let each copy stack with its station original.
# Keep BaseSkillChipSyndicateVariant first; the first parent supplies the sprite.

- type: entity
  abstract: true
  parent: BaseSyndicateContraband
  id: BaseSkillChipSyndicateVariant
  suffix: Syndicate
  components:
  # Clear inherited departments; parent maps otherwise merge.
  - type: Contraband
    allowedDepartments: []
    allowedJobs: []
  - type: OrganChip
    hiddenFromScanners: true
  - type: Sprite
    layers:
    - state: syndicate
    - state: leds-rows
      map: [ "enum.OrganChipVisualLayers.Leds" ]
      color: "#ff4848"
      shader: unshaded

- type: entity
  parent: [ BaseSkillChipSyndicateVariant, SkillChipUnarmed ]
  id: SkillChipUnarmedSyndicate
  components:
  - type: KnowledgeGrantOnWear
    skills:
      MeleeKnowledge: 35

