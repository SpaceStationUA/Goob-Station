- type: entity
  parent: BaseStructure
  id: Crucifix
  name: wooden cross
  description: A sturdy wooden cross. You could probably nail someone onto it...
  components:
  - type: Sprite
    noRot: true
    sprite: _Pirate/Structures/crucifix.rsi
    layers:
    - state: icon
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.4
        density: 100
        mask:
        - TableMask
  - type: Damageable
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Strap
    position: Stand
    buckleOffset: "0,0.1"
    buckleDoafterTime: 5
    selfUnBuckleDelay: 10
    whitelist:
      components:
      - HumanoidAppearance
  - type: StrapLock
  - type: ChangeNodeOnUnstrap
    node: cross
  - type: Construction
    graph: Crucifix
    node: cross
    defaultTarget: crucified

- type: entityEffect
  id: CrucifixDropped
  effects:
  - !type:HealthChange
    damage:
      types:
        Blunt: 10
    ignoreResistances: false
    ignoreBlockers: false
    targetPart: Chest
  - !type:ModifyKnockdown
    time: 4
  - !type:ModifyParalysis
    time: 2
