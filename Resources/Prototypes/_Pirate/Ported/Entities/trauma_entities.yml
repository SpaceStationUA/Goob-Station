- type: entity
  id: MetalToolDurability
  abstract: true
  components:
  - type: Durability
    durabilityThresholds:
      0: Pristine
      50: Worn
      75: Damaged
      85: Broken
      100: Destroyed
    damageProbability: .50
    damagePopups:
      Worn:
      - durability-metal-0
      - durability-metal-1
      Damaged:
      - durability-metal-2
      - durability-metal-3
      - durability-metal-4
      Broken:
      - durability-metal-5
      - durability-metal-6
      - durability-metal-7
      Destroyed:
      - durability-metal-8
      - durability-metal-9
      - durability-metal-10
      - durability-wood-9
    minDamageRoll: 2.5
    maxDamageRoll: 5
    maxRepairBonus: 0
    repairable: true
    repairTool: Welding
    toolRepairAmount: 10, 15
    fuelCost: 5
    repairDoAfter: 3
    onBreakEffects:
    - !type:PlaySoundEffect
      sound:
        collection: MetalBreak
        params:
          volume: -6
