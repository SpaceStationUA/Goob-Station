- type: entity
  parent: BaseItem
  id: BaseWeaponGaussgun
  abstract: true
  components:
  - type: WeaponClass
    class: Laser # probably similar since no cartridges, explosion or crazy recoil of firearms
  - type: Item
    size: Ginormous
    shape:
    - 0,0,8,1
  - type: StaticPrice
    price: 1500
  - type: EmitSoundOnPickup
    sound:
      collection: SnipersPickUp
  - type: EmitSoundOnDrop
    sound:
      collection: SnipersDrop
  - type: EmitSoundOnLand
    sound:
      collection: SnipersDrop
  - type: AmmoCounter
  - type: Gun
    minAngle: 3
    maxAngle: 10
    fireRate: 1
    angleIncrease: 3
    angleDecay: 16
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_Pirate/Weapons/Guns/railgun/railgunshot.ogg
    defaultDirection: 1, 0
  - type: MultiMagazineAmmoProvider
    slots:
      gun_magazine: null # Use ammo provied by gun magazine
      gun_magazine_cell: 0.5 # Don't use battery projectiles, multiply fire cost by 0.5 (30 shots for high-cap cell)
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineGaussgun
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_magazine_cell:
        ejectOnInteract: false
        name: power-cell-slot-component-slot-name-default
        whitelist:
          tags:
          - PowerCell
          - PowerCellSmall
        blacklist:
          tags:
          - PotatoBattery
          - PowerCage
        whitelistFailPopup: gun-magazine-whitelist-fail
  - type: PowerCellSlot
    cellSlotId: gun_magazine_cell
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_magazine_cell: !type:ContainerSlot
  - type: Appearance
