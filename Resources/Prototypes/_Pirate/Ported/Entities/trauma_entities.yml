- type: entity
  parent: MaterialBase
  id: BarbedWire
  name: barbed wire
  suffix: Full
  description: Some wire with barbs cut into it.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Materials/barbwire.rsi
    state: icon
  - type: Appearance
  - type: Stack
    stackType: BarbedWire
    count: 30
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      BarbedWire: 100
  - type: Item
    heldPrefix: wire
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Pirate/Footsteps/barbedwire.ogg
      params:
        volume: -4
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Pirate/Footsteps/barbedwire.ogg
      params:
        volume: -4
