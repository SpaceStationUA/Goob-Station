- type: entity
  parent: BarbedWire
  id: BarbedWire1
  suffix: Single
  components:
  - type: Stack
- type: entity
  parent: [ BaseStructure, BaseMinorContraband ]
  id: BarbedWireStructure
  name: barbed wire
  description: A large mass of steel wire with nasty barbs.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Materials/barbwire.rsi
    state: structure
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 20
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          BarbedWire1:
            min: 0
            max: 1
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.3
    sprintSpeedModifier: 0.3
  - type: Physics
    bodyType: Static
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/_Pirate/Footsteps/barbedwire.ogg
      params:
        volume: 8
  - type: DamageContacts
    damage:
      types:
        Slash: 3
  - type: Fixtures
    fixtures:
      fix1:
        hard: false
        density: 7
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - MidImpassable
  - type: Construction
    graph: BarbedWire
    deconstructionTarget: null
    node: finish
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Metallic
    damageContainer: Inorganic
  - type: DamageOnAttacked
    damage:
      types:
        Slash: 5
    popupText: barbed-contact-damage
    interactSound: /Audio/Weapons/bladeslice.ogg
