- type: entity
  parent: [ BaseItem, BaseRevMajorContraband ]
  id: BaseMagazineTurret
  name: "магазин (.22 short)"
  suffix: Full
  description: "Малокаліберний магазин на 60 набоїв, який часто використовують у протипіхотних турелях."
  components:
  - type: Tag
    tags:
    - MagazineTurret
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CartridgeTurret
    proto: CartridgeTurret
    capacity: 60
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/Ammunition/Magazine/Turrets/smgturretmag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: BaseMagazineTurret
  id: BaseMagazineTurretEmpty
  suffix: Empty
  components:
  - type: BallisticAmmoProvider
    proto: null

- type: entity
  parent: BaseMagazineTurret
  id: BaseMagazineTurretHeavy
  name: "дисковий магазин (.22 short)"
  suffix: Full
  description: "Малокаліберний дисковий магазин на 240 набоїв, який часто використовують комуністи та інші покидьки."
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/maxim.rsi
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - CartridgeTurret
    proto: CartridgeTurret
    capacity: 240
  - type: Item
    size: Normal

- type: entity
  parent: BaseMagazineTurretHeavy
  id: BaseMagazineTurretHeavyEmpty
  suffix: Empty
  components:
  - type: BallisticAmmoProvider
    proto: null
