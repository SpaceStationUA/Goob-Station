- type: entity
  parent: [ BaseItem, BaseRevMinorContraband ]
  id: RevDropPodTraps
  name: "маяк десантної капсули (форма для шипів)"
  description: "Зламує найближчу вантажну капсулу з потрібними предметами й перенаправляє її до вас."
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Revs/droppodbeacon.rsi
    state: icon
  - type: Item
    size: Small
  - type: Damageable
  # Pirate: Injurable belongs to Trauma's wound model; local item damage uses Damageable.
  - type: TriggerOnUse
  - type: TimerTrigger
    delay: 0.9
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 100 # for nuke
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          SpawnPodRevTraps:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: TwoStageTrigger
    keysIn:
    - timer
    triggerDelay: 1
    components:
    - type: DamageOverTime
      damage:
        types:
          Slash: 50
      interval: 0.1
      ignoreResistances: true

- type: entity
  parent: RevDropPodTraps
  id: RevDropPodMelees
  name: "маяк десантної капсули (форма для поліпшень зброї ближнього бою)"
  components:
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        offset: 0
        spawn:
          SpawnPodRevMelees:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: SpawnSupplyEmpty
  id: SpawnPodRevTraps
  categories: [ HideSpawnMenu ]
  name: "революційна капсула зі шипами"
  components:
  - type: SpawnOnDespawn
    prototype: BlueprintCaltrops

- type: entity
  parent: SpawnSupplyEmpty
  id: SpawnPodRevMelees
  categories: [ HideSpawnMenu ]
  name: "революційна капсула з поліпшеннями зброї ближнього бою"
  components:
  - type: SpawnOnDespawn
    prototype: BlueprintRevMelees
