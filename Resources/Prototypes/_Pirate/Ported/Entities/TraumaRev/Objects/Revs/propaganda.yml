- type: entity
  parent: [ BasePaper, BaseRevMajorContraband ]
  id: RevPropaganda
  name: "пропагандистська листівка"
  description: "Революційна пропагандистська листівка. Після одного прочитання вона втрачає чарівність, тож вам знадобиться багато примірників."
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Revs/propaganda.rsi
    layers:
    - state: icon
      visible: true
      map: ["base"]
  - type: GenericVisualizer
    visuals:
      enum.LimitedChargesState.HasCharges:
        base:
          True: {state: icon}
          False: {state: burnt}
  - type: FireVisuals
    sprite: _Pirate/Effects/fire.rsi
    normalState: revfire
  # Pirate: use the local revolutionary conversion pipeline.
  - type: RevolutionaryConverter
    conversionDuration: 2
    consumesCharges: 1
  - type: UseDelay
    delay: 5
  - type: LimitedCharges
    maxCharges: 1
  - type: Tag
    tags:
    - Document # no Paper, cant fax it...

- type: entity
  parent: RevPropaganda
  id: RevPropagandaAdvanced
  name: "удосконалена пропагандистська листівка"
  description: "Ця пропагандистська листівка сповнена найпотужнішої класової свідомості, яку ви здатні вигадати. Вона навертає миттєво."
  components:
  - type: RevolutionaryConverter
    conversionDuration: 0.1
    consumesCharges: 1
