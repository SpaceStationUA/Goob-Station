- type: entity
  parent: [ BasePaper, BaseRevMajorContraband ]
  id: RevPropaganda
  name: propaganda pamphlet
  description: It is a revolutionary propaganda pamphlet. It loses its charm after reading it once, so you will need plenty.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Revs/propaganda.rsi
    layers:
    - state: icon
      visible: true
      map: ["base"]
  - type: GenericVisualizer
    visuals:
      enum.LimitedChargesState.HasCharges:
        base:
          True: {state: icon}
          False: {state: burnt}
  - type: FireVisuals
    sprite: _Pirate/Effects/fire.rsi
    normalState: revfire
  # Pirate: use the local revolutionary conversion pipeline.
  - type: RevolutionaryConverter
    conversionDuration: 2
    consumesCharges: 1
  - type: UseDelay
    delay: 5
  - type: LimitedCharges
    maxCharges: 1
  - type: Tag
    tags:
    - Document # no Paper, cant fax it...

- type: entity
  parent: RevPropaganda
  id: RevPropagandaAdvanced
  name: advanced propaganda pamphlet
  description: This propaganda pamphlet is full of the most potent class consciousness you can come up with. It will convert instantly.
  components:
  - type: RevolutionaryConverter
    conversionDuration: 0.1
    consumesCharges: 1
