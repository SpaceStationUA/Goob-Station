- type: entity
  parent: [ PinpointerBase, BaseRevMajorContraband ]
  id: PinpointerCommand
  name: "пінпойнтер командування"
  description: "Ручний пристрій стеження, який відстежує найближчого члена командування."
  components:
  - type: Sprite
    layers:
    - state: pinpointer_thief
      map: ["enum.PinpointerLayers.Base"]
    - state: pinonnull
      map: ["enum.PinpointerLayers.Screen"]
      shader: unshaded
      visible: false
  - type: Icon
    state: pinpointer_thief
  - type: Pinpointer
    targetName: command staff
    whitelist:
      components:
      - CommandStaff
    blacklist:
      components:
      - DeadMob
      - Revolutionary
