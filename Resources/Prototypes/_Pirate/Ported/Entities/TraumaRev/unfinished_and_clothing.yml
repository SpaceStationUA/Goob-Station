# Pirate: Trauma revolutionary lathe outputs and their completed construction results.

- type: entity
  abstract: true
  parent: [ RevUnfinishedComponent, BaseRevMinorContraband ]
  id: BaseUnfinishedRevWeapon
  components:
  - type: Construction
    defaultTarget: finished
    node: start

- type: entity
  parent: BaseUnfinishedRevWeapon
  id: RevSwordBlade
  name: unfinished sword blade
  description: An unfinished sword, use some wood to complete it.
  components:
  - type: Sprite
    state: sword
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 5
  - type: ThrowingAngle
    angle: 225
  - type: Construction
    graph: RevSword

- type: entity
  parent: BaseUnfinishedRevWeapon
  id: RevMaceHead
  name: unfinished mace parts
  description: An unfinished mace, use some wood to complete it.
  components:
  - type: Sprite
    state: mace
  - type: Construction
    graph: RevMace

- type: entity
  parent: BaseUnfinishedRevWeapon
  id: RevKnifeBlade
  name: unfinished knife blade
  description: An unfinished knife, use some wood to complete it.
  components:
  - type: Sprite
