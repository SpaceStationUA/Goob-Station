  # Pirate: no Trauma viewcone parent or viewcone component.
  - type: Sprite
    sprite: Clothing/Mask/merc.rsi
  - type: Clothing
    sprite: Clothing/Mask/merc.rsi
  - type: Armor
    coverage: [ Head ]
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9
  - type: IngestionBlocker
    blockSmokeIngestion: true
  - type: Construction
    graph: RevMask
    deconstructionTarget: null
    node: finished

- type: entity
  parent: [ ClothingHeadHelmetArmoredBase, BaseRevMajorContraband ]
  id: ClothingHeadHelmetRev
  name: helmet
  description: A strong but light revolutionary combat helmet.
  components:
  - type: Sprite
    sprite: Clothing/Head/Helmets/merc_helmet.rsi
  - type: Clothing
    sprite: Clothing/Head/Helmets/merc_helmet.rsi
  - type: Construction
    graph: RevHelmet
    deconstructionTarget: null
    node: finished
  - type: Armor
    coverage: [ Head ]
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.3
        Slash: 0.3
        Piercing: 0.3
        Heat: 0.3
      flatReductions:
        Piercing: 3.5 # Pirate: local damage taxonomy has no Ballistic type.
  - type: ExplosionResistance
    damageCoefficient: 0.75

