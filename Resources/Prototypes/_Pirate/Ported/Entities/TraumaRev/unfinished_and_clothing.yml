  - type: EmbeddableProjectile
    sound: /Audio/Weapons/bladeslice.ogg
  - type: DamageOtherOnHit
    damage:
      types:
        Slash: 5
  - type: ThrowingAngle
    angle: 225
  - type: Construction
    graph: RevPitchfork

- type: entity
  parent: BaseUnfinishedRevWeapon
