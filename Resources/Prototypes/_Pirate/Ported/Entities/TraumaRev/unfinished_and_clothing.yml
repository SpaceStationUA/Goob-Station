- type: entity
  parent: [ ClothingOuterBaseMedium, AllowSuitStorageClothing, BaseRevMajorContraband ]
  id: ClothingOuterArmorRevFlame
  name: flame trooper armor
  description: Heavy armor that almost completely protects the user from fire.
  components:
  - type: Item
    size: Ginormous
  - type: Sprite
    sprite: _Pirate/Clothing/OuterClothing/Armor/revflamearmor.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/OuterClothing/Armor/revflamearmor.rsi
  - type: Armor
    coverage: [ Chest, Groin, Leg, Arm, Hand, Foot, Tail ] # Pirate: Trauma Torso maps to local Chest + Groin.
    traumaDeductions:
      Dismemberment: 0.2
      OrganDamage: 0.2
      BoneDamage: 0.2
      VeinsDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.1
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9
  - type: ExplosionResistance
    damageCoefficient: 0.4
  - type: ModifyDelayedKnockdown
    delayDelta: 2
    knockdownTimeDelta: -2
  - type: StaminaResistance
    damageCoefficient: 0.3
  - type: FireProtection
    reduction: 1
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingHelmetRevFlame
  - type: SelfExtinguisher
    cooldown: 1
    requiresIgniteFromGasImmune: false
    sound:
      path: /Audio/_Pirate/Revs/flamethrower.ogg
  - type: ContainerContainer
