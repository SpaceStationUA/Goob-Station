  components:
  - type: Sprite
    state: kunai
  - type: Construction
    graph: RevKunai

- type: entity
  parent: [ BaseItem, BaseRevMajorContraband ]
  id: RevHelmetLiner
  name: helmet liner
  description: Used in the creation of helmets. Add plasteel to complete it.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Revs/components.rsi
    state: helmetliner
  - type: Construction
    graph: RevHelmet
    deconstructionTarget: null
    node: unfinished

- type: entity
  parent: [ BaseItem, BaseRevMajorContraband ]
  id: RevGasFilter
  name: gas filter
  description: Used in the creation of gas masks. Use plastic to complete it.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Revs/components.rsi
    state: gasfilter
  - type: Construction
    graph: RevMask
    defaultTarget: finished
    deconstructionTarget: null
    node: unfinished

- type: entity
  parent: [ BaseItem, BaseRevMajorContraband ]
  id: RevEmptyVest
  name: empty vest
  description: An empty vest that still needs armor plates.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Revs/components.rsi
    state: emptyweb
  - type: Construction
    graph: RevVest
    deconstructionTarget: null
    node: unfinished

- type: entity
  parent: [ BaseItem, BaseRevMajorContraband ]
  id: RevReflectivePlate
  name: reflective plate
  description: A plate for a laser-resistant vest.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Revs/components.rsi
    state: reflectplate
  - type: Tag
    tags:
    - RevReflectivePlate

- type: entity
  parent: [ ClothingBackpack, BaseRevMajorContraband ]
  id: ClothingBackpackRev
  name: MOLLE pack
  description: A backpack designed for use in combat.
  components:
  - type: Sprite
    sprite: Clothing/Back/Backpacks/merc.rsi
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Storage
    grid:
    - 0,0,7,3
    - 8,1,8,3

- type: entity
  parent: [ ClothingBeltStorageBase, BaseRevMajorContraband ]
  id: ClothingBeltRevWebbing
  name: chest rig
  description: Ideal for storing ammo, weapons, and combat essentials.
  components:
  - type: Sprite
    sprite: Clothing/Belt/mercwebbing.rsi
  - type: Clothing
    sprite: Clothing/Belt/mercwebbing.rsi

- type: entity
  parent: [ ClothingUniformJumpsuitMercenary, BaseRevMajorContraband ]
  id: ClothingUniformJumpsuitMilitaryTurtleneckRev
  name: military jumpsuit
  description: A sturdy and protective jumpsuit.
  components:
  - type: Sprite
    sprite: _NF/Clothing/Uniforms/Jumpsuit/military.rsi
    layers:
    - state: icon-base-bottom
      color: "#3e3e48"
    - state: icon-base-top-turtleneck
      color: "#b5b56e"
    - state: icon-belt
      color: "#3e3e48"
    - state: icon-belt-buckle
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left-base-bottom
        color: "#3e3e48"
      - state: inhand-left-base-top-turtleneck
        color: "#b5b56e"
      - state: inhand-left-belt
        color: "#3e3e48"
      - state: inhand-left-belt-buckle
      right:
      - state: inhand-right-base-bottom
        color: "#3e3e48"
      - state: inhand-right-base-top-turtleneck
        color: "#b5b56e"
      - state: inhand-right-belt
        color: "#3e3e48"
      - state: inhand-right-belt-buckle
  - type: Clothing
    sprite: _NF/Clothing/Uniforms/Jumpsuit/military.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-base-bottom
        color: "#3e3e48"
      - state: equipped-base-top-turtleneck-alt
        color: "#b5b56e"
      - state: equipped-belt
        color: "#3e3e48"
      - state: equipped-belt-buckle
  - type: Armor
    coverage: [ Chest, Groin, Arm, Hand, Leg, Foot ] # Pirate: Trauma Torso maps to local Chest + Groin.
    modifiers:
      coefficients:
        Blunt: 0.85
        Heat: 0.85

- type: entity
  parent: [ ClothingShoesMilitaryBase, BaseRevMajorContraband ]
  id: ClothingShoesBootsRev
  name: workboots
  description: Robust workboots that reduce injury slowdown and can be armored.
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Shoes/Boots/workboots.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Shoes/Boots/workboots.rsi
  - type: ClothingSlowOnDamageModifier
    modifier: 0.5
  - type: Construction
    graph: RevBoots
    defaultTarget: finished
    deconstructionTarget: null
    node: unfinished

- type: entity
  parent: ClothingShoesBootsRev
  id: ClothingShoesBootsRevSteel
  name: steel-toed workboots
  description: Workboots modified to safely walk across caltrops.
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Shoes/Boots/steeltoed.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Shoes/Boots/steeltoed.rsi
  - type: StepTriggerImmune
    whitelist:
      types:
      - Caltrop
  - type: Construction
    defaultTarget: null
    node: finished

- type: entity
  parent: [ ClothingHeadsetAlt, BaseRevMajorContraband ]
  id: ClothingHeadsetRevolutionary
  name: revolutionary headset
  description: A modular over-ear intercom that protects from flashbangs.
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Ears/Headsets/revearpiece.rsi
    state: icon
  - type: Clothing
    sprite: _Pirate/Clothing/Ears/Headsets/revearpiece.rsi
  - type: FlashSoundSuppression

- type: entity
  parent: [ ClothingEyesBase, BaseRevMajorContraband, ShowSecurityIcons ]
  id: ClothingEyesRevolutionaryVisor
  name: revolutionary visor
  description: Protects from flashes and shows security status icons.
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Pirate/Clothing/Eyes/Glasses/revvisor.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Eyes/Glasses/revvisor.rsi
  - type: FactionClothing
    faction: Revolutionary
  - type: FlashImmunity
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: IdentityBlocker
    coverage: EYES
  - type: Armor
    coverage: [ Head ]
    modifiers:
      coefficients:
        Heat: 0.95
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95
    traumaDeductions:
      Dismemberment: 0
      OrganDamage: 0.13
      BoneDamage: 0.13
      VeinsDamage: 0

- type: entity
  parent: [ ClothingNeckBase, BaseRevMajorContraband ]
