  name: reflective vest
  description: An armored vest with advanced shielding against energy weapons.
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/OuterClothing/Vests/revreflective.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/OuterClothing/Vests/revreflective.rsi
