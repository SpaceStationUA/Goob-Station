- type: entity
  parent: BaseAction
  id: ActionTogglePatrol
  name: "перемкнути патрулювання"
  description: "Перемикає маршрут патрулювання призначених сек'юритронів."
  components:
  - type: Sprite
    layers:
    - texture: Interface/AdminNotes/message.png
  - type: InstantAction
    event: !type:TogglePatrolActionEvent

- type: entity
  parent: BaseAction
  id: ActionCRWaypoint
  name: "створити або прибрати патрульну точку"
  description: "Додає точку у вибраному місці або прибирає вже наявну."
  components:
  - type: Sprite
    layers:
    - texture: Interface/AdminNotes/none_button.png
  - type: Action
    useDelay: 3
    sound:
      path: /Audio/Machines/chime.ogg
  - type: TargetAction
    range: 200
    repeat: false
  - type: WorldTargetAction
    event: !type:PatrolWaypointActionEvent

- type: entity
  parent: BaseAction
  id: ActionClearWaypoints
  name: "очистити патрульні точки"
  description: "Вимикає патрулювання й видаляє всі точки цього командира."
  components:
  - type: Sprite
    layers:
    - texture: Interface/AdminNotes/high_button.png
  - type: InstantAction
    event: !type:ClearPatrolWaypointsActionEvent

- type: entity
  id: SecuritronWaypoint
  name: "патрульна точка сек'юритрона"
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
  - type: Sprite
  - type: Appearance
  - type: PatrolWaypoint
  - type: HolopadHologram
    rsiPath: _Pirate/Mobs/Silicon/Bots/beepsky.rsi
    rsiState: secbot
    shaderName: Hologram
    color1: "#65b8e2"
    color2: "#3a6981"
