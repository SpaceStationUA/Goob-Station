  id: MobHumanMorty
  name: "Морті Сміт"
  description: "Нервовий підліток, який допомагає Ріку в експериментах."
  components:
  - type: RandomHumanoidAppearance
    randomizeName: false
  - type: HumanoidAppearance
    species: Human
    age: 14
    sex: Male
    skinColor: "#FDBCB4"
    eyeColor: "#8B4513"
    hairStyleName: HairShort
    hairColor: "#8B4513"
  - type: Loadout
    prototypes: [MortyStudentGear]
  - type: Emoting
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechSounds: Squeak
  - type: ReplacementAccent
    accent: stutter
