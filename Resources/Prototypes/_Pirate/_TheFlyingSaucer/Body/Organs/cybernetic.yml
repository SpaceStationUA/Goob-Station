  suffix: Rick
  name: Покращенний мозок
  description: "Знання цієї та ближайших галактик заховані глибоко в цьому мозгу."
  components:
  - type: Organ
    slotId: brain # Shitmed Change
    onAdd:
    - type: Tag
      tags:
      - CyberManMechanics
    - type: ActionGrant
      actions:
