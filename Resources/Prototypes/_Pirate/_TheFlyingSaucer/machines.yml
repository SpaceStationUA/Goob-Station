    - ClothingCasualContrabandJumpsuits
    - SecurityAmmoStaticGoob
    - SecurityEquipmentStaticGoob
    - SecurityHypoStatic
    - SecurityWeaponsStaticGoob
    - SecurityWeaponsNonEmaggableStaticGoob
    - SecurityWeaponsGoob
    - SecurityAmmoGoob
    - SecurityEquipmentDynamicGoob
    - SecurityCybernetics
    - RestraintTechnology
    - BluespaceTheory
    - ExperimentalScienceGoob
    - IPCPartsStatic
    - BorgModulesStaticGoob
    - PowerCagesStatic
    - Modsuits
    - BorgModulesGoob
    - PowerCages
    - BasicCybernetics
    - AdvancedCybernetics
    - SyndicateAmmoLightStatic
    - SyndicateAmmoHeavyStatic
    - LatheMiscStatic
    - SyndicateCatridgesStatic
    - ProtoLatheMiscStatic
    - SpecOpsGoogles
    - Pinpointers
