- type: entity
  parent: Protolathe
  id: RickTechFab
  name: "техфаб Ріка"
  description: "Спеціальний технологічний фабрикатор Ріка, який може створювати зброю та предмети з блюспейс кристалів."
  components:
  - type: Sprite
    sprite: Structures/Machines/protolathe.rsi
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: Machine
    board: RickTechFabCircuitboard
  - type: AccessReader
    access: [["Rick"]]
  - type: Lathe
    idleState: icon
    runningState: building
    staticPacks:
    - RickPack
    - Reports
    - Statements
    - InquiriesAndAppeals
    - Complaints
    - Permissions
    - OrdersAndInstructions
    - Orders
    - Evidence
    - ConclusionsAndDecisions
    - ErrorDocument
    - SecurityBoardsStaticGoob
    - MedicalBoardsStaticGoob
    - MedicalBoardsGoob
    - EngineeringBoardsGoob
    - MiningToolsStatic
    - SalvageExplosivesStatic
    - MiningWeapons
    - MiningBoards
    - MiningUpgrades
    - HumanoidCubesStatic
    - EmagCubesStatic
    - BiofabPartsStatic
    - BiofabPartsEmagStatic
    - ClothingCasualJumpsuits
