- type: entity
  parent: ClothingOuterCoatLab
  id: ClothingOuterCoatLabRick
  name: "лабораторний халат Ріка"
  description: "Забруднений халат геніального науковця. Пахне хімікатами та пригодами."
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Coats/labcoat.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Coats/labcoat.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.8
        Cold: 0.8
        Caustic: 0.5
    coverage:
    - Chest
    - Groin
    - Tail
    - Arm
    - Leg
  - type: ToggleClothing
    action: ActionTogglePhaseCloak
    disableOnUnequip: true
  - type: ComponentToggler
    parent: true
    components:
    - type: Stealth
      maxVisibility: 0.1
      hadOutline: true
      thermalsImmune: false
  - type: PowerCellDraw
    drawRate: 3.6
  - type: ToggleCellDraw
  - type: ItemCreator
    action: ActionCreateThrowingStar
    charge: 14.4
    spawnedPrototype: ThrowingStarNinja
    noPowerPopup: ninja-no-power
  # core ninja suit stuff
  - type: UseDelay
    delay: 2 # disable time
  - type: PowerCellSlot
    cellSlotId: cell_slot
    fitsInCharger: false
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmallNuclear
        disableEject: true
        whitelist:
          tags:
            - PowerCell

# Morty's Yellow Shirt
- type: entity
  parent: ClothingUniformJumpsuitColorYellow
  id: ClothingUniformJumpsuitMorty
  name: "жовта футболка Морті"
  description: "Проста жовта футболка підлітка. Часто забруднена після пригод з Ріком."
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuit/color.rsi
    layers:
    - state: icon
      color: "#ffe14d"
    - state: trinkets-icon
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#ffe14d"
      - state: trinkets-inhand-left
      right:
      - state: inhand-right
        color: "#ffe14d"
      - state: trinkets-inhand-right
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuit/color.rsi
    clothingVisuals:
      jumpsuit:
      - state: equipped-INNERCLOTHING
        color: "#ffe14d"
      - state: trinkets-equipped-INNERCLOTHING
