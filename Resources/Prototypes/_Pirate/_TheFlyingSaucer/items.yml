# Rick's Science Goggles
- type: entity
  parent: [ClothingEyesBase, ShowSecurityIcons, ShowMedicalIcons]
  id: ClothingEyesGlassesRick
  name: "окуляри Ріка"
  description: "Спеціальні окуляри з вбудованими сенсорами для наукових досліджень."
  components:
  - type: Sprite
    sprite: Clothing/Eyes/Glasses/glasses.rsi
  - type: Clothing
    sprite: Clothing/Eyes/Glasses/glasses.rsi
  - type: FlashImmunity
  - type: EyeProtection
    protectionTime: 5
  - type: IdentityBlocker
    coverage: EYES
  - type: Armor # provide more coverage than default ones. you know, it's a sec one
    coverage:
    - Head
    modifiers:
      coefficients:
        Heat: 0.9
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
    traumaDeductions:
      Dismemberment: 0
      OrganDamage: 0.13
      BoneDamage: 0.13
      VeinsDamage: 0
      NerveDamage: 0
  - type: ShowJobIcons
  - type: SolutionScanner
  - type: NightVision
    isEquipment: true
  - type: VisionCorrection
  - type: ShowHealthBars
  - type: ShowHealthIcons
  - type: ShowThirstIcons
  - type: ShowHungerIcons
  - type: ShowSyndicateIcons
  - type: ShowMindShieldIcons

