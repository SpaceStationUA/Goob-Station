# Infinite Alcohol Bottles (like sink with infinite water)

- type: entity
  parent: DrinkVodkaBottleFull
  id: RickVodkaBottleInfinite
  name: "нескінченна горілка Ріка"
  description: "Бутилка горілки з нескінченним запасом завдяки блюспейс-технологіям."
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
        reagents:
        - ReagentId: Vodka
          Quantity: 100
  - type: DumpableSolution
    solution: drink
    unlimited: true
  - type: Unremoveable
  - type: PreventCollide

