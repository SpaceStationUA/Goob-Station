# Rick's Bottle Selector - like holy book selection
- type: entity
  id: RickBottleSelector
  name: "блюспейс-селектор напоїв"
  description: "Дивний пристрій Ріка, який дозволяє вибрати улюблену бутилку з нескінченним запасом алкоголю."
  parent: [ BaseItem, BaseSetSelector ]
  components:
  - type: Sprite
    sprite: Objects/Consumable/Drinks/flask.rsi
    state: icon
  - type: SetSelector
    possibleSets:
    - RickVodkaSet
    - RickWhiskeySet
    - RickRumSet
    - RickGinSet
    - RickTequilaSet
    - RickCognacSet
    - RickAbsintheSet
    - RickBeerSet
    maxSelectedSets: 1

- type: selectableSet
  id: RickVodkaSet
  name: "Нескінченна горілка"
  description: "Бутилка горілки з нескінченним запасом. Технології Ріка дивовижні."
  sprite:
    sprite: Objects/Consumable/Drinks/vodkabottle.rsi
    state: icon
  content:
  - RickVodkaBottleInfinite

- type: selectableSet
  id: RickWhiskeySet
  name: "Нескінченний віскі"
  description: "Бутилка віскі з нескінченним запасом."
  sprite:
    sprite: Objects/Consumable/Drinks/whiskeybottle.rsi
    state: icon
  content:
