- type: entity
  name: homerun bat
  parent: BaseBallBat
  id: WeaponMeleeHomerunBat
  categories: [HideSpawnMenu]
  description: K.O.
  suffix: Traitor
  components:
  - type: MeleeThrowOnHit
    speed: 30
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 20
    soundHit:
      collection: MetalThud # Pirate: use the licensed SS14 bat impact.
    attackRate: 0.5
  - type: Damageable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: WoodDestroy
            params:
              volume: -1
  - type: DamageOnHit
    damage:
      types:
        Blunt: 25
