- type: entity
  parent: N14GasPipeBase
  id: N14GasPipeTJunction
  categories: [HideSpawnMenu]
  suffix: TJunction
  components:
  - type: NodeContainer
    nodes:
      pipe:
        !type:PipeNode
        nodeGroupID: Pipe
