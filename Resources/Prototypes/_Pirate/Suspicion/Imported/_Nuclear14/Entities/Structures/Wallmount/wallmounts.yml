- type: entity
  parent: BaseSign
  id: N14WallmountVent
  categories: [HideSpawnMenu]
  name: vent
  description: An airvent. Could be a good stash.
  components:
  - type: WallMount
    arc: 360
  - type: Sprite
    drawdepth: Overdoors
    snapCardinals: true
    sprite: _Pirate/Suspicion/Imported/_Nuclear14/Structures/Storage/storage.rsi
    state: vent
  - type: ContainerContainer
    containers:
      stash: !type:ContainerSlot {}

- type: entity
  parent: N14WallmountVent
  id: N14WallmountVentDamaged
  categories: [HideSpawnMenu]
  suffix: damaged
  components:
  - type: Sprite
    sprite: _Pirate/Suspicion/Imported/_Nuclear14/Structures/Storage/storage.rsi
    state: vent-damaged

- type: entity
  parent: N14WallmountVent
  id: N14WallmountVentOpen
  categories: [HideSpawnMenu]
  suffix: open
  components:
  - type: Sprite
    sprite: _Pirate/Suspicion/Imported/_Nuclear14/Structures/Storage/storage.rsi
    state: vent-open
