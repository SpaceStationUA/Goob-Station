- type: entity
  id: N14Rails
  categories: [HideSpawnMenu]
  name: railway
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Pirate/Suspicion/Imported/_Nuclear14/Structures/Decoration/rails64.rsi
    state: rails
    snapCardinals: false
    netsync: false
    drawdepth: FloorObjects
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Transform
    anchored: true
  - type: Physics
    canCollide: False
    bodyType: Static
  - type: Clickable

- type: entity
  parent: N14Rails
  id: N14RailsJunctionLeftTop
  categories: [HideSpawnMenu]
  suffix: junction left top
  components:
  - type: Sprite
    state: junction-left-top
