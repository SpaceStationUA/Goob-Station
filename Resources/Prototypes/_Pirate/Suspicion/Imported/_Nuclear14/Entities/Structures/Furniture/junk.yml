- type: entity
  parent: N14JunkMetalBase
  id: N14JunkClock
  categories: [HideSpawnMenu]
  name: broken clock
  description: Out of time!
  components:
  - type: Sprite
    state: junk_clock
    drawdepth: Overdoors
  - type: WallMount

- type: entity
  parent: N14JunkWoodBase
  id: N14JunkDresser
  categories: [HideSpawnMenu]
  name: broken dresser
  description: Once held underwear. Now it's junk.
  components:
  - type: Sprite
    state: junk_dresser
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

- type: entity
  parent: N14JunkMachine
  id: N14JunkJukebox
  categories: [HideSpawnMenu]
  name: broken jukebox
  description: An old destroyed jukebox. Now it's junk.
  components:
  - type: Sprite
    state: junk_jukebox

- type: entity
  parent: N14JunkMetalBase
  id: N14JunkMachine
  categories: [HideSpawnMenu]
  name: broken machine
  description: Rusty old machine. Now it's junk.
  components:
  - type: Sprite
    state: junk_machine
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
            bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

- type: entity
  parent: N14JunkWoodBase
  id: N14JunkMetalBase
  abstract: true
  components:
  - type: Damageable
    damageModifierSet: Metallic
  - type: Physics
    canCollide: False
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
    - Metal


- type: entity
  parent: N14JunkMachine
  id: N14JunkMicrowave
  categories: [HideSpawnMenu]
  name: broken microwave
  description: Dirty old microwave. Now it's junk.
  components:
  - type: Sprite
    state: junk_micro

- type: entity
  parent: N14JunkMachine
  id: N14JunkTV
  categories: [HideSpawnMenu]
  name: broken TV
  description: An old television. Now it's junk.
  components:
  - type: Sprite
    state: junk_tv

- type: entity
  id: N14JunkWoodBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Pirate/Suspicion/Imported/_Nuclear14/Structures/Furniture/junk.rsi
    snapCardinals: true
    netsync: false
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 0
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Tag
    tags:
    - Wooden
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Anchorable
  - type: Pullable
  - type: InteractionOutline
  - type: Clickable
