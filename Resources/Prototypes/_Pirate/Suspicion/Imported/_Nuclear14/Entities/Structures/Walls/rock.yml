- type: entity
  id: N14WallRockAndesite
  categories: [HideSpawnMenu]
  name: andesite
  parent: N14WallRock
  components:
    - type: Icon
      sprite: Structures/Walls/rock.rsi
      state: rock_andesite
    - type: Sprite
      sprite: Structures/Walls/rock.rsi
      layers:
        - state: rock_andesite
        - map: [ "enum.EdgeLayer.South" ]
          state: rock_andesite_south
        - map: [ "enum.EdgeLayer.East" ]
          state: rock_andesite_east
        - map: [ "enum.EdgeLayer.North" ]
          state: rock_andesite_north
        - map: [ "enum.EdgeLayer.West" ]
          state: rock_andesite_west

- type: entity
  id: N14WallRock
  categories: [HideSpawnMenu]
  parent: BaseWall
  name: rock
  suffix: planetmap
  components:
    - type: Transform
      noRot: true
    - type: SoundOnGather
    - type: Gatherable
      toolWhitelist:
        tags:
          - Pickaxe
    - type: Damageable
      damageContainer: Inorganic
      damageModifierSet: Metallic
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 150
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
    - type: IconSmooth
      key: walls
      mode: NoSprite
    - type: Icon
      sprite: Structures/Walls/rock.rsi
      state: rock
    - type: SmoothEdge
    - type: Sprite
      sprite: Structures/Walls/rock.rsi
      layers:
        - state: rock
        - map: [ "enum.EdgeLayer.South" ]
          state: rock_south
        - map: [ "enum.EdgeLayer.East" ]
          state: rock_east
        - map: [ "enum.EdgeLayer.North" ]
          state: rock_north
        - map: [ "enum.EdgeLayer.West" ]
          state: rock_west


- type: entity
  id: N14WallRockAndesiteCoal
  categories: [HideSpawnMenu]
  parent: N14WallRockAndesite
  description: An ore vein rich with coal.
  suffix: Coal
  components:
    - type: OreVein
      oreChance: 1.0
      currentOre: OreCoal
    - type: Sprite
      layers:
        - state: rock_andesite
        - map: [ "enum.EdgeLayer.South" ]
          state: rock_andesite_south
        - map: [ "enum.EdgeLayer.East" ]
          state: rock_andesite_east
        - map: [ "enum.EdgeLayer.North" ]
          state: rock_andesite_north
        - map: [ "enum.EdgeLayer.West" ]
          state: rock_andesite_west
        - state: rock_coal

