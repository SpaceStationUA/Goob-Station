- type: entity
  parent: BaseItem
  id: DoubleBedsheetBase
  abstract: true
  name: базова двоспальна ковдра
  description: Велика м’яка ковдра для двоспального ліжка.
  placement:
    mode: SnapgridCenter
    snap: [Bed]
  components:
  - type: Sprite
    sprite: _Pirate/ADT/Objects/Misc/bedsheets_double.rsi
    noRot: true
  - type: Item
    size: Small
  - type: StaticPrice
    price: 24
  - type: Tag
    tags: [Bedsheet]
  - type: DoubleBedSheet

