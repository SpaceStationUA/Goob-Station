      collection: BikeHorn
    Sigh:
      collection: MaleSigh
    Crying:
      path: /Audio/_Pirate/Xelthia/Voice/Xelthia/cry.ogg
    Whistle:
      collection: Whistles
    Weh:
      collection: Weh
    Hew:
      collection: Hew
    # Pirate: omit Omu's Awebo; its whitelist only permits harpies and Allulalo, not Xelthia.
