- type: entity
  save: false
  parent:
  - BaseMobNeocyte
  id: BaseMobNeoThaven
  name: Urist McEarster
  abstract: true
  components:
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - RobotTalk
    - Thaveyan
    understands:
    - TauCetiBasic
    - RobotTalk
    - Thaveyan
    - Carptongue
  - type: Icon
    sprite: _Pirate/StarlightSpecies/FarHorizons/Mobs/Species/Proto-Thaven/parts.rsi
    state: full
  - type: ThavenMoods
  - type: Respirator
    damage:
      types:
        Asphyxiation: 2
    damageRecovery:
      types:
        Asphyxiation: -1.0
  - type: Sprite
    noRot: true
    drawdepth: Mobs
    scale: 1, 1.05
  - type: Body
    prototype: NeoThaven
    requiredLegs: 2
  - type: HumanoidAppearance
    species: NeoThaven
    hideLayersOnEquip:
