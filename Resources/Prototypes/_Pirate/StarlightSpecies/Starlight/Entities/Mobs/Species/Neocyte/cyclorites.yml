- type: entity
  parent:
  - BaseMobNeocyte
  id: BaseMobNeoCyclorite
  name: Urist McCyclorister
  abstract: true
  components:
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    - RobotTalk
    - Terrum
    understands:
    - TauCetiBasic
    - RobotTalk
    - Terrum
  - type: Icon
    sprite: _Pirate/StarlightSpecies/FarHorizons/Mobs/Species/Proto-Cyclops/parts.rsi
    state: full
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 10
  - type: HumanoidAppearance
    species: NeoCyclorite
    hideLayersOnEquip:
    - Hair
    - Snout
  - type: Body
    prototype: NeoCyclorite
    requiredLegs: 2
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeCircle
          radius: 0.35
        density: 300
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: MobThresholds
    thresholds:
      '0': Alive
      '150': Critical
      '300': Dead
  - type: Damageable
    damageContainer: Hybrid
    damageModifierSet: NeoCyclorite
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: _Pirate/StarlightSpecies/Shared/Mobs/Effects/brute_damage.rsi
        color: '#9457eb'
      Burn:
        sprite: _Pirate/StarlightSpecies/Shared/Mobs/Effects/burn_damage.rsi
    thresholds:
    - 10
    - 20
    - 30
    - 50
    - 70
    - 100
    targetLayers:
    - enum.HumanoidVisualLayers.Chest
    - enum.HumanoidVisualLayers.Head
    - enum.HumanoidVisualLayers.LArm
    - enum.HumanoidVisualLayers.LLeg
    - enum.HumanoidVisualLayers.RArm
    - enum.HumanoidVisualLayers.RLeg
  - type: MeleeWeapon
    soundHit:
      collection: AlienClaw
    angle: 30
    animation: WeaponArcFist
    attackRate: 0.5
    damage:
      types:
        Blunt: 13
        Structural: 10
  - type: Sprite
    scale: 1.08, 1.08
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: CycloriteBlood
        Quantity: 600
  - type: MovementSpeedModifierScale
    movementSpeedScale: 0.5
  - type: SlowOnDamage
    speedModifierThresholds:
      '90': 0.5
      '120': 0
  - type: Crawler
    standTime: 4
    knockdownDamageThreshold: 10
  - type: Stamina
    forceStandStamina: 20
  - type: CombatMode
    canDisarm: true
    disarmFailChance: 0.5
  - type: Vocal
  - type: Inventory
    speciesId: cyclorite
