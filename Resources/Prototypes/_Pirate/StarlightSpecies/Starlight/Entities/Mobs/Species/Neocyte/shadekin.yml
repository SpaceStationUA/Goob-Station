      - Water
      - SpaceCleaner
      methods:
      - Touch
      effects:
      - !type:WashCreamPie ''
      - !type:Emote
        emote: Hisses
        showInChat: false
  - type: Bloodstream
    bloodlossDamage:
      types:
        Bloodloss: 1
    bloodlossHealDamage:
      types:
        Bloodloss: -0.25
    bloodReferenceSolution:
      reagents:
      - ReagentId: BlackBlood
        Quantity: 600
  - type: Flammable
    damage:
      types:
        Heat: 1.5
  - type: PassiveDamage
    allowedStates:
    - Alive
    damage:
      types:
        Blunt: -0.05
        Piercing: -0.05
        Slash: -0.05
        Heat: -0.07
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTypeTrigger
        damageType: Blunt
        damage: 400
      behaviors:
      - !type:GibBehavior {}
      - !type:SpawnEntitiesBehavior
        spawn:
          ShadowkinShadow:
            min: 1
            max: 1
    - trigger: !type:DamageTypeTrigger
        damageType: Heat
        damage: 1500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          Ash:
            min: 1
            max: 1
          ShadowkinShadow:
            min: 1
            max: 1
      - !type:BurnBodyBehavior {}
  - type: Barotrauma
    protectionSlots:
    - head
    alternativeProtectionSlots:
    - - outerClothing
      - outerClothing2
    damage:
      types:
        Blunt: 0.85
        Heat: 0.1
