# Pirate: Starlight species port, adapted to native body topology, organs and chemistry.
# Source: ss14Starlight/space-station-14@8d02e1bf65628a4f156143bbbdf3fb366923cba0.

- type: entity
  id: StaminaSurge
  name: '[color=yellow]Stamina Surge[/color]'
  description: Grants increased stamina regeneration and resistance for a while at the cost of drastically increased hunger.
  components:
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
    icon:
      sprite: _Pirate/StarlightSpecies/Starlight/Interface/Actions/actions_lagomorph.rsi
      state: stamina-active
  - type: LimitedCharges
    maxCharges: 1
  - type: AutoRecharge
    rechargeDuration: 50
  - type: InstantAction
    event: !type:StaminaSurgeActionEvent ''
- type: entity
  id: Zoomies
  name: '[color=lightblue]Zoomies!![/color]'
  description: Boost sprint speed at the cost of drastically increased thirst.
  components:
  - type: Action
    useDelay: 15
    itemIconStyle: BigAction
    icon:
      sprite: _Pirate/StarlightSpecies/Starlight/Interface/Actions/actions_lagomorph.rsi
      state: zoomies-btn
  - type: LimitedCharges
    maxCharges: 1
  - type: AutoRecharge
    rechargeDuration: 50
  - type: InstantAction
    event: !type:ZoomiesActionEvent ''
