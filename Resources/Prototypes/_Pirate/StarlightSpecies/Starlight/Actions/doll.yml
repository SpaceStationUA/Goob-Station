# Pirate: Starlight species port, adapted to native body topology, organs and chemistry.
# Source: ss14Starlight/space-station-14@8d02e1bf65628a4f156143bbbdf3fb366923cba0.

- type: entity
  id: ActionGenerateShellPiece
  name: snap shell
  description: Break off an expendable piece of your shell, either to use it as a crude knife or to donate it to a fellow
    doll.
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _Pirate/StarlightSpecies/Starlight/Interface/Actions/actions_doll.rsi
      state: break_shard
    useDelay: 60
  - type: ConfirmableAction
    popup: doll-snap-shell-action
  - type: InstantAction
    event: !type:SnapShellPieceEvent
      requiresFreeHand: true
      selfDamage:
        types:
          Blunt: 15
