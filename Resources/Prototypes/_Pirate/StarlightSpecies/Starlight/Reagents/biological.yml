- type: reagent
  parent: Blood
  id: CycloriteBlood
  name: reagent-name-cyclorite-blood
  group: Biological
  desc: reagent-desc-cyclorite-blood
  flavor: acid
  color: '#9457eb'
  physicalDesc: reagent-physical-desc-strong-smelling
  plantMetabolism:
  - !type:PlantAdjustToxins
    amount: 5
  - !type:PlantAdjustWeeds
    amount: -1
  - !type:PlantAdjustHealth
    amount: -2
  reactiveEffects:
    Acidic:
      methods:
      - Touch
      effects:
      - !type:HealthChange
        ignoreResistances: false
        damage:
          types:
            Caustic: 0.1
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Cyclorite
          inverted: true
      - !type:Emote
        emote: Scream
        probability: 0.1
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Cyclorite
          inverted: true
  metabolisms:
    Medicine:
      metabolismRate: 1.0
      effects:
      - !type:HealthChange
        damage:
          types:
            Caustic: 1
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Cyclorite
          - Vampiric
          inverted: true
      - !type:PopupMessage
        type: Local
        visualType: Large
        messages:
        - generic-reagent-effect-burning-insides
        probability: 0.2
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Cyclorite
          - Vampiric
          inverted: true
      - !type:Emote
        emote: Scream
        probability: 0.2
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Cyclorite
          - Vampiric
          inverted: true
      - !type:EvenHealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Vampiric
        damage:
          Brute: -3
          Burn: -1.25
- type: reagent
  id: DollBlood
  name: reagent-name-doll-blood
  group: Biological
  desc: reagent-desc-doll-blood
  flavor: spooky
  color: '#660000'
  metamorphicSprite:
    sprite: Objects/Consumable/Drinks/bloodglass.rsi
    state: icon_empty
  metamorphicMaxFillLevels: 5
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: false
  physicalDesc: reagent-physical-desc-thick
  metabolisms:
    Drink:
      effects:
      - !type:SatiateThirst
        factor: 1.0
        conditions: null
      - !type:EvenHealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Vampiric
        damage:
          Brute: -3
          Burn: -1.25
      - !type:AdjustReagent
        reagent: Protein
        amount: 0.5
  plantMetabolism:
  - !type:PlantAdjustWater
    amount: 0.5
  footstepSound:
    collection: FootstepBlood
    params:
      volume: 6
- type: reagent
  id: PseudoceramicPlatelets
  name: reagent-name-pseudoceramic-platelets
  group: Biological
  desc: reagent-desc-pseudoceramic-platelets
  flavor: spooky
  color: '#FF7777'
  physicalDesc: reagent-physical-desc-abrasive
  metabolisms:
    Medicine:
      metabolismRate: 0.25
      effects:
      - !type:RegrowShell
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Doll
        - !type:ReagentCondition
          reagent: PseudoceramicPlatelets
          min: 25
      - !type:AdjustReagent
        conditions:
        - !type:MetabolizerTypeCondition
          type:
          - Doll
        - !type:ReagentCondition
          reagent: PseudoceramicPlatelets
          min: 25
        reagent: PseudoceramicPlatelets
        amount: -25
