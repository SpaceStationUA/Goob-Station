- type: entity
  parent:
  - BoxCardboard
  id: BoxHugBlood
  name: box of hugs
  description: A special box for sensitive people. This one is labelled to contain a haemobrick.
  suffix: Emergency, Blood
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingMaskBreath
        - id: ExtendedEmergencyOxygenTankFilled
        - id: EmergencyMedipen
        - id: Flare
        - id: FoodSnackBloodBrick
        - id: DrinkWaterBottleFull
  - type: Sprite
    layers:
    - state: internals
    - state: extendedtank
