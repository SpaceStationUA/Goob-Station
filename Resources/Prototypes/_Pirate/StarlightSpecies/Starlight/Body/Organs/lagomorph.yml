# Pirate: Starlight species port, adapted to native body topology, organs and chemistry.
# Source: ss14Starlight/space-station-14@8d02e1bf65628a4f156143bbbdf3fb366923cba0.

- type: entity
  id: OrganLagomorphEyes
  parent:
  - OrganHumanEyes
  name: lagomorph eyes
  suffix: Lagomorph
  description: Couldn't have seen that one coming.
  components:
  - type: Organ
- type: entity
  id: OrganLagomorphHeart
  parent:
  - OrganAnimalHeart
  name: lagomorph heart
  suffix: Lagomorph
  description: The rapidly beating heart of a Lagomorph.
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: heart-on
  - type: Item
    size: Small
    heldPrefix: heart
  - type: Metabolizer
    updateInterval: 0.75
- type: entity
  id: OrganLagomorphStomach
  parent:
  - OrganAnimalStomach
  - OrganHumanStomach
  name: lagomorph stomach
  suffix: Lagomorph
  description: Yearns for fresh produce.
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: stomach
  - type: Item
    size: Small
    heldPrefix: stomach
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
      stomach:
        maxVol: 50
  - type: Metabolizer
    updateInterval: 0.75
- type: entity
  id: OrganLagomorphTongue
  parent:
  - OrganHumanTongue
  suffix: Lagomorph
  components:
  - type: OrganTongue
    allowedEmotes:
    - Squee
    - Snort
    - Sneeze
    - LagomorphSnore
    - Stomp
    sounds:
      Male: MaleLagomorph
      Female: FemaleLagomorph
      Unsexed: FemaleLagomorph
  - type: TongueVoiceOrgan
