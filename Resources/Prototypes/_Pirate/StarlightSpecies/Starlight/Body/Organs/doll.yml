- type: entity
  id: ShellFragmentDoll
  parent:
  - BaseKnife
  name: doll shell fragment
  description: A shell piece, broken off of a doll. Sharp, and looks quite sturdy.
  components:
  - type: Sprite
    sprite: _Pirate/StarlightSpecies/Starlight/Mobs/Species/Doll/organs.rsi
    state: shell
  - type: Organ
    slotId: shell
  - type: PhysicalComposition
    materialComposition:
      Plasteel: 25
      Steel: 100
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 1.0
    damage:
      types:
        Slash: 10
  - type: OrganShell
    modifiers:
      coefficients:
        Slash: -0.06
        Piercing: -0.06
        Heat: 0.03
  - type: Damageable
    damageContainer: Biological
