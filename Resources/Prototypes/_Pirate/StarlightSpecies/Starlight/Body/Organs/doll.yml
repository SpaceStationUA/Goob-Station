# Pirate: Starlight species port, adapted to native body topology, organs and chemistry.
# Source: ss14Starlight/space-station-14@8d02e1bf65628a4f156143bbbdf3fb366923cba0.

- type: entity
  id: BaseDollOrgan
  parent: BaseHumanOrgan
  abstract: true
  components:
  - type: Sprite
    sprite: _Pirate/StarlightSpecies/Starlight/Mobs/Species/Doll/organs.rsi
  - type: Organ
  - type: Edible
  - type: Extractable
    grindableSolutionName: organ
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: FlavorProfile
    flavors:
    - savory
    - meaty
    - strange
    - spooky
  - type: Tag
    tags:
    - Meat
  - type: StatusEffects
    allowed:
    - Electrocution
    - TemporaryBlindness
    - Pacified
    - Flashed
    - RadiationProtection
    - Adrenaline
  - type: MobPrice
    price: 150
  - type: FloatingVisuals
  - type: Damageable
    damageContainer: Biological
  - type: Stamina
  - type: StunVisuals
  - type: MobState
  - type: MobThresholds
    thresholds:
      '0': Alive
      '100': Critical
      '200': Dead
  - type: MobStateActions
    actions:
      Critical:
      - ActionCritSuccumb
      - ActionCritFakeDeath
      - ActionCritLastWords
  - type: Deathgasp
  - type: HealthExaminable
    examinableTypes:
    - Blunt
    - Slash
    - Piercing
    - Heat
    - Shock
    - Cold
    - Caustic
    - Asphyxiation
    - Radiation
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
  - type: Pullable
  - type: LightningTarget
    priority: 2
    lightningExplode: false
  - type: Reactive
    groups:
      Flammable:
      - Touch
      Extinguish:
      - Touch
      Acidic:
      - Touch
      - Ingestion
  - type: Internals
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: Buckle
  - type: StandingState
  - type: Blindable
  - type: PermanentBlindness
  - type: NpcFactionMember
    factions:
    - SimpleNeutral
  - type: HTN
    rootTask:
      task: IdleCompound
  - type: Body
    prototype: Animal
  - type: Climbing
  - type: NameIdentifier
    group: GenericNumber
  - type: SlowOnDamage
    speedModifierThresholds:
      '60': 0.7
      '80': 0.5
  - type: VentCrawler
    allowInventory: false
- type: entity
  id: OrganDollBrain
  parent:
  - OrganHumanBrain
  - BaseDollOrgan
  name: brain
  description: A strange mass of meat somehow equivalent to a brain.
  components:
  - type: Sprite
    state: brain
  - type: Item
    size: Small
    heldPrefix: brain
  - type: Organ
  - type: Input
    context: ghost
  - type: Brain
  - type: Examiner
  - type: BadFood
  - type: Tag
    tags:
    - Meat
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      food:
        maxVol: 15
        reagents:
        - ReagentId: GreyMatter
          Quantity: 15
  - type: FoodSequenceElement
    entries:
      Burger: Brain
      Taco: Brain
- type: entity
  id: OrganDollEyes
  parent:
  - BaseDollOrgan
  - OrganHumanEyes
  name: eyes
  description: There are too many of these...
  components:
  - type: Sprite
    layers:
    - state: eyeball-l
    - state: eyeball-r
  - type: Item
    size: Small
    heldPrefix: eyeballs
  - type: Organ
- type: entity
  id: OrganDollHeart
  parent:
  - BaseDollOrgan
  - OrganHumanHeart
  name: heart
  description: Is this even a heart?
