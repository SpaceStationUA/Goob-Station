  - type: Sprite
    layers:
    - state: kidney-l
    - state: kidney-r
  - type: Metabolizer
    maxReagents: 5
    metabolizerTypes:
    - Human
- type: entity
  id: OrganDollLiver
  parent:
  - BaseDollOrgan
  - OrganHumanLiver
  name: liver
  description: Indistinct mass of flesh. Probably the liver.
  components:
  - type: Sprite
    state: liver
  - type: Metabolizer
    maxReagents: 1
    metabolizerTypes:
    - Doll
    - Human
    groups:
    - id: Alcohol
- type: entity
  id: OrganDollLungs
  parent:
  - BaseDollOrgan
  - OrganHumanLungs
  name: lungs
  description: Dolls use these to breathe... somehow.
  components:
  - type: Sprite
    layers:
    - state: lung-l
    - state: lung-r
  - type: Lung
  - type: Metabolizer
    metabolizerTypes:
    - Human
    groups:
    - id: Gas
      rateModifier: 100
    removeEmpty: true
    solutionOnBody: false
    solution: Lung
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
      Lung:
        maxVol: 100
        canReact: false
