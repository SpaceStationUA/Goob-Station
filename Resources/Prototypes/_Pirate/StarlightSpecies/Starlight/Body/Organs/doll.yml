  - type: Tag
    tags:
    - Meat
    - Heart
  - type: Sprite
    state: heart-on
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes:
    - Doll
    - Human
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic
  - type: Item
    size: Small
    heldPrefix: heart
- type: entity
  id: OrganDollKidneys
  parent:
  - BaseDollOrgan
  - OrganHumanKidneys
