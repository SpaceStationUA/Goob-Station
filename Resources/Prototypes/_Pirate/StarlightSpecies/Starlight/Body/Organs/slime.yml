# Pirate: Starlight species port, adapted to native body topology, organs and chemistry.
# Source: ss14Starlight/space-station-14@8d02e1bf65628a4f156143bbbdf3fb366923cba0.

- type: entity
  id: OrganSlimeHeart
  parent:
  - BaseHumanOrgan
  - OrganHumanHeart
  name: slime circulator
  suffix: Slime
  description: A little circulator what makes the fluid move through the slime body.
  components:
  - type: Tag
    tags:
    - Meat
    - Heart
  - type: Sprite
    sprite: _Pirate/StarlightSpecies/Shared/Mobs/Species/Slime/organs.rsi
    state: heart-on
  - type: Item
    size: Small
    heldPrefix: heart
  - type: Metabolizer
    maxReagents: 6
    metabolizerTypes:
    - Slime
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic
- type: entity
  id: OrganSlimePeepoids
  parent:
  - BaseHumanOrgan
  - OrganHumanEyes
  name: peepoids
  suffix: Slime
  description: Primitive and goopy, but more or less just as good as the human equivalent.
  components:
  - type: Sprite
    sprite: _Pirate/StarlightSpecies/Starlight/Mobs/Species/Slime/organs.rsi
    state: peepoids
  - type: Item
    size: Small
    heldPrefix: peepoids
  - type: Organ
- type: entity
  id: OrganSlimeSlurpoid
  parent:
  - OrganHumanTongue
  name: slurpoid
  suffix: Slime
  description: It has all the consistency of gelatin.
  components:
  - type: OrganTongue
    allowedEmotes:
    - Squish
    - Bubble
    - Pop
    sounds:
      Male: MaleSlime
      Female: FemaleSlime
      Unsexed: MaleSlime
  - type: Sprite
    sprite: _Pirate/StarlightSpecies/Starlight/Mobs/Species/Slime/organs.rsi
    state: slurpoid
