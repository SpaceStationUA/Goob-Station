# Pirate: Starlight species port, adapted to native body topology, organs and chemistry.
# Source: ss14Starlight/space-station-14@8d02e1bf65628a4f156143bbbdf3fb366923cba0.

- type: entity
  id: OrganNeoResomiEyes
  parent:
  - OrganNeocyteEyes
  name: resomi cybernetic eyes
  suffix: Neo-Resomi
  description: These cybernetic eyes have great night vision for hunting prey in maintenance tunnels, but are very sensitive
    to bright flashes.
  components:
  - type: Organ
    onAdd:
    - type: NightVision
      disabilityBlockable: true
    - type: FlashModifier
      modifier: 2
- type: entity
  id: OrganNeoResomiHeart
  parent:
  - OrganNeocyteHeart
  name: resomi cybernetic heart
  suffix: Neo-Resomi
  components:
  - type: Metabolizer
    maxReagents: 2
    metabolizerTypes:
    - Resomi
    - Neocyte
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic
- type: entity
  id: OrganNeoResomiLungs
  parent:
  - OrganNeocyteLungs
  name: resomi cybernetic lungs
  suffix: Neo-Resomi
  description: Filters oxygen from an atmosphere, which is then sent into the bloodstream to be used as an electron carrier.
    Entirely cybernetic in nature, working in tandem with the visor's filtration system.
  components:
  - type: Metabolizer
    metabolizerTypes:
    - Resomi
    - Neocyte
    groups:
    - id: Gas
      rateModifier: 100
    removeEmpty: true
    solutionOnBody: false
    solution: Lung
- type: entity
  id: OrganNeoResomiTongue
  parent:
  - OrganNeocyteTongueForked
  suffix: Neo-Resomi
  components:
  - type: OrganTongue
    sounds:
      Male: NeoResomiMSounds
      Female: NeoResomiFSounds
      Unsexed: NeoResomiMSounds
