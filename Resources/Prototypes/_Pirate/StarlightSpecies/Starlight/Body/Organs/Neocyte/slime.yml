# Pirate: Starlight species port, adapted to native body topology, organs and chemistry.
# Source: ss14Starlight/space-station-14@8d02e1bf65628a4f156143bbbdf3fb366923cba0.

- type: entity
  id: OrganNeoSlimeHeart
  parent:
  - OrganSlimeHeart
  name: augmented slime circulator
  suffix: Neo-Slime
  description: A little circulator what makes the fluid move through the slime body.
  components:
  - type: Metabolizer
    maxReagents: 6
    metabolizerTypes:
    - Slime
    - Neocyte
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic
  - type: Organ
- type: entity
  id: OrganNeoSlimeLungs
  parent:
  - OrganSlimeLungs
  name: augmented slime gas sacs
  suffix: Neo-Slime
  description: Collects nitrogen, which slime cells use for maintenance.
  components:
  - type: Organ
- type: entity
  id: OrganNeoSlimePeepoids
  parent:
  - OrganSlimePeepoids
  name: augmented peepoids
  suffix: Neo-Slime
  description: Primitive and goopy, but more or less just as good as the human equivalent.
  components:
  - type: Sprite
    sprite: _Pirate/StarlightSpecies/Starlight/Mobs/Species/Slime/organs.rsi
    layers:
    - state: peepoids
  - type: Item
    size: Small
    heldPrefix: peepoids
  - type: Organ
- type: entity
  id: OrganNeoSlimeSlurpoid
  parent:
  - OrganSlimeSlurpoid
  name: augmented slurpoid
  suffix: Neo-Slime
  description: It has all the consistency of gelatin.
  components:
  - type: OrganTongue
    allowedEmotes:
    - Chirp
    - Hisses
    - Squish
    - Bubble
    - Pop
    - Purr
    - Growl
    - Trill
    - Scree
    - Call
    - Squawk
    - Bark
    - Snarl
    - Whine
    - Howl
    - Yip
    - Mew
    - Meow
    - Liss
    - Lurr
    - Rattle
    - Marr
    - Wurble
    - Chitter
    - Squeak
    - Click
    - Beep
    - Ping
    - Buzz
    - Buzz-Two
    - Chime
    - Honk
    - Hum
    - ThavenGlub
    - Squee
    - Snort
    - Sneeze
    - LagomorphSnore
    sounds:
      Male: NeoHumanMSounds
      Female: NeoHumanFSounds
      Unsexed: NeoHumanMSounds
  - type: Sprite
    sprite: _Pirate/StarlightSpecies/Starlight/Mobs/Species/Slime/organs.rsi
    state: slurpoid
  - type: Organ
- type: entity
  id: SentientNeoSlimeCore
  parent:
  - SentientSlimeCore
  name: augmented sentient slime core
  suffix: Neo-Slime
  description: The source of incredible, unending gooeyness.
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - RamChip
    isSpecialDigestibleExclusive: false
  - type: Metabolizer
    maxReagents: 6
    metabolizerTypes:
    - Slime
    - Animal
    groups:
    - id: Food
    - id: Drink
    - id: Alcohol
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 15
        reagents:
        - ReagentId: GreyMatter
          Quantity: 15
      stomach:
        maxVol: 50
