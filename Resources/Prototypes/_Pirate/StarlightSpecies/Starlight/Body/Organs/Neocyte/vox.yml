# Pirate: Starlight species port, adapted to native body topology, organs and chemistry.
# Source: ss14Starlight/space-station-14@8d02e1bf65628a4f156143bbbdf3fb366923cba0.

- type: entity
  id: OrganNeoVoxHeart
  parent:
  - BaseNeocyteOrgan
  - OrganNeocyteHeart
  name: vox cybernetic heart
  suffix: Neo-Vox
  components:
  - type: Tag
    tags:
    - Meat
    - Heart
  - type: Sprite
    state: heart-on
  - type: Item
    size: Small
    heldPrefix: heart
  - type: Metabolizer
    metabolizerTypes:
    - Vox
    - Neocyte
- type: entity
  id: OrganNeoVoxLungs
  parent:
  - OrganNeocyteLungs
  name: vox cybernetic lungs
  suffix: Neo-Vox
  description: Filters nitrogen from an atmosphere, which is then sent into the bloodstream to be used as an electron carrier.
    Entirely cybernetic in nature, working in tandem with the visor's filtration system.
  components:
  - type: Metabolizer
    metabolizerTypes:
    - Slime
    - NeoVox
    groups:
    - id: Gas
      rateModifier: 100
    removeEmpty: true
    solutionOnBody: false
    solution: Lung
  - type: Lung
    alert: LowNitrogen
- type: entity
  id: OrganNeoVoxStomach
  parent:
  - OrganNeocyteStomach
  name: vox biological reactor
  suffix: Neo-Vox
  components:
  - type: Metabolizer
    metabolizerTypes:
    - Vox
  - type: Stomach
    specialDigestible:
      tags:
      - RamChip
      - Trash
    isSpecialDigestibleExclusive: false
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
      stomach:
        maxVol: 50
- type: entity
  id: OrganNeoVoxTongue
  parent:
  - OrganNeocyteTongue
  suffix: Neo-Vox
  components:
  - type: OrganTongue
    sounds:
      Male: NeoVoxMSounds
      Female: NeoVoxFSounds
      Unsexed: NeoVoxMSounds
