# Pirate: Starlight species port, adapted to native body topology, organs and chemistry.
# Source: ss14Starlight/space-station-14@8d02e1bf65628a4f156143bbbdf3fb366923cba0.

- type: entity
  id: OrganNeoMothStomach
  parent:
  - OrganAnimalStomach
  - OrganHumanStomach
  name: moth biological reactor
  suffix: Neo-Moth
  description: Some call it over-engineered, but it's vital to the function of a neocyte. Turns organic matter into organic
    and electrical energy to power the neocyte's cybernetics and flesh.
  components:
  - type: Sprite
    sprite: _Pirate/StarlightSpecies/FarHorizons/Mobs/Species/Protogen/organs.rsi
    state: stomach
  - type: Item
    size: Small
    heldPrefix: stomach
  - type: Stomach
    specialDigestible:
      tags:
      - ClothMade
      - RamChip
    isSpecialDigestibleExclusive: false
  - type: Metabolizer
    # Pirate: native food effects check the stomach, not the Neocyte heart.
    metabolizerTypes: [Animal, Neocyte]
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
      stomach:
        maxVol: 50
  - type: Organ
- type: entity
  id: OrganNeoMothTongue
  parent:
  - OrganNeocyteTongue
  suffix: Neo-Moth
  components:
  - type: OrganTongue
    allowedEmotes:
    - Chirp
    - Hisses
    - Squish
    - Bubble
    - Pop
    - Purr
    - Growl
    - Trill
    - Scree
    - Call
    - Squawk
    - Bark
    - Snarl
    - Whine
    - Howl
    - Yip
    - Mew
    - Meow
    - Liss
    - Lurr
    - Rattle
    - Marr
    - Wurble
    - Chitter
    - Squeak
    - Click
    - Beep
    - Ping
    - Buzz
    - Buzz-Two
    - Chime
    - Honk
    - Hum
    - ThavenGlub
    - Squee
    - Snort
    - Sneeze
    - LagomorphSnore
    sounds:
      Male: NeoMothMSounds
      Female: NeoMothFSounds
      Unsexed: NeoMothMSounds
  - type: TongueVoiceOrgan
