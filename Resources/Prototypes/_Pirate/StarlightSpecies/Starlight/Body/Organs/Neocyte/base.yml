- type: entity
  id: OrganNeocyteLungs
  parent:
  - BaseNeocyteOrgan
  - OrganHumanLungs
  name: cybernetic lungs
  suffix: Neocyte
  description: Filters oxygen from an atmosphere, which is then sent into the bloodstream to be used as an electron carrier.
    Entirely cybernetic in nature, working in tandem with the visor's filtration system.
  components:
  - type: Sprite
    layers:
    - state: lung-l
    - state: lung-r
  - type: Item
    size: Small
    heldPrefix: lungs
  - type: Lung
  - type: Metabolizer
    metabolizerTypes:
    - Neocyte
    groups:
    - id: Gas
      rateModifier: 100
    removeEmpty: true
    solutionOnBody: false
    solution: Lung
  - type: SolutionContainerManager
    solutions:
      organ:
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
      Lung:
        maxVol: 100
        canReact: false
  - type: Organ
- type: entity
