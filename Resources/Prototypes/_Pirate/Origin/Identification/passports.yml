- type: entity
  name: passport
  parent: BaseItem
  id: BasePassport
  abstract: true
  description: Паспорт, що підтверджує громадянство та інформацію особи.
  components:
    - type: Passport
    - type: Sprite
      sprite: _Pirate/Origin/Passport.rsi
      layers:
      - state: passport_biesel_closed
    - type: Appearance
    - type: EmitSoundOnPickup
      sound:
        path: /Audio/_Goobstation/Items/handling/book_pickup.ogg
        params:
          volume: -4
    - type: EmitSoundOnDrop
      sound:
        path: /Audio/_Goobstation/Items/handling/book_drop.ogg
        params:
          volume: -4
    - type: EmitSoundOnLand
      sound:
        path: /Audio/_Goobstation/Items/handling/book_drop.ogg
        params:
          volume: -4

