# Journey mode sectors. A sector decides what the round is while the station is inside it: the
# events the scheduler may run and the ones it holds back. Names and descriptions are locale keys.
#
# majorEvents are the sector's big threats. They wait majorDelayMinutes after arrival, and about
# 20 minutes after a major fired anywhere else. An empty list makes the sector quiet.
# `journey preset calm` gates the round to quiet sectors, `dynamic` to loud ones, `standard` clears it.
#
# blockedEvents never run in the sector. allowedEvents, when set, is the only playlist: a major
# must be listed there to ever fire.

# Starter sector: quiet, so the first hour teaches. Pressure comes from anomalies and glimmer, not bosses.
- type: journeySector
  id: JourneyKelTerus
  name: journey-sector-kel-terus
  parallax: JourneyGenBlue
  weight: 1
  blockedEvents:
  # Paranormal presences cannot take root in the resonance field.
  - GlimmerRevenantSpawn
  - BorerSpawn
  - SlaughterDemonMidround
  - WraithMidround
  - DarkPriestMidround
  # Paranormal antagonists (sector rule-level; roundstart antags are filtered by the rule itself).
  - Heretic
  - Devil
  - Shadowling
  # Strong glimmer discharges are for later sectors; the starter keeps zap, wisps and foxfire.
  - NoosphericFry
  - NoosphericStorm
  # Siege monsters and soldiers would end the tutorial early.
  - BlobSpawn
  - XenomorphsInfestation
  - DragonSpawn
  - ColossusSpawn
  - BingleSpawn
  - LoneOpsSpawn
  - NinjaSpawn
  - SpacePirates
  - VoxRaidersMidround
  - ZombieOutbreak
  - TerrorSpidersSpawn
  - LoneAbductorSpawn
  - DuoAbductorSpawn
  - MimeAssassinMidround
  - TunnelClownMidround
  - SingulothKnightsMidround
  allowedEvents:
  # Starter playlist: anomalies and soft glimmer over a calm ship. No paranormal, no siege,
  # no strong glimmer discharges (those stay banned above) — phase one teaches.
  - AnomalySpawn
  - BluespaceArtifact
  - BluespaceLocker
  - MalignRiftSpawn
  - NoosphericZap
  - MundaneDischarge
  - NoosphericSilence
  - GlimmerWispSpawn
  - GlimmerMiteSpawn
  - GlimmerFoxfireSpawn
  - FreeProber
  - GlimmerRandomSentience
  - PsionicNosebleedEvent
  - BreakerFlip
  - BureaucraticError
  - ClericalError
  - JobDistributionError
  - ClosetSkeleton
  - GasLeak
  - KudzuGrowth
  - PowerGridCheck
  - VentClog
  - MassHallucinations
  - IonStorm
  - SolarFlare
  - MimicVendorRule
  - MouseMigration
  - CockroachMigration
  - MothroachSpawn
  - RandomSentience

