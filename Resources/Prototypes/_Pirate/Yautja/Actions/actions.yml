- type: entity
  parent: BaseToggleAction
  id: ActionYautjaToggleClaws
  name: Extend Claws
  description: Extend or retract the wrist blades built into your bracer.
  components:
  - type: Action
    icon:
      sprite: _Pirate/Yautja/wrist_blades.rsi
      state: icon
  - type: InstantAction
    event: !type:ToggleYautjaClawsEvent {}

- type: entity
  parent: BaseToggleAction
  id: ActionYautjaToggleCloak
  name: Cloak
  description: Toggles the predator cloaking field. Requires a Yautja cloak in the backpack slot.
  components:
  - type: Action
    icon:
      sprite: _Pirate/Yautja/cape_full.rsi
      state: icon
  - type: InstantAction
    event: !type:ToggleYautjaCloakEvent {}

- type: entity
  parent: BaseAction
  id: ActionYautjaSelfDestruct
  name: Self Destruct
  description: Initiates the bracer self-destruct protocol. Detonates with macro-bomb force after the countdown.
  components:
  - type: Action
    priority: -20
    icon:
      sprite: Actions/Implants/implants.rsi
      state: explosive
  - type: InstantAction
    event: !type:YautjaBracerSelfDestructEvent {}
