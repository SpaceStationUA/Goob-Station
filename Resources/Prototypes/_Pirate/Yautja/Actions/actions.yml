- type: entity
  parent: BaseAction
  id: ActionYautjaToggleClaws
  name: "Висунути кігті"
  description: "Висуває або ховає наручні леза, вбудовані у ваш наруч."
  components:
  - type: Action
    icon:
      sprite: _Pirate/Yautja/wrist_blades.rsi
      state: icon
    iconOn:
      sprite: _Pirate/Yautja/wrist_blades.rsi
      state: icon
  - type: InstantAction
    event: !type:ToggleYautjaClawsEvent {}

- type: entity
  parent: BaseAction
  id: ActionYautjaToggleShield
  name: "Розгорнути щит"
  description: "Висуває або ховає наручний щит, вбудований у ваш наруч."
  components:
  - type: Action
    icon:
      sprite: _Pirate/Yautja/bracer_shield.rsi
      state: icon
    iconOn:
      sprite: _Pirate/Yautja/bracer_shield.rsi
      state: icon
  - type: InstantAction
    event: !type:ToggleYautjaShieldEvent {}

- type: entity
  parent: BaseAction
  id: ActionYautjaToggleCloak
  name: "Маскування"
  description: "Перемикає повне маскування. Ви залишаєтесь невидимими під час руху або коли вас вдаряють. Потрібен плащ Яутжа в слоті рюкзака."
  components:
  - type: Action
    icon:
      sprite: _Pirate/Yautja/cape_full.rsi
      state: icon
    iconOn:
      sprite: _Pirate/Yautja/cape_full.rsi
      state: icon
  - type: InstantAction
    event: !type:ToggleYautjaCloakEvent {}

- type: entity
  parent: BaseAction
  id: ActionYautjaSelfDestruct
  name: "Самознищення"
  description: "Запускає протокол самознищення наруча. Після зворотного відліку вибухає з потужністю макробомби."
  components:
  - type: Action
    priority: -20
    icon:
      sprite: Actions/Implants/implants.rsi
      state: explosive
  - type: InstantAction
    event: !type:YautjaBracerSelfDestructEvent {}

- type: entity
  parent: BaseAction
  id: ActionYautjaObservationProjection
  name: "Псіонічна проєкція"
  description: "Покиньте тіло як безтілесний спостерігач. Скористайтеся дією повернення, щоб повернутися до тіла."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: _EinsteinEngines/Interface/VerbIcons/telegnosis.png
    useDelay: 1
  - type: InstantAction
    event: !type:YautjaObservationProjectionEvent {}

- type: entity
  parent: ActionMindSwapReturn
  id: ActionYautjaObservationReturn
  name: "Повернутися до тіла"
  description: "Поверніться з проєкції спостереження до свого тіла."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: _EinsteinEngines/Interface/VerbIcons/mind_swap_return.png
    useDelay: 3
    checkCanInteract: false
