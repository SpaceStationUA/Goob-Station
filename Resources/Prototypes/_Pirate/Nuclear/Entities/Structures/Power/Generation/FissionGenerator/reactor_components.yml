- type: entity
  id: BaseReactorPart
  parent: BaseItem
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: ReactorPart
  - type: Sprite
    sprite: _Pirate/Nuclear/Structures/Power/Generation/FissionGenerator/reactor_parts.rsi
    layers:
    - state: default_rod
      map: ["enum.NuclearPropertiesVisuals.Layer"]
  - type: Item
    size: Huge
  - type: MultiHandedItem
  - type: Tag
    tags:
    - ReactorPart
  - type: DamageOnInteract
    damage:
      types:
        Heat: 1
  - type: GuideHelp
    guides:
    - NuclearReactor
    - Power

# Fuel Rods
- type: entity
  id: BaseReactorFuelRod
  parent: [ BaseReactorPart, BaseEngineeringContraband ]
  categories: [ HideSpawnMenu ]
  name: fuel rod
  description: A fuel rod for a nuclear reactor.
  abstract: true
  components:
  - type: ReactorPart
    iconStateInserted: "fuel"
    iconStateCap: "fuel_cap"
    neutronCrossSection: 1.0
    thermalCrossSection: 10
    thermalMass: 420000 # specific heat capacity of steel (420 J/KgK) * mass of component (1000Kg)
  - type: ReactorFuelRod
  - type: Edible # Blame Abby for making them edible
    transferAmount: null
    delay: 30
    forceFeedDelay: 60
  - type: FlavorProfile
    flavors:
    - metallic
    - electrons
  - type: BadFood
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 1000
        reagents:
        - ReagentId: Uranium
          Quantity: 800
        - ReagentId: Radium
          Quantity: 200
        canReact: false
  - type: StealTarget
    stealGroup: ReactorFuelRodSteal
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-inanimate
    weight: 0.2

- type: entity
  id: CerenkiteReactorFuelRod
  parent: [ BaseReactorFuelRod, BaseNuclearPropertiesCerenkite ]
  name: cerenkite fuel rod # These are your basic, semi-harmless fuel rods

- type: entity
  id: UraniumReactorFuelRod
  parent: [ BaseReactorFuelRod, BaseNuclearPropertiesUranium ]
  name: uranium fuel rod

- type: entity
  id: PlutoniumReactorFuelRod
  parent: [ BaseReactorFuelRod, BaseNuclearPropertiesPlutonium ]
  name: plutonium fuel rod
  components:
  - type: GhostRole
    makeSentient: true
    allowSpeech: true
    allowMovement: false
    name: ghost-role-information-plutonium-rod-name
    description: ghost-role-information-plutonium-rod-description
    rules: ghost-role-information-plutonium-rod-rules
    mindRoles:
    - MindRoleGhostRoleFreeAgentHarmless
  - type: GhostTakeoverAvailable
  - type: SentienceTarget
    weight: 2

- type: entity
  id: BananiumReactorFuelRod
  parent: [ BaseReactorFuelRod, BaseNuclearPropertiesBananium ]
  name: bananium fuel rod
  description: A honk rod for a nuclear reactor.

- type: entity
  id: PlasmaReactorFuelRod
  parent: [ BaseReactorFuelRod, BaseNuclearPropertiesPlasma ]
  name: plasma fuel rod

- type: entity
  id: UraniumGlassReactorFuelRod
  parent: [ BaseReactorFuelRod, BaseNuclearPropertiesUraniumGlass ]
  name: uranium glass fuel rod

- type: entity
  id: MeatReactorFuelRod
  parent: BaseReactorFuelRod
  name: meat fuel rod
  description: A fuel rod fo- wait, is it alive?
  components:
  - type: NuclearProperties
    color: "#c53648"
    electrical: 4
    hard: 1
    density: 3
    flammable: 3
    radioactive: 5

