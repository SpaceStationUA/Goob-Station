- type: entity
  abstract: true
  parent: BaseStructureDynamic
  id: HeavyFlatpackBase
  name: "важкий флетпак"
  description: "Великий флетпак для зберігання підозріло великої машини."
  components:
  - type: Sprite
    sprite: _Pirate/Nuclear/Objects/Devices/large_flatpack.rsi
    state: large
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.29"
        density: 100
        mask:
        - CrateMask
        layer:
        - MachineLayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: InteractionOutline

- type: entity
  parent: HeavyFlatpackBase # DeltaV - was CrateEngineering
  id: NuclearReactorFlatpack
  name: "флетпак ядерного реактора"
  description: "Флетпак для побудови ядерного реактора. Компоненти продаються окремо."
  components:
  - type: Flatpack
    entity: NuclearReactorEmpty

- type: entity
  parent: HeavyFlatpackBase # DeltaV - was CrateEngineering
  id: GasTurbineFlatpack
  name: "флетпак газової турбіни"
  description: "Флетпак для побудови газової турбіни."
  components:
  - type: Flatpack
    entity: Turbine

- type: entity
  parent: HeavyFlatpackBase
  id: NuclearReactorSmallFlatpack
  name: "флетпак малого ядерного реактора"
  description: "Флетпак для побудови малого ядерного реактора. Компоненти продаються окремо."
  components:
  - type: Flatpack
    entity: NuclearReactorSmall

- type: entity
  parent: HeavyFlatpackBase
  id: GasTurbineSmallFlatpack
  name: "флетпак малої газової турбіни"
  description: "Флетпак для побудови малої газової турбіни."
  components:
  - type: Flatpack
    entity: TurbineSmall
