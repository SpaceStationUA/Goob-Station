- type: entity
  parent: ClothingBackpackDuffelSyndicateBundle
  id: ClothingBackpackDuffelSyndicateControllerBundle
  name: "набір модульного костюма Синдикату"
  description: "Містить попередньо зібраний модульний костюм Синдикату."
  components:
  - type: Item
    size: Ginormous # Pirate: match the widened storage to avoid storage arbitrage.
  - type: Storage
    maxItemSize: Ginormous
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: ClothingModularControllerSyndicatePreassembled
        - !type:NestedSelector
          tableId: SyndicateHardsuitExtrasEntityTable

- type: entity
  parent: ClothingBackpackDuffelSyndicateBundle
  id: ClothingBackpackDuffelEnergyShieldModuleBundle
  name: "набір модулів енергетичного щита"
  description: "Містить п'ять модулів енергетичного щита для цілої команди."
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: EnergyShieldSuitModule
          amount: 5
