- type: entity
  parent: BaseMachinePowered
  id: RanchIncubator
  name: "інкубатор"
  description: "Дозволяє висиджувати незапліднені курячі яйця за допомогою електрики"
  components:
  - type: Sprite
    sprite: _Pirate/Ranching/Structures/Machines/ranchobjects.rsi
    drawdepth: SmallObjects
    snapCardinals: true
    layers:
    - state: incubator
    - state: incubator-egg
      map: ["egg"]
      visible: false
  - type: ApcPowerReceiver
    powerLoad: 20
  - type: ItemSlots
    slots:
      egg-slot:
        priority: 4
        whitelist:
          tags:
          - Egg
  - type: ContainerContainer
    containers:
      egg-slot: !type:ContainerSlot
  - type: GenericVisualizer
    visuals:
      enum.EggIncubatorVisuals.Egg:
        egg:
          True: { visible: true }
          False: { visible: false }
  - type: Appearance
  - type: EggIncubator

- type: entity
  id: ChickenCarrier
  name: "переноска для курей"
  description: "Дозволяє безпечно переносити одну курку."
  parent: PetCarrier
  components:
  - type: Sprite
    noRot: true
    drawdepth: OverMobs
    sprite: _Pirate/Ranching/Structures/Machines/ranchobjects.rsi
    layers:
    - state: chicken-carrier
      map: [ "enum.StorageVisualLayers.Base" ]
    - state: chicken-carrier
      map: [ "enum.StorageVisualLayers.Door" ]
  - type: EntityStorage
    capacity: 1
    airtight: false
    showContents: true
    whitelist:
      tags:
      - Chicken
  - type: EntityStorageVisuals
    stateDoorOpen: chicken-carrier
    stateDoorClosed: chicken-carrier
  - type: ContainerContainer
    containers:
      entity_storage: !type:Container
        showEnts: True
      paper_label: !type:ContainerSlot
        showEnts: False

- type: entity
  parent: BaseStructure
  id: RanchBox
  name: "гніздівля"
  description: "Колись кури відкладали яйця тут, але сучасним породам вона вже не потрібна."
  components:
  - type: Sprite
    sprite: _Pirate/Ranching/Structures/Machines/ranchobjects.rsi
    drawdepth: SmallObjects
    snapCardinals: true
    state: box
