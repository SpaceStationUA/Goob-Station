- type: entity
  id: ThunderCloud
  parent: BaseEnergyBall
  name: "грозова хмара"
  description: "Локальна гроза, породжена курячою магією."
  components:
  - type: ChasingWalk
    minSpeed: 2
    maxSpeed: 3
    chasingComponent:
    - type: LightningTarget
  - type: Fixtures
    fixtures:
      TeslaCollider:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        hard: true
        restitution: 0.8
        density: 10
        mask:
        - None
        layer:
        - None
  - type: TimedDespawn
    lifetime: 20
  - type: Sprite
    drawdepth: Effects
    sprite: _Pirate/Ranching/Objects/Misc/thunder-cloud.rsi
    layers:
    - state: thundercloud
      shader: unshaded
  - type: Electrified
    requirePower: false

- type: entity
  abstract: true
  parent: BaseItem
  id: WaterBalloonBase
  components:
  - type: Sprite
    sprite: _Pirate/Ranching/Objects/Misc/eggs.rsi
    state: egg-balloon-blue
  - type: SolutionContainerManager
    solutions:
      balloon:
        maxVol: 20
        reagents:
        - ReagentId: Water
          Quantity: 20
  - type: DamageOnLand
    ignoreResistances: true
    damage:
      types:
        Blunt: 5
  - type: Damageable # Pirate: Goobstation stores this on Damageable instead of Trauma's Injurable.
    damageContainer: Inorganic
    damageModifierSet: FlimsyGlass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: desecration
      - !type:SpillBehavior
        solution: balloon
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: EmpPulse
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.8
  - type: Sprite
    drawdepth: Effects
    noRot: true
    layers:
    - shader: unshaded
      map: ["enum.EffectLayers.Unshaded"]
      sprite: Effects/emp.rsi
      state: emp_pulse
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu
  - type: AnimationPlayer
  - type: EmpOnTrigger
    range: 5
    energyConsumption: 50
    disableDuration: 5
  - type: TriggerOnSpawn
