# Clown

- type: entity
  abstract: true
  id: BaseChickenClown
  components:
  - type: Inventory
    templateId: RanchChicken
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.InstrumentUiKey.Key:
        type: InstrumentBoundUserInterface
        requireInputValidation: false
  - type: FavoriteFood
    tag:
    - Banana
  - type: InteractionPopup
    successChance: 0.8
    interactSuccessString: petting-success-bird
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Items/Toys/pushHornHonk.ogg
  - type: MeleeWeapon
    soundHit:
      collection: BikeHorn
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepClown
  - type: SpamEmitSound
    minInterval: 2
    maxInterval: 12
    sound:
      collection: BikeHorn
      params:
        variation: 0.125

- type: entity
  parent: [BaseChickenClown, BaseMobChickRanch]
  id: MobChickClown
  name: "курча-клоун"
  components:
  - type: Sprite
    sprite: _Pirate/Ranching/Mobs/Ranch/chicken-honk.rsi
  - type: SpawnEntityOnAgeUp
    entToSpawn:
    - MobClownHen
    - MobClownRooster
  - type: ReplaceOnItemEquipped
    ent: MobChickMime
    requiredTags:
    - Cigarette
  - type: Tag
    tags:
    - FootstepSound

- type: entity
  parent: [BaseChickenClown, BaseMobHenRanch]
  id: MobClownHen
  name: "курка-клоун"
  components:
  - type: Sprite
    sprite: _Pirate/Ranching/Mobs/Ranch/chicken-honk.rsi
  - type: ReplaceOnItemEquipped
    ent: MobMimeHen
    requiredTags:
    - Cigarette
  - type: ReplaceOnUnhappy
    ent: MobCluwneHen
  - type: Tag
    tags:
    - FootstepSound

- type: entity
  parent: [BaseChickenClown, BaseMobRoosterRanch]
  id: MobClownRooster
  name: "півень-клоун"
  components:
  - type: Sprite
    sprite: _Pirate/Ranching/Mobs/Ranch/chicken-honk.rsi
  - type: ReplaceOnItemEquipped
    ent: MobMimeRooster
    requiredTags:
    - Cigarette
