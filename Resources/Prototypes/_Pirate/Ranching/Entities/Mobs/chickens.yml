  id: MobChickDragon
  name: "драконяче курча"
  components:
  - type: SpawnEntityOnAgeUp
    entToSpawn:
    - MobDragonHen
    - MobDragonRooster
  - type: Sprite
    sprite: _Pirate/Ranching/Mobs/Ranch/chicken-dragon.rsi

- type: entity
  parent: [BaseChickenDragon, BaseMobHenRanch]
  id: MobDragonHen
  name: "драконяча курка"
  components:
  - type: Sprite
    sprite: _Pirate/Ranching/Mobs/Ranch/chicken-dragon.rsi

- type: entity
  parent: [BaseChickenDragon, BaseMobRoosterRanch]
  id: MobDragonRooster
  name: "драконячий півень"
  components:
  - type: Sprite
    sprite: _Pirate/Ranching/Mobs/Ranch/chicken-dragon.rsi
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 1
  - type: BasicEntityAmmoProvider
    proto: ProjectileFireball
    capacity: 1
    count: 1
  - type: Gun
    fireRate: 0.1
    useKey: false
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot: /Audio/Magic/fireball.ogg
  - type: HTN
    rootTask:
      task: RangedRoosterCompound

# Coral Chicken

- type: entity
  abstract: true
  parent: BaseChickenLegendary
  id: BaseChickenCoral
  components:
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      400: Dead

- type: entity
  parent: [BaseChickenCoral, BaseMobChickRanch]
  id: MobChickCoral
  name: "коралове курча"
  components:
  - type: SpawnEntityOnAgeUp
    entToSpawn:
    - MobCoralHen
    - MobCoralRooster
  - type: Sprite
    sprite: _Pirate/Ranching/Mobs/Ranch/chicken-coral.rsi

- type: entity
  parent: [BaseChickenCoral, BaseMobHenRanch]
  id: MobCoralHen
  name: "коралова курка"
  components:
  - type: Sprite
    sprite: _Pirate/Ranching/Mobs/Ranch/chicken-coral.rsi

- type: entity
  parent: [BaseChickenCoral, BaseMobRoosterRanch]
  id: MobCoralRooster
  name: "кораловий півень"
  components:
  - type: Sprite
    sprite: _Pirate/Ranching/Mobs/Ranch/chicken-coral.rsi
