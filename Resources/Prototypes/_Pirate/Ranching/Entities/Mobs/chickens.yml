- type: entity
  abstract: true
  parent: [SimpleMobBase, StripableInventoryBase]
  id: BaseMobChickRanch
  name: "курка"
  description: "Нащадок динозаврів, пристосований до розведення незвичайних порід"
  components:
  - type: UnhappyWhenCrowded
    tag: Chicken
  - type: Happiness
  - type: NpcFactionMember
    factions:
    - Chicken
  - type: Sprite
    sprite: _Pirate/Ranching/Mobs/Ranch/chicken-white.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: chick
  - type: MobThresholds
    thresholds:
      0: Alive
      20: Critical
      50: Dead
  - type: AnimalAgeing
  - type: DamageStateVisuals
    states:
      Alive:
        Base: chick
      Critical:
        Base: chick-dead
      Dead:
        Base: chick-dead
  - type: HTN
    rootTask:
      task: RuminantCompound
  - type: Body
    prototype: AnimalRuminant
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 8
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Speech
    speechVerb: SmallMob
    speechSounds: Cluck
  - type: Tag
    tags:
    - DoorBumpOpener
    - Chicken
    - VimPilot
  - type: Appearance
  - type: Butcherable
    spawned:
    - id: FoodMeatChicken
      amount: 3
  - type: InteractionPopup
    successChance: 0.8
    interactSuccessString: petting-success-bird
    interactFailureString: petting-failure-generic
    interactSuccessSpawn: EffectHearts
    interactSuccessSound:
      path: /Audio/Animals/chicken_cluck_happy.ogg
  - type: Bloodstream
    bloodReferenceSolution:
      reagents:
      - ReagentId: Blood
        Quantity: 100
  - type: Unrevivable
  - type: ExaminableHunger
  - type: Hunger
    thresholds:
      Overfed: 100
      Okay: 50
      Peckish: 35
      Starving: 20
      Dead: 15
    starvationDamage:
      types:
        Asphyxiation: 1

- type: entity
  abstract: true
  parent: BaseMobChickRanch
  id: BaseMobAdultChickenRanch
  components:
  - type: Happiness
  - type: AnimalAgeing # Not exactly needed, but probably should do for spawning in
    currentAgeState: Adult
    yearsOld: 15
  - type: GroupRetaliation
    range: 5

- type: entity
  abstract: true
  parent: [BaseMobAdultChickenRanch, MobCombat]
  id: BaseMobRoosterRanch
  components:
  - type: Sprite
    sprite: _Pirate/Ranching/Mobs/Ranch/chicken-white.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: rooster
  - type: MobThresholds
    thresholds:
      0: Alive
      60: Critical
      100: Dead
  - type: MeleeWeapon
    angle: 0
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 10
  - type: NPCRetaliation
    attackMemoryLength: 60
  - type: EggFertilizer
  - type: HostileWhenUnhappy
    unhappyTask: !type:HTNCompoundTask
      task: SimpleHostileCompound
    happyTask: !type:HTNCompoundTask
      task: RoosterCompound
  - type: HTN
    rootTask:
      task: RoosterCompound
    blackboard:
      MinimumIdleTime: !type:Single
        5
      MaximumIdleTime: !type:Single
        20
  - type: DamageStateVisuals
    states:
      Alive:
        Base: rooster
      Critical:
        Base: rooster-dead
      Dead:
        Base: rooster-dead

- type: entity
  abstract: true
  parent: BaseMobAdultChickenRanch
  id: BaseMobHenRanch
  components:
  - type: MobThresholds
    thresholds:
      0: Alive
      50: Critical
      90: Dead
  - type: RanchingEggLayer
  - type: MostRecentlyEatenFoodTags
  - type: Happiness
  - type: HTN
    rootTask:
      task: HenCompound
  - type: Sprite
    sprite: _Pirate/Ranching/Mobs/Ranch/chicken-white.rsi
    layers:
    - map: ["enum.DamageStateVisualLayers.Base"]
      state: hen
  - type: DamageStateVisuals
    states:
      Alive:
        Base: hen
      Critical:
        Base: hen-dead
      Dead:
        Base: hen-dead

