- type: entity
  parent: FoodApple
  id: FoodDeliciousApple
  name: "апетитне яблуко"
  description: "Спокусливий плід, наче щойно з Едему."
  components:
  - type: Produce
    seedId: deliciousApple
  - type: Tag
    tags:
    - Fruit
    - DeliciousLookingApple

- type: entity
  parent: FoodApple
  id: FoodMethApple
  name: "метамфетамінове яблуко"
  description: "Яблуко, насичене метамфетаміном."
  components:
  - type: Sprite
    sprite: _Pirate/Ranching/Objects/Specific/Hydroponics/meth_apple.rsi
  - type: Produce
    seedId: MethApple
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 19
        reagents:
        - ReagentId: Nutriment
          Quantity: 10
        - ReagentId: Vitamin
          Quantity: 4
        - ReagentId: Desoxyephedrine
          Quantity: 5
  - type: Tag
    tags:
    - Fruit
    - MethApple

