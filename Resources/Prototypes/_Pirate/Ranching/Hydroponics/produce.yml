- type: entity
  parent: FoodProduceBase
  id: MelonBalloon
  name: "кавун-кулька"
  description: "Газонаповнений кавун, здатний літати"
  components:
  - type: Sprite
    state: icon
    sprite: _Pirate/Ranching/Objects/Fun/balloons/red_balloon.rsi
  - type: Produce
    seedId: BalloonWatermelon
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_Goobstation/BalloonEffect/balloon_pop.ogg
          params:
            variation: 0.125
            volume: -4
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpillBehavior
        solution: food
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 75
  - type: Tag
    tags:
    - BalloonMelon

- type: entity
  parent: ProduceBaseRuminant
  id: SteelWheatBushel
  name: "оберемок сталевої пшениці"
  description: "Важкі стебла пшениці з металевим зерном"
  components:
  - type: Sprite
    sprite: _Pirate/Ranching/Objects/Specific/Hydroponics/steel_wheat.rsi
  - type: Produce
    seedId: SteelWheat
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 8
        reagents:
        - ReagentId: Nutriment
          Quantity: 5
        - ReagentId: Lead
          Quantity: 0.1
        - ReagentId: Iron
          Quantity: 2
  - type: Tag
    tags:
    - Ruminant
    - Wheat
    - SteelWheat
