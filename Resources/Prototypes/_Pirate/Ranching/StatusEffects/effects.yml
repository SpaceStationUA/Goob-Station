- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectShink
  name: "зменшення"
  components:
  - type: ShrunkStatusEffect

- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectDamageMod
  name: "змінена стійкість"
  components:
  - type: ChangeDamageModiferSetStatusEffect

- type: entity
  parent: StatusEffectDamageMod
  id: StatusEffectDamageModKnightEgg
  components:
  - type: ChangeDamageModiferSetStatusEffect
    damageModifierSet: KnightChickenEffect

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectDreamEgg
  name: "регенеративний сон"
  components:
  - type: StunnedStatusEffect
  - type: StatusEffectAlert
    alert: Stun
  - type: KnockdownStatusEffect
  - type: StatusEffectEffects
    effects:
    - !type:HealthChange
      damage:
        types:
          Asphyxiation: -5
          Blunt: -5
          Heat: -5
          Piercing: -5
          Slash: -5
          Cold: -5
          Radiation: -2
          Poison: -2
      useTargeting: false

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectCockatricePower
  name: "сила кокатриса"
  components:
  - type: TemporaryActionGrantEffect
    actionPrototypes:
    - CockatricePowerAction

- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectMedusa
  name: "скам'яніння"
  components:
  - type: StunnedStatusEffect
  - type: AddShaderStatusEffect
    shader: Greyscale
  - type: StatusEffectEffectsApply
    effectsOnApply:
    - !type:PopupMessage
      visualType: LargeCaution
      type: Local
      messages:
      - medusa-popup
    - !type:PlaySoundEffect
      sound: /Audio/Effects/break_stone.ogg

- type: entity
  parent: MobStatusEffectDebuff
  id: SnowEggEffect
  name: "сніговий слід"
  components:
  - type: Trail
    color: "#ffffff"
    lifetime: 1
    sprite:
      sprite: /Textures/_Pirate/Ranching/Objects/Specific/egg-snow-effect.rsi
      state: icon
  - type: StatusEffectEffects
    effects:
    - !type:SpawnEntity
      entity: WallRockSnow
    - !type:HealthChange
      damage:
        types:
          Cold: -5
      useTargeting: false

- type: entity
  parent: MobStatusEffectBase
  id: DreamsicleEggEffect
  name: "апельсинове марення"
  components:
  - type: TemporaryActionGrantEffect
    actionPrototypes:
    - ActionDashMoth
  - type: StatusEffectEffects
    effects:
    - !type:Jitter
    - !type:MovementSpeedModifier
      walkSpeedModifier: 4
      sprintSpeedModifier: 4

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectZappyPower
  name: "сила блискавичної курки"
  components:
  - type: TemporaryActionGrantEffect
    actionPrototypes:
    - ZappyPowerAction
    - ActionMutationShockTouch

- type: entity
  parent: MobStatusEffectBase
  id: SnowEggEffectNoDamage
  name: "сніговий слід"
  components:
  - type: Trail
    color: "#ffffff"
    lifetime: 5
    frequency: 0.05
    sprite:
      sprite: /Textures/_Pirate/Ranching/Objects/Specific/egg-snow-effect.rsi
      state: icon

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectPhoenixHeal
  name: "зцілення фенікса"
  components:
  - type: StatusEffectEffects
    effects:
    - !type:HealthChange
      damage:
        types:
          Blunt: -5
          Heat: -5
          Radiation: -5
          Poison: -5
      useTargeting: false

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectPhoenixPower
  name: "сила фенікса"
  components:
  - type: TemporaryActionGrantEffect
    actionPrototypes:
    - ActionFireballPhoenix

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectDragonPower
  name: "сила дракона"
  components:
  - type: TemporaryActionGrantEffect
    actionPrototypes:
    - ActionFireballPhoenix
  - type: StatusEffectEffects
    updateDelay: 5.5
    effects:
    - !type:PlaySoundEffect
      sound: /Audio/Animals/space_dragon_roar.ogg
    - !type:RelayNearby
      compName: MobState
      range: 2
      blacklist:
        components:
        - BorgChassis # Borgs cant feel fear
      effect: !type:ModifyStatusEffect
        effectProto: StatusEffectDragonFear
        time: 3
        type: Add

- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectDragonFear
  name: "драконячий жах"
  components:
  - type: StatusEffectEffectsApply
    effectsOnApply:
    - !type:PopupMessage
      type: Local
      visualType: LargeCaution
      messages:
      - entity-effect-popup-fear-affected
    - !type:GenericStatusEffect
      key: BlurryVision
      component: BlurryVision
      time: 3
    - !type:ModifyParalysis
      time: 2

- type: entity
  parent: MobStatusEffectBase
  id: SugarRushEffect
  name: "цукровий приплив"
  components:
  - type: StatusEffectEffects
    effects:
    - !type:Jitter
    - !type:MovementSpeedModifier
      walkSpeedModifier: 3
      sprintSpeedModifier: 3
