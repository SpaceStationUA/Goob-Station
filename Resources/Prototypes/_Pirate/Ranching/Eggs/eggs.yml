    state: egg-ghost
  - type: RanchingHatchable
    entity: MobChickPoultrygeist
  - type: EntityEffectOnTrigger
    targetUser: true
    effects:
    - !type:SpawnRandomEntities
      # Pirate: Trauma's shadow demon prototype is unavailable here.
      entity: MobLesserSlaughterDemon
      number: 2

- type: entity
  parent: BaseRanchingEgg
