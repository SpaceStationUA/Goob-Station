- type: entity
  abstract: true
  parent: FoodEggBase
  id: BaseRanchingEgg
  name: egg
  components:
  - type: Perishable
    rotAfter: 99999999 # For my birthday wish I wish to remove rotting
    molsPerSecondPerUnitMass: 0
  - type: RotInto
    entity: Eggshells
    stage: 1
  - type: Sprite
    sprite: _Pirate/Ranching/Objects/Misc/eggs.rsi
    state: egg-white
  - type: EggFertilizationTarget
  - type: RanchingHatchable
    entity: MobChickWhite
  - type: BadFood
  - type: RanchingTriggerOnFullyEaten

- type: entity
  parent: BaseRanchingEgg
  id: WhiteEgg

- type: entity
  parent: BaseRanchingEgg
  id: BrownEgg
  components:
  - type: Sprite
    state: egg-brown
  - type: RanchingHatchable
    entity: MobChickBrown

- type: entity
  parent: BaseRanchingEgg
  id: VoidEgg
  components:
  - type: Sprite
    state: egg-purple
  - type: RanchingHatchable
    entity: MobChickVoid
  - type: EntityEffectOnTrigger
    targetUser: true
    effects:
    - !type:ModifyStatusEffect
      effectProto: StatusEffectShink
      time: 30
      type: Add
    - !type:ModifyStatusEffect
      effectProto: StatusEffectDamageMod
      time: 30
      type: Add

- type: entity
  parent: BaseRanchingEgg
  id: IxworthEgg
  components:
  - type: Sprite
    state: egg-pet
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 56
        reagents:
        - ReagentId: Egg
          Quantity: 6
        - ReagentId: Ageium
          Quantity: 50
  - type: RanchingHatchable
    entity: MobChickIxworth

