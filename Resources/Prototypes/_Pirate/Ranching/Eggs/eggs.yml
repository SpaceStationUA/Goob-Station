  - type: RanchingHatchable
    entity: MobChickDream
  - type: EntityEffectOnTrigger
    targetUser: true
    effects:
    - !type:ModifyStatusEffect
      effectProto: StatusEffectDreamEgg
      time: 60
      type: Add
    - !type:PopupMessage
      visualType: MediumCaution
      type: Local
      messages:
      - dream-egg-popup
    - !type:PlaySoundEffect
      sound: /Audio/_Goobstation/Changeling/Effects/armour_transform.ogg

- type: entity
  parent: BaseRanchingEgg
