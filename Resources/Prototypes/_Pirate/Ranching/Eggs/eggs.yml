- type: entity
  parent: BaseRanchingEgg
  id: PigeonEgg
  components:
  - type: Sprite
    sprite: _Pirate/Ranching/Objects/Misc/eggs.rsi
    state: egg-pigeon
  - type: RanchingHatchable
    entity: MobChickPigeon
  - type: TelecomExempt
  - type: RadioMicrophone
    broadcastChannel: Handheld
    listenRange: 1
  - type: RadioSpeaker
    channels:
    - Handheld
  - type: ListenBlacklist
    blacklist:
      components:
      - Advertise
  - type: Speech
    speechVerb: Robotic
  - type: EntityEffectOnTrigger
    targetUser: true
    effects:
    - !type:AddComponents
      components:
      - type: TelecomExempt
      - type: IntrinsicRadioReceiver
      - type: ActiveRadio
        channels:
        - EggRadio
  - type: Tag
    tags:
    - Radio

- type: entity
  parent: BaseItem
  id: PigeonEggInedible
  name: egg
  components:
  - type: Sprite
    sprite: _Pirate/Ranching/Objects/Misc/eggs.rsi
    state: egg-pigeon
  - type: TelecomExempt
  - type: RadioMicrophone
    broadcastChannel: EggRadio
    listenRange: 1
  - type: RadioSpeaker
    channels:
    - EggRadio
  - type: ListenBlacklist
    blacklist:
      components:
      - Advertise
  - type: Speech
    speechVerb: Robotic
  - type: Tag
    tags:
    - Radio

