- type: entity
  id: OrganAvaliStomach
  parent: OrganAnimalStomach
  name: "шлунок авалі"
  suffix: Avali
  description: "При уважнішому огляді видно, що він насправді складається з двох шлунків."
  components:
  - type: Stomach
    specialDigestible:
      tags:
      - Meat
      - Pill
      - Crayon
      - Paper
      - AvianFood
  - type: Metabolizer
    maxPoisonsProcessable: 3
    metabolizerTypes: [Avali, Animal]
    groups:
    - id: Food
    - id: Drink
  - type: SolutionContainerManager
    solutions:
      stomach:
        maxVol: 50
      food:
        maxVol: 5
        reagents:
        - ReagentId: UncookedAnimalProteins
          Quantity: 5
  - type: Sprite
    sprite: _Pirate/Mobs/Species/Avali/organs.rsi
    state: stomach

- type: entity
  id: OrganAvaliHeart
  parent: OrganHumanHeart
  name: "серце авалі"
  suffix: Avali
  description: "Серце авалі."
  components:
  - type: Metabolizer
    maxPoisonsProcessable: 2
    metabolizerTypes: [Avali]
    groups:
    - id: Medicine
    - id: Poison
    - id: Narcotic
  - type: Sprite
    sprite: _Pirate/Mobs/Species/Avali/organs.rsi
    state: heart-on

- type: entity
  id: OrganAvaliLiver
  parent: OrganHumanLiver
  name: "печінка авалі"
  suffix: Avali
  description: "Печінка авалі."
  components:
  - type: Metabolizer
    maxPoisonsProcessable: 1
    metabolizerTypes: [Avali]
    groups:
    - id: Alcohol
  - type: Sprite
    sprite: _Pirate/Mobs/Species/Avali/organs.rsi
    state: liver

- type: entity
  id: OrganAvaliKidneys
  parent: OrganHumanKidneys
  name: "нирки авалі"
  suffix: Avali
  description: "Нирки авалі."
  components:
  - type: Metabolizer
    maxPoisonsProcessable: 5
    metabolizerTypes: [Avali]
    removeEmpty: true
  - type: Sprite
    sprite: _Pirate/Mobs/Species/Avali/organs.rsi
    layers:
    - state: kidney-l
    - state: kidney-r

- type: entity
  id: OrganAvaliLungs
  parent: OrganHumanLungs
  name: "легені авалі"
  suffix: Avali
  description: "Легені авалі."
  components:
  - type: Metabolizer
    removeEmpty: true
    solutionOnBody: false
    solution: Lung
    # Pirate: Human preserves oxygen metabolism while Avali enables species reagents.
    metabolizerTypes: [Avali, Human]
    groups:
    - id: Gas
      rateModifier: 100.0
  - type: Sprite
    sprite: _Pirate/Mobs/Species/Avali/organs.rsi
    layers:
    - state: lung-l
    - state: lung-r

- type: entity
  id: OrganAvaliEyes
  parent: OrganHumanEyes
  name: "очі авалі"
  suffix: Avali
  description: "Очі авалі."

- type: entity
  id: OrganAvaliBrain
  parent: OrganHumanBrain
  name: "мозок авалі"
  suffix: Avali
  description: "Тут авалі думають злі думки."
  components:
  - type: Sprite
    sprite: _Pirate/Mobs/Species/Avali/organs.rsi
    state: brain
