- type: entity
  id: ActionStasisEnter
  name: "Увійти в стазис"
  description: "Увійти у стан призупиненої анімації, який поступово лікує шкоду, але перешкоджає руху та більшості дій."
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _Pirate/Interface/Actions/actions_avali.rsi
      state: heal
  - type: InstantAction
    event: !type:PrepareStasisActionEvent

- type: entity
  id: ActionStasisExit
  name: "Вийти зі стазису"
  description: "Вийти зі стану призупиненої анімації."
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: _Pirate/Interface/Actions/actions_avali.rsi
      state: healoff
  - type: InstantAction
    event: !type:ExitStasisActionEvent
