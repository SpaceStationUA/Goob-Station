# Trauma Demons

- type: entity
  parent: ActionBlink
  id: ActionDemonRift
  name: "демонічний стрибок"
  description: "Клацніть десь, щоб телепортуватися туди."
  components:
  - type: Sprite
    sprite: _Pirate/Demonology/Actions/demon.rsi
    layers:
    - state: rift
  - type: Action
    useDelay: 20
    sound: !type:SoundPathSpecifier
      path: /Audio/Effects/burning.ogg
  - type: EffectAction
    onPerformed: true
    effects:
    - !type:SpawnParticles
      particleProto: DemonPassage

- type: entity
  parent: ActionRepulseNoRobes
  id: ActionDemonRepulse
  name: "демонічний імпульс"
  description: "Вивільніть імпульс чистої демонічної енергії, відштовхуючи всіх навколо."
  components:
  - type: Sprite
    sprite: _Pirate/Demonology/Actions/demon.rsi
    layers:
    - state: repulse
  - type: Action
    useDelay: 25
    sound: !type:SoundPathSpecifier
      path: /Audio/_Goobstation/Heretic/disintegrate.ogg


# Goobstation heretic

- type: entity
  id: ActionDemonGaze
  name: "погляд демона"
  description: "Створює величезний промінь смерті, що знищує все на своєму шляху. Він має власне гравітаційне тяжіння й затягує нових жертв."
  components:
  - type: Sprite
    sprite: _Goobstation/Heretic/abilities_heretic.rsi
    layers:
    - state: gazer_beam_charge
  - type: Action
    checkCanInteract: false
    useDelay: 30
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:StarGazeEvent
