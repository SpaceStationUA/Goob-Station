- type: entity
  abstract: true
  parent: [ BaseStructure, BaseMagicalContraband ]
  id: BaseSummoningRune
  components:
  - type: Sprite
    state: icon
    snapCardinals: true
  - type: Clickable
  - type: IgnoresFingerprints
  - type: Damageable
  # Pirate: Injurable is unavailable in this branch; Damageable handles rune damage.
    damageContainer: Inorganic
  - type: Physics
    canCollide: false

- type: entity
  abstract: true
  parent: [ BaseStructure, DrinkBase, BaseMagicalContraband ]
  id: BaseCarvedRune
  components:
  - type: Sprite
    state: carved
    snapCardinals: true
  - type: Construction
    node: carved
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_Goobstation/Heretic/runebreak.ogg
  - type: InteractionOutline
  - type: Physics
    canCollide: false

# Enchanting

- type: entity
  parent: BaseCarvedRune
  id: EnchantingRuneCarved
  name: "незавершена руна"
  description: "Незавершена руна, потребує крові."
  components:
  - type: Sprite
    sprite: _Pirate/Demonology/Structures/Runes/enchanting.rsi
  - type: Construction
    graph: EnchantingRune

- type: entity
  parent: BaseSummoningRune
  id: EnchantingRune
  name: "руна зачарування"
  description: "Руна для зачарування предметів."
  components:
  - type: PlaceableSurface
  - type: EnchantingTable
  - type: Sprite
    sprite: _Pirate/Demonology/Structures/Runes/enchanting.rsi
    state: icon
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 30
      behaviors: &rune_break
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/_Goobstation/Heretic/runebreak.ogg
  - type: Construction
    graph: EnchantingRune
    node: finish

## Demons

- type: entity
  abstract: true
  parent: BaseSummoningRune
  id: BaseDemonRune
  components:
  - type: RandomDemonSpawner
  - type: Construction
    node: finish
  - type: GhostRole
    name: ghost-role-information-demon-name
    description: ghost-role-information-demon-desc
    rules: ghost-role-information-antagonist-rules
    mindRoles:
    - MindRoleGhostRoleSoloAntagonist
    raffle:
      settings: short
  - type: TimedDespawn
    lifetime: 60
  - type: SpawnOnDespawn
    prototype: DemonSoulFragment # gets changed by RandomDemonSpawner mapinit

# Minor

- type: entity
  parent: BaseDemonRune
  id: MinorDemonRune
  name: "мале коло призову"
  description: "Руна для призову малих демонів."
  components:
  - type: Sprite
    sprite: _Pirate/Demonology/Structures/Runes/minor.rsi
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTrigger
        damage: 30
      behaviors: *rune_break
  - type: Construction
    graph: MinorSummoning
  - type: RandomDemonSpawner
    hostileChance: 0.25 # minor demons are more friendly
    demons:
    - MinorDemonGuy
    - MinorDemonIncel
    - MinorDemonUrist
    - MinorDemonIan
    - MinorDemonVox
    - MinorDemonVulp
    - MinorDemonCentifiend
    - MinorDemonFlesh

- type: entity
  parent: BaseCarvedRune
  id: MinorRuneCarved
  name: "незавершена руна"
  description: "Незавершена руна, потребує крові."
  components:
  - type: Sprite
    sprite: _Pirate/Demonology/Structures/Runes/minor.rsi
  - type: Construction
    graph: MinorSummoning

