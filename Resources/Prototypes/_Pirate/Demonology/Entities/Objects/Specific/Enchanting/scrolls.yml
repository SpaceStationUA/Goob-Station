- type: entity
  abstract: true
  parent: BasePaper
  id: BaseEnchantingScroll
  name: "зачарований сувій"
  description: "Сувій, наділений зачаруванням. Може робити що завгодно."
  components:
  - type: Sprite
    sprite: _Pirate/Demonology/Objects/Specific/empty_scroll.rsi
    layers:
    - state: icon
      shader: shaded
    - state: writing
      map: ["enum.EnchanterVisuals.Layer"]
      shader: Enchant
  - type: Item
    size: Small
  - type: Tag
    tags: [] # no faxing it etc
  - type: GuideHelp
    guides:
    - Enchanting

- type: entity
  parent: BaseItem
  id: EnchantingScrollEmpty
  name: "сувій"
  description: "Порожній сувій, що чекає на зачарування."
  components:
  - type: Sprite
    sprite: _Pirate/Demonology/Objects/Specific/empty_scroll.rsi
    layers:
    - state: icon
      shader: shaded
    - state: writing
      map: ["enum.EnchanterVisuals.Layer"]
      visible: false
      shader: Enchant
  - type: Item
    size: Small
  - type: Tag
    tags:
    - EnchantingScroll
  - type: Construction
    graph: EnchantedScroll
    node: finish
