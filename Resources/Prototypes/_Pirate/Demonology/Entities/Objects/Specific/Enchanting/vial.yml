- type: entity
  name: "порожня ампула крові"
  parent: [DrinkBaseMaterialGlass, DrinkBaseCup, DrinkVisualsFillOverlay, BaseMagicalContraband]
  description: "Порожня ампула, яку потрібно наповнити кров'ю."
  id: BloodVial
  components:
  - type: Spillable
    solution: drink
  - type: StaticPrice
    price: 100
  - type: PhysicalComposition
    materialComposition:
      Glass: 100
      Steel: 50
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 100
  - type: Sprite
    sprite: _Pirate/Demonology/Objects/Enchanting/bloodvial.rsi
    layers:
    - state: icon-empty
      map: [ "enum.SolutionContainerLayers.Base" ]
    - state: fill-1
      map: [ "enum.SolutionContainerLayers.Fill" ]
      visible: false
    - state: icon-front
      map: [ "enum.SolutionContainerLayers.Overlay" ]
  - type: Item
    size: Small
    sprite: _Pirate/Demonology/Objects/Enchanting/bloodvial.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 3
    fillBaseName: fill-
    inHandsMaxFillLevels: 3
  - type: GuideHelp
    guides:
    - Enchanting
  - type: Construction
    graph: DemonBlood
    node: unfinished

- type: entity
  name: "наповнена ампула крові"
  parent: [BaseItem, BaseMagicalContraband]
  description: "Ампула крові, наділена чорною магією; корисна для різних цілей."
  id: BloodVialFull
  components:
  - type: StaticPrice
    price: 100
  - type: PhysicalComposition
    materialComposition:
      Glass: 100
      Steel: 50
  - type: Sprite
    sprite: _Pirate/Demonology/Objects/Enchanting/bloodvial.rsi
    layers:
    - state: icon
  - type: Item
    size: Small
    sprite: _Pirate/Demonology/Objects/Enchanting/bloodvial.rsi
  - type: GuideHelp
    guides:
    - Enchanting
  - type: Tag
    tags:
    - BloodVial
  - type: Construction
    graph: DemonBlood
    node: finish
