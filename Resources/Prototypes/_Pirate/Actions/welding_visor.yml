# Pirate: welding visor - toggles a welding mask/goggle's visor between lowered (protecting) and raised.
# Icon is set dynamically per-item by WeldingVisorSystem (the item's own sprite), not hardcoded here.
- type: entity
  id: ActionToggleWeldingVisor
  name: Toggle Visor
  description: Flip the visor up or down. Only lowered down does it protect your eyes.
  components:
  - type: Action
    itemIconStyle: NoItem
  - type: InstantAction
    event: !type:ToggleWeldingVisorEvent
