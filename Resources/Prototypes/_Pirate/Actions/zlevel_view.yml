- type: entity
  parent: BaseMentalAction
  id: ActionStationAiViewUp
  name: "Переглянути поверх вище"
  description: "Перемістити оглядову камеру на поверх вище."
  components:
  - type: Action
    checkCanInteract: false
    priority: -8
    itemIconStyle: BigAction
    icon:
      sprite: _Pirate/Actions/misc.rsi
      state: up
