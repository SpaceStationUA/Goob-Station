- type: entity
  parent: BaseAction
  id: ActionCorticalBorerChemMenu
  name: Chemicals
  description: Open the chemicals menu.
  components:
  - type: Action
    icon: _Pirate/Interface/Action/borer_chem.png
  - type: InstantAction
    event: !type:CorticalChemMenuActionEvent

- type: entity
  parent: BaseAction
  id: ActionCorticalBorerInfest
  name: Infest
  description: Infest a humanoid target with a bloodstream.
  components:
  - type: Action
    icon: _Pirate/Interface/Action/borer_infest.png
    itemIconStyle: NoItem
    useDelay: 5
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:CorticalInfestEvent

- type: entity
  parent: BaseAction
  id: ActionCorticalBorerEject
  name: Eject Host
  description: Eject yourself from your host.
  components:
  - type: Action
    icon: _Pirate/Interface/Action/borer_eject.png
    useDelay: 5
  - type: InstantAction
    event: !type:CorticalEjectEvent

- type: entity
  parent: BaseAction
  id: ActionCheckBlood
  name: Check Blood
  description: Inspect your host's blood and condition.
  components:
  - type: Action
    icon: _Pirate/Interface/Action/borer_bloodcheck.png
    useDelay: 5
  - type: InstantAction
    event: !type:CorticalCheckBloodEvent

- type: entity
  parent: BaseAction
  id: ActionControlHost
  name: Take Control
  description: Take full control of your host for 40 seconds while they are awake.
  components:
  - type: Action
    icon: _Pirate/Interface/Action/borer_control.png
    useDelay: 340
  - type: InstantAction
    event: !type:CorticalTakeControlEvent

- type: entity
  parent: BaseAction
  id: ActionEndControlHost
  name: Relinquish Control
  description: Give up control of the host's body early.
  components:
  - type: Action
    icon: _Pirate/Interface/Action/borer_eject.png
    useDelay: 5
  - type: InstantAction
    event: !type:CorticalEndControlEvent

- type: entity
  parent: BaseAction
  id: ActionLayEggHost
  name: Lay Egg
  description: Force your host to vomit an egg. Costs 200 chemicals.
  components:
  - type: Action
    icon: _Pirate/Interface/Action/borer_egg.png
    useDelay: 5
  - type: InstantAction
    event: !type:CorticalLayEggEvent
