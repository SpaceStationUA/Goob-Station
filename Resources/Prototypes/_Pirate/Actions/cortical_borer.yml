- type: entity
  parent: BaseAction
  id: ActionCorticalBorerChemMenu
  name: "Хімікати"
  description: "Відкрити меню хімікатів для введення реагентів носієві."
  components:
  - type: Action
    icon: _Pirate/Interface/Action/borer_chem.png
  - type: InstantAction
    event: !type:CorticalChemMenuActionEvent

- type: entity
  parent: BaseAction
  id: ActionCorticalBorerInfest
  name: "Заразити"
  description: "Проникнути в гуманоїда з кровоносною системою."
  components:
  - type: Action
    icon: _Pirate/Interface/Action/borer_infest.png
    itemIconStyle: NoItem
    useDelay: 5
  - type: TargetAction
    interactOnMiss: false
  - type: EntityTargetAction
    whitelist:
      components:
      - Body
    canTargetSelf: false
    event: !type:CorticalInfestEvent

- type: entity
  parent: BaseAction
  id: ActionCorticalBorerEject
  name: "Покинути носія"
  description: "Вибратися з тіла поточного носія."
  components:
  - type: Action
    icon: _Pirate/Interface/Action/borer_eject.png
    useDelay: 5
  - type: InstantAction
    event: !type:CorticalEjectEvent

- type: entity
  parent: BaseAction
  id: ActionCheckBlood
  name: "Перевірити кров"
  description: "Дослідити кров і стан свого носія."
  components:
  - type: Action
    icon: _Pirate/Interface/Action/borer_bloodcheck.png
    useDelay: 5
  - type: InstantAction
    event: !type:CorticalCheckBloodEvent

- type: entity
  parent: BaseAction
  id: ActionControlHost
  name: "Перехопити контроль"
  description: "Повністю контролювати притомного носія протягом 40 секунд."
  components:
  - type: Action
    icon: _Pirate/Interface/Action/borer_control.png
    useDelay: 340
  - type: InstantAction
    event: !type:CorticalTakeControlEvent

- type: entity
  parent: BaseAction
  id: ActionEndControlHost
  name: "Відмовитися від контролю"
  description: "Достроково повернути носієві контроль над тілом."
  components:
  - type: Action
    icon: _Pirate/Interface/Action/borer_eject.png
    useDelay: 5
  - type: InstantAction
    event: !type:CorticalEndControlEvent

- type: entity
  parent: BaseAction
  id: ActionLayEggHost
  name: "Відкласти яйце"
  description: "Змусити носія виблювати яйце. Витрачає 200 хімікатів."
  components:
  - type: Action
    icon: _Pirate/Interface/Action/borer_egg.png
    useDelay: 5
  - type: InstantAction
    event: !type:CorticalLayEggEvent
