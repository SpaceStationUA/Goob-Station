- type: entity
  parent: BaseAction
  id: ToggleModularSuitDeployAction
  name: "[color=#58c4e8]Розгорнути костюм[/color]"
  description: "Розкриває модульний костюм і вдягає на тіло всі встановлені частини. Повторне натискання згортає костюм назад у компактний стан."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1.5
    icon: { sprite: _Pirate/Interface/Actions/actions_modules.rsi, state: activate }
    iconOn: { sprite: _Pirate/Interface/Actions/actions_modules.rsi, state: activate-ready }
    itemIconStyle: BigAction
  - type: InstantAction
    event: !type:ToggleDeploySuitActionEvent

- type: entity
  parent: BaseAction
  id: ToggleModularSuitUiAction
  name: "[color=#58c4e8]Відкрити інтерфейс МОД-костюма[/color]"
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 2
    icon: { sprite: _Pirate/Interface/Actions/actions_modules.rsi, state: panel }
  - type: InstantAction
    event: !type:ToggleSuitUiActionEvent

- type: entity
  parent: BaseAction
  id: ToggleLightModuleAction
  name: "[color=#58c4e8]Перемкнути освітлення[/color]"
  description: "Вмикає або вимикає вбудовану систему освітлення костюма."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    icon: { sprite: _Pirate/Interface/Actions/actions_modules.rsi, state: light-off }
    iconOn: { sprite: _Pirate/Interface/Actions/actions_modules.rsi, state: light-on }
  - type: InstantAction
    event: !type:ToggleLightModuleEvent

- type: entity
  parent: BaseAction
  id: ActivateTeleporterModuleAction
  name: "[color=#58c4e8]Активувати телепортер[/color]"
  description: "Миттєво телепортує користувача до випадкової істоти поблизу. Для роботи потребує блюспейс-ядра."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    startDelay: true
    useDelay: 20
    icon: { sprite: _Pirate/Interface/Actions/actions_modules.rsi, state: teleporter }
  - type: InstantAction
    event: !type:ActivateTeleporterModuleEvent

- type: entity
  parent: BaseAction
  id: ToggleHolsterModuleAction
  name: "[color=#58c4e8]Перемкнути кобуру[/color]"
  description: "Висуває або ховає кобуру для швидкого доступу до вогнепальної зброї."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    startDelay: true
    useDelay: 10
    icon: { sprite: _Pirate/Interface/Actions/actions_modules.rsi, state: holster-in }
    iconOn: { sprite: _Pirate/Interface/Actions/actions_modules.rsi, state: holster-out }
  - type: InstantAction
    event: !type:ToggleHolsterModuleEvent

- type: entity
  parent: BaseAction
  id: ActivatePaperDispenserModuleAction
  name: "[color=#58c4e8]Активувати видавач паперу[/color]"
  description: "Синтезує свіжий папір за допомогою передових технологій факсів і принтерів. Перетворює енергію костюма на високоякісне канцелярське приладдя. Ідеально для надзвичайних паперових справ або коли просто потрібно залишити записку."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    startDelay: true
    useDelay: 30
    icon: { sprite: _Pirate/Interface/Actions/actions_modules.rsi, state: paper }
  - type: InstantAction
    event: !type:ActivateDispenserModuleEvent
      spawnedProto:
      - Paper
      - PaperOffice
      activateSound:
        path: "/Audio/Machines/printer.ogg"

- type: entity
  parent: BaseAction
  id: ActivateEnergyShieldModuleAction
  name: "[color=#58c4e8]Активувати енергетичний щит[/color]"
  description: "Створює персональне захисне силове поле, що блокує вхідні атаки. Споживає значну кількість енергії."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    startDelay: true
    useDelay: 60
    icon: { sprite: _Pirate/Interface/Actions/actions_modules.rsi, state: energyshield }
  - type: InstantAction
    event: !type:ActivateEnergyShieldModuleEvent

