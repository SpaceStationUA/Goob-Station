- type: entity
  parent: BaseAction
  id: ActionSharkVisionPulse
  name: "Відчути кров у воді"
  description: "Дозволяє відчувати кров і тих, хто стікає кров'ю."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    itemIconStyle: BigAction
    priority: -20
    useDelay: 10
    icon:
      sprite: /Textures/Interface/Alerts/bleed.rsi
      state: bleed10
  - type: InstantAction
    event: !type:ToggleSharkVisionEvent

- type: entity
  parent: BaseToggleAction
  id: ActionFeroxiDive
  name: "Пірнути"
  description: "Зануритись під воду. Над поверхнею залишається тільки спинний плавець, ти пливеш на 50% швидше, б'єш без зброї удвічі сильніше, а твої кроки стають безшумними."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: _Pirate/Interface/Actions/feroxi_dive.png
    itemIconStyle: NoItem
    useDelay: 1

- type: entity
  parent: BaseToggleAction
  id: ActionFeroxiSurface
  name: "Виринути"
  description: "Піднятись назад із води. Ти виринаєш сам, якщо покидаєш воду, якщо тебе збили з ніг або важко поранили."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    icon: _Pirate/Interface/Actions/feroxi_surface.png
    itemIconStyle: NoItem
    useDelay: 1
