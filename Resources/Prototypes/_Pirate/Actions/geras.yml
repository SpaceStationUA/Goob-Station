- type: entity
  parent: BaseAction
  id: ActionMorphGeras
  name: Morph into Geras
  description: Morphs you into a geras, a faster miniature form. Your equipment and held items are stashed away safely, but will spill out if you die in this form.
  categories: [ HideSpawnMenu ]
  components:
  - type: ConfirmableAction
    popup: gera-transformation-popup
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Mobs/Aliens/slimes.rsi
      state: blue_adult_slime
  - type: InstantAction
    event: !type:MorphIntoGerasEvent
