- type: entity
  parent: BaseAction
  id: ActionMorphGeras
  name: "Перетворитися на гераса"
  description: "Перетворює вас на гераса — швидшу мініатюрну форму, ціною скидання спорядження та речей із рук."
  categories: [ HideSpawnMenu ]
  components:
  - type: ConfirmableAction
    popup: gera-transformation-popup
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: Mobs/Aliens/slimes.rsi
      state: blue_adult_slime
  - type: InstantAction
    event: !type:MorphIntoGerasEvent
