- type: entity
  abstract: true
  parent: BaseAction
  id: RMCActionCassetteBase
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 0.5

- type: entity
  parent: RMCActionCassetteBase
  id: RMCActionCassettePlayPause
  name: "Відтворити / призупинити"
  description: "Починає або призупиняє відтворення музики."
  components:
  - type: Action
    icon:
      sprite: _Pirate/Cassette/Actions/cassette_player.rsi
      state: walkman_playpause
  - type: InstantAction
    event: !type:CassettePlayPauseActionEvent

- type: entity
  parent: RMCActionCassetteBase
  id: RMCActionCassetteNext
  name: "Наступна композиція"
  description: "Переходить до наступної доріжки."
  components:
  - type: Action
    icon:
      sprite: _Pirate/Cassette/Actions/cassette_player.rsi
      state: walkman_next
  - type: InstantAction
    event: !type:CassetteNextActionEvent

- type: entity
  parent: RMCActionCassetteBase
  id: RMCActionCassetteRestart
  name: "Перезапустити композицію"
  description: "Перезапускає поточну доріжку."
  components:
  - type: Action
    icon:
      sprite: _Pirate/Cassette/Actions/cassette_player.rsi
      state: walkman_restart
  - type: InstantAction
    event: !type:CassetteRestartActionEvent
