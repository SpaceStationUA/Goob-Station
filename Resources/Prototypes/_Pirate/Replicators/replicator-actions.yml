# these are HEAVILY based on the Bingle free-agent ghostrole from GoobStation, but reflavored and reprogrammed to make them more Robust (and less of a meme.)
# all credit for the core gameplay concepts and a lot of the core functionality of the code goes to the folks over at Goob, but I re-wrote enough of it to justify putting it in our filestructure.
# the original Bingle PR can be found here: https://github.com/Goob-Station/Goob-Station/pull/1519
- type: entity
  parent: BaseAction
  id: ActionReplicatorSpawnNest
  name: "Створити гніздо"
  description: "Створити нове гніздо для вашого вулика."
  components:
  - type: Action
    itemIconStyle: NoItem
    icon: _Pirate/Interface/Actions/spawn_nest.png
    useDelay: 20
  - type: InstantAction
    event: !type:ReplicatorSpawnNestActionEvent
  - type: ConfirmableAction
    popup: replicator-nest-confirm

- type: entity
  parent: BaseAction
  id: BaseReplicatorLevelupAction
  components:
  - type: ConfirmableAction
    popup: replicator-levelup-confirm

- type: entity
  id: ActionReplicatorUpgrade1
  parent: BaseReplicatorLevelupAction
  name: "Повернутися до Реплікатора"
  description: "Позбутися частини нанітів і змінити конфігурацію."
  components:
  - type: Action
    itemIconStyle: NoItem
    icon: _Pirate/Interface/Actions/replicator_level1.png
    useDelay: 20
  - type: InstantAction
    event: !type:ReplicatorUpgradeActionEvent
      nextStage: MobReplicator

- type: entity
  id: ActionReplicatorUpgrade2
  parent: BaseReplicatorLevelupAction
  name: "Стати Деконструктором"
  description: "Зібрати наніти й отримати інструменти."
  components:
  - type: Action
    itemIconStyle: NoItem
    icon: _Pirate/Interface/Actions/replicator_level2.png
    useDelay: 20
  - type: InstantAction
    event: !type:ReplicatorUpgradeActionEvent
      nextStage: MobReplicatorTier2


- type: entity
  id: ActionReplicatorUpgrade2Alt
  parent: BaseReplicatorLevelupAction
  name: "Стати Захисником"
  description: "Зібрати наніти й отримати озброєння."
  components:
  - type: Action
    itemIconStyle: NoItem
    icon: _Pirate/Interface/Actions/replicator_level2alt.png
    useDelay: 20
  - type: InstantAction
    event: !type:ReplicatorUpgradeActionEvent
      nextStage: MobReplicatorTier2Alt


- type: entity
  id: ActionReplicatorUpgrade3
  parent: BaseReplicatorLevelupAction
  name: "Стати Протектором"
  description: "Зібрати наніти й посилити корпус."
  components:
  - type: Action
    itemIconStyle: NoItem
    icon: _Pirate/Interface/Actions/replicator_level3.png
    useDelay: 20
  - type: InstantAction
    event: !type:ReplicatorUpgradeActionEvent
      nextStage: MobReplicatorTier3
