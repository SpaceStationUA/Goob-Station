# Pirate: only the Replicator vocabulary is ported; the general DeltaV AAC catalog is not present in Goob.
- type: entity
  parent: BaseItem
  id: BaseReplicatorAACTablet
  abstract: true
  components:
  - type: ActivatableUI
    singleUser: false
    key: enum.AACTabletKey.Key
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: UserInterface
    interfaces:
      enum.AACTabletKey.Key:
        type: AACBoundUserInterface
  - type: Speech
    speechSounds: Borg
  - type: AACTablet
    phraseGroup: ReplicatorPhrases
  - type: VoiceMask
