# Monster disperse jaunt — black floating form, no slaughter-demon enter/exit VFX
# (those VFX only spawn from SlaughterDemonComponent).

- type: entity
  id: PolymorphMonsterJaunt
  name: Unknown
  description: A black smear in the air. Something is wrong.
  parent: [ Incorporeal, BaseMob ]
  components:
  - type: Sprite
    sprite: Structures/Specific/Anomalies/Cores/flesh_core.rsi
    state: core
    color: "#000000"
  - type: PointLight
    enabled: false
  - type: MovementSpeedModifier
    baseSprintSpeed: 12
    baseWalkSpeed: 8
  - type: Input
    context: "ghost"
  - type: NoSlip
  - type: BloodCrawl
    isCrawling: true
    requireBlood: false
    jaunt: MonsterJaunt
    actionId: ActionMonsterDisperse
    enterJauntSound: null
    exitJauntSound: null
    blood:
    - Blood
  - type: Spectral
  - type: Eye
    drawFov: false
  - type: MindContainer
  - type: MindExaminable
  - type: Muted
  - type: IsDeadIC
    dead: false

- type: polymorph
  id: MonsterJaunt
  configuration:
    entity: PolymorphMonsterJaunt
    forced: true
    attachToGridOrMap: true
    showPopup: false
    componentsToTransfer:
    - component: LanguageKnowledge
    - component: LanguageSpeaker
    - component: Grammar
    - component: BackroomsPreySense
    - component: Pinpointer
    - component: ThermalVision
    - component: Sprinter
    - component: Stamina
    - component: NpcFactionMember
