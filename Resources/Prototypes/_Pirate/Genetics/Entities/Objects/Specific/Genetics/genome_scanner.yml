- type: entity
  parent: BaseItem
  id: HandheldGeneticsScanner
  name: handheld genome scanner
  description: A combined DNA sampler and readout device that can show all sequences in a subject outside of the lab.
  components:
  - type: Sprite
    sprite: _Pirate/Genetics/Objects/Specific/Genetics/genome_scanner.rsi
    layers:
    - state: icon
    - state: analyzer
      shader: unshaded
  - type: Item
    heldPrefix: analyzer
    storedRotation: -90
  - type: GeneticsScanner
    scanDelay: 3
  - type: HandheldGeneticsScanner
  - type: GeneticsPrintout
  # Uses the mutation discoveries of the research server on the grid it was made on.
  - type: ResearchClient
  - type: DoAfter
  - type: ActivatableUI
    key: enum.GeneticsConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.GeneticsConsoleUiKey.Key:
        type: GeneticsScannerBUI
  - type: Appearance
  - type: Speech
    speechVerb: Robotic
    speechSounds: Pai
  - type: GuideHelp
    guides:
    - Genetics

- type: entity
  parent: PaperArtifactAnalyzer
  id: PaperGeneticsScanner
  name: genetics printout
  description: Information printed from a handheld genome scanner.
