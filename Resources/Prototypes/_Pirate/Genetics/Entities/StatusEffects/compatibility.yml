# Pirate: adapt Trauma's split status handlers to the local component-based mechanics.
- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectPressureImmunityMutation
  components:
  - type: GeneticsComponentStatusEffect
    components:
    - type: PressureImmunity
    - type: SpecialPressureImmunity # Pirate: local barotrauma immunity.

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectMutedMutation
  components:
  - type: GeneticsComponentStatusEffect
    components:
    - type: Muted
  - type: StatusEffectAlert
    alert: Muted

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectClumsyMutation
  components:
  - type: GeneticsComponentStatusEffect
    components:
    - type: Clumsy
      catchingFailDamage:
        types:
          Blunt: 1
      gunShootFailDamage:
        types:
          Blunt: 5
          Piercing: 4
          Heat: 3

- type: entity
  parent: MobStatusEffectBase
  id: StatusEffectBlurryVision
  components:
  - type: GeneticsComponentStatusEffect
    components:
    - type: BlurryVision

- type: entity
  parent: MobStatusEffectDebuff
  id: StatusEffectBlindness
  components:
  - type: StatusEffect
    whitelist:
      components:
      - MobState
      - Blindable
      requireAll: true
  - type: GeneticsComponentStatusEffect
    components:
    - type: TemporaryBlindness
