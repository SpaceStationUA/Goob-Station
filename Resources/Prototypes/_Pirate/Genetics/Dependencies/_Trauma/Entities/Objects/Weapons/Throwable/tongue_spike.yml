- type: entity
  parent: BaseItem
  id: TongueSpike
  name: biomass spike
  description: Hardened biomass, shaped into a spike. Very pointy!
  components:
  - type: Sharp
  - type: Sprite
    sprite: _Pirate/Genetics/Objects/Weapons/Throwable/tonguespike.rsi
    state: icon
  - type: Tool
    qualities:
    - Slicing
    useSound:
      path: /Audio/Items/Culinary/chop.ogg
  - type: EmbeddableProjectile
    offset: -0.2,0
  - type: ThrowingAngle
    angle: -45
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 30 # Pirate: local ballistic damage type; donor damage preserved.
  - type: TriggerOnLand
  - type: EntityEffectOnTrigger
    effects:
    - !type:RevertPolymorph

- type: entity
  parent: TongueSpike
  id: TongueSpikeChem
  name: chem spike
  description: Hardened biomass, shaped into... something.
  components:
  - type: Sprite
    state: chemspike
  - type: DamageOtherOnHit
    damage:
      types:
        Piercing: 5 # Pirate: local ballistic damage type; donor damage preserved.
  - type: ChemTransferProjectile
