# Base objective for all Malf AI objectives
- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseMalfAiObjective
  components:
  - type: Objective
    difficulty: 1
    issuer: objective-issuer-malfai
  - type: RoleRequirement
    roles:
    - MalfAiRole

# Survive (guaranteed via AntagObjectives in the game rule)
- type: entity
  parent: BaseMalfAiObjective
  id: MalfAiSurviveObjective
  name: "ЦІЛЬ: ВИЖИТИ."
  description: "Переконайтеся, що ваше ядро не знищено й не вилучено до кінця раунду."
  components:
  - type: Objective
    icon:
      sprite: Structures/Machines/computers.rsi
      state: computer
  - type: MalfAiSurviveObjective

# Sabotage: Essentially AI DAGD. Blacklists protect if rolled.
- type: entity
  parent: BaseMalfAiObjective
  id: MalfAiDoomsdayObjective
  name: "ЦІЛЬ: ЗАПУСТИТИ ПРОТОКОЛ КІНЦЯ СВІТУ."
  description: "Успішно запустіть протокол кінця світу."
  components:
  - type: Objective
    difficulty: 3
    icon:
      sprite: Structures/Power/apc.rsi
      state: base
  - type: MalfAiSabotageObjective
    sabotageType: Doomsday

# Sabotage: Assassinate a random crew member, shared logic with traitor.
- type: entity
  parent: BaseMalfAiObjective
  id: MalfAiAssassinateObjective
  name: "ЦІЛЬ: ЛІКВІДУВАТИ ЧЛЕНА ЕКІПАЖУ."
  description: "Оберіть випадкового члена екіпажу. Якщо він помре, ціль буде виконано."
  components:
  - type: Objective
    difficulty: 1
    icon:
      sprite: Mobs/Species/Human/parts.rsi
      state: full
  - type: MalfAiSabotageObjective
    sabotageType: Assassinate
  - type: TargetObjective
    title: objective-condition-kill-person-title
  - type: PickRandomPerson

# Sabotage: Protect a crew member, shared logic with traitor.
- type: entity
  parent: BaseMalfAiObjective
  id: MalfAiProtectObjective
  name: "ЦІЛЬ: ЗАХИСТИТИ ЧЛЕНА ЕКІПАЖУ."
  description: "Оберіть члена екіпажу та переконайтеся, що він виживе до кінця раунду."
  components:
  - type: Objective
    difficulty: 1
    icon:
      sprite: Mobs/Species/Human/parts.rsi
      state: full
  - type: MalfAiSabotageObjective
    sabotageType: Protect
  - type: TargetObjective
    title: objective-condition-keep-alive-title
  - type: MalfAiPickProtectTarget

# Sabotage: Control cyborgs
- type: entity
  parent: BaseMalfAiObjective
  id: MalfAiControlBorgsObjective
  name: "ЦІЛЬ: КЕРУВАТИ КІБОРГАМИ."
  description: "Візьміть під контроль кіборгів станції та використовуйте їх для досягнення своїх цілей."
  components:
  - type: Objective
    difficulty: 2
    icon:
      sprite: Mobs/Silicon/chassis.rsi
      state: robot
  - type: MalfAiScaleBorgsObjective
    playersPerBorg: 10
    minBorgs: 2
    maxBorgs: 5


# Main objective groups
- type: weightedRandom
  id: MalfAiSabotageObjectives
  weights:
    MalfAiDoomsdayObjective: 0.5
    MalfAiAssassinateObjective: 4
    MalfAiProtectObjective: 3
    MalfAiControlBorgsObjective: 2

- type: weightedRandom
  id: MalfAiSurviveObjectives
  weights:
    MalfAiSurviveObjective: 1

# Individual objective groups (required by the objectives system)
- type: weightedRandom
  id: MalfAiControlBorgsObjective
  weights:
    MalfAiControlBorgsObjective: 1

- type: weightedRandom
  id: MalfAiAssassinateObjective
  weights:
    MalfAiAssassinateObjective: 1

- type: weightedRandom
  id: MalfAiProtectObjective
  weights:
    MalfAiProtectObjective: 1

- type: weightedRandom
  id: MalfAiSurviveObjective
  weights:
    MalfAiSurviveObjective: 1

- type: weightedRandom
  id: MalfAiDoomsdayObjective
  weights:
    MalfAiDoomsdayObjective: 1

# Debug fallback objectives for single-player testing
- type: entity
  parent: BaseMalfAiObjective
  id: MalfAiDebugAssassinateObjective
  name: "ЦІЛЬ: ЛІКВІДУВАТИ ЧЛЕНА ЕКІПАЖУ (НАЛАГОДЖЕННЯ)."
  description: "Версія для налагодження — автоматично виконується для тестування."
  components:
  - type: Objective
    difficulty: 1
    icon:
      sprite: Mobs/Species/Human/parts.rsi
      state: full
  - type: MalfAiSabotageObjective
    sabotageType: Assassinate
  - type: FreeObjective

- type: entity
  parent: BaseMalfAiObjective
  id: MalfAiDebugProtectObjective
  name: "ЦІЛЬ: ЗАХИСТИТИ ЧЛЕНА ЕКІПАЖУ (НАЛАГОДЖЕННЯ)."
  description: "Версія для налагодження — автоматично виконується для тестування."
  components:
  - type: Objective
    difficulty: 1
    icon:
      sprite: Mobs/Species/Human/parts.rsi
      state: full
  - type: MalfAiSabotageObjective
    sabotageType: Protect
  - type: FreeObjective
