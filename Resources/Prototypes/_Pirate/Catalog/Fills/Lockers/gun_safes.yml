# Preserve the upstream locker quantities while changing the weapon selections.
# Double the Garand rifle count because it is weak.

- type: entity
  parent: [GunSafeBaseSecure, BaseSecurityContraband]
  id: GunSafeRifleM16
  name: m16a4 safe
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:NestedSelector
        tableId: FillGunSafeRifleM16

- type: entityTable
  id: FillGunSafeRifleM16
  table: !type:AllSelector
    children:
    - id: WeaponRifleM16
      amount: 2
    - id: MagazineRifleM16
      amount: 4

