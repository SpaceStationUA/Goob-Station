- type: entity
  id: PartAsakim
  parent: [BaseItem, BasePart]
  name: "частина тіла Асакима"
  abstract: true
  components:
  - type: Icon
    sprite: _Pirate/Asakim/Mobs/Species/parts.rsi
    state: full
  - type: BodyPart
    species: Asakim
  - type: Destructible
    thresholds:
    - trigger: !type:DamageTypeTrigger
        damageType: Blunt
        damage: 350
      behaviors:
      - !type:GibPartBehavior
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 3
      - ReagentId: Blood
        Quantity: 10

- type: entity
  id: ChestAsakim
  name: "груди Асакима"
  parent: [PartAsakim, BaseChest]
  components:
  # Pirate: the source RSI has no separate chest and groin states.
  - type: Sprite
    sprite: _Pirate/Asakim/Mobs/Species/parts.rsi
    state: torso_m
  - type: Icon
    state: torso_m
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 10
      - ReagentId: Blood
        Quantity: 20

- type: entity
  id: GroinAsakim
  name: "пах Асакима"
  parent: [PartAsakim, BaseGroin]
