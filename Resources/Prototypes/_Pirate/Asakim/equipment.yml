- type: entity
  parent: [ClothingHeadHardsuitBase, ShowMedicalIcons]
  id: ClothingHelmetHardsuitAsakim
  name: "шолом бойової системи"
  description: "Частина вдосконаленої бойової системи."
  components:
  - type: Sprite
    sprite: _Pirate/Asakim/Clothing/Head/Hardsuits/asakim.rsi
  - type: Clothing
    sprite: _Pirate/Asakim/Clothing/Head/Hardsuits/asakim.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.8
        Slash: 0.8
        Piercing: 0.85
        Heat: 0.8
  - type: FlashImmunity
  - type: EyeProtection
    protectionTime: 15
  - type: ThermalVision
    pulseTime: 1
    isEquipment: true
    toggleAction: PulseThermalVision
  - type: RadarConsole
    maxRange: 1024
    followEntity: true
  - type: ActivatableUI
    key: enum.RadarConsoleUiKey.Key
    singleUser: true
  - type: UserInterface
    interfaces:
      enum.RadarConsoleUiKey.Key:
        type: RadarConsoleBoundUserInterface
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide

- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitAsakim
  name: "бойова система"
  description: "Вдосконалена бойова система. Надзвичайно рідкісна й майже чужинська порівняно із сучасними скафандрами технологія. Після вдягання броня з’єднується з тілом носія, і зняти її можна лише за зовнішньої допомоги."
  suffix: SelfUnremovable
  components:
  - type: Sprite
    sprite: _Pirate/Asakim/Clothing/OuterClothing/Hardsuits/asakim.rsi
  - type: Clothing
    sprite: _Pirate/Asakim/Clothing/OuterClothing/Hardsuits/asakim.rsi
    stripDelay: 60
    equipDelay: 5
  - type: SelfUnremovableClothing
  - type: PressureProtection
    highPressureMultiplier: 0.1
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.35
  - type: FireProtection
    reduction: 0.7
  - type: ProtectedFromStepTriggers
    slots: WITHOUT_POCKET
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 10
    slots: OUTERCLOTHING
  - type: StaticPrice
    price: 50000
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.85
        Piercing: 0.4
        Heat: 0.6
        Radiation: 0
        Shock: 0.8
        Poison: 0.4
        Caustic: 0.4
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    requiredSlot: outerclothing
    clothingPrototypes:
      head: ClothingHelmetHardsuitAsakim
  - type: StaminaResistance
    damageCoefficient: 0.4
  - type: DamageOnUnequip
    unequipDamage:
      types:
        Blunt: 20
        Slash: 30
        Piercing: 40
    unequipSound: /Audio/_Pirate/Effects/breakingbones.ogg
    screamOnUnequip: true

- type: entity
  parent: ClothingOuterHardsuitAsakim
  id: ClothingOuterHardsuitAsakimUnremoveable
  description: "Вдосконалена бойова система. Надзвичайно рідкісна й майже чужинська порівняно із сучасними скафандрами технологія. Цей екземпляр повністю з’єднався з воїном, тому його зняття триватиме дуже довго."
  suffix: 120 stripDelay
  components:
  - type: Clothing
    stripDelay: 120
    equipDelay: 120

- type: entity
  parent: ClothingShoesBootsMagAdv
  id: ClothingShoesBootsMagAsakim
  name: "бойові магнітні черевики"
  description: "Найсучасніші магнітні черевики для використання з удосконаленими бойовими системами."
  components:
  - type: ClothingSlowOnDamageModifier
    modifier: 0.35

- type: entity
  parent: ClothingBackpack
  id: ClothingBackpackAdvancedTactical
  name: "удосконалений тактичний рюкзак"
  description: "Місткий рюкзак із великою кількістю кишень."
  components:
  - type: Sprite
    sprite: Clothing/Back/Backpacks/ertleader.rsi
  - type: Storage
    grid:
    - 0,0,10,3

- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitAsakim
  name: "бойовий комбінезон"
  description: "Зручний і гнучкий комбінезон для носіння під скафандром."
  components:
  - type: Sprite
    sprite: Clothing/Uniforms/Jumpsuit/ninja.rsi
  - type: Clothing
    sprite: Clothing/Uniforms/Jumpsuit/ninja.rsi
