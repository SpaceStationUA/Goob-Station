- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseAsakimObjective
  components:
  - type: Objective
    difficulty: 1
    issuer: objective-issuer-asakim
    icon:
      sprite: _Pirate/Asakim/Objects/Weapons/Melee/hfblade.rsi
      state: icon
  - type: RoleRequirement
    roles:
    - AsakimRole

- type: entity
  parent: BaseAsakimObjective
  id: AsakimKillObjective
  name: ">ЛІКВІДУВАТИ"
  description: "Життєві показники суб’єкта МАЮТЬ досягти нуля. Один раз."
  components:
  - type: Objective
    issuer: objective-issuer-asakim
    unique: false
    icon:
      sprite: Mobs/Ghosts/ghost_human.rsi
      state: icon
  - type: KillPersonCondition
    requireDead: true
  - type: TargetObjective
    title: objective-condition-asakim-terminate-title
  - type: PickRandomPerson
    filters:
    - !type:BodyMindFilter
      whitelist:
        components:
        - CommandStaff
    - !type:ObjectiveImmuneFilter
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
  - type: RerollAfterCompletion
    rerollObjectivePrototype: AsakimKillObjective
    rerollObjectiveMessage: objective-condition-asakim-terminate-reroll-message

- type: entity
  parent: [BaseAsakimObjective, BaseSurviveObjective]
  id: AsakimTheftObjective
  name: ">КОНФІСКУВАТИ"
  description: "Записи вказують, що в цьому секторі можуть бути цінні предмети. Конфіскуйте їх для подальшого дослідження."
  components:
  - type: Objective

- type: entity
  parent: [BaseAsakimObjective, BaseSurviveObjective]
  id: AsakimInfiltrateObjective
  name: ">ПРОНИКНУТИ"
  description: "У місцевому радіоефірі згадуються «зони підвищеної безпеки». Дослідіть такі місця, якщо вони справді існують."
  components:
  - type: Objective

- type: entity
  parent: [BaseAsakimObjective, BaseSurviveObjective]
  id: AsakimInterrogateObjective
  name: ">ДОПИТАТИ"
  description: "УВАГА: виявлено часовий розрив у [ПОМИЛКА] років. Записи можуть бути застарілими. Опитайте місцеве населення."
  components:
  - type: Objective

- type: entity
  parent: [BaseAsakimObjective, BaseSurviveObjective]
  id: AsakimUpgradeObjective
  name: ">ВДОСКОНАЛИТИСЯ"
  description: "Попереднє сканування сектора виявило можливі цінні кібернетичні технології. Вдоскональте своє тіло."
  components:
  - type: Objective

- type: entity
  parent: [BaseAsakimObjective, BaseSurviveObjective]
  id: AsakimAllyObjective
  name: ">ОБ’ЄДНАТИСЯ"
  description: "Попередні записи вказують на можливих осіб, що становлять інтерес у цьому секторі. Знайдіть або здобудьте союзників серед місцевого населення."
  components:
  - type: Objective

- type: weightedRandom
  id: AsakimObjectiveGroup
  weights:
    AsakimObjectiveGroupKill: 1
    AsakimObjectiveGroupTheft: 1
    AsakimObjectiveGroupInfiltrate: 1
    AsakimObjectiveGroupInterrogate: 1
    AsakimObjectiveGroupUpgrade: 1
    AsakimObjectiveGroupAlly: 1

- type: weightedRandom
  id: AsakimObjectiveGroupKill
  weights:
    AsakimKillObjective: 1

- type: weightedRandom
  id: AsakimObjectiveGroupTheft
  weights:
    AsakimTheftObjective: 1

- type: weightedRandom
  id: AsakimObjectiveGroupInfiltrate
  weights:
    AsakimInfiltrateObjective: 1

- type: weightedRandom
  id: AsakimObjectiveGroupInterrogate
  weights:
    AsakimInterrogateObjective: 1

- type: weightedRandom
  id: AsakimObjectiveGroupUpgrade
  weights:
    AsakimUpgradeObjective: 1

- type: weightedRandom
  id: AsakimObjectiveGroupAlly
  weights:
    AsakimAllyObjective: 1
