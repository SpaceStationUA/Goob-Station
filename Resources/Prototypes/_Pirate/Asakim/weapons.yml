- type: entity
  name: plasma autopulser
  parent: [BaseWeaponBattery, BaseGunWieldable]
  id: WeaponRifleAsakimAutopulser
  description: An advanced handheld plasma rifle.
  components:
  - type: Sprite
    sprite: _Pirate/Asakim/Objects/Weapons/Guns/Battery/asakimrifle.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Pirate/Asakim/Objects/Weapons/Guns/Battery/asakimrifle.rsi
  - type: GunWieldBonus
    minAngle: -18
    maxAngle: -14
  - type: Gun
    minAngle: 18
    maxAngle: 26
    fireRate: 6
    burstFireRate: 15
    shotsPerBurst: 3
    selectedMode: FullAuto
    availableModes:
    - Burst
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/ship_svalinn.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: false
  - type: BatteryAmmoProvider
    proto: HandheldAutopulserProjectile
    fireCost: 50
  - type: BatteryWeaponFireModes
    fireModes:
    - proto: HandheldAutopulserProjectile
      fireCost: 50
    - proto: HandheldAutopulserDisablerProjectile
      fireCost: 35
  - type: Appearance
  - type: StaticPrice
    price: 1750
  - type: BatterySelfRecharger
    autoRechargeRate: 30

- type: entity
  id: HandheldAutopulserProjectile
  name: plasma projectile
  parent: BaseBullet
  categories: [HideSpawnMenu]
  components:
  - type: Projectile
    damage:
      types:
        Caustic: 4
        Heat: 6
        Radiation: 4
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/Projectiles/energybolts.rsi
    scale: 0.4, 0.4
    layers:
    - state: medium
      shader: unshaded
  - type: Ammo
    muzzleFlash: MuzzleFlashEffectEnergySmall
  - type: PointLight
    color: "#FF00AA"

- type: entity
  id: HandheldAutopulserDisablerProjectile
  name: disabling plasma projectile
  parent: BulletDisablerSmg
  categories: [HideSpawnMenu]
  components:
  - type: StaminaDamageOnCollide
    damage: 19
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/Projectiles/energybolts.rsi
    scale: 0.4, 0.4
    layers:
    - state: lightstun
      shader: unshaded
  - type: PointLight
    color: "#00a6ff"

- type: entity
  name: high-frequency blade
  parent: Katana
  id: WeaponHFKatana
  description: A high-frequency blade. It is incredibly powerful.
  components:
  - type: Sprite
    sprite: _Pirate/Asakim/Objects/Weapons/Melee/hfblade.rsi
  - type: MeleeWeapon
    attackRate: 1.25
    wideAnimationRotation: -60
    damage:
      types:
        Slash: 19
        Shock: 6
        Structural: 25
  - type: Item
    sprite: _Pirate/Asakim/Objects/Weapons/Melee/hfblade.rsi
  - type: Clothing
    sprite: _Pirate/Asakim/Objects/Weapons/Melee/hfblade.rsi
    slots:
    - Back
    - Belt
    - suitStorage
  - type: Reflect
    reflectProb: 0.15
  - type: DisarmMalus
    malus: 0.9
  - type: StaticPrice
    price: 5000
