- type: antag
  id: Asakim
  name: roles-antag-asakim-name
  objective: roles-antag-asakim-objective
  antagonist: true
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 48h

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleAsakim
  name: Asakim Role
  components:
  - type: MindRole
    roleType: FreeAgent
    subtype: role-subtype-asakim
    antagPrototype: Asakim
    exclusiveAntag: true
  - type: AsakimRole
  - type: RoleBriefing
    briefing: asakim-role-briefing

- type: entity
  categories: [HideSpawnMenu, Spawner]
  parent: BaseAntagSpawner
  id: SpawnPointGhostAsakim
  components:
  - type: GhostRole
    name: ghost-role-information-asakim-name
    description: ghost-role-information-asakim-description
    rules: ghost-role-information-asakim-rules
    mindRoles:
    - MindRoleAsakim

# Kept for administrators who need to spawn a fully equipped warrior directly.
- type: entity
  parent: MobAsakim
  id: MobAsakimGhostrole
  name: asakim warrior
  suffix: Asakim
  components:
  - type: RandomHumanoidAppearance
    randomizeName: true
  - type: Loadout
    prototypes: [AsakimGear]
  - type: GhostRole
    name: ghost-role-information-asakim-name
    description: ghost-role-information-asakim-description
    rules: ghost-role-information-asakim-rules
    raffle:
      settings: default
    mindRoles:
    - MindRoleAsakim
  - type: GhostTakeoverAvailable
  - type: NpcFactionMember
    factions:
    - Syndicate
  - type: SurgerySpeedModifier
    speedModifier: 1.5
