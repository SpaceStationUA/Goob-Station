- type: entity
  id: HitmanCase
  name: "кейс найманого убивці"
  description: "Кейс із професійними інструментами найманого убивці."
  parent: ToolboxThief
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Tools/hitman-case.rsi
    state: icon
  - type: SetSelector
    maxSelectedSets: 2
    possibleSets:
    - HitmanSharpshooterKit
    - HitmanBountyHunterKit
    - HitmanAssassinKit
    - HitmanNinjaKit
    - HitmanPoisonerKit
    - HitmanSaboteurKit
    - HitmanTrackerKit

- type: entity
  id: HitmanBusinessCard
  name: "візитівка найманого убивці"
  description: "Чорна картка з прицілом. На звороті щось написано."
  parent: [Paper, BaseMajorContraband]
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Misc/hitman_card.rsi
    layers:
    - state: hitman_card
    - state: hitman_card
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      sprite: Objects/Misc/bureaucracy.rsi
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    headerImagePath: "/Textures/_Pirate/Interface/Paper/paper_heading_hitman_logo.png"
    headerMargin: 0.0, 0.0, 0.0, 2.0
    backgroundImagePath: "/Textures/_Pirate/Interface/Paper/paper_background_hitman.png"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 4.0, 4.0, 4.0, 4.0
    maxWritableArea: 400.0, 256.0
  - type: Paper
    content: paper-hitman-business-card

- type: entity
  parent: BaseImplantAction
  id: ActionCreateHitmanCard
  name: "Створити візитівку"
  description: "створює візитівку, на якій можна писати"
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 120
    itemIconStyle: BigAction
    priority: -20
    icon:
      sprite: _Pirate/Objects/Misc/hitman_card.rsi
      state: hitman_card

- type: entity
  id: HitmanCardImplanter
  name: "імплантер візитівки"
  parent: BaseImplantOnlyImplanterSyndi
  components:
  - type: Implanter
    implant: HitmanCardImplant

- type: entity
  parent: BaseSubdermalImplant
  id: HitmanCardImplant
  name: "імплант візитівки"
  description: "Дозволяє користувачеві створювати візитівки за бажанням"
  categories: [HideSpawnMenu]
  components:
  - type: SubdermalImplant
    implantAction: ActionCreateHitmanCard
  - type: TriggerOnActivateImplant
  - type: CreateHitmanCardOnTrigger
