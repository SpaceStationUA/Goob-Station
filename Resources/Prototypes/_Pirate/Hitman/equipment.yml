    - Belt
    - suitStorage
  - type: Reflect
    reflectProb: 0.1
  - type: DisarmMalus
    malus: 0.9
  - type: StaticPrice
    price: 3000

- type: entity
  parent: [BaseItem, BaseGunWieldable, BaseSyndicateContraband]
  id: WeaponLeverActionSKL93
  name: SKL93
  description: A modernized variant of the L93, manufactured in limited amounts by Waffle Corp, lightweight materials are used for the furniture. It has an extended barrel and magazine, along side a WZR-4X Scope. Uses .45 Magnum rounds.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/Rifles/skl93.rsi
    layers:
    - state: icon
      map: ["enum.GunVisualLayers.Base"]
  - type: Item
    size: Large
    sprite: _Pirate/Objects/Weapons/Guns/Rifles/skl93.rsi
    shape:
    - 0,0,4,1
  - type: Clothing
    sprite: _Pirate/Objects/Weapons/Guns/Rifles/skl93.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: GunRequiresWield
  - type: Gun
    fireRate: 3
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Pirate/Weapons/Guns/LeverAction/gunshot.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: GunSpreadModifier
    spread: 0.1
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgeMagnum
    capacity: 10
    proto: CartridgeMagnum
    soundInsert:
      path: /Audio/_Pirate/Weapons/Guns/LeverAction/insert.ogg
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 2
    pvsIncrease: 0.3
  - type: StaticPrice
    price: 670

