- type: entity
  parent: Multitool
  id: MultitoolAiDetector
  suffix: AI Detector
  components:
  - type: Sprite
    layers:
    - state: icon
    - state: green-unlit
      shader: unshaded
      map: ["enum.AiDetectorVisuals.Layer"]
  - type: Physics
    canCollide: true
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
      yellow:
        shape: !type:PhysShapeCircle
          radius: 12
        density: 0
        hard: false
        mask:
        - GhostImpassable
      red:
        shape: !type:PhysShapeCircle
          radius: 5
        density: 0
        hard: false
        mask:
        - GhostImpassable
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AiDetectorVisuals.Light:
        enum.AiDetectorVisuals.Layer:
          none: {state: green-unlit}
          yellow: {state: yellow-unlit}
          red: {state: red-unlit}
  - type: AiDetector
    ranges:
    - state: red
      range: 5
    - state: yellow
      range: 12

