    sprite: _Pirate/Objects/Weapons/Melee/mfkatana.rsi
  - type: MeleeWeapon
    attackRate: 1.25
    wideAnimationRotation: -60
    damage:
      types:
        Slash: 19
        Heat: 6
        Structural: 25
  - type: Item
    sprite: _Pirate/Objects/Weapons/Melee/mfkatana.rsi
  - type: Clothing
    sprite: _Pirate/Objects/Weapons/Melee/mfkatana.rsi
    slots:
