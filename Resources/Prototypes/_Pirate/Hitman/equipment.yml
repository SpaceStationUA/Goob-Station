- type: entity
  parent: RemoteSignaller
  id: DeadMansSignaler
  name: dead man's signaler
  description: A device that if armed will send signals to objects within 50 meters when dropped or put away.
  components:
  - type: DeadMansSignaller
  - type: ItemToggle
  - type: Sprite
    drawdepth: Items
    sprite: _Pirate/Objects/Devices/deadmanssignaller.rsi
    layers:
    - state: inactive
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: {state: active}
          False: {state: inactive}
  - type: WirelessNetworkConnection
    range: 50

