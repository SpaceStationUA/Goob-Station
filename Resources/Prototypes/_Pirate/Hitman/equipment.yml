  components:
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/Rifles/skl93.rsi
    layers:
    - state: icon
      map: ["enum.GunVisualLayers.Base"]
  - type: Item
    size: Large
    sprite: _Pirate/Objects/Weapons/Guns/Rifles/skl93.rsi
    shape:
    - 0,0,4,1
  - type: Clothing
    sprite: _Pirate/Objects/Weapons/Guns/Rifles/skl93.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  - type: GunRequiresWield
  - type: Gun
    fireRate: 3
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/_Pirate/Weapons/Guns/LeverAction/gunshot.ogg
    soundEmpty:
      path: /Audio/Weapons/Guns/Empty/empty.ogg
  - type: GunSpreadModifier
    spread: 0.1
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgeMagnum
    capacity: 10
    proto: CartridgeMagnum
    soundInsert:
      path: /Audio/_Pirate/Weapons/Guns/LeverAction/insert.ogg
