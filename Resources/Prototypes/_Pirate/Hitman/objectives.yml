- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseFreeObjective
  components:
  - type: FreeObjective

- type: entity
  parent: BaseObjective
  abstract: true
  id: BaseHitmanObjective
  components:
  - type: Objective
    issuer: objective-issuer-hitman
    difficulty: 1
  - type: RoleRequirement
    roles:
    - HitmanRole

- type: entity
  parent: [BaseHitmanObjective, BaseTeachALessonObjective]
  id: HitmanTeachLessonRandomPersonObjective
  description: objective-hitman-teach-person-description
  components:
  - type: Objective
    difficulty: 1
    unique: true
  - type: TargetObjective
    title: objective-condition-teach-lesson-title
  - type: PickRandomPerson
    filters:
    - !type:ObjectiveImmuneFilter
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
        - TeachALessonCondition
        - TargetObjectiveImmune

- type: entity
  parent: [BaseHitmanObjective, HitmanTeachLessonRandomPersonObjective]
  id: HitmanTeachLessonRandomHeadObjective
  components:
  - type: Objective
    difficulty: 1.5
    unique: true
  - type: PickRandomPerson
    filters:
    - !type:BodyMindFilter
      whitelist:
        components:
        - CommandStaff
    - !type:ObjectiveImmuneFilter
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
        - TeachALessonCondition
        - TargetObjectiveImmune

