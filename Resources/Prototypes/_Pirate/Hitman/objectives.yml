- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseFreeObjective
  components:
  - type: FreeObjective

- type: entity
  parent: BaseObjective
  abstract: true
  id: BaseHitmanObjective
  components:
  - type: Objective
    issuer: objective-issuer-hitman
    difficulty: 1
  - type: RoleRequirement
    roles:
    - HitmanRole

- type: entity
  parent: [BaseHitmanObjective, BaseTeachALessonObjective]
  id: HitmanTeachLessonRandomPersonObjective
  description: "Клієнт хоче смерті цієї особи. Убийте її один раз, щоб виконати контракт"
  components:
  - type: Objective
    difficulty: 1
    unique: true
  - type: TargetObjective
    title: objective-condition-teach-lesson-title
  - type: PickRandomPerson
    filters:
    - !type:ObjectiveImmuneFilter
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
        - TeachALessonCondition
        - TargetObjectiveImmune

- type: entity
  parent: [BaseHitmanObjective, HitmanTeachLessonRandomPersonObjective]
  id: HitmanTeachLessonRandomHeadObjective
  components:
  - type: Objective
    difficulty: 1.5
    unique: true
  - type: PickRandomPerson
    filters:
    - !type:BodyMindFilter
      whitelist:
        components:
        - CommandStaff
    - !type:ObjectiveImmuneFilter
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
        - TeachALessonCondition
        - TargetObjectiveImmune

- type: entity
  parent: [BaseHitmanObjective, BaseLivingObjective]
  id: HitmanEscapeShuttleObjective
  name: "Дістатися ЦентКому живим і не під вартою."
  description: "Ви підготували шлях відступу до ЦентКому. Не дайте себе заарештувати."
  components:
  - type: Objective
    icon:
      sprite: Structures/Furniture/chairs.rsi
      state: shuttle
    difficulty: 1.25
    unique: true
  - type: EscapeShuttleCondition

- type: entity
  parent: [BaseHitmanObjective, BaseSurviveObjective]
  id: HitmanSurviveObjective
  name: "Вижити й підготувати відступ."
  description: "Клієнт виплатить вам усе пізніше, в іншому місці. Постарайтеся не загинути до того часу."
  components:
  - type: Objective
    icon:
      sprite: Structures/Furniture/chairs.rsi
      state: shuttle
    difficulty: 1.25
    unique: true

- type: entity
  parent: [BaseHitmanObjective, BaseFreeObjective]
  id: HitmanNiceObjective
  name: "Убити чемно"
  description: "Клієнт хоче, щоб ви були шанобливими до цілі навіть під час убивства."
  components:
  - type: Objective
    icon:
      sprite: Clothing/Hands/Gloves/Color/color.rsi
      state: icon
    difficulty: 1
    unique: true

- type: entity
  parent: [BaseHitmanObjective, BaseFreeObjective]
  id: HitmanDramaticObjective
  name: "Убити драматично"
  description: "Клієнт хоче перетворити смерть на виставу. Влаштуйте гідне видовище."
  components:
  - type: Objective
    icon:
      sprite: Objects/Fun/Instruments/microphone.rsi
      state: icon
    difficulty: 1.25
    unique: true

- type: entity
  parent: [BaseHitmanObjective, BaseFreeObjective]
  id: HitmanHumorousObjective
  name: "Убити смішно"
  description: "Клієнт хоче перетворити смерть на жарт. Зробіть її кумедною."
  components:
  - type: Objective
    icon:
      sprite: Clothing/Mask/clown.rsi
      state: icon
    difficulty: 1.25
    unique: true

- type: entity
  parent: [BaseHitmanObjective, BaseFreeObjective]
  id: HitmanAccidentObjective
  name: "Замаскувати смерть під нещасний випадок"
  description: "Клієнт не хоче, щоб смерть виглядала як замовне вбивство. Обставте все як нещасний випадок."
  components:
  - type: Objective
    icon:
      sprite: Objects/Tools/rcd.rsi
      state: icon
    difficulty: 2
    unique: true

- type: entity
  parent: [BaseHitmanObjective, BaseFreeObjective]
  id: HitmanIndirectlyObjective
  name: "Убити опосередковано"
  description: "Клієнт не хоче, щоб вас побачили біля тіла. Убийте ціль не власноруч."
  components:
  - type: Objective
    icon:
      sprite: Actions/Implants/implants.rsi
      state: explosive
    difficulty: 2
    unique: true

- type: entity
  parent: [BaseHitmanObjective, BaseFreeObjective]
  id: HitmanCleanObjective
  name: "Убити чисто"
  description: "Клієнт не хоче безладу. Завдайте цілі якомога менше пошкоджень."
  components:
  - type: Objective
    icon:
      sprite: Objects/Specific/Janitorial/soap.rsi
      state: deluxe-4
    difficulty: 1.75
    unique: true

- type: entity
  parent: [BaseHitmanObjective, BaseFreeObjective]
  id: HitmanSufferObjective
  name: "Розтягнути вбивство"
  description: "Клієнт хоче, щоб ціль страждала. Не поспішайте із завершенням."
  components:
  - type: Objective
    icon:
      sprite: Objects/Consumable/Drinks/bloodglass.rsi
      state: icon
    difficulty: 1
    unique: true

- type: entity
  parent: [BaseHitmanObjective, BaseFreeObjective]
  id: HitmanPublicObjective
  name: "Убити в людному місці"
  description: "Клієнт хоче надіслати повідомлення. Убийте ціль публічно, на очах якомога більшої кількості свідків."
  components:
  - type: Objective
    icon:
      sprite: Structures/Wallmounts/screen.rsi
      state: screen
    difficulty: 2
    unique: true

- type: entity
  parent: [BaseHitmanObjective, BaseFreeObjective]
  id: HitmanNoticeObjective
  name: "Заздалегідь попередити про замах"
  description: "Клієнт хоче, щоб ціль знала про неминучу смерть задовго до замаху. Повідомте їй про це заздалегідь."
  components:
  - type: Objective
    icon:
      sprite: _Pirate/Objects/Misc/hitman_card.rsi
      state: hitman_card
    difficulty: 1
    unique: true

- type: entity
  parent: [BaseHitmanObjective, BaseFreeObjective]
  id: HitmanTraumaObjective
  name: "Убити близьку людину цілі й повідомити їй"
  description: "Клієнт хоче зламати ціль морально й фізично. Знайдіть близьку до неї людину, убийте її один раз і переконайтеся, що ціль про це дізналася."
  components:
  - type: Objective
    icon:
      sprite: Mobs/Species/Human/organs.rsi
      state: brain
    difficulty: 1.75
    unique: true

- type: entity
  parent: [BaseHitmanObjective, BaseFreeObjective]
  id: HitmanTrustObjective
  name: "Завоювати довіру цілі"
  description: "Клієнт хоче, щоб ціль відчула зраду під час убивства. Проводьте з нею багато часу."
  components:
  - type: Objective
    icon:
      sprite: Mobs/Species/Human/organs.rsi
      state: heart-off
    difficulty: 1.75
    unique: true
