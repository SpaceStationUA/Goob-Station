# Mantis caster "fusing" graphs (Pirate)
#
# Each graph takes a psionic caster frame (the unloaded base form) and a whitelisted
# anomaly core, and fuses them into a finished caster. Three branches per gun type:
# crypto (silencing), holy (banishing), lethal (piercing).

- type: constructionGraph
  id: MantisCasterPistolFuse
  start: cryptoStart
  graph:
  - node: crypto
    entity: MantisCasterPistolCrypto
  - node: cryptoStart
    edges:
    - to: crypto
      steps:
      - tag: MantisCasterFramePistol
        name: recipe-mantis-caster-frame-name
        icon:
          sprite: _DEN/Objects/Weapons/Guns/Ammunition/Magazine/Battery/Mantis/mantis-pistol-frame.rsi
          state: base
      - component: AnomalyCore
        name: recipe-anomaly-core-name
        icon:
          sprite: Structures/Specific/Anomalies/Cores/gravity_core.rsi
          state: core
        doAfter: 2
  - node: holy
    entity: MantisCasterPistolHoly
  - node: holyStart
    edges:
    - to: holy
      steps:
      - tag: MantisCasterFramePistol
        name: recipe-mantis-caster-frame-name
        icon:
          sprite: _DEN/Objects/Weapons/Guns/Ammunition/Magazine/Battery/Mantis/mantis-pistol-frame.rsi
          state: base
      - component: AnomalyCore
        name: recipe-anomaly-core-name
        icon:
          sprite: Structures/Specific/Anomalies/Cores/gravity_core.rsi
          state: core
        doAfter: 2
  - node: lethal
    entity: MantisCasterPistolLethal
  - node: lethalStart
    edges:
    - to: lethal
      steps:
      - tag: MantisCasterFramePistol
        name: recipe-mantis-caster-frame-name
        icon:
          sprite: _DEN/Objects/Weapons/Guns/Ammunition/Magazine/Battery/Mantis/mantis-pistol-frame.rsi
          state: base
      - component: AnomalyCore
        name: recipe-anomaly-core-name
        icon:
          sprite: Structures/Specific/Anomalies/Cores/gravity_core.rsi
          state: core
        doAfter: 2

