# Construction graphs for the HFR parts. These exist so the multipart
# machine can match anchored, completed parts; each part is assembled by
# screwing it into place and removed by prying it back off.

- type: constructionGraph
  id: HFRFuelInputPart
  start: start
  graph:
    - node: start
      entity: HFRFuelInputPartUnfinished
      edges:
        - to: completed
          conditions:
            - !type:EntityAnchored {}
          steps:
            - tool: Screwing
              doAfter: 0.5
    - node: completed
      entity: HFRFuelInputPart
      edges:
        - to: start
          conditions:
            - !type:EntityAnchored { }
          steps:
            - tool: Prying
              doAfter: 0.5

