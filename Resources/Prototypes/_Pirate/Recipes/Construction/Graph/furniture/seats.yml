- type: constructionGraph
  id: TPSeat
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: barbellchair
          steps:
            - material: Steel
              amount: 2
              doAfter: 1

    - node: barbellchair
      entity: BarbellChair
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: SheetSteel1
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 2

