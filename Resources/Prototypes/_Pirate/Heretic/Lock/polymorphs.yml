- type: polymorph
  id: ShatteredRisen
  configuration:
    entity: MobShattered
    forced: true
    transferName: true
    transferDamage: false
    revertOnCrit: false
    revertOnDeath: false
    transferHumanoidAppearance: false
    inventory: Drop
    allowRepeatedMorphs: true

- type: polymorph
  id: ShapeshiftStalkerLock
  configuration:
    entity: MobGhoulStalkerLock
    transferName: true
    transferDamage: true
    revertOnCrit: true
    revertOnDeath: true
    skipRevertConfirmation: true
    allowRepeatedMorphs: true
    componentsToTransfer:
    - component: LanguageKnowledge
    - component: LanguageSpeaker
    - component: Grammar

