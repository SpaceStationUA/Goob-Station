- type: entity
  parent: BaseAction
  id: ActionHereticBurglarsFinesse
  name: knowledge-path-lock-s7-name
  description: knowledge-path-lock-s7-desc
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    predicted: false
    useDelay: 15
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Heretic/abilities_heretic.rsi
      state: bulglar_finesse
  - type: TargetAction
    checkCanAccess: false
    range: 6
  - type: EntityTargetAction
    whitelist:
      components:
      - Inventory
    canTargetSelf: false
    event: !type:EventHereticBulglarFinesse
  - type: HereticAction
    requireMagicItem: true
  - type: SpeakOnAction
    sentence: heretic-speech-bulglar-finesse

- type: entity
  parent: BaseAction
  id: ActionHereticLastRefuge
  name: knowledge-path-lock-s9-name
  description: knowledge-path-lock-s9-desc
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    checkCanInteract: false
    useDelay: 6
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Heretic/abilities_heretic.rsi
      state: last_refuge
  - type: InstantAction
    event: !type:EventHereticCloak
      status: LastRefugeStatusEffect
  - type: HereticAction
    requireMagicItem: true
  - type: LastRefugeAction

- type: entity
  parent: BaseAction
  id: ActionHereticShapeshiftLock
  name: heretic-ability-shapeshift
  description: heretic-ability-shapeshift-desc
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: NoItem
    icon:
      sprite: _Goobstation/Heretic/abilities_heretic.rsi
      state: shapeshift
  - type: InstantAction
    event: !type:EventHereticShapeshift
  - type: ShapeshiftAction
    polymorphs:
    - ShapeshiftStalkerLock
    - ShapeshiftProphetLock
    - ShapeshiftMaidLock
    - ShapeshiftFireSharkLock
    - ShapeshiftRustWalkerLock
    - ShapeshiftShatteredLock
  - type: UserInterface
    interfaces:
      enum.HereticShapeshiftUiKey.Key:
        type: HereticShapeshiftBoundUserInterface
        requireInputValidation: false
        interactionRange: -1
  - type: HereticAction

- type: entity
  parent: ActionHereticRustCharge
  id: ActionHereticRustChargeShort
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
  - type: WorldTargetAction
    event: !type:EventHereticRustCharge
      distance: 3
