- type: entity
  id: WallLabyrinth
  name: labyrinth pages
  description: A field of papers flying in the air, repulsing heathens with impossible force.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: TimedDespawn
    lifetime: 15
  - type: Tag
    tags:
    - Wall
    - Holosign
    - BlockLightning
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape: !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - SpecialWallLayer
        layer:
        - SpecialWallLayer
        hard: false
  - type: Airtight
  - type: Sprite
    sprite: _Pirate/Heretic/Entities/paper_wall.rsi
    layers:
    - state: icon
  - type: Icon
    sprite: _Pirate/Heretic/Entities/paper_wall.rsi
    state: icon
  - type: RustRequiresPathStage
    pathStage: 11
  - type: LabyrinthWall
  - type: ContainmentField
    throwForce: 50
  - type: Clickable

- type: entity
  id: RealityCrack
  name: crack in reality
  description: A crack in space, impossibly deep and painful to the eyes. Definitely not safe.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Pirate/Heretic/Effects/lock_effects.rsi
    layers:
    - state: realitycrack
    drawdepth: OverMobs
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        layer:
        - HighImpassable
        - MidImpassable
        - LowImpassable
        hard: false
  - type: Physics
    bodyType: Static
  - type: Tag
    tags:
    - HideContextMenu
  - type: LockPortal
  - type: Clickable

- type: entity
  id: LabyrinthTear
  name: ???
  description: It stares back. There's no reason to remain. Run.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    scale: 3, 3
    drawdepth: HighFloorObjects
    sprite: _Pirate/Heretic/Effects/lock_effects.rsi
    state: bhole3
  - type: PointLight
    enabled: true
    radius: 20
    energy: 2
    color: "#53277e"
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 1.5
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: LabyrinthPortal
  - type: Tag
    tags:
    - ForceHereticMinion
  - type: TileEntityEffect
    effects:
    - !type:GenericStatusEffect
      key: TemporaryBlindness
      component: TemporaryBlindness
      type: Update
      time: 20
      conditions:
      - !type:HasComponentCondition
        checkMind: true
        inverted: true
        components:
        - type: Heretic
        - type: Ghoul
        guidebookComponentName: reagent-comp-condition-heretic-or-ghoul
