- type: entity
  parent: [SimpleSpaceMobBase, FlyingMobBase, MobCombat, BaseMobHereticLockForm]
  id: MobGhoulFireSharkLock
  name: empowered fire shark
  components:
  - type: Sprite
    sprite: _Goobstation/Heretic/eldritch_mobs.rsi
    state: fire_shark
  - type: MovementSpeedModifier
    baseWalkSpeed: 7
    baseSprintSpeed: 7
  - type: IgniteOnMeleeHit
    fireStacks: 4
  - type: MeleeWeapon
    altDisarm: false
    angle: 0
    animation: WeaponArcBite
    soundHit:
      path: /Audio/Effects/bite.ogg
    damage:
      types:
        Heat: 8
        Slash: 8
        Piercing: 8
  - type: Flammable
    canResistFire: false
    damage:
      types:
        Heat: 0
  - type: TemperatureDamage
    heatDamage:
      types:
        Heat: 0
  - type: PointLight
    radius: 3
    energy: 3
    color: "#ff8227"
  - type: Damageable
    damageModifierSet: FireShark
  - type: MobThresholds
    thresholds:
      0: Alive
      80: Critical
      90: Dead
  - type: NpcFactionMember
    factions:
    - Heretic

- type: entity
  parent: [SimpleSpaceMobBase, MobCombat, BaseMobHereticLockForm]
  id: MobGhoulRustWalkerLock
  name: empowered rust walker
  components:
  - type: Sprite
    sprite: _Goobstation/Heretic/eldritch_mobs.rsi
    layers:
    - map: [ "movement" ]
      state: rust_walker
  - type: SpriteMovement
    movementLayers:
      movement:
        state: rust_walker-move
    noMovementLayers:
      movement:
        state: rust_walker
  - type: LeechingWalk
  - type: MeleeWeapon
    soundHit:
      collection: MetalThud
    damage:
      types:
        Blunt: 25
        Ion: 25
        Structural: 200
  - type: Damageable
    damageContainer: Inorganic
  - type: MobThresholds
    thresholds:
      0: Alive
      150: Critical
      160: Dead
  - type: RustObjectsInRadius
    rustStrength: -1
    rustRadius: 3
  - type: ActionGrant
    actions:
    - ActionHereticRustChargeShort
  - type: NoSlip
  - type: Insulated
  - type: FlashImmunity
  - type: NpcFactionMember
    factions:
    - Heretic
