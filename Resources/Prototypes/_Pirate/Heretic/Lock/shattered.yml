    RArm: MobShatteredRArm
    LHand: MobShatteredLHand
    RHand: MobShatteredRHand
    LLeg: MobShatteredLLeg
    RLeg: MobShatteredRLeg
    LFoot: MobShatteredLFoot
    RFoot: MobShatteredRFoot

