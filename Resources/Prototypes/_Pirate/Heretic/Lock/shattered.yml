- type: body
  id: Shattered
  name: shattered
  root: chest
  slots:
    head:
      part: HeadShattered
      connections:
      - chest
      organs:
        brain: OrganHumanBrain
    chest:
      part: ChestShattered
      connections:
      - groin
      - right arm
      - left arm
      - head
    groin:
      part: GroinShattered
      connections:
      - right leg
      - left leg
    right arm:
      part: RightArmShattered
      connections:
      - right hand
    left arm:
      part: LeftArmShattered
      connections:
      - left hand
    right hand:
      part: RightHandShattered
    left hand:
      part: LeftHandShattered
    right leg:
      part: RightLegShattered
      connections:
      - right foot
    left leg:
      part: LeftLegShattered
      connections:
      - left foot
    right foot:
      part: RightFootShattered
    left foot:
      part: LeftFootShattered

- type: species
  id: Shattered
  name: species-name-shattered
  roundStart: false
  prototype: MobShattered
  sprites: MobShatteredSprites
  markingLimits: MobHumanMarkingLimits
  dollPrototype: MobShatteredDummy
  skinColoration: TintedHues
  knowledge: Human

