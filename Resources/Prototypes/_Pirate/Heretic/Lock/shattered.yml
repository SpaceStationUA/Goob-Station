- type: entity
  save: false
  parent:
  - BaseMobSpecies
  - MobAtmosStandard
  - MobFlammable
  id: MobShattered
  name: shattered risen
  components:
  - type: HumanoidAppearance
    species: Shattered
  - type: Icon
    sprite: _Pirate/Heretic/Mobs/Shattered/parts.rsi
    state: torso
  - type: Body
    prototype: Shattered
    requiredLegs: 2
  - type: Damageable
    damageContainer: Biological
  - type: MeleeWeapon
    soundHit:
      collection: GlassBreak
    animation: WeaponArcSmash
    damage:
      types:
        Slash: 8
        Piercing: 7
  - type: PassiveDamage
    splitBehavior: SplitEnsureAll
    allowedStates:
    - Alive
    damage:
      types:
        Blunt: -2
        Slash: -2
        Piercing: -2
        Heat: -2
        Cold: -2
        Shock: -2
        Asphyxiation: -2
        Bloodloss: -2
        Caustic: -2
        Poison: -2
        Radiation: -2
        Cellular: -2
        Holy: -2
  - type: PressureImmunity
  - type: NightVision
    color: "#177698"
    activateSound: null
    deactivateSound: null
  - type: ZombieImmune
  - type: MobThresholds
    thresholds:
      0: Alive
      250: Critical
      260: Dead
  - type: ShatteredRisen
  - type: NpcFactionMember
    factions:
    - Heretic
  - type: RangedDamageSound
    soundGroups:
      Brute:
        collection: GlassBreak
    soundTypes:
      Heat:
        collection: MeatLaserImpact
  - type: FootstepModifier
    footstepSoundCollection:
      path: /Audio/Effects/glass_step.ogg
      params:
        variation: 0.09
        volume: -8
  - type: Insulated
  - type: FlashImmunity
  - type: FlashSoundSuppression
    protectionRange: 0
  - type: CollectiveMind
    defaultChannel: MansusLink
    channels:
    - MansusLink

- type: entity
  parent: BaseSpeciesDummy
  id: MobShatteredDummy
  categories: [ HideSpawnMenu ]
  components:
  - type: HumanoidAppearance
    species: Shattered
