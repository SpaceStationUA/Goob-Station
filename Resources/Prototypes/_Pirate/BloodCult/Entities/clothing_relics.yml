- type: entity
  id: ClothingOuterBloodCultArmor
  parent: [ ClothingOuterHardsuitBase, BaseBloodCultContraband ]
  name: "загартована броня Нар'Сі"
  description: "Важкий герметичний обладунок воїнів Нар'Сі, придатний для відкритого космосу."
  components:
  - type: Sprite
    sprite: _Pirate/BloodCult/Clothing/OuterClothing/Hardsuits/blood_cult_armor.rsi
  - type: Clothing
    sprite: _Pirate/BloodCult/Clothing/OuterClothing/Hardsuits/blood_cult_armor.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.6
        Piercing: 0.6
        Heat: 0.7
        Caustic: 0.2
        Radiation: 0.2
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHelmetBloodCultArmor
  - type: BloodCultItem

- type: entity
  id: ClothingHeadHelmetBloodCultArmor
  parent: [ ClothingHeadHardsuitBase, BaseBloodCultContraband ]
  categories: [ HideSpawnMenu ]
  name: "загартований шолом Нар'Сі"
  description: "Герметичний шолом до загартованої броні культу."
  components:
  - type: BreathMask
  - type: Sprite
    sprite: _Pirate/BloodCult/Clothing/Head/Hardsuits/blood_cult_helmet.rsi
  - type: Clothing
    sprite: _Pirate/BloodCult/Clothing/Head/Hardsuits/blood_cult_helmet.rsi
    equipSound: /Audio/Effects/rustle1.ogg
    unequipSound: /Audio/Effects/rustle2.ogg
  - type: PressureProtection
    highPressureMultiplier: 0.08
    lowPressureMultiplier: 1000
  - type: BloodCultItem

- type: entity
  id: ClothingOuterRobesBloodCultFlagellant
  parent: [ ClothingOuterBaseToggleable, BaseBloodCultContraband ]
  name: "роба флагелянта"
  description: "Просочена кров'ю роба, що надає неприродної швидкості ціною значно тяжчих поранень."
  components:
  - type: Sprite
    sprite: _Pirate/BloodCult/Clothing/OuterClothing/Misc/blood_cult_robe.rsi
  - type: Clothing
    sprite: _Pirate/BloodCult/Clothing/OuterClothing/Misc/blood_cult_robe.rsi
  - type: ClothingSpeedModifier
    walkModifier: 1.25
    sprintModifier: 1.25
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 1.4
        Slash: 1.4
        Piercing: 1.4
        Heat: 1.4
  - type: ToggleableClothing
    clothingPrototype: ClothingHeadHatHoodBloodCultFlagellant
  - type: BloodCultItem

- type: entity
  id: ClothingHeadHatHoodBloodCultFlagellant
  parent: [ ClothingHeadBase, BaseBloodCultContraband ]
  categories: [ HideSpawnMenu ]
  name: "каптур флагелянта"
  description: "Просочений кров'ю каптур, насичений темною магією."
  components:
  - type: Sprite
    sprite: _Pirate/BloodCult/Clothing/Head/Hoods/blood_cult_hood.rsi
  - type: Clothing
    sprite: _Pirate/BloodCult/Clothing/Head/Hoods/blood_cult_hood.rsi
    equipSound: /Audio/Effects/rustle1.ogg
    unequipSound: /Audio/Effects/rustle2.ogg
  - type: HideLayerClothing
    slots:
    - Hair
  - type: BloodCultItem

- type: entity
  id: ClothingEyeBloodCultBlindfold
  parent: [ ClothingEyesBase, BaseBloodCultContraband ]
  name: "пов'язка ревнителя"
  description: "Нехай Нар'Сі веде вас крізь темряву та захищає від світла."
  components:
  - type: Sprite
    sprite: Clothing/Eyes/Misc/blindfold.rsi
    state: icon
  - type: Clothing
    sprite: Clothing/Eyes/Misc/blindfold.rsi
  - type: FlashImmunity
  - type: EyeProtection
  - type: NightVision
    isActive: true
    isEquipment: true
    toggleAction: null
    activateSound: null
    deactivateSound: null
    color: White
  - type: ShowHealthBars
    damageContainers:
    - Biological
    - Inorganic
  - type: ShowHealthIcons
    damageContainers:
    - Biological
  - type: BloodCultItem
