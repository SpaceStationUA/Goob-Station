- type: entity
  id: ActionBloodCultPhaseShift
  parent: BaseAction
  name: "Фазовий зсув"
  description: "Прослизніть за завісу, щоб ненадовго проходити крізь стіни й атаки."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    icon:
      sprite: _Pirate/BloodCult/Interface/Actions/blood_cult.rsi
      state: phase_shift
  - type: InstantAction
    event: !type:BloodCultPhaseShiftActionEvent
      duration: 10

- type: entity
  id: ActionBloodCultSummonFloor
  parent: BaseAction
  name: "Створити підлогу культу"
  description: "Перетворіть вибрану ділянку підлоги на поверхню культу крові."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    icon:
      sprite: _Pirate/BloodCult/Interface/Actions/blood_cult.rsi
      state: create_cult_floor
  - type: TargetAction
    checkCanAccess: false
    range: 5
  - type: WorldTargetAction
    event: !type:PlaceTileEntityEvent
      entity: BloodCultTileSpawnEffect
      tileId: BloodCultFloor
      audio: !type:SoundPathSpecifier
        path: /Audio/_Pirate/BloodCult/curse.ogg

- type: entity
  id: ActionBloodCultSummonWall
  parent: BaseAction
  name: "Мале будівництво"
  description: "Підніміть у вибраному місці стіну культу."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 20
    itemIconStyle: BigAction
    icon:
      sprite: _Pirate/BloodCult/Interface/Actions/blood_cult.rsi
      state: lesser_construct
  - type: TargetAction
    checkCanAccess: false
    range: 5
  - type: WorldTargetAction
    event: !type:PlaceTileEntityEvent
      entity: BloodCultWallSpawnEffect
      length: 2
      audio: !type:SoundPathSpecifier
        path: /Audio/_Pirate/BloodCult/curse.ogg
      blockedCollisionMask:
      - FullTileMask
      blockedCollisionLayer:
      - WallLayer

- type: entity
  id: ActionBloodCultSummonDoor
  parent: BaseAction
  name: "Створити двері культу"
  description: "Підніміть у вибраному місці рунічні двері."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    icon:
      sprite: _Pirate/BloodCult/Interface/Actions/blood_cult.rsi
      state: lesser_construct
  - type: TargetAction
    checkCanAccess: false
    range: 5
  - type: WorldTargetAction
    event: !type:PlaceTileEntityEvent
      entity: BloodCultDoorSpawnEffect
      audio: !type:SoundPathSpecifier
        path: /Audio/_Pirate/BloodCult/curse.ogg
      blockedCollisionMask:
      - FullTileMask
      blockedCollisionLayer:
      - WallLayer

- type: entity
  id: ActionBloodCultSummonSoulStone
  parent: BaseAction
  name: "Створити камінь душі"
  description: "Простягніть волю крізь завісу й створіть камінь для добровільної душі."
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    icon:
      sprite: _Pirate/BloodCult/Interface/Actions/blood_cult.rsi
      state: create_soul_stone
  - type: TargetAction
    checkCanAccess: false
    range: 5
  - type: WorldTargetAction
    event: !type:PlaceTileEntityEvent
      entity: CultSoulStoneGhost
      audio: !type:SoundPathSpecifier
        path: /Audio/_Pirate/BloodCult/curse.ogg
