# SPDX-License-Identifier: MIT

- type: body
  id: Experiment
  name: "experiment"
  root: torso
  slots:
    head:
      part: HeadExperiment
      connections:
      - torso
      organs:
        brain: OrganHumanBrain
        eyes: OrganExperimentEyes
        tongue: OrganExperimentTongue
        brain_implant: BrainImplantExpiScan
    torso:
      part: TorsoExperiment
      connections:
      - groin
      - right arm
      - left arm
      organs:
        heart: OrganExperimentHeart
        lungs: OrganHumanLungs
    groin:
      part: GroinExperiment
      connections:
      - right leg
      - left leg
      organs:
        stomach: OrganExperimentStomach
        liver:  OrganExperimentLiver
        kidneys: OrganHumanKidneys
    right arm:
      part: RightArmExperiment
      connections:
      - right hand
    left arm:
      part: LeftArmExperiment
      connections:
      - left hand
    right hand:
      part: RightHandExperiment
    left hand:
      part: LeftHandExperiment
    right leg:
      part: RightLegExperiment
      connections:
      - right foot
    left leg:
      part: LeftLegExperiment
      connections:
      - left foot
    right foot:
      part: RightFootExperiment
    left foot:
      part: LeftFootExperiment
