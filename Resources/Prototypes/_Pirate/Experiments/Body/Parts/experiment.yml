- type: entity
  id: PartExperiment
  parent: [BaseItem, BasePart] # Pirate: native base supplies wound and bone containers.
  name: "experiment body part"
  abstract: true
  components:
  - type: Damageable
    damageContainer: Biological
  - type: BodyPart
    species: Experiment
  - type: StaticPrice
    price: 100
  - type: Tag
    tags:
      - Trash
  - type: Extractable
    juiceSolution:
      reagents:
      - ReagentId: Fat
        Quantity: 1
      - ReagentId: Blood
        Quantity: 5

- type: entity
  id: TorsoExperiment
  name: "experiment torso"
  parent: [PartExperiment, BaseChest] # Pirate: Starlight torso maps to the local chest.
  components:
    - type: Sprite
      sprite: _Pirate/Experiments/Mobs/Species/Experiment/parts.rsi
      state: "torso"
    - type: Icon
      sprite: _Pirate/Experiments/Mobs/Species/Experiment/parts.rsi
      state: "torso"
    - type: BodyPart
      partType: Chest
    # Pirate: native wound visuals own these layers instead of the conflicting DamageVisuals.
    - type: WoundableVisuals
      thresholds: [ 10, 30, 50, 70, 100 ]
      occupiedLayer: Chest
      damageOverlayGroups:
        Brute:
          sprite: _Pirate/Experiments/Mobs/Effects/Experiment/brute_damage.rsi
          color: "#ffbb00"
        Burn:
          sprite: _Pirate/Experiments/Mobs/Effects/Experiment/burn_damage.rsi
    - type: Extractable
      juiceSolution:
        reagents:
        - ReagentId: Fat
          Quantity: 1
        - ReagentId: Blood
          Quantity: 5

- type: entity
  id: GroinExperiment
  name: "experiment groin"
  parent: [PartExperiment, BaseGroin]
  components:
    # Pirate: the source species has a single torso sprite, also used for the groin.
    - type: Sprite
      sprite: _Pirate/Experiments/Mobs/Species/Experiment/parts.rsi
      state: "torso"
    - type: Icon
      sprite: _Pirate/Experiments/Mobs/Species/Experiment/parts.rsi
      state: "torso"

