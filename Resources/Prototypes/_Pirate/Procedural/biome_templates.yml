# Backrooms: only Level 0 (FloorBackroom + WallBackrooms).

- type: biomeTemplate
  id: backrooms
  layers:
  - !type:BiomeMetaLayer
    template: BackroomsLevel0
    threshold: -1

# Classic Level 0 - FloorBackroom + WallBackrooms, rectilinear corridors
