- type: entity
  parent: DeathRattleImplant
  id: DeathRattleImplantInterdyne
  name: "Імплант сповіщення"
  description: "Сповіщує про смерть робітника."
  categories: [ HideSpawnMenu ]
  components:
  - type: RattleOnTrigger
    radioChannel: InterdynePrivat

- type: entity
  parent: BaseSubdermalImplant
  id: K9IDCardImplant
  categories: [HideSpawnMenu]
  name: "ID-імплант K9"
  description: "Підшкірний імплант із попередньо завантаженою ID-карткою."
  components:
  - type: SubdermalImplant
    whitelist:
      tags:
      - K9
  - type: ContainerContainer
    containers:
      subdermalIdCard: !type:Container { }
  - type: SubdermalIdCard
    idCardProto: K9OfficerIDCard
    
- type: entity
  parent: BaseSubdermalImplant
  id: RadioImplantInterdyne
  name: "Радіоімплант Interdyne"
  description: "Цей імплант дає можливість говорити у канали Interdyne без гарнітури."
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
  - type: RadioImplant
    radioChannels:
    - InterdynePrivat
    - Interdyne

# Cybersun counterpart of the Lavaland "Last Breath" implant. Reports only over the Cybersun
# channel, transmitted from that channel's telecom server, so it always reaches the Cybersun base
# wherever that base happens to be.
- type: entity
  parent: BaseSubdermalImplant
  id: DeathRattleImplantCybersun
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    permanent: true
    whitelist:
      components:
      - MobState
  - type: MansusGraspBlockTrigger
  - type: TriggerOnMobstateChange
    mobState:
    - Critical
    - Dead
  - type: RemoteRattleOnTrigger
    radioChannel: Cybersun
    targetUser: true
    reportCoordinates: true
    messages:
      Critical: cybersun-deathrattle-implant-critical-message
      Dead: cybersun-deathrattle-implant-dead-message
