- type: entity
  parent: BaseSubdermalImplant
  id: RevolutionaryLieutenantImplant
  name: revolutionary lieutenant implant
  description: Appoints a revolutionary as a lieutenant and grants access to the leadership radio channel.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    whitelist:
      components:
      - Revolutionary
    blacklist:
      components:
      - HeadRevolutionary
      - MindShield
      - RevolutionaryLieutenant
  - type: RevolutionaryLieutenant
  - type: RadioImplant
    radioChannels:
    - Syndicate

- type: entity
  parent: BaseImplantOnlyImplanterSyndi
  id: LieutenantRevolutionaryImplanter
  name: revolutionary lieutenant implanter
  description: A single-use implanter used to appoint a revolutionary lieutenant.
  components:
  - type: Implanter
    implant: RevolutionaryLieutenantImplant
