- type: entity
  parent: BaseSubdermalImplant
  id: RevolutionaryLieutenantImplant
  name: "імплант революційного лейтенанта"
  description: "Призначає революціонера лейтенантом і підключає його до захищеного каналу керівництва."
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    whitelist:
      components:
      - Revolutionary
    blacklist:
      components:
      - HeadRevolutionary
      - MindShield
      - RevolutionaryLieutenant
  - type: RevolutionaryLieutenant
  - type: RadioImplant
    radioChannels:
    - Syndicate

- type: entity
  parent: BaseImplantOnlyImplanterSyndi
  id: LieutenantRevolutionaryImplanter
  name: "імплантер революційного лейтенанта"
  description: "Одноразовий імплантер для призначення лейтенанта революції."
  components:
  - type: Implanter
    implant: RevolutionaryLieutenantImplant
