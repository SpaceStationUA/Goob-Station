- type: entity
  abstract: true
  parent: FloorTileItemBase
  id: FloorTileItemGlassBase
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Tiles/glass_tiles.rsi
  - type: Item
    sprite: _Pirate/Objects/Tiles/glass_tiles.rsi
    heldPrefix: glass

- type: entity
  parent: FloorTileItemGlassBase
  id: FloorTileItemGlass
  name: glass floor tile
  description: A see-through glass floor tile.
  components:
  - type: Sprite
    state: glass-old
  - type: FloorTile
    outputs:
    - Plating
    - FloorGlass
  - type: Stack
    stackType: FloorTileGlass
  - type: Construction
    graph: TileGlass
    node: tile
  - type: PhysicalComposition
    materialComposition:
      Glass: 25

