- type: entity
  id: Diary
  parent: BookBase
  name: щоденник
  description: Особистий щоденник для записів, думок та спогадів. Написане в ньому зберігається між змінами.
  components:
  - type: Sprite
    sprite: Objects/Misc/books.rsi
    layers:
    - state: paper
    - state: cover_base
      color: "#4a1f3d"
    - state: decor_wingette_circle
      color: "#8a5a7a"
    - state: icon_text
    - state: overlay_null
  # Pirate: persistent text (diaries) - a stamp would make the diary unwritable forever
  - type: NoStamping
  - type: Paper
    contentSize: 20000
  # Pirate: persistent diary pages - the diary reads like a book: flip it leaf by leaf,
  # add or tear out leaves and sign each one separately
  - type: PaperPages
  # Pirate: chameleon-style cover - right-click to pick a look from ordinary books
  - type: BookSkin
  # Redeclared: prototype inheritance replaces the whole interface list, so the paper UI
  # has to be listed again next to the cover menu.
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: PaperBoundUserInterface
      enum.BookSkinUiKey.Key:
        type: BookSkinBoundUserInterface

- type: entity
  id: DiaryLoadout
  parent: Diary
  suffix: loadout
  components:
  - type: PersistentText
    ownerKind: profile
    storageKey: diary
    supportCharacterName: true
    appendOwnerName: true
