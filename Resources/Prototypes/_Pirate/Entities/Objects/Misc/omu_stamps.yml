# Ported from ProjectOmu/OmuStation #2180 and its stamp dependencies.

- type: entity
  name: IA rubber stamp
  parent: [RubberStampBase, BaseCentcommContraband] # Pirate: source contraband classification.
  id: RubberStampNTAgent
  suffix: DO NOT MAP
  description: A rubber stamp for stamping important documents. For internal related affairs.
  components:
  - type: Stamp
    stampedName: stamp-component-stamped-name-NTAgent
    stampedColor: "#000080"
    stampState: "paper_stamp-cap"
