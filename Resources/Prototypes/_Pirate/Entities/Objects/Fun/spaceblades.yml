- type: entity
  id: SpaceBladeBoxTrash
  parent: BaseItem
  name: unfolded space blade box
  description: A small, unfolded cardboard toy box.
  components:
  - type: PhysicalComposition
    materialComposition:
      Cardboard: 50
  - type: Sprite
    sprite: _Pirate/Objects/Fun/spaceblade.rsi
    state: sb_box_unfolded
  - type: Tag
    tags:
    - Trash
  - type: SpaceGarbage

- type: entity
  id: MysterySpaceBladeBox
  parent: BaseItem
  name: mystery space blade box
  description: A box containing a mystery space blade. The side depicts a few blacked-out rare space blades.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Fun/spaceblade.rsi
    state: sb_box
    scale: 0.65, 0.65
  - type: StaticPrice
    price: 160
  - type: SpawnItemsOnUse
    sound:
      path: /Audio/Effects/unwrap.ogg
    items:
    - id: SpaceBladeBoxTrash
    - id: SpaceBladeRedOrange
      orGroup: SpaceBlade
    - id: SpaceBladeBlue
      orGroup: SpaceBlade
    - id: SpaceBladeFrontier
      orGroup: SpaceBlade
    - id: SpaceBladeGoldBlue
      orGroup: SpaceBlade
    - id: SpaceBladeMail
      orGroup: SpaceBlade
    - id: SpaceBladeEyeball
      orGroup: SpaceBlade
    - id: SpaceBladeBlade
      orGroup: SpaceBlade
    - id: SpaceBladeCheck
      orGroup: SpaceBlade
      prob: 0.2
    - id: SpaceBladeRune
      orGroup: SpaceBlade
      prob: 0.2
    - id: SpaceBladeMoff
      orGroup: SpaceBlade
      prob: 0.2
    - id: SpaceBladePizza
      orGroup: SpaceBlade
      prob: 0.2
    - id: SpaceBladeWeh
      orGroup: SpaceBlade
      prob: 0.2
    - id: SpaceBladeBros
      orGroup: SpaceBlade
      prob: 0.2
    - id: SpaceBladeGay
      orGroup: SpaceBlade
      prob: 0.2
    - id: SpaceBladeRatKing
      orGroup: SpaceBlade
      prob: 0.2
    - id: SpaceBladeClown
      orGroup: SpaceBlade
      prob: 0.1
    - id: SpaceBladeTesla
      orGroup: SpaceBlade
      prob: 0.1
    - id: SpaceBladeSingularity
      orGroup: SpaceBlade
      prob: 0.1
