- type: construction
  id: SpawnBilliardTriangle
  name: construction-billiard-pyramid
  description: construction-billiard-pyramid-description
  graph: BilliardTriangleGraph
  startNode: start
  targetNode: triangle
  category: construction-category-misc
  objectType: Structure
  placementMode: PlaceFree

- type: construction
  id: SpawnBilliardAmericanPool
  name: construction-billiard-american
  description: construction-billiard-american-description
