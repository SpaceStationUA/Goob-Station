- type: entity
  id: BilliardTableFlatpack
  parent: BaseFlatpack
  name: billiard table flatpack
  description: A flatpack used to construct a billiard table. Use a multitool to unpack it.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Devices/billiard_flatpack.rsi
    layers:
    - state: billiard-table
  - type: Flatpack
    entity: TableBilliard
  - type: StaticPrice
    price: 600

- type: constructionGraph
  id: TableBilliard
  start: start
  graph:
  - node: start
  - node: tableBilliard
    entity: TableBilliard
    edges:
    - to: start
      conditions:
      - !type:ContainerEmpty
        container: storagebase
        examineText: construction-condition-billiard-table-storage-not-empty
        guideStep: construction-step-billiard-table-empty-storage
      completed:
      - !type:SpawnPrototype
        prototype: BilliardTableFlatpack
        amount: 1
      - !type:DeleteEntity
      steps:
      - tool: Screwing
        doAfter: 3

- type: entity
  id: BoxBilliardBalls
  parent: BoxCardboard
  name: billiard ball box
  description: A box for storing billiard balls.
  components:
  - type: Sprite
    layers:
    - state: box
    - sprite: _Pirate/Objects/Storage/billiard_box.rsi
      state: balls
  - type: Storage
    grid:
    - 0,0,3,3
    whitelist: # TODO cardboard boxes should not have whitelisting
      components:
      - BilliardBall
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:AllSelector
        children:
        - id: BilliardBall
          amount: 16

- type: entity
  id: CrateBilliardComplect
  parent: CrateGenericSteel
  name: billiards set crate
  description: "A billiard table flatpack, a box of balls, and two cues: everything needed for a good evening."
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: BoxBilliardBalls
        - id: BilliardTableFlatpack
        - id: BilliardCue
          amount: 2

- type: cargoProduct
  id: CrateBilliardComplect
  icon:
    sprite: _Pirate/Objects/Fun/Billiards/billiard_table.rsi
    state: table
  product: CrateBilliardComplect
  cost: 5000
  category: cargoproduct-category-name-fun
  group: market
