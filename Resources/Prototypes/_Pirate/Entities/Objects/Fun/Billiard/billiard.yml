- type: entity
  id: TableBilliard
  parent: BaseStructure
  name: billiard table
  description: A standard billiard table with green cloth. The perfect place to relax after a shift.
  components:
  - type: Transform
    anchored: true
  - type: Sprite
    sprite: _Pirate/Objects/Fun/Billiards/billiard_table.rsi
    state: table
  - type: Physics
    bodyType: Static
  - type: Construction
    graph: TableBilliard
    node: tableBilliard
  - type: Fixtures
    fixtures:
      border_north:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.34,0.62,0.34,0.72"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001
      border_south:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.34,-0.75,0.34,-0.66"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001
      border_west_top:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.50,0.06,-0.40,0.56"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001
      border_west_bottom:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.50,-0.59,-0.40,-0.09"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001
      border_east_top:
        shape:
          !type:PhysShapeAabb
          bounds: "0.40,0.06,0.50,0.56"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001
      border_east_bottom:
        shape:
          !type:PhysShapeAabb
          bounds: "0.40,-0.59,0.50,-0.09"
        density: 100
        mask: [ MachineMask, DoorPassable ]
        layer: [ TableLayer ]
        friction: 0.0001
      pocket_nw:
        shape:
          !type:PhysShapeCircle
          radius: 0.06
          position: -0.44,0.66
        hard: false
        mask: [ DoorPassable ]
      pocket_ne:
        shape:
          !type:PhysShapeCircle
          radius: 0.06
          position: 0.44,0.66
        hard: false
        mask: [ DoorPassable ]
      pocket_sw:
        shape:
          !type:PhysShapeCircle
          radius: 0.06
          position: -0.44,-0.69
        hard: false
        mask: [ DoorPassable ]
      pocket_se:
        shape:
          !type:PhysShapeCircle
          radius: 0.06
          position: 0.44,-0.69
        hard: false
        mask: [ DoorPassable ]
      pocket_w:
        shape:
          !type:PhysShapeCircle
          radius: 0.06
          position: -0.466,-0.01
        hard: false
        mask: [ DoorPassable ]
      pocket_e:
        shape:
          !type:PhysShapeCircle
          radius: 0.06
          position: 0.46,-0.01
        hard: false
        mask: [ DoorPassable ]
  - type: Damageable
    damageContainer: StructuralInorganic # Pirate: Injurable is unavailable in this branch.
  - type: Storage
    grid:
    - 0,0,4,3
    maxItemSize: Small
    whitelist:
      components:
      - BilliardBall
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: BilliardTable
  - type: Anchorable
  - type: Rotatable

- type: entity
  id: BilliardBall
  parent: BaseItem
  name: billiard ball
  description: A heavy, smooth ball used to play billiards.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Fun/Billiards/billiard_ball.rsi
    layers:
    - state: ball
      map: [ "enum.BilliardVisualLayers.Base" ]
    - state: ball_second
      map: [ "enum.BilliardVisualLayers.Stripe" ]
      visible: false
    scale: 0.08,0.08
  - type: Appearance
  - type: Item
    size: Tiny
  - type: TileFrictionModifier
    modifier: 0.2
  - type: Physics
    bodyType: Dynamic
    linearDamping: 1.0
    angularDamping: 1.5
    sleepingAllowed: false
  - type: Damageable
  - type: BilliardBall
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.035
        density: 5
        restitution: 0.45
        friction: 0.01
        mask:
        - DoorPassable
        - Impassable
        layer:
        - DoorPassable

- type: entity
  id: BilliardCue
  parent: BaseItem
  name: billiard cue
  description: A cue used to strike billiard balls.
  components:
  - type: Item
    size: Small
    sprite: _Pirate/Objects/Fun/Billiards/billiard_cue.rsi
  - type: Sprite
    sprite: _Pirate/Objects/Fun/Billiards/billiard_cue.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimationRotation: -180
    damage:
      types:
        Blunt: 5
        Structural: 1
  - type: BilliardCue
  - type: MeleeThrowOnHit
    speed: 5
    distance: 0.4
    cameraRecoilOnThrown: false
    throwInAir: false

- type: entity
  id: SpawnBilliardTriangle
  parent: BaseItem
  name: billiard ball pyramid spawner
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Fun/Billiards/billiard_ball.rsi
    state: ball_triangle
    drawdepth: Effects
  - type: Construction
    graph: BilliardTriangleGraph
    node: triangle
  - type: BilliardSpawner
    ballPrototype: BilliardBall
    ballSpacing: 0.082
    rows: 5
    gameType: Pyramid

- type: entity
  id: SpawnBilliardAmericanPool
