- type: entity
  parent: [ BaseItem, BaseSyndicateContraband ]
  id: RadioHandheldSyndicate
  name: syndicate radio
  description: A tiny listening device which relays what it hears to the syndicate radio channel. It does not have a speaker.
  components:
  - type: TelecomExempt
  - type: RadioMicrophone
    broadcastChannel: Syndicate
    listenRange: 6
  - type: Speech
    speechVerb: Robotic
  - type: Sprite
    sprite: _Pirate/Objects/Devices/syndicate_radio.rsi
    layers:
    - state: walkietalkie
    - state: walkietalkie-on
    state: walkietalkie
  - type: Item
    size: Tiny
    sprite: _Pirate/Objects/Devices/syndicate_radio.rsi
    heldPrefix: walkietalkie
  - type: Appearance
  - type: SubFloorHide
  - type: Anchorable
  - type: CollideOnAnchor
  - type: Transform
    anchored: false
  - type: BlockAnchorOn
    blacklist:
      components:
      - AnchoredStorageFilter
  - type: Visibility
    layer: 1
  - type: Tag
    tags:
    - Radio
    - ListeningBug
