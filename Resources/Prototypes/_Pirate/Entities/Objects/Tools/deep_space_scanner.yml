- type: entity
  id: HandHeldDeepSpaceScanner
  parent: HandHeldMassScanner
  name: '"Echo" void tracker'
  description: A security tracker, for people who think open space is a good place to hide.
  components:
  - type: Item
    sprite: _Pirate/Objects/Tools/deep_space_scanner.rsi
  - type: Sprite
    sprite: _Pirate/Objects/Tools/deep_space_scanner.rsi
    state: icon
    layers:
      - state: icon
      - state: screen
        shader: unshaded
        visible: false
        map: [ "enum.ToggleableVisuals.Layer" ]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
  - type: ItemToggle
    onUse: false
    onActivate: false # UI open toggles scanning; do not activate again after a denied open.
  - type: PowerCellDraw
    drawRate: 2 # Higher draw than the 1.5 W mass scanner for the longer range.
  - type: DeepSpaceScanner
  - type: AlertLevelRestricted
    requirement:
      minimum: red
  - type: StaticPrice
    price: 400
