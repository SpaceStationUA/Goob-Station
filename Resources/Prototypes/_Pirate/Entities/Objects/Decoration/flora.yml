- type: entity
  parent: BaseStructure
  id: FloraBigBush01
  name: big bush
  description: A dense decorative bush.
  components:
  - type: SpriteFade
  - type: Sprite
    sprite: _Pirate/Objects/Decoration/Flora/flora_bushes64x64.rsi
    state: bigbush1
    drawdepth: OverMobs
    offset: "0, 0.4"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 60
        mask: []
        layer: []
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: MeleeSound
    soundGroups:
      Brute:
        path: /Audio/Effects/chop.ogg
        params:
          variation: 0.05
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [Destruction]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialCloth1:
            min: 1
            max: 2

