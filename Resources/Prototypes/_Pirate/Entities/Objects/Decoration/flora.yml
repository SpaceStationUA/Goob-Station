### Пальмові
- type: entity
  parent: BaseTree
  id: FloraTreeBroken01
  name: broken tree
  description: The remains of a once majestic tree.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Decoration/Flora/flora_treebroken_96x96.rsi
    state: broken01
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.35,-0.3,0.35,0.5"
        density: 1000
        layer:
        - WallLayer
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]

