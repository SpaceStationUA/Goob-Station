- type: entity
  id: WaistBeltInstructorBelt
  parent: [BaseSecurityContraband, ClothingBeltBase]
  name: дисциплінарний пояс
  description: Дуже важкий пояс. "Дивись, що ти накоїв! Кадет, від пола п'ять разів віджатися! ЗАРАЗ!""
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Belt/instructordisciplinary.rsi
    state: icon
  - type: Clothing
    sprite: _Pirate/Clothing/Belt/instructordisciplinary.rsi
    equipSound:
       path: /Audio/_PIrate/Items/Belts/BeltBuckle.ogg
       params:
         volume: -3
  - type: MeleeWeapon
    wideAnimationRotation: -135
    bluntStaminaDamageFactor: 1.5
    angle: 0
    damage:
      types:
        Blunt: 5
    attackRate: 0.7
    soundHit:
      path: /Audio/_Goobstation/Weapons/Effects/whip.ogg
      params:
        variation: 0.125
        volume: -0.5
  - type: TelescopicBaton
  - type: KnockdownOnHit
    duration: .1
    dropItems: false
  - type: StaminaDamageOnHit
    damage: 12
  - type: UseDelay
    delays:
      default:
        length: 1
  - type: UseDelayBlockMelee
    delays:
    - default
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Pirate/Items/Belts/BeltPickup.ogg
      params:
        volume: -3