- type: entity
  name: "Вулкан-М"
  parent: [BaseWeaponRifle, BaseSecurityContraband]
  id: WeaponRifleVulcanM
  description: "Компактна гвинтівка компонування \"буллпап\", втілення надійності класичної платформи у ергономічному корпусі. Менша віддача, вища точність. Використовує гвинтівкові магазини .30 калібру."
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/Rifles/vulcan.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Pirate/Objects/Weapons/Guns/Rifles/vulcan.rsi
  - type: Gun
    minAngle: 21
    maxAngle: 32
    fireRate: 6
    selectedMode: FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rifle2.ogg
    availableModes:
    - FullAuto
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifle
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineLightRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifle
        priority: 1
        whitelist:
          tags:
            - CartridgeLightRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  name: "Бандит"
  parent: [BaseWeaponRifle, BaseSyndicateContraband]
  id: WeaponRifleBandit
  description: "Точна та надійна гвинтівка компонування \"буллпап\", доведена до досконалості Scarborough Arms. Використовує безгільзові гвинтівкові набої .30 калібру."
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/Rifles/bandit.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Pirate/Objects/Weapons/Guns/Rifles/bandit.rsi
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    fireRate: 2
    soundGunshot:
      collection: DMRFire
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineLightRifleCaseless
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineLightRifleCaseless
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeLightRifleCaseless
        priority: 1
        whitelist:
          tags:
          - CartridgeLightRifleCaseless
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance

- type: entity
  name: "M469"
  parent: [BaseWeaponRifle, BaseSecurityContraband, SolAllianceInfo]
  id: WeaponRifleSol
  suffix: SAN
  description: Надійна штурмова гвинтівка виробництва Zavodskiy Interstellar. M469, є стандартною службовою гвинтівкою Соларіанського Альянсу, що поширена у сухопутних військах. Хоча сама конструкція автомата стара, вона продовжує широко використовуватися в Альянсі та сепаратистськими державами і, ймовірно, використовуватиметься ще багато років.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/Rifles/sol_rifle/36x32.rsi
    layers:
      - state: base
        map: ["enum.GunVisualLayers.Base"]
      - state: base-unshaded
        map: ["enum.GunVisualLayers.BaseUnshaded"]
        shader: unshaded
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Pirate/Objects/Weapons/Guns/Rifles/sol_rifle/32x32.rsi
    clothingVisuals:
      back:
      - sprite: _Pirate/Objects/Weapons/Guns/Rifles/sol_rifle/32x32.rsi
        state: equipped-BACKPACK
      - sprite: _Pirate/Objects/Weapons/Guns/Rifles/sol_rifle/32x32.rsi
        state: equipped-BACKPACK-unshaded
        shader: unshaded
      suitstorage:
      - sprite: _Pirate/Objects/Weapons/Guns/Rifles/sol_rifle/32x32.rsi
        state: equipped-BACKPACK
      - sprite: _Pirate/Objects/Weapons/Guns/Rifles/sol_rifle/32x32.rsi
        state: equipped-BACKPACK-unshaded
        shader: unshaded
  - type: Item
    sprite: _Pirate/Objects/Weapons/Guns/Rifles/sol_rifle/32x32.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      - state: inhand-left-unshaded
        shader: unshaded
      right:
      - state: inhand-right
      - state: inhand-right-unshaded
        shader: unshaded
  - type: WieldedInhandVisuals
    wieldedInhandVisuals:
      left:
      - state: wielded-inhand-left
      - state: wielded-inhand-left-unshaded
        shader: unshaded
      right:
      - state: wielded-inhand-right
      - state: wielded-inhand-right-unshaded
        shader: unshaded
  - type: Gun
    fireRate: 6
    minAngle: 12
    maxAngle: 40
    angleIncrease: 4
    angleDecay: 16
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - Burst
    soundGunshot:
      path: /Audio/_Pirate/Weapons/Guns/Gunshots/ak_fire.ogg
  - type: ChamberMagazineAmmoProvider
    autoEject: true
  - type: GunWieldBonus
    minAngle: -10
    maxAngle: -30
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
