- type: entity
  name: BRDI R-25
  parent: [BaseWeaponSubMachineGun, BaseSecurityContraband, BaseGunWieldable]
  id: WeaponSubMachineGunBRDIR25
  description: Іконічна зброя, яку використовують члени Іноземного легіону Республіки Бізель. Як гордість Республіки, вона символізує свободу від тиранії Солоріанського Альянсу. Стріляє набоями 9.5мм.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/SMGs/BRDI_R25.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Pirate/Objects/Weapons/Guns/SMGs/BRDI_R25.rsi
  - type: Wieldable
  - type: GunWieldBonus
    minAngle: -19
    maxAngle: -16
  - type: Gun
    minAngle: 21
    maxAngle: 32
    fireRate: 5 # 300rpm in Semi & Full Auto
    burstFireRate: 20 # 1200rpm in Burst mode.
    shotsPerBurst: 5
    burstCooldown: 0.8
    cameraRecoilScalar: 0.5
    selectedMode: Burst
    soundGunshot:
      path: /Audio/_Pirate/Weapons/Guns/Gunshots/brdi-r25-suppressed-gunshot.ogg
      params:
        volume: -3
        maxDistance: 8
        rolloffFactor: 1.2
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
  - type: ChamberMagazineAmmoProvider
    autoEject: true
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice
    price: 1500
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineCaselessRifleStandard
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazineCaselessRifle
      gun_chamber:
        name: Chamber
        startingItem: CartridgeCaselessRifleStandard
        priority: 1
        whitelist:
          tags:
            - CartridgeCaselessRifle

- type: entity
  name: антикварний BRDI R-25
  parent: WeaponSubMachineGunBRDIR25
  id: WeaponSubMachineGunBRDIR25Antique
  description: Колись цю улюблену гвинтівку тримав невідомий член Іноземного легіону Республіки Бізеля; вона брала участь у боях з Солом в кожних боях Республіки.
  components:
    - type: Sprite
      sprite: _Pirate/Objects/Weapons/Guns/SMGs/BRDI_R25_antique.rsi

- type: entity
  name: M470-L "Витязь"
  parent: [BaseWeaponSubMachineGun, BaseGunWieldable, BaseSecurityContraband, SolAllianceInfo]
  id: WeaponSubMachineGunSol
  suffix: SAN
  description: Розроблена компанією Zavodskiy Interstellar як зменшена версія моделі M469. M470-L є зброєю індивідуального захисту, призначеною для особового складу збройних сил Соларіанського Альянсу - зокрема екіпажу флоту. Легка конструкція дозволяє вести вогонь з однієї руки з малою віддачею, проте дворучний хват все ще комфортніше.
  components:
  - type: Sprite
    sprite:  _Pirate/Objects/Weapons/Guns/SMGs/sol_smg/40x32.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite:  _Pirate/Objects/Weapons/Guns/SMGs/sol_smg/32x32.rsi
  - type: Gun
    minAngle: 5
    maxAngle: 20
    fireRate: 8.33
    burstFireRate: 8.33
    angleIncrease: 1.5
    angleDecay: 16
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    - Burst
    soundGunshot:
      path: /Audio/_Pirate/Weapons/Guns/Gunshots/smg.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazinePistolSubMachineGun
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistolSubMachineGun
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgePistol
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: GunWieldBonus
    minAngle: -3
    maxAngle: -10
  - type: Multishot
    missChance: 0.3
  - type: Item
    sprite:  _Pirate/Objects/Weapons/Guns/SMGs/sol_smg/32x32.rsi
    size: Normal
    shape:
    - 0,0,2,1
