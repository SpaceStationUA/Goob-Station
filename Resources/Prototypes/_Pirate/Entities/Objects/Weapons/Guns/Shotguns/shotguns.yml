- type: entity
  name: M63
  parent: [BaseWeaponShotgun, BaseGunWieldable, BaseSecurityContraband, SolAllianceInfo]
  id: WeaponShotgunSol
  suffix: SAN
  description: Компактна бойова рушниця виробництва Zavodskoi Interstellar для Соларіанських збройних сил, M63 найчастіше використовується штурмовиками, що воюють у ближньому бою, хоча також рідко використовується як оборонна зброя екіпажами ВМС. Використовує дробь 12 калібру.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Weapons/Guns/Shotguns/sol_shotgun/35x32.rsi
    layers:
    - state: icon
    - state: icon-unshaded
      shader: unshaded
  - type: Clothing
    sprite: _Pirate/Objects/Weapons/Guns/Shotguns/sol_shotgun/32x32.rsi
  - type: Item
    sprite: _Pirate/Objects/Weapons/Guns/Shotguns/sol_shotgun/32x32.rsi
    inhandVisuals:
      left:
      - state: inhand-left
      - state: inhand-left-unshaded
        shader: unshaded
      right:
      - state: inhand-right
      - state: inhand-right-unshaded
        shader: unshaded
    shape:
    - 0,0,3,1
  - type: WieldedInhandVisuals
    wieldedInhandVisuals:
      left:
      - state: wielded-inhand-left
      - state: wielded-inhand-left-unshaded
        shader: unshaded
      right:
      - state: wielded-inhand-right
      - state: wielded-inhand-right-unshaded
        shader: unshaded
  - type: GunSpreadModifier
    spread: 0.8
  - type: BallisticAmmoProvider
    autoCycle: false
    capacity: 7
  - type: GunRequiresWield
  - type: Gun
    fireRate: 3.3
    soundGunshot:
      path: /Audio/_Pirate/Weapons/Guns/Gunshots/shotgun2.ogg
