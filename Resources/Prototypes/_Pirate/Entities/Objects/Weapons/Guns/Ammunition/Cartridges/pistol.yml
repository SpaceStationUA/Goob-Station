- type: entity
  id: CartridgePistolCryptobiolin
  name: cartridge (.35 auto Cryptobiolin)
  description: Arguably the most popular caliber on the market, used by all manner of pistols and submachine guns. The tip carries a payload of cryptobiolin that suppresses psionics.
  parent: [ BaseCartridgePistol, BaseMantisContraband ]
  components:
  - type: CartridgeAmmo
    proto: BulletPistolCryptobiolin
  - type: Sprite
    layers:
      - state: base
        map: [ "enum.AmmoVisualLayers.Base" ]
      - state: tip
        map: [ "enum.AmmoVisualLayers.Tip" ]
        color: "#510A5C"
