# Pirate: large ammo box for the Bandit's .30 caseless light rifle rounds - no box existed for this
# caliber before, only the 15-round magazine.
- type: entity
  parent: BaseMagazineBoxLightRifle
  id: MagazineBoxLightRifleCaselessBig
  name: "коробка набоїв (.30 безгільзові гвинтівкові)"
  description: "Картонна коробка безгільзових набоїв .30 калібру для легкої гвинтівки. Призначена для зберігання кінетичних боєприпасів загального призначення."
  components:
  - type: BallisticAmmoProvider
    capacity: 200
    proto: CartridgeLightRifleCaseless
    whitelist:
      tags:
      - CartridgeLightRifleCaseless
  - type: Sprite
    layers:
    - state: base-b
      map: ["enum.GunVisualLayers.Base"]
    - state: magb-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: magb
    steps: 4
    zeroVisible: false
  - type: Appearance
