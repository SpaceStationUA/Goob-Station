- type: entity
  parent: [ BaseVehicle, FlyingMobBase ]
  id: ADTVehicleLavabike
  name: lavabike
  description: This monster will help you to conquer lavaland. Very safe.
  components:
  - type: MovementIgnoreGravity
  - type: MovementAlwaysTouching
  - type: CanMoveInAir
  - type: Physics
    bodyType: KinematicController
    bodyStatus: InAir
  - type: AmbientSound
    sound: /Audio/Effects/shuttle_thruster.ogg
    range: 8
    volume: 5
    enabled: false
  - type: Strap
    buckleOffset: "0.1, -0.05"
  - type: MovementSpeedModifier
    baseAcceleration: 1.2
    baseFriction: 1.5
    baseWalkSpeed: 1.5
    baseSprintSpeed: 6
  - type: Sprite
    sprite: _Pirate/Objects/Vehicles/lavabike.rsi
    layers:
    - state: hull
      map: [ "enum.DamageStateVisualLayers.Base" ]
    - state: engine
    - state: lights
      shader: unshaded
    noRot: true
  - type: ItemSlots
    slots:
      key_slot:
        name: vehicle-slot-component-slot-name-keys
        whitelist:
          requireAll: true
          tags:
          - VehicleKey
          - ADTLavabikeKeys
        startingItem: ADTVehicleLavabikeKey
        priority: 1
        insertSound:
          path: /Audio/Effects/RingtoneNotes/a.ogg
          params:
            volume: 1
      bag:
        name: lavabike-slot-bag
        whitelist:
          components:
            - Storage
        priority: 2
        insertSound:
          path: /Audio/Items/belt_equip.ogg
          params:
            volume: -3
  - type: ItemMapper
    mapLayers:
      bag:
        whitelist:
          components:
            - Storage
    sprite: _Pirate/Objects/Vehicles/lavabike.rsi
  - type: Appearance
  - type: PointLight
    enabled: true
    radius: 8
    energy: 2.5
  - type: Icon
    sprite: _Pirate/Objects/Vehicles/lavabike.rsi
    state: vehicle
  - type: Vehicle
    renderOver: North, East, South, West
    hornSound:
      collection: BikeHorn
  - type: UnpoweredFlashlight
  - type: WeatherImmune # Pirate: Ashfall uses this immunity here.

- type: entity
  parent: BaseKey
  id: ADTVehicleLavabikeKey
  name: lavabike keys
  description: A fearsome set of keys for a lavabike.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Vehicles/lavabike.rsi
    state: keys
  - type: Tag
    tags: [ VehicleKey, ADTLavabikeKeys ]

- type: Tag
  id: ADTLavabikeKeys
