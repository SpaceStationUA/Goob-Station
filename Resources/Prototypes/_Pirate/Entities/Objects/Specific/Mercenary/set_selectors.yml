- type: entity
  id: MercUndeterminedClass
  name: mercenary specialization requisition
  description: Choose one mercenary specialization. Assault provides weapon requisitions, while Medic, Recon, Augment and Vanguard provide specialized equipment.
  parent: [ BaseItem, BaseSetSelector ]
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Specific/Mercenary/requisition_uplink.rsi
    state: icon
  - type: SetSelector
    possibleSets:
    - MercAssaultSet
    - MercMedicSet
    - MercReconSet
    - MercAugmentSet
    - MercVanguardSet
    maxSelectedSets: 1

- type: entity
  id: MercUndeterminedAssaultWeapon
  name: mercenary weapon requisition
  description: A small remote utilizing bluespace technology to drop in a weapon loadout directly to you. Choose wisely.
  parent: [ BaseItem, BaseSetSelector ]
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Specific/Mercenary/requisition_uplink.rsi
    state: icon
  - type: SetSelector
    possibleSets:
    - MercEstocSet
    - MercBanditSet
    - MercAKMSet
    - MercEnforcerSet
    - MercVulkanMSet
    - MercM16ModernSet
    maxSelectedSets: 1

- type: entity
  id: MercUndeterminedSidearm
  name: mercenary sidearm requisition
  description: A small remote utilizing bluespace technology to drop in a sidearm directly to you. Choose wisely.
  parent: [ BaseItem, BaseSetSelector ]
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Specific/Mercenary/requisition_uplink.rsi
    state: icon
  - type: SetSelector
    possibleSets:
    - MercSvalinnSet
    - MercEnergyMagnumSet
    - MercCobraSet
    - MercViperSet
    maxSelectedSets: 1
