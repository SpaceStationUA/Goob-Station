# Construction
- type: entity
  id: ModularSuitConstruction
  name: "конструкція модульного костюма"
  description: "Частково зібраний каркас модульного костюма. Для завершення потребує ядра, частин броні, обшивки та батареї."
  components:
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: Pullable
  - type: DamageExaminable
  - type: Appearance
  - type: ModularSuitAssemblyVisuals
    statePrefix: mod
  - type: Sprite
    sprite: &mod-rsi _Pirate/Objects/Specific/Robotics/modular_suits.rsi
    drawdepth: Items
    noRot: true
    state: mod0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3  # fite me
        friction: 0.2
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Effects/drop.ogg
      params:
        volume: 2
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Construction
    graph: ModularSuit
    node: start
    defaultTarget: mod

- type: entity
  parent: ModularSuitConstruction
  id: ModularSuitConstructionFinished
  name: "конструкція модульного костюма"
  description: "Повністю зібраний каркас модульного костюма. Готовий до встановлення обшивки та вставлення батареї."
  components:
  - type: Sprite
    state: mod8
  - type: Construction
    graph: ModularSuitVariants
    node: base_suit
    defaultTarget: null # Pirate: clear the inherited target from the assembly graph.
    deconstructionTarget: null # Pirate: this one-way graph has no local "start" node or deconstruction path.

# Cores
- type: entity
  parent: BaseItem
  id: BaseModularSuitCore
  abstract: true
  components:
  - type: Item
    size: Small
    storedRotation: -90
  - type: Sprite
    sprite: *mod-rsi

- type: entity
  parent: BaseModularSuitCore
  id: ModularSuitCoreStandard
  name: "ядро модульного костюма"
  description: "Стандартне ядро костюма від «Накамура Інжиніринг». Забезпечує базовий розподіл живлення в модульних костюмах."
  components:
  - type: Sprite
    state: mod-core-standard
  - type: ModularSuitCore
    verbIcon:
      sprite: *mod-rsi
      state: mod-core-standard
  - type: Tag
    tags:
    - ModularSuitCore

- type: entity
  parent: BaseModularSuitCore
  id: ModularSuitCorePlasma
  name: "плазмове ядро модульного костюма"
  description: "Удосконалене ядро на плазмовому паливі. Має вдвічі більшу місткість за стандартні моделі й ідеально підходить для тривалих операцій."
  components:
  - type: Sprite
    state: mod-core-plasma
  - type: ModularSuitCore
    multiplier: 0.5
    maxCharge: 200
    charge: 200
    verbIcon:
      sprite: *mod-rsi
      state: mod-core-plasma

- type: entity
  parent: BaseModularSuitCore
  id: ModularSuitCoreInfinite
  name: "нескінченне ядро модульного костюма"
  description: "Експериментальне ядро з необмеженим джерелом енергії. Де ви взагалі це взяли?"
  components:
  - type: Sprite
    state: mod-core-infinite
  - type: ModularSuitCore
    infinite: true
    verbIcon:
      sprite: *mod-rsi
      state: mod-core-infinite

# Parts
- type: entity
  parent: BaseItem
  id: ModularSuitHelmet
  name: "шолом модульного костюма"
  description: "Герметичний шолом для модульних костюмів. Захищає голову та містить інтерфейси для візорних модулів."
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: *mod-rsi
    state: helmet
  - type: ModularSuitPart
    partType: Helmet
    verbIcon:
      sprite: *mod-rsi
      state: helmet
  - type: Tag
    tags:
    - ModularSuitHelmet

- type: entity
  parent: BaseItem
  id: ModularSuitChestPlate
  name: "нагрудник модульного костюма"
  description: "Основна бронепластина модульного костюма. Захищає торс і слугує точкою кріплення для більшості модулів."
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: *mod-rsi
    state: chestplate
  - type: ModularSuitPart
    partType: Torso
    verbIcon:
      sprite: *mod-rsi
      state: chestplate
  - type: Tag
    tags:
    - ModularSuitChestPlate

- type: entity
  parent: BaseItem
  id: ModularSuitGauntlets
  name: "рукавиці модульного костюма"
  description: "Посилені рукавиці з інтегрованими сервосистемами. Дають змогу встановлювати модулі для рук."
  components:
  - type: Item
    size: Small
    storedRotation: -90
  - type: Sprite
    sprite: *mod-rsi
    state: gauntlets
  - type: ModularSuitPart
    partType: Gloves
    verbIcon:
      sprite: *mod-rsi
      state: gauntlets
  - type: Tag
    tags:
    - ModularSuitGauntlets

- type: entity
  parent: BaseItem
  id: ModularSuitBoots
  name: "чоботи модульного костюма"
  description: "Герметичні чоботи із системами магнітного кріплення. Слугують основою для модулів мобільності."
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: *mod-rsi
    state: boots
  - type: ModularSuitPart
    partType: Boots
    verbIcon:
      sprite: *mod-rsi
      state: boots
  - type: Tag
    tags:
    - ModularSuitBoots

# Platings
- type: entity
  parent: BaseItem
  id: BaseModularSuitPlating
  abstract: true
  components:
  - type: Sprite
    sprite: *mod-rsi

- type: entity
  parent: BaseModularSuitPlating
  id: BasicPlating
  name: "базова обшивка костюма"
  description: "Стандартна обшивка від «Накамура Інжиніринг». Забезпечує базовий захист із дещо поліпшеною рухливістю."
  components:
  - type: Sprite
    state: standard-plating
  - type: Tag
    tags:
    - BasicPlating

- type: entity
  parent: BaseModularSuitPlating
  id: CivilianPlating
  name: "цивільна обшивка костюма"
  description: "Легка цивільна обшивка. Не захищає від вакууму, зате зовсім не обмежує рухів."
  components:
  - type: Sprite
    sprite: *mod-rsi
    state: civilian-plating
  - type: Tag
    tags:
    - CivilianPlating

- type: entity
  parent: BaseModularSuitPlating
  id: ClownPlating
  name: "клоунська обшивка костюма"
  description: "Обшивка від «Хонк Лтд.». Захищає від середовищ із низьким вмістом гумору. Більшість технологій витрачено на зниження енергоспоживання."
  components:
  - type: Sprite
    sprite: *mod-rsi
    state: cosmohonk-plating
  - type: Tag
    tags:
    - ClownPlating

- type: entity
  parent: BaseModularSuitPlating
  id: EngineeringPlating
  name: "інженерна обшивка костюма"
  description: "Класична інженерна обшивка від «Накамура Інжиніринг». Має чудову стійкість до жару й електрики."
  components:
  - type: Sprite
    sprite: *mod-rsi
    state: engineering-plating
  - type: Tag
