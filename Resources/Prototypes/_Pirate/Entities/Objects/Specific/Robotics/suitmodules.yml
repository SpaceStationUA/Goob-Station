  id: EMPShieldAdvancedSuitModule
  name: "удосконалений модуль ЕМІ-захисту"
  description: "Польовий інгібітор нового покоління, що повністю нейтралізує електромагнітні перешкоди без жодного споживання енергії. Принцип його роботи є комерційною таємницею «Кіберсан Індастріз»."
  components:
  - type: ModularSuitModule
    modulePrefix: 'C'
    powerUsage: 0

- type: entity
  parent: BaseSuitModule
  id: NoSlipSuitModule
  name: "модуль захисту від ковзання"
  description: "Засекречений прототип «Кіберсан Індастріз», створений зворотним проєктуванням трофейного обладнання Синдикату. Ці передові п'єзоелектричні стабілізатори забезпечують ідеальне зчеплення з будь-якою поверхнею без енергоспоживання чи магнітного сліду стандартних магнітних чобіт. Спочатку їх розробили для таємних оперативників, яким потрібно безшумно рухатися будь-яким середовищем, не залишаючи слідів. «Нанотрейзен» оголосила ці модулі контрабандою, але вони залишаються улюбленими серед тих, хто працює проти інтересів корпорації. «Хонк Ко.» подала численні протести щодо законності модулів, посилаючись на нечесну конкурентну перевагу на ринку запобігання ковзанню."
  components:
  - type: Sprite
    state: noslip
  - type: ModularSuitModuleEffect
    targetSlot: shoes
    activeComponents:
    - type: NoSlip
  - type: ModularSuitModule
    tags: [ NoSlipModuleConflict ]
    modulePart: Boots
    modulePrefix: 'C'
    canBeDisabled: false
    active: true
    verbIcon:
      sprite: *modules-rsi
      state: noslip

- type: entity
  parent: BaseSuitModule
  id: PlateCompressionSuitModule
  name: "модуль стиснення броні"
  description: "Заборонена розробка «Кіберсан Індастріз». Нанокомпресори тимчасово зменшують об'єм бронеплит і сервоприводів, даючи носієві змогу протискуватися вентиляцією та іншими вузькими проходами. Поки модуль активний, механізм зняття костюма заблокований, тому без сторонньої допомоги його неможливо зняти. Несумісний із модулями посилення броні через перевантаження системи стиснення."
  components:
  - type: Sprite
    state: plate_compression
  - type: ModularSuitPermanentInstalled
  - type: ModularSuitModuleEffect
    activeComponents:
    - type: SelfUnremovableClothing
  - type: ModularSuitModuleWearerEffect
    activeComponents:
    - type: VentCrawler
  - type: ModularSuitModule
    tags: [ CompressionModuleConflict ]
    modulePart: Torso
    modulePrefix: 'C'
    active: true
    verbIcon:
      sprite: *modules-rsi
      state: plate_compression
  - type: Tag
    tags:
    - CompressionModuleConflict

- type: entity
  parent: BaseSuitModule
  id: BurgerDispenserSuitModule
  name: "модуль видачі бургерів"
  description: "Рідкісна технологія, відтворена з прототипу, знайденого на судні корпорації «Донк». Вона може споживати неймовірну кількість енергії батареї костюма, щоб створювати їстівну органічну матерію в долоні рукавиці носія, але дослідження, схоже, повністю зупинилися на бургерах. Примітно, що всі спроби змусити пристрій видавати чай «Ерл Ґрей» провалилися."
  components:
  - type: Sprite
    state: dispenser
  - type: ModularSuitActionModule
    action: ActivateBurgerDispenserModuleAction
  - type: ModularSuitModule
    modulePart: Gloves
    powerInstanceUsage: 10
    canBeDisabled: false
    active: true
    verbIcon:
      sprite: *modules-rsi
      state: dispenser

- type: entity
  parent: JetpackSuitModule
  id: JetpackAdvancedSuitModule
  name: "удосконалений модуль іонного джетпака"
  description: "Високопродуктивна іонна рушійна система, якій надають перевагу сили безпеки «Нанотрейзен». Має посилену тягу й кращу паливну ефективність порівняно зі стандартною моделлю. Ідеальна для переслідування або швидкого реагування на надзвичайні ситуації."
  components:
  - type: Sprite
    state: jetpack_advanced
  - type: ModularSuitItemModule
    item: JetpackSecurityModule
  - type: ModularSuitModule
    powerUsage: 3
    verbIcon:
      sprite: *modules-rsi
      state: jetpack_advanced

- type: entity
  parent: BaseMagnetSuitModule
  id: MagnetAdvancedSuitModule
  name: "удосконалений магнітний модуль"
  description: "Складне поліпшення системи магнітної стабілізації «Накамура Інжиніринг» із комп'ютерним автоматичним перемиканням і точнішим налаштуванням зчеплення. На відміну від базової моделі, ці електромагніти розумно регулюють силу поля залежно від поверхні та намірів користувача, усуваючи «липкість» старих версій. Нейроінтерфейс інтуїтивно вмикає магнітне зчеплення лише за потреби й забезпечує плавні переходи між рухами. Спочатку модуль створили для удосконаленого костюма старшого інженера, а згодом відкрили для інженерів, які вимагають найкращого керування рухливістю."
  components:
  - type: ModularSuitModuleEffect
    targetSlot: shoes
    activeComponents:
    - type: NoSlip
    - type: Magboots
  - type: ModularSuitModule
    powerUsage: 0
