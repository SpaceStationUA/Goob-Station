- type: entity
  parent: BaseItem
  id: BaseSuitModule
  abstract: true
  components:
  - type: Sprite
    sprite: &modules-rsi _Pirate/Objects/Specific/Robotics/modules.rsi
  - type: ModularSuitModule

# Storage
- type: entity
  parent: BaseSuitModule
  id: BaseStorageSuitModule
  abstract: true
  components:
  - type: ModularSuitStorageModule
  - type: Item
    size: Huge
  - type: ModularSuitModule
    tags: [ StorageSuitModule ]
    canBeDisabled: false
    active: true
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: [ ]
  - type: Storage
    showVerb: false
    clickInsert: false
    openOnActivate: false
    maxItemSize: Huge
    grid:
    - 0,0,6,3
  - type: ExplosionResistance
    damageCoefficient: 1
  - type: Tag
    tags:
    - StorageSuitModule

- type: entity
  parent: BaseStorageSuitModule
  id: StorageSuitModule
  name: "модуль зберігання Синдикату"
  description: "Низка вбудованих відсіків і спеціалізованих кишень по всій поверхні костюма, корисних для зберігання різноманітних дрібничок і всілякого мотлоху."
  components:
  - type: Sprite
    state: storage
  - type: ModularSuitModule
    verbIcon:
      sprite: *modules-rsi
      state: storage

- type: entity
  parent: BaseStorageSuitModule
  id: StorageLargeSuitModule
  name: "великий модуль зберігання"
  description: "Відтворена «Накамура Інжиніринг» за розробками корпорації «Донк» система прихованих відсіків повністю міститься всередині костюма й рівномірно розподіляє предмети та вагу для зручності користувача під час контрабанди чи звичайного перевезення вантажів."
  components:
  - type: Sprite
    state: storage_large
  - type: ModularSuitModule
    verbIcon:
      sprite: *modules-rsi
      state: storage_large
  - type: Storage
    grid:
    - 0,0,7,4

- type: entity
  parent: BaseStorageSuitModule
  id: StorageSyndicateSuitModule
  name: "модуль зберігання Синдикату"
  description: "Нанотехнологічна система зберігання від «Кіберсан Індастріз». Ці відсіки використовують езотеричну технологію для стискання фізичної матерії вкладених предметів, фактично зменшуючи їх задля значно зручнішого перенесення."
  components:
  - type: Sprite
    state: storage_syndi
  - type: ModularSuitModule
    modulePrefix: 'C'
    verbIcon:
      sprite: *modules-rsi
      state: storage_syndi
  - type: Storage
    grid:
    - 0,0,8,4

- type: entity
  parent: BaseStorageSuitModule
  id: StorageHoldingSuitModule
  name: "блюспейс-модуль зберігання"
  description: "Система зберігання, розроблена «Нанотрейзен». Ці відсіки використовують мініатюрні блюспейс-кишені як вершину складських технологій незалежно від ваги вкладених предметів."
  components:
  - type: Sprite
    state: storage_holding
  - type: ModularSuitModule
    verbIcon:
      sprite: *modules-rsi
      state: storage_holding
  - type: Storage
    grid:
    - 0,0,14,5 # Pirate: match the bag of holding capacity.

# Flashlight
- type: entity
  parent: BaseSuitModule
  id: BaseFlashlightSuitModule
  abstract: true
  components:
  - type: Sprite
    state: flashlight
  - type: UserInterface
    interfaces:
      enum.LightModuleUiKey.Key:
        type: LightModuleBoundUserInterface
  - type: ModularSuitActionModule
    action: ToggleLightModuleAction
  - type: ModularSuitLightModule
    guaranteedRemoved:
    - type: RgbLightController
  - type: ModularSuitModule
    tags: [ FlashlightSuitModule ]
    modulePart: Helmet
    powerUsage: 0.005
    canBeDisabled: false
    active: true
    verbIcon:
      sprite: *modules-rsi
      state: flashlight
  - type: Tag
    tags:
    - FlashlightSuitModule

- type: entity
  parent: BaseFlashlightSuitModule
  id: BaseAdvancedFlashlightSuitModule
  abstract: true
  components:
  - type: ModularSuitLightModule
    lightEnergy: 3
    lightRadius: 6

- type: entity
  parent: BaseFlashlightSuitModule
  id: FlashlightSuitModule
  name: "модуль ліхтарика"
  description: "Проста пара ліхтариків, установлених ліворуч і праворуч на шоломі, корисна для освітлення на різній відстані та різними кольорами. Дехто з виживальників із невідомих причин віддає перевагу зеленому світлу."

- type: entity
  parent: BaseAdvancedFlashlightSuitModule
  id: AdvancedFlashlightSuitModule
  name: "удосконалений модуль ліхтарика"
  description: "Удосконалена система освітлення з регульованою яскравістю та широким спектром кольорів. Має датчики навколишнього освітлення для автоматичного регулювання й режим аварійної сигналізації. Ідеальна для темних коридорів, технічних тунелів і надзвичайних ситуацій. Колір світла можна налаштувати на будь-який смак."

