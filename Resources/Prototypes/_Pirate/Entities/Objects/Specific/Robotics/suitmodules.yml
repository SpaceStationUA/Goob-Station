# Visor
- type: entity
  parent: BaseSuitModule
  id: BaseVisorSuitModule
  abstract: true
  components:
  - type: ModularSuitModuleEffect
    targetSlot: head
  - type: ModularSuitModule
    tags: [ VisorSuitModule ]
    modulePart: Helmet
    powerUsage: 0.3
  - type: Tag
    tags:
    - VisorSuitModule

- type: entity
  parent: BaseVisorSuitModule
  id: VisorMedicalSuitModule
  name: "модуль медичного візора"
  description: "Проєкційний дисплей, установлений у візор костюма. Він зіставляє дані сенсорів костюма із сучасним комплексом біологічного сканування, даючи змогу бачити поточний стан здоров'я органічних істот і зручно переглядати дані на кшталт карток пацієнтів. Кажуть, такі візори також дозволяють бачити, що коїться за спиною."
  components:
  - type: Sprite
    state: medhud_visor
  - type: ModularSuitModuleEffect
    activeComponents:
    - type: ShowHealthBars
    - type: ShowHealthIcons
  - type: ModularSuitModule
    verbIcon:
      sprite: *modules-rsi
      state: medhud_visor

- type: entity
  parent: BaseVisorSuitModule
  id: VisorDiagnosticSuitModule
  name: "модуль діагностичного візора"
  description: "Проєкційний дисплей, установлений у візор костюма. Низка передових сенсорів отримує дані зі складних машин, екзокостюмів та інших пристроїв, даючи змогу бачити їхній заряд і цілісність. Кажуть, такі візори також дозволяють бачити, що коїться за спиною."
  components:
  - type: Sprite
    state: diaghud_visor
  - type: ModularSuitModuleEffect
    activeComponents:
    - type: ShowHealthBars
      damageContainers:
      - Inorganic
      - Silicon
      # Pirate: the local codebase has no Android damage container.
  - type: ModularSuitModule
    verbIcon:
      sprite: *modules-rsi
      state: diaghud_visor

- type: entity
  parent: BaseVisorSuitModule
  id: VisorSecuritySuitModule
  name: "модуль охоронного візора"
  description: "Проєкційний дисплей, установлений у візор костюма. Цей модуль є глибоко переробленою системою наведення, під'єднаною до різних кримінальних баз даних, щоб переглядати записи про арешти, керувати простими охоронними роботами й загалом знати, в кого стріляти. Кажуть, такі візори також дозволяють бачити, що коїться за спиною."
  components:
  - type: Sprite
    state: sechud_visor
  - type: ModularSuitModuleEffect
    activeComponents:
    - type: ShowJobIcons
    # Pirate: the Wega SecApartment squad HUD is not present in this codebase.
    - type: ShowMindShieldIcons
    - type: ShowCriminalRecordIcons
    - type: ShowContrabandDetails
  - type: ModularSuitModule
    verbIcon:
      sprite: *modules-rsi
      state: sechud_visor

- type: entity
  parent: BaseVisorSuitModule
  id: VisorMesonSuitModule
  name: "модуль мезонного візора"
  description: "Проєкційний дисплей, установлений у візор костюма. Модуль заснований на перевіреній технології мезонних сканерів, завдяки якій будівельники та шахтарі всієї галактики бачать крізь стіни основні конструкції й рельєф незалежно від освітлення. Кажуть, такі візори також дозволяють бачити, що коїться за спиною."
  components:
  - type: Sprite
    state: meson_visor
  - type: ModularSuitModuleEffect
    activeComponents:
    - type: EyeProtection
  - type: ModularSuitModuleWearerEffect
    activeComponents:
    - type: MesonVision
  - type: ModularSuitModule
    tags: [ VisorSuitModule, WeldingModuleConflict ]
    verbIcon:
      sprite: *modules-rsi
      state: meson_visor
  - type: Tag
    tags:
    - VisorSuitModule
    - WeldingModuleConflict

- type: entity
  parent: BaseVisorSuitModule
  id: SolutionScannerSuitModule
  name: "модуль сканера реагентів"
  description: "Модуль на основі дослідницьких проєкційних дисплеїв «Нанотрейзен». Сканує вміст контейнерів і показує інформацію у зручному для читання форматі на дисплеї носія. Смаків не розпізнає, це вже на ваш розсуд."
  components:
  - type: Sprite
    state: scanner
  - type: ModularSuitModuleEffect
    activeComponents:
    - type: SolutionScanner
  - type: ModularSuitModule
    powerUsage: 0.2
    verbIcon:
      sprite: *modules-rsi
      state: scanner

# Core
- type: entity
  parent: BaseSuitModule
  id: AntiGravitySuitModule
  name: "антигравітаційний модуль"
  description: "Модуль використовує гравітаційне ядро, щоб зробити користувача повністю невагомим."
  components:
  - type: Sprite
    state: antigrav
  - type: RadiationBlockingContainer
    resistance: 5
  - type: ModularSuitModuleContainerRequirement
    failureMessage: modsuit-module-requires-gravity-core
    requiredContainerId: module_core
  - type: ModularSuitModuleEffect
    activeComponents:
    - type: AntiGravityClothing
  - type: ModularSuitModule
    powerUsage: 0.45
    verbIcon:
      sprite: *modules-rsi
      state: antigrav
  - type: ContainerContainer
    containers:
      module_core: !type:ContainerSlot { }
  - type: ItemSlots
    slots:
      module_core:
        name: module-core-slot-name-default
        whitelist:
          tags:
          - GravityCore
  - type: ItemMapper
    mapLayers:
      antigrav_core:
        whitelist:
          tags:
          - GravityCore
  - type: Appearance

- type: entity
  parent: BaseSuitModule
  id: TeleporterSuitModule
  name: "телепортаційний модуль"
  description: "Модуль використовує блюспейс-ядро, щоб переносити частинки користувача в інше місце."
  components:
  - type: Sprite
    state: teleporter
  - type: ModularSuitActionModule
    action: ActivateTeleporterModuleAction
  - type: ModularSuitModuleContainerRequirement
    failureMessage: modsuit-module-requires-bluespace-core
    requiredContainerId: module_core
  - type: ModularSuitModule
    powerInstanceUsage: 25
    canBeDisabled: false
    active: true
    verbIcon:
      sprite: *modules-rsi
      state: teleporter
  - type: ContainerContainer
    containers:
      module_core: !type:ContainerSlot { }
  - type: ItemSlots
    slots:
      module_core:
        name: module-core-slot-name-default
        whitelist:
          tags:
          - BluespaceCore
  - type: ItemMapper
    mapLayers:
      teleporter_core:
        whitelist:
          tags:
          - BluespaceCore
  - type: Appearance

# Printed
- type: entity
  parent: BaseSuitModule
  id: WeldingSuitModule
  name: "зварювальний модуль"
  description: "Установлений у візор костюма модуль проєктує перед очима користувача поляризовану голографічну накладку. Її рівень захисту достатній проти таких крайнощів, як точкове й дугове зварювання, сонячні затемнення та ручні ліхтарики."
  components:
  - type: Sprite
    state: welding
  - type: ModularSuitModuleEffect
    targetSlot: head
    activeComponents:
    - type: FlashImmunity
    - type: EyeProtection
  - type: ModularSuitModule
    tags: [ WeldingModuleConflict ]
    modulePart: Helmet
    canBeDisabled: false
    active: true
    verbIcon:
      sprite: *modules-rsi
      state: welding
  - type: Tag
    tags:
    - WeldingModuleConflict

- type: entity
  parent: BaseSuitModule
  id: TRaySuitModule
  name: "т-променевий модуль"
  description: "Установлений у візор костюма модуль дає змогу імпульсом терагерцового випромінювання фактично ехолокувати об'єкти під підлогою, переважно кабелі й труби. Незамінний для атмосферних робіт і протидії контрабанді."
  components:
  - type: Sprite
    state: tray
  - type: ModularSuitItemModule
    handId: tray-hand
    item: trayScanner
  - type: ModularSuitModule
    modulePart: Gloves
    powerUsage: 0.15
    verbIcon:
      sprite: *modules-rsi
      state: tray

- type: entity
  parent: BaseSuitModule
  id: HealthAnalyzerSuitModule
  name: "модуль аналізатора здоров'я"
  description: "Установлений у рукавицю костюма високотехнологічний комплекс біологічного сканування. Одним рухом зап'ястка дає докладну інформацію про життєві показники й травми інших навіть на відстані. Дані зручно показуються на проєкційному дисплеї шолома, але скористатися ними маєте ви."
  components:
  - type: Sprite
    state: health
  - type: ModularSuitItemModule
    handId: health-analyzer-hand
    item: HandheldHealthAnalyzer
  - type: ModularSuitModule
    modulePart: Gloves
    powerUsage: 0.75
    verbIcon:
      sprite: *modules-rsi
      state: health

- type: entity
  parent: BaseSuitModule
  id: DefibrillatorSuitModule
  name: "модуль дефібрилятора"
  description: "Установлений у рукавицю костюма компактний дефібрилятор, здатний урятувати пацієнта із зупинкою серця електричним розрядом. «Нанотрейзен» радить не використовувати його як зброю, але зупинити вас не може."
  components:
  - type: Sprite
    state: defibrillator
  - type: ModularSuitItemModule
    handId: defibrillator-hand
    item: DefibrillatorOneHandedUnpowered
  - type: ModularSuitModule
    modulePart: Gloves
    powerUsage: 2
    verbIcon:
      sprite: *modules-rsi
      state: defibrillator

- type: entity
  parent: BaseSuitModule
  id: JetpackSuitModule
  name: "модуль іонного джетпака"
  description: "Низка електричних рушіїв, установлених по всьому костюму. Цей модуль дуже чекають інженери-стажери. Замість спалювання газів для створення тяги рушії розганяють іони зарядом батареї костюма. Кажуть, це не перша спроба «Накамура Інжиніринг» створити костюм із реактивною тягою."
  components:
  - type: Sprite
    state: jetpack
  - type: ModularSuitItemModule
    handId: jetpack-hand
    item: JetpackBlueModule
  - type: ModularSuitModule
    tags: [ JetpackSuitModule ]
    modulePart: Torso
    powerUsage: 1.25
    verbIcon:
      sprite: *modules-rsi
      state: jetpack
  - type: Tag
    tags:
    - JetpackSuitModule

- type: entity
  parent: BaseSuitModule
  id: BaseMagnetSuitModule
  abstract: true
  components:
  - type: Sprite
    state: magnet
  - type: ModularSuitModule
    tags: [ MagneticSuitModule, NoSlipModuleConflict ]
    modulePart: Boots
    verbIcon:
      sprite: *modules-rsi
      state: magnet
  - type: Tag
    tags:
    - MagneticSuitModule

- type: entity
  parent: BaseMagnetSuitModule
  id: MagnetSuitModule
  name: "магнітний модуль"
  description: "Потужні електромагніти в чоботах костюма забезпечують чудове зчеплення в приміщеннях за будь-яких умов і дають змогу фактично їхати ззовні на корпусі корабля. Однак ці базові моделі не мають комп'ютерних систем автоматичного перемикання, тому багато користувачів скаржаться на певну липкість кроків."
  components:
  - type: ModularSuitActionModule
    action: ToggleMagbootsModuleAction
  - type: ModularSuitMagbootsModule
    targetSlot: shoes
    activeComponents:
    - type: NoSlip
    - type: Magboots
    - type: ClothingSpeedModifier
      walkModifier: 0.8
      sprintModifier: 0.8
  - type: ModularSuitModule
    powerUsage: 0.4
  - type: Tag
    tags:
    - MagneticSuitModule

- type: entity
  parent: BaseSuitModule
  id: HolsterSuitModule
  name: "модуль кобури"
  description: "Заснована на звичайних відсіках зберігання система дає змогу закріпити стандартну вогнепальну зброю на поверхні костюма й надзвичайно швидко її діставати. Одні користувачі надають перевагу грудям, інші передпліччю, а деякі правоохоронці полюбляють кобуру, що висувається зі стегна."
  components:
  - type: Sprite
    state: holster
  - type: ModularSuitActionModule
    action: ToggleHolsterModuleAction
  - type: ModularSuitModule
    modulePart: Torso
    powerInstanceUsage: 2.5
    canBeDisabled: false
    active: true
    verbIcon:
      sprite: *modules-rsi
      state: holster
  - type: ContainerContainer
    containers:
      module_weapon: !type:ContainerSlot { }
  - type: ItemSlots
    slots:
      module_weapon:
        name: module-weapon-slot-name-default
        whitelist:
          components:
          - BallisticAmmoProvider
          - ChamberMagazineAmmoProvider

- type: entity
  parent: BaseSuitModule
  id: TetherSuitModule
  name: "модуль аварійного фала"
