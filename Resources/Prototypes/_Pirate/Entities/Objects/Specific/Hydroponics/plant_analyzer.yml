- type: entity
  id: PlantAnalyzer
  parent: [ BaseHandheldComputer ]
  name: plant analyzer
  description: A hand-held plant scanner capable of analyzing plants and seeds.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Devices/plantanalyzer.rsi
    state: icon
    layers:
    - state: icon
    - state: analyzer
      shader: unshaded
      visible: true
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Item
    heldPrefix: analyzer
  - type: ActivatableUI
    key: enum.PlantAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PlantAnalyzerUiKey.Key:
        type: PlantAnalyzerBoundUserInterface
  - type: PlantAnalyzer
    scanningEndSound:
      path: "/Audio/Items/Medical/healthscanner.ogg"
  - type: PowerCellDraw
    drawRate: 1.2
  - type: ToggleCellDraw
  - type: ActivatableUIRequiresPowerCell
  - type: Appearance
  - type: Tag
    tags:
    - PlantAnalyzer

- type: entity
  id: PlantAnalyzerDebug
  parent: [ BaseHandheldComputer ]
  name: plant analyzer (debug)
  description: A debug plant scanner that does not draw power and scans instantly.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Devices/plantanalyzer.rsi
    state: icon
    layers:
    - state: icon
    - state: analyzer
      shader: unshaded
      visible: true
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
  - type: Item
    heldPrefix: analyzer
  - type: ActivatableUI
    key: enum.PlantAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.PlantAnalyzerUiKey.Key:
        type: PlantAnalyzerBoundUserInterface
  - type: PlantAnalyzer
    settings:
      scanDelay: 0
      maxScanRange: 999
  - type: Appearance
  - type: Tag
    tags:
    - PlantAnalyzer

# Pirate: retain the report paper.
- type: entity
  name: plant analyzer report
  parent: Paper
  id: PlantAnalyzerReportPaper
  description: A printout from a plant analyzer.
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper_receipt_horizontal
    - state: paper_receipt_horizontal_words
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperVisuals
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_perforated.svg.96dpi.png"
    backgroundImageTile: true
    backgroundPatchMargin: 6.0, 0.0, 6.0, 0.0
    contentMargin: 6.0, 6.0, 6.0, 6.0
    maxWritableArea: 375.0, 600.0
