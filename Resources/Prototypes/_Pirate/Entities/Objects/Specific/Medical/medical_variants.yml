# Pirate medical vendor variants.

## DeForest bruise packs
- type: entity
  name: "пакет DeForest від забиттів"
  description: "Медичний пакет DeForest для лікування тупих травм."
  parent: BaseHealingItem
  id: DeforestBrutePack
  suffix: Full
  components:
  - type: Tag
    tags:
    - Brutepack
  - type: Sprite
    sprite: _Pirate/Objects/Specific/Medical/medical_variants.rsi
    state: bluebrutepack2
  - type: Item
    # Pirate: the variant RSI only contains world sprites; use the base in-hand states.
    sprite: Objects/Specific/Medical/medical.rsi
    heldPrefix: brutepack
  - type: Stack
    stackType: DeforestBrutePack
    count: 15
  - type: StackPrice
    price: 5
  - type: Healing
    damageContainers:
    - Biological
    - Skeleton
    delay: 1.6
    damage:
      groups:
        Brute: -24
    healingBeginSound:
      path: /Audio/Items/Medical/brutepack_begin.ogg
    healingEndSound:
      path: /Audio/Items/Medical/brutepack_end.ogg

- type: entity
  name: "пакет DeForest від забиттів"
  description: "Медичні пакети DeForest для лікування тупих травм. Сині, кажуть, рідкісні."
  parent: DeforestBrutePack
  id: DeforestBrutePack1
  suffix: Single
  components:
  - type: Sprite
    state: bluebrutepack
  - type: Stack
    stackType: DeforestBrutePack
    count: 1

- type: stack
  parent: BaseSmallStack
  id: DeforestBrutePack
  name: stack-deforestbrutepack
  icon: { sprite: /Textures/_Pirate/Objects/Specific/Medical/medical_variants.rsi, state: bluebrutepack }
  spawn: DeforestBrutePack1
  maxCount: 15

## DeForest ointments
- type: entity
  name: "мазь DeForest"
  description: "Мазь DeForest для лікування опіків, що не діє на їдкі опіки."
