# Pirate medical vendor variants.

## DeForest bruise packs
- type: entity
  name: DeForest bruise pack
  description: DeForest-grade bruise packs for all your needs.
  parent: BaseHealingItem
  id: DeforestBrutePack
  suffix: Full
  components:
  - type: Tag
    tags:
    - Brutepack
  - type: Sprite
    sprite: _Pirate/Objects/Specific/Medical/medical_variants.rsi
    state: bluebrutepack2
  - type: Item
    # Pirate: the variant RSI only contains world sprites; use the base in-hand states.
    sprite: Objects/Specific/Medical/medical.rsi
    heldPrefix: brutepack
  - type: Stack
    stackType: DeforestBrutePack
    count: 15
  - type: StackPrice
    price: 5
  - type: Healing
    damageContainers:
    - Biological
    - Skeleton
    delay: 1.6
    damage:
      groups:
        Brute: -24
    healingBeginSound:
      path: /Audio/Items/Medical/brutepack_begin.ogg
    healingEndSound:
      path: /Audio/Items/Medical/brutepack_end.ogg

- type: entity
  name: DeForest bruise pack
  description: DeForest-grade bruise packs for all your needs. The blue ones are supposedly rare.
  parent: DeforestBrutePack
  id: DeforestBrutePack1
  suffix: Single
  components:
  - type: Sprite
    state: bluebrutepack
  - type: Stack
    stackType: DeforestBrutePack
    count: 1

- type: stack
  parent: BaseSmallStack
  id: DeforestBrutePack
  name: stack-deforestbrutepack
  icon: { sprite: /Textures/_Pirate/Objects/Specific/Medical/medical_variants.rsi, state: bluebrutepack }
  spawn: DeforestBrutePack1
  maxCount: 15

## DeForest ointments
- type: entity
  name: DeForest ointment
  description: DeForest's soothing ointment treats severe burns but does nothing for caustic burns.
  parent: BaseHealingItem
  id: DeforestOintment
  suffix: Full
  components:
  - type: Tag
    tags:
    - Ointment
  - type: Sprite
    sprite: _Pirate/Objects/Specific/Medical/medical_variants.rsi
    state: blueointment3
  - type: Item
    # Pirate: the variant RSI only contains world sprites; use the base in-hand states.
    sprite: Objects/Specific/Medical/medical.rsi
    heldPrefix: ointment
