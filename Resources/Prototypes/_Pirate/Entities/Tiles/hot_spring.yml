    effects:
    - HotSpringSteam1Pirate
    - HotSpringSteam2Pirate
    - HotSpringSteam3Pirate
    - HotSpringSteam4Pirate
    - HotSpringSteam5Pirate
  - type: SolutionContainerManager
    solutions:
      pool:
        maxVol: 9999999
        temperature: 313.15
        reagents:
        - ReagentId: Water
          Quantity: 9999999

