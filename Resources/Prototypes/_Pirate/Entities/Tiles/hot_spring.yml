    sprite: _Pirate/Tiles/hot_spring.rsi
    layers:
    - state: pool_1
      map: [ "water" ]
  - type: RandomSprite
    available:
    - water:
        pool_1: ""
        pool_2: ""
        pool_3: ""
        pool_4: ""

- type: entity
  parent: FloorWaterEntityHotSpringBasePirate
  id: FloorWaterEntityHotSpringPlanetPirate
