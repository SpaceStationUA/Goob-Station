### База для нових банерів
- type: entity
  id: BannerBaseTP
  parent: BannerBase
  abstract: true
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Banners/banner.rsi
    layers:
    - state: banner
      map: ["unfoldedLayer"]
    - sprite: _Pirate/Structures/Banners/rolled.rsi
      state: rolled
      map: ["foldedLayer"]
      visible: false
  - type: Foldable
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.FoldedVisuals.State:
        foldedLayer:
          True: {visible: true}
          False: {visible: false}
        unfoldedLayer:
          True: {visible: false}
          False: {visible: true}
  - type: Item
    size: Normal

### Банери з новою базою
- type: entity
  id: BannerCybersun
  parent: BannerBaseTP
  name: "банер Кіберсан"
  description: "Банер із логотипом «Кіберсан Індастріз». Це дуже таємнича корпорація."
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Banners/banner.rsi
    layers:
    - state: cydersun
      map: ["unfoldedLayer"]
    - sprite: _Pirate/Structures/Banners/rolled.rsi
      state: cydersun-rolled
      map: ["foldedLayer"]
      visible: false
  - type: Construction
    graph: BannersGraph
    node: BannerCybersunNode

