# Pirate: Shipyard source maps use a layer-one connector port; retain the local GasPort schema with the layer-one pipe sprite.
- type: entity
  parent: [GasPipeLayerAlt1, GasPort]
  id: GasPortAlt1
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Structures/Piping/Atmospherics/gascanisterport.rsi
    layers:
    - sprite: Structures/Piping/Atmospherics/pipe_alt1.rsi
      state: pipeUnaryConnectors
      map: [ "enum.PipeVisualLayers.Pipe" ]
    - state: gasCanisterPort
      map: [ "enum.SubfloorLayers.FirstLayer" ]
