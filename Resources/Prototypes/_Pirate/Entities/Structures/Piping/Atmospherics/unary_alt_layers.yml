## Pirate: pipe layer placement
## Duplicated unary atmos device prototypes with different pipe layer offsets, mirroring
## Resources/Prototypes/Entities/Structures/Piping/Atmospherics/alt_layers.yml, so vents,
## scrubbers, passive vents and injectors can be placed onto pipe layers 1-3 while mapping.
## Only the connector stub sprite is swapped to the offset pipe_alt RSIs; the pipe layer of the
## device (and therefore which network it joins) is driven by the AtmosPipeLayers component,
## which is set to layer 1/2 via the GasPipeLayerAlt1/GasPipeLayerAlt2 parents.

# GasVentPump

- type: entity
  parent: [GasPipeLayerAlt1, GasVentPump]
  id: GasVentPumpAlt1
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: FloorObjects
    sprite: Structures/Piping/Atmospherics/vent.rsi
    noRot: true
    layers:
      - sprite: Structures/Piping/Atmospherics/pipe_alt1.rsi
        state: pipeUnaryConnectors
        map: [ "enum.PipeVisualLayers.Pipe" ]
      - state: vent_off
        map: [ "enabled", "enum.SubfloorLayers.FirstLayer" ]

- type: entity
  parent: [GasPipeLayerAlt2, GasVentPump]
  id: GasVentPumpAlt2
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    drawdepth: FloorObjects
    sprite: Structures/Piping/Atmospherics/vent.rsi
    noRot: true
    layers:
      - sprite: Structures/Piping/Atmospherics/pipe_alt2.rsi
        state: pipeUnaryConnectors
        map: [ "enum.PipeVisualLayers.Pipe" ]
      - state: vent_off
        map: [ "enabled", "enum.SubfloorLayers.FirstLayer" ]

