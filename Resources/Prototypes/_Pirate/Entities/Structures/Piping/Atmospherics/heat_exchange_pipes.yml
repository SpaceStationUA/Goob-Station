- type: entity
  abstract: true
  parent: HeatExchanger
  id: PirateHeatExchangePipeBase
  name: inline radiator
  description: Transfers heat between the pipe and its surroundings. Doesn't need gas flow. Only connects to other heat exchange pipes.
  placement:
    mode: AlignAtmosPipeLayers
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Piping/Atmospherics/he_pipe.rsi
    drawdepth: ThinPipeAlt1
    layers:
    - state: pipeStraight
      map: [ "enum.PipeVisualLayers.Pipe", "enum.SubfloorLayers.FirstLayer" ]
  - type: PipeAppearance
    sprite:
    - sprite: _Pirate/Structures/Piping/Atmospherics/he_pipe.rsi
      state: pipeConnector
    - sprite: _Pirate/Structures/Piping/Atmospherics/he_pipe_alt1.rsi
      state: pipeConnector
    - sprite: _Pirate/Structures/Piping/Atmospherics/he_pipe_alt2.rsi
      state: pipeConnector
  - type: AtmosPipeLayers
    numberOfPipeLayers: 3
    spriteLayersRsiPaths:
      enum.PipeVisualLayers.Pipe:
        Primary: _Pirate/Structures/Piping/Atmospherics/he_pipe.rsi
        Secondary: _Pirate/Structures/Piping/Atmospherics/he_pipe_alt1.rsi
        Tertiary: _Pirate/Structures/Piping/Atmospherics/he_pipe_alt2.rsi
  - type: HeatExchanger
    inlet: pipe
    outlet: pipe
  - type: NodeContainer
    nodes:
      pipe:
        !type:HeatExchangePipeNode
        nodeGroupID: Pipe
        pipeDirection: Longitudinal
  - type: Construction
    graph: PirateHeatExchangePipe
    node: heStraight

- type: entity
  parent: PirateHeatExchangePipeBase
  id: HeatExchangerInlineManifold
  suffix: Manifold
  components:
  - type: Sprite
    layers:
    - state: pipeTJunction
      map: [ "enum.PipeVisualLayers.Pipe", "enum.SubfloorLayers.FirstLayer" ]
  - type: NodeContainer
    nodes:
      pipe:
        !type:HeatExchangePipeNode
        nodeGroupID: Pipe
        pipeDirection: TSouth
  - type: AtmosPipeLayers
    alternativePrototypes:
      Primary: HeatExchangerInlineManifold
      Secondary: HeatExchangerInlineManifoldAlt1
      Tertiary: HeatExchangerInlineManifoldAlt2
  - type: Construction
    graph: PirateHeatExchangePipe
    node: heManifold

- type: entity
  parent: [GasPipeLayerAlt1, HeatExchangerInlineManifold]
