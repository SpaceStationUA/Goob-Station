- type: entity
  parent: PirateHeatExchangePipeBase
  id: HeatExchangerInlineJunction
  name: heat exchange junction
  suffix: Junction
  description: Ties a heat exchange pipe run into ordinary pipework. Insulated, so it radiates no heat of its own.
  components:
  - type: HeatExchanger
    inlet: pipe
    outlet: pipe
    convectionCoefficient: 0
    radiationCoefficient: 0
  - type: Sprite
    layers:
    - state: junction
      map: [ "enum.PipeVisualLayers.Pipe", "enum.SubfloorLayers.FirstLayer" ]
  - type: NodeContainer
    nodes:
      pipe:
        !type:HeatExchangeJunctionPipeNode
        nodeGroupID: Pipe
        pipeDirection: Longitudinal
        heatExchangeDirection: South
  - type: AtmosPipeLayers
    alternativePrototypes:
      Primary: HeatExchangerInlineJunction
      Secondary: HeatExchangerInlineJunctionAlt1
      Tertiary: HeatExchangerInlineJunctionAlt2
  - type: Construction
    graph: PirateHeatExchangePipe
    node: heJunction

