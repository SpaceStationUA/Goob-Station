#region База
- type: entity
  id: TPSofaBase
  name: Sofa
  description: A comfortable sofa to sit on.
  parent: [SeatBase, BaseStructure]
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: HealOnBuckle
    damage:
      types:
        Poison: -0.1
        Blunt: -0.1
  - type: Strap
    position: Down
    rotation: 0
  - type: StaticPrice
    price: 50

- type: entity
  id: TPSofaCornerBase
  abstract: true
  placement:
    mode: SnapgridCenter
  components:
  - type: Transform
    anchored: true
  - type: Rotatable
  - type: Clickable
  - type: InteractionOutline
  - type: Pullable
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: StaticPrice
    price: 50



#region Чорний
- type: entity
  name: black sofa
  id: SofaBlack
  parent: TPSofaBase
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Furniture/Sofas/black.rsi
    state: sofa_middle
  - type: Construction
    graph: TPSofas
    node: sofablackmiddle

- type: entity
  id: SofaBlackLeft
  parent: SofaBlack
  components:
  - type: Sprite
    state: sofa_left
  - type: Construction
    node: sofablackleft

- type: entity
  id: SofaBlackRight
  parent: SofaBlack
  components:
  - type: Sprite
    state: sofa_right
  - type: Construction
    node: sofablackright

- type: entity
  name: black sofa
  id: SofaBlackCorner
  parent: TPSofaCornerBase
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Furniture/Sofas/black.rsi
    state: sofa_corner
  - type: Construction
    graph: TPSofas
    node: sofablackcorner



