#region Крісло для штанги
- type: entity
  name: barbell chair
  id: BarbellChair
  parent: ChairBase
  description: Крісло, на яке можна повісити штангу.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Furniture/Chairs/barbell_chair.rsi
    layers:
    - state: barbell-chair
      map: ["base"]
    - state: barbell-chair
      map: ["barbell-slot"]
      visible: false
  - type: BarbellBench
    overlayPrototype: BarbellBenchOverlay
  - type: BarbellBenchVisuals
    attachedState: barbell_chair-overlay
    overlayBaseState: barbell_chair-overlay
    overlayRepFlickState: barbell-raises-overlay
  - type: Appearance
  - type: ContainerContainer
    containers:
      barbell-slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      barbell-slot:
        insertSound: /Audio/_Pirate/Furniture/barbell/barbell_3.ogg
        ejectSound: /Audio/_Pirate/Furniture/barbell/barbell_2.ogg
        whitelist:
          tags:
          - BarbellAttachment
  - type: Construction
    graph: TPSeat
    node: barbellchair
