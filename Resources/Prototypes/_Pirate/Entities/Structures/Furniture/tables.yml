#region Круглі
- type: entity
  id: TableRoundFrame
  parent: BaseStructure
  name: round table frame
  description: Pieces of metal that make the frame of a round table.
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Furniture/Tables/roundtable.rsi
    state: round_frame
    noRot: true
  - type: Icon
    sprite: _Pirate/Structures/Furniture/Tables/roundtable.rsi
    state: round_frame
  - type: Animateable
  - type: PlaceableSurface
  - type: Climbable
  - type: Clickable
  - type: SpriteFade
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 55
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          PartRodMetal1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Bonkable
    bonkDamage:
      types:
        Blunt: 4
  - type: Tag
    tags:
    - Table
    - ForceFixRotations
  - type: RequireProjectileTarget
    ignoreThrow: true
  - type: Construction
    graph: TPTable
    node: tableroundframe

