#region Звичайні
- type: entity
  id: TablePlastic
  parent: TableBase
  name: plastic table
  description: A square piece of plastic, standing on four metal legs.
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Furniture/Tables/plastic.rsi
  - type: Icon
    sprite: _Pirate/Structures/Furniture/Tables/plastic.rsi
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetPlastic1:
            min: 1
            max: 1
      - !type:ChangeConstructionNodeBehavior
        node: tptableframe
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: plastictable
  - type: Construction
    graph: Table
    node: tableplastic
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepTile

- type: entity
  id: TableUraniumGlass
  parent: TableBase
  name: uranium glass table
  description: A square piece of uranium glass, standing on four metal legs. Radioactive!
  components:
