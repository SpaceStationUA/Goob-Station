#region Особливі
- type: entity
  id: TableRoulette
  parent: BaseStructure
  name: roulette table
  description: A roulette wheel table.
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Furniture/Tables/roulette.rsi
    noRot: false
    layers:
    - state: idle
      map: ["enum.RouletteVisualLayers.Base"]
  - type: Icon
    sprite: _Pirate/Structures/Furniture/Tables/roulette.rsi
    state: idle
  - type: Appearance
  - type: Roulette
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.72,-0.35,0.7,0.25"
        density: 55
        mask: [TableMask]
        layer: [TableLayer]
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Anchorable
  - type: Rotatable
    rotateWhileAnchored: true
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
  - type: Construction
    graph: TPTable
    node: tableroulette
  - type: Tag
    tags: [Table, ForceFixRotations]
