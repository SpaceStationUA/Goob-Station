# /tg/ gases - Hyper-Noblium & Anti-Noblium canisters

- type: entity
  parent: GasCanister
  id: HyperNobliumCanister
  name: hyper-noblium canister
  description: A canister that can contain any type of gas. This one is supposed to contain hyper-noblium. It can be attached to connector ports using a wrench.
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Storage/canister.rsi
    layers:
    - state: hypernoblium
  - type: GasCanister
    gasMixture:
      volume: 1000
      moles:
      - 0     # oxygen
      - 0     # nitrogen
      - 0     # CO2
      - 0     # Plasma
      - 0     # Tritium
      - 0     # Water vapor
      - 0     # Miasma
      - 0     # N2O
      - 0     # Frezon
      - 0     # BZ
      - 0     # Healium
      - 0     # Nitrium
      - 0     # Pluoxium
      - 1871.71051 # HyperNoblium
      temperature: 293.15
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          HyperNobliumCanisterBroken:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:DumpCanisterBehavior
  - type: Lock
    locked: true

