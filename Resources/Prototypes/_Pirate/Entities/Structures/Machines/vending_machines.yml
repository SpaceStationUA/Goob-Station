# Pirate medical vendor variations.

## Interdyne
- type: entity
  parent: VendingMachineMedicalBase
  id: VendingMachineMedicalBaseSyndicate
  name: Interdyne Commercial
  suffix: Civilian
  description: A medical drug dispenser by Interdyne Pharmaceutics.
  components:
  - type: VendingMachine
    pack: InterdyneCommercialInventory
    offState: off-civilian
    brokenState: broken
    normalState: normal-unshaded
    ejectState: eject-unshaded
    denyState: deny-unshaded
    ejectDelay: 0.6
  - type: DatasetVocalizer
    dataset: InterdyneAds
  - type: SpeakOnUIClosed
    pack: GenericVendGoodbyes
  - type: Sprite
    sprite: _Pirate/Structures/Machines/VendingMachines/interdyne_medical.rsi
    layers:
    - state: off-civilian
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: off-civilian
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.5
    energy: 3.0
    color: "#9dc5c9"

- type: entity
  parent: VendingMachineMedicalBaseSyndicate
  id: VendingMachineMedicalSyndicate
  name: Interdyne Enterprise
  suffix: Departmental
  components:
  - type: VendingMachine
    pack: InterdyneEnterpriseInventory
    offState: off
  - type: Sprite
    layers:
    - state: off
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: off
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - state: panel
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: AccessReader
    access: [["Medical"], ["SyndicateAgent"]]

- type: entity
  parent: VendingMachineWallmount
  id: VendingMachineWallMedicalCivilianSyndicate
  name: Interdyne life-aid commercial
  suffix: Civilian, Wallmount
  description: A wall-mounted medical equipment dispenser by Interdyne Pharmaceutics.
  components:
  - type: VendingMachine
    pack: InterdyneCommercialWallInventory
    offState: off-civilian
    brokenState: broken
    normalState: normal-unshaded
    denyState: deny-unshaded
  - type: Sprite
    sprite: _Pirate/Structures/Machines/VendingMachines/interdyne_wallmed.rsi
    layers:
    - state: off-civilian
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: off-civilian
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - texture: Structures/Machines/VendingMachines/maintenance_panel.png
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: PointLight
    radius: 1.3
    energy: 3.0
    color: "#43ccb5"

- type: entity
  parent: VendingMachineWallMedicalCivilianSyndicate
  id: VendingMachineWallMedicalSyndicate
  name: Interdyne life-aid enterprise
  suffix: Departmental, Wallmount
  components:
  - type: VendingMachine
    pack: InterdyneEnterpriseWallInventory
    offState: off
  - type: Sprite
    layers:
    - state: off
      map: ["enum.VendingMachineVisualLayers.Base"]
    - state: off
      map: ["enum.VendingMachineVisualLayers.BaseUnshaded"]
      shader: unshaded
    - texture: Structures/Machines/VendingMachines/maintenance_panel.png
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
  - type: AccessReader
