# Worldwide, unredacted NanoChat relay for designated Syndicate PDAs.
- type: entity
  parent: TelecomServer
  id: SyndicateNanoChatRelay
  name: "вузол підпросторової ретрансляції"
  suffix: Syndicate NanoChat relay
  description: "Телекомунікаційний сервер із хитрим підключенням. Передає чужі дзвінки всюди водночас, прослуховує розмови й нікому не підпорядковується."
  components:
  - type: SyndicateNanoChatRelay
  - type: NanoChatLogHost
    requiresKey: false
  - type: Machine
    board: SyndicateNanoChatRelayCircuitboard

# Reconstruction board only. Deliberately absent from lathes, research and cargo.
- type: entity
  parent: BaseMachineCircuitboard
  id: SyndicateNanoChatRelayCircuitboard
  name: "плата вузла підпросторової ретрансляції"
  description: "Друкована плата вузла підпросторової ретрансляції."
  components:
  - type: Sprite
    state: engineering
  - type: MachineBoard
    prototype: SyndicateNanoChatRelay
    stackRequirements:
      Steel: 1
      Cable: 2
