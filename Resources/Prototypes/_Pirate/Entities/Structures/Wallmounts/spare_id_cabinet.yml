- type: entity
  parent: FireAxeCabinet
  id: SpareIdCabinet
  name: "сейф резервного ID"
  description: "На маленькій табличці написано: «Лише для надзвичайних ситуацій»."
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50000 # Good luck lol
  - type: Sprite
    sprite: _Pirate/Structures/Wallmounts/idcard_cabinet.rsi
    layers:
    - state: cabinet
    - state: card
      map: ["enum.ItemCabinetVisuals.Layer"]
      visible: true
    - state: glass
      map: ["enum.OpenableVisuals.Layer"]
  - type: ItemSlots
    slots:
      ItemCabinet:
        ejectOnInteract: true
        whitelist:
          components:
          - IdCard
  - type: AccessReader
    access: [["DV-SpareSafe"]]
  - type: SpareIDSafe

- type: entity
  parent: SpareIdCabinet
  id: SpareIdCabinetFilled
  suffix: Filled
  components:
  - type: ContainerFill
    containers:
      ItemCabinet:
      - CaptainIDCard
