# ---------------------------------------------------------------------------
# Hyper-torus Fusion Reactor — a 3x3 multipart machine.
#
# Layout (offsets from the core, which is the master entity):
#   corner   waste_output   corner      y: -1..1, x: -1..1
#   fuel     core           moderator
#   corner   interface      corner
#
# Parts face outward: fuel points West, moderator East, waste North,
# interface South. Corners are oriented so their bracket hugs the core.
# ---------------------------------------------------------------------------

# --- Parts ---------------------------------------------------------------

- type: entity
  abstract: true
  parent: BaseStructure
  id: BaseHFRPart
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Machines/hfr_parts.rsi
  - type: Appearance
  - type: InteractionOutline
  - type: Clickable
  - type: Rotatable
  - type: Anchorable
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
        - HighImpassable
  - type: MultipartMachinePart

- type: entity
  parent: BaseHFRPart
  id: HFRFuelInputPart
  name: HFR fuel input port
  description: Input port for the Hypertorus Fusion Reactor, designed to take in fuels. The optimal fuel mix is a 50/50 split.
  components:
  - type: Sprite
    layers:
    - state: fuel_input
      map: [ "enum.HFRVisualLayers.Base" ]
    - state: fuel_input_active
      map: [ "enum.HFRVisualLayers.Active" ]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.HFRVisuals.State:
        enum.HFRVisualLayers.Base:
          Idle: { state: fuel_input, visible: true }
          Active: { state: fuel_input, visible: true }
          Broken: { state: fuel_input, visible: true }
        enum.HFRVisualLayers.Active:
          Idle: { visible: false }
          Active: { state: fuel_input_active, visible: true }
          Broken: { visible: false }
  - type: HFRFuelInput
  - type: NodeContainer
    nodes:
      pipe: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Fourway
        pipeLayer: 0
        volume: 2000
      pipe1: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Fourway
        pipeLayer: 1
        volume: 2000
      pipe2: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Fourway
        pipeLayer: 2
        volume: 2000
  - type: Construction
    graph: HFRFuelInputPart
    node: completed

- type: entity
  parent: BaseHFRPart
  id: HFRFuelInputPartUnfinished
  name: HFR fuel input port
  suffix: Unfinished
  description: Input port for the Hypertorus Fusion Reactor. It looks unfinished.
  components:
  - type: Sprite
    layers:
    - state: fuel_input_open
  - type: HFRFuelInput
  - type: Machine
    board: MachineHFRFuelInputCircuitboard
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Construction
    graph: HFRFuelInputPart
    node: start
    defaultTarget: completed

