          Idle: { state: moderator_input, visible: true }
          Active: { state: moderator_input, visible: true }
          Broken: { state: moderator_input, visible: true }
        enum.HFRVisualLayers.Active:
          Idle: { visible: false }
          Active: { state: moderator_input_active, visible: true }
          Broken: { visible: false }
  - type: HFRModeratorInput
  - type: NodeContainer
    nodes:
      pipe: !type:PipeNode
