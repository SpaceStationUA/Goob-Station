- type: entity
  parent: BaseHFRPart
  id: HFRInterfacePart
  name: HFR interface
  description: Interface for the HFR to control the flow of the reaction.
  components:
  - type: Sprite
    layers:
    - state: interface
      map: [ "enum.HFRVisualLayers.Base" ]
    - state: interface_active
      map: [ "enum.HFRVisualLayers.Active" ]
      visible: false
    # Small coolant-port marker on the outward edge: shows where to hook up the
    # cooling loop (the interface part is the coolant port). 4-direction state so
    # it rotates together with the part.
    - state: interface_coolant
  - type: GenericVisualizer
    visuals:
      enum.HFRVisuals.State:
        enum.HFRVisualLayers.Base:
          Idle: { state: interface, visible: true }
          Active: { state: interface, visible: true }
          Broken: { state: interface, visible: true }
        enum.HFRVisualLayers.Active:
          Idle: { visible: false }
          Active: { state: interface_active, visible: true }
          Broken: { visible: false }
  - type: HFRInterface
  - type: NodeContainer
    nodes:
      pipe: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Fourway
        pipeLayer: 0
        volume: 2000
      pipe1: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Fourway
        pipeLayer: 1
        volume: 2000
      pipe2: !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: Fourway
        pipeLayer: 2
        volume: 2000
