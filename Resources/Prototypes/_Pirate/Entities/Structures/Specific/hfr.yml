# --- Master (core) --------------------------------------------------------

- type: entity
  parent: BaseStructure
  id: HyperTorusFusionReactor
  name: hyper-torus fusion reactor
  description: A fusion reactor that consumes fuel to produce rare gases. Maintaining this is really hard. Expect to spend half an hour building supporting infrastructure.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Machines/hfr_parts.rsi
    layers:
    - state: core
      map: [ "enum.HFRVisualLayers.Base" ]
    - state: core_active
      map: [ "enum.HFRVisualLayers.Active" ]
      visible: false
    - state: crack
      map: [ "enum.HFRVisualLayers.Crack" ]
      visible: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.HFRVisuals.State:
        enum.HFRVisualLayers.Base:
          Idle: { state: core, visible: true }
          Active: { state: core, visible: true }
          Broken: { state: core, visible: true }
        enum.HFRVisualLayers.Active:
          Idle: { visible: false }
          Active: { state: core_active, visible: true }
          Broken: { visible: false }
        enum.HFRVisualLayers.Crack:
          Idle: { visible: false }
          Active: { visible: false }
          Broken: { state: crack, visible: true }
  - type: AmbientSound
    volume: -6
    range: 12
    enabled: false
    sound:
      path: /Audio/_Pirate/Machines/HFR/hypertorus_nominal.wav
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
        - HighImpassable
  - type: InteractionOutline
  - type: Anchorable
    delay: 10
  - type: Rotatable
    rotateWhileAnchored: false
  - type: Damageable
    damageModifierSet: StructuralReactorCasing
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 2000
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: HFR
  - type: WiresPanel
  - type: Machine
    board: MachineHyperTorusFusionReactorCircuitboard
  - type: GuideHelp
    guides:
    - HFR
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container
  - type: Construction
    graph: Machine
    node: machine
    containers:
    - machine_parts
    - machine_board
  - type: MultipartMachine
    parts:
      enum.HFRParts.FuelInput:
        component: HFRFuelInput
        offset: -1, 0
        rotation: 270
        ghostProto: HFRFuelInputPart
        graph: HFRFuelInputPart
        expectedNode: completed
      enum.HFRParts.ModeratorInput:
        component: HFRModeratorInput
        offset: 1, 0
        rotation: 90
        ghostProto: HFRModeratorInputPart
        graph: HFRModeratorInputPart
        expectedNode: completed
      enum.HFRParts.WasteOutput:
        component: HFRWasteOutput
        offset: 0, 1
        rotation: 180
        ghostProto: HFRWasteOutputPart
        graph: HFRWasteOutputPart
        expectedNode: completed
      enum.HFRParts.Interface:
        component: HFRInterface
        offset: 0, -1
        rotation: 0
        ghostProto: HFRInterfacePart
        graph: HFRInterfacePart
        expectedNode: completed
      enum.HFRParts.CornerNW:
        component: HFRCorner
        offset: -1, 1
        rotation: 180
        ghostProto: HFRCornerPart
        graph: HFRCornerPart
        expectedNode: completed
      enum.HFRParts.CornerNE:
        component: HFRCorner
        offset: 1, 1
        rotation: 90
        ghostProto: HFRCornerPart
        graph: HFRCornerPart
        expectedNode: completed
      enum.HFRParts.CornerSW:
        component: HFRCorner
        offset: -1, -1
        rotation: 270
        ghostProto: HFRCornerPart
        graph: HFRCornerPart
        expectedNode: completed
      enum.HFRParts.CornerSE:
        component: HFRCorner
        offset: 1, -1
        rotation: 0
        ghostProto: HFRCornerPart
        graph: HFRCornerPart
        expectedNode: completed
  - type: AtmosDevice
  - type: RadiationSource
    intensity: 0
  - type: ActivatableUI
    key: enum.HFRUiKey.Key
  - type: ActivatableUIRequiresAnchor
  - type: UserInterface
    interfaces:
      enum.HFRUiKey.Key:
        type: HFRBoundUserInterface
