- type: entity
  id: CEActionZFlightUp
  name: "Піднятися"
  description: "Піднятися на один поверх"
  components:
  - type: Action
    useDelay: 1.5
    icon:
      sprite: _Pirate/Actions/misc.rsi
      state: up
  - type: InstantAction
    event: !type:CEZFlightActionUp

- type: entity
  id: CEActionZFlightDown
  name: "Спуститися"
  description: "Спуститися на один поверх"
  components:
  - type: Action
    useDelay: 1.5
    icon:
      sprite: _Pirate/Actions/misc.rsi
      state: down
  - type: InstantAction
    event: !type:CEZFlightActionDown

- type: entity
  parent: BaseToggleAction
  id: CEActionZFlightToggle
  name: "Перемкнути режим польоту"
  description: "Увімкнути або вимкнути режим польоту"
  components:
  - type: Action
    useDelay: 1.5
    icon:
      sprite: _Pirate/Actions/misc.rsi
      state: toggle_flight
    iconOn:
      sprite: _Pirate/Actions/misc.rsi
      state: toggle_flight_on
