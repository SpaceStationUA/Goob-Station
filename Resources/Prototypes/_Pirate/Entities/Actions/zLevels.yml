- type: entity
  id: CEActionZLevelUp
  name: "Рух вгору"
  description: "Переміститися на поверх вище"
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _Pirate/Actions/misc.rsi
      state: up
  - type: InstantAction
    event: !type:CEZLevelActionUp

- type: entity
  id: CEActionZLevelDown
  name: "Рух вниз"
  description: "Переміститися на поверх нижче"
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _Pirate/Actions/misc.rsi
      state: down
  - type: InstantAction
    event: !type:CEZLevelActionDown

- type: entity
  id: CEActionWeightlessZLevelUp
  parent: CEActionZLevelUp
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _Pirate/Actions/misc.rsi
      state: up

- type: entity
  id: CEActionWeightlessZLevelDown
  parent: CEActionZLevelDown
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _Pirate/Actions/misc.rsi
      state: down

- type: entity
  id: CEActionToggleLookUp
  name: "Подивитися вгору"
  description: "Ви піднімаєте голову й дивитеся в небо."
  components:
  - type: Action
    checkCanInteract: false
    icon:
      sprite: _Pirate/Actions/misc.rsi
      state: eye
  - type: InstantAction
    event: !type:CEToggleZLevelLookUpAction