# Parameters are stored alphabetically in marking colors. The fallback color
# contains the default slider values encoded as RGBA.
# Arachnids and IPC only expose HairSpecial, so facial gradients omit them.

- type: marking
  id: HairGradientRGB2Col
  bodyPart: Hair
  markingCategory: HairSpecial
  canBeDisplaced: false
  shader: GradientRGB2Col
  speciesRestriction: [Human, SlimePerson, Harpy, Vox, Arachnid, IPC, Yowie, BananaMen, Shadow, Vulpkanin, Feroxi]
  coloring:
    layers:
      col1:
        type: !type:MarkingColoring
          colorIndex: 0
          markingId: HairGradientRGB2Col
          markingCategory: HairSpecial
      col2:
        type: !type:MarkingColoring
          colorIndex: 1
          markingId: HairGradientRGB2Col
          markingCategory: HairSpecial
      params:
        type: !type:ShaderParamsMarkingColoring
          params:
            blur: 0.01, 0.5
            proportion: 0, 1
          colorIndex: 2
          markingId: HairGradientRGB2Col
          markingCategory: HairSpecial
        fallbackColor: "#26cc0000"

