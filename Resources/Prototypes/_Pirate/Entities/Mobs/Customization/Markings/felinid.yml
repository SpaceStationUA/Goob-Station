# Pirate - everything here is a Felinid-only copy of a marking that humans (or
# reptilians, for the tail/torso part) already have but felinids did not.
# Markings the felinid could already pick (human hair, facial hair, collars,
# undergarments, the upstream felinid ears/tails, ...) are deliberately absent.

