#region Hair gradients

- type: marking
  id: FelinidHairGradientRGB2Col
  bodyPart: Hair
  markingCategory: HairSpecial
  canBeDisplaced: false
  shader: GradientRGB2Col
  speciesRestriction: [Felinid]
  coloring:
    layers:
      col1:
        type: !type:MarkingColoring
          colorIndex: 0
          markingId: FelinidHairGradientRGB2Col
          markingCategory: HairSpecial
      col2:
        type: !type:MarkingColoring
          colorIndex: 1
          markingId: FelinidHairGradientRGB2Col
          markingCategory: HairSpecial
      params:
        type: !type:ShaderParamsMarkingColoring
          params:
