# Pirate: ported from OmuStation master d61692d693fd1870b2a00e26f25cbfda27b6c49e.

- type: borgType
  id: generic_bug

  # Description
  dummyPrototype: BorgChassisGeneric

  # Functional
  extraModuleCount: 5
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleScience #until sciborgs are added

  defaultModules:
  - BorgModuleTool
  - BorgModuleInflatable
  - BorgModuleArtifact
  - BorgModuleAnomaly

  # Pirate: generic borgs use the local default lawset; OmuScience is source-only.

  radioChannels:
  - Science

  addComponents: # Goobstation
  - type: Inventory
    templateId: borgNoOffset
    displacements:
      head:
        sizeMaps:
          32:
            sprite: _Pirate/Mobs/Species/Cyborgs/displacements.rsi
            state: head

  # Visual
  inventoryTemplateId: borgNoOffset # Pirate: preserve displacement-only hat placement with our inventory system.
  spriteBodyState: robot
  spriteHasMindState: robot_e
  spriteNoMindState: robot_e_r
  spriteToggleLightState: robot_l

  # Pet
  petSuccessString: petting-success-generic-cyborg
  petFailureString: petting-failure-generic-cyborg


