# Bug Medical borg

- type: borgType
  id: medical_bug

  # Description
  dummyPrototype: BorgChassisMedical

  # Functional
  extraModuleCount: 3
  moduleWhitelist:
    tags:
    - BorgModuleGeneric
    - BorgModuleMedical

  defaultModules:
  - BorgModuleTool
  - BorgModuleChemical
  - BorgModuleTopicals
  - BorgModuleRescue
  - BorgModuleSurgery
  # Pirate: this checkout has no separate virology borg module.
  - BorgModuleLollypop # Goobstation


  lawset: Medical # Pirate: local equivalent of OmuMedical.

  radioChannels:
  - Science
  - Medical

  addComponents:
  - type: SolutionScanner
  - type: ShowHealthBars
    damageContainers:
    - Biological
  - type: ShowHealthIcons
    damageContainers:
    - Biological
  - type: Sanitized # Shitmed
  - type: SurgeryTarget # Shitmed
  - type: SurgeryIgnoreClothing
  - type: SurgerySpeedModifier
    speedModifier: 1.5
  - type: Inventory # Goobstation(?) The others had this comment, so i'm putting it here too.
    templateId: borgNoOffset
    displacements:
      head:
        sizeMaps:
          32:
            sprite: _Pirate/Mobs/Species/Cyborgs/displacements.rsi
            state: head

  # Visual
  inventoryTemplateId: borgNoOffset # Pirate: preserve displacement-only hat placement with our inventory system.
  spriteBodyState: medical
  spriteHasMindState: medical_e
  spriteNoMindState: medical_e_r
  spriteToggleLightState: medical_l

  # Pet
  petSuccessString: petting-success-medical-cyborg
  petFailureString: petting-failure-medical-cyborg

  # Sounds
#  footstepCollection:
#    collection: FootstepHoverBorg  # Omitted, due to having feet.

