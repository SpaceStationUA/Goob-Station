    successChance: 1
  - type: Grammar
    attributes:
      proper: true
      gender: female
  - type: Loadout
    prototypes: [ MobSecDogLaikaGear ]
  - type: Tag
    tags:
    - CannotSuicide
    - VimPilot
    - DoorBumpOpener
    - K9
