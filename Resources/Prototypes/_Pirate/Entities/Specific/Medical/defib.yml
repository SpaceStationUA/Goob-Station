- type: entity
  id: DefibrillatorBeltBase
  parent: DefibrillatorCompact
  abstract: true
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Specific/Medical/defibcompact.rsi
    layers:
    - state: icon
    - state: screen
      map: [ "enum.ToggleableVisuals.Layer" ]
      visible: false
      shader: unshaded
    - state: charge100
      map: [ "enum.DefibrillatorChargeLayers.Charge" ]
      visible: false
      shader: unshaded
    - state: nocell
      map: [ "enum.DefibrillatorChargeLayers.NoCell" ]
      visible: false
      shader: unshaded
    - state: emagged
      map: [ "enum.DefibrillatorChargeLayers.Emagged" ]
      visible: false
      shader: unshaded
  - type: DefibrillatorChargeVisuals
  - type: DefibrillatorEmag
    prepDuration: 1
    channelInterval: 1
    channelDamage: 5
    channelChargeCost: 25
  - type: DefibrillatorHideInHand
  - type: Item
    size: Ginormous # too big for bags and boxes
  # Both slots must be declared explicitly: YAML inheritance replaces the whole
  # containers dict, and ItemSlotsSystem creates a container for every slot at runtime.
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
      paddles_slot: !type:ContainerSlot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        blacklist:
          components:
          - BatterySelfRecharger # blocks nuclear/microreactor and slime organ cells
      paddles_slot:
        name: defibrillator-paddles-slot-name
        startingItem: DefibrillatorPaddles
        ejectOnInteract: true
        whitelist:
          components:
          - DefibrillatorPaddles
  - type: Clothing
    slots: [belt]

- type: entity
  id: DefibrillatorBeltCompact
  parent: DefibrillatorBeltBase
  name: belt defibrillator
  description: A compact defibrillator with a belt clip, for medics who need their hands free.
  components:
  - type: DefibrillatorSelfDrain
    drainPerSecond: 0.05

- type: entity
  id: DefibrillatorBeltCompactEmpty
  parent: DefibrillatorBeltCompact
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        blacklist:
          components:
          - BatterySelfRecharger
      paddles_slot:
        name: defibrillator-paddles-slot-name
        startingItem: DefibrillatorPaddles
        ejectOnInteract: true
        whitelist:
          components:
          - DefibrillatorPaddles

- type: entity
