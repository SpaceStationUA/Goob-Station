  parent: [ DefibrillatorBeltBase, BaseCommandContraband ]
  name: chief medical officer's belt defibrillator
  description: A premium belt defibrillator issued to the Chief Medical Officer. Pairs well with a chest rig.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Specific/Medical/defibcmo.rsi
    layers:
    - state: icon
    - state: charge100
      map: [ "enum.DefibrillatorChargeLayers.Charge" ]
      visible: false
      shader: unshaded
    - state: nocell
      map: [ "enum.DefibrillatorChargeLayers.NoCell" ]
      visible: false
      shader: unshaded
    - state: emagged
      map: [ "enum.DefibrillatorChargeLayers.Emagged" ]
      visible: false
      shader: unshaded
  - type: DefibrillatorHideInHand
  - type: DefibrillatorSelfRecharge
    rechargePerSecond: 0.1
  - type: ItemSlots
    slots:
      cell_slot:
