      visible: false
      shader: unshaded
    - state: nocell
      map: [ "enum.DefibrillatorChargeLayers.NoCell" ]
      visible: false
      shader: unshaded
  - type: DefibrillatorHideInHand
  - type: DefibrillatorSelfRecharge
    rechargePerSecond: 0.1
  - type: Tag
    tags:
    - EmagImmune # NT gear cannot be emagged
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
      paddles_slot:
        name: defibrillator-paddles-slot-name
        startingItem: DefibrillatorPaddlesNT
        ejectOnInteract: true
        whitelist:
          components:
          - DefibrillatorPaddles

- type: entity
  id: DefibrillatorBeltNTEmpty
  parent: DefibrillatorBeltNT
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
      paddles_slot:
        name: defibrillator-paddles-slot-name
        startingItem: DefibrillatorPaddlesNT
        ejectOnInteract: true
        whitelist:
          components:
          - DefibrillatorPaddles

# Shock paddles — detachable electrodes stored in the belt defibrillators.
# Using them on a target zaps it through the parent belt (charge, cooldown, sounds).
# They snap back into the belt when dropped or when the holder moves away.

- type: entity
  id: DefibrillatorPaddles
  parent: BaseItem
  name: defibrillator paddles
  description: A pair of plastic-gripped paddles that deliver a powerful shock. Store them back in your belt before running off.
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Specific/Medical/defibpaddles.rsi
    layers:
    - state: icon
  - type: Item
    size: Normal
  - type: Wieldable
    freeHandsRequired: 1
  - type: MeleeRequiresWield
  - type: DefibrillatorPaddles

- type: entity
  id: DefibrillatorPaddlesCMO
  parent: DefibrillatorPaddles
  name: CMO defibrillator paddles
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Specific/Medical/defibpaddles.rsi
    layers:
    - state: icon

- type: entity
  id: DefibrillatorPaddlesCombat
  parent: DefibrillatorPaddles
  name: combat defibrillator paddles
  components:
  - type: Sprite
    sprite: _Pirate/Objects/Specific/Medical/defibpaddles_combat.rsi
    layers:
    - state: icon
  - type: ItemToggle
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 8
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Items/Defib/defib_zap.ogg
      params:
        variation: 0.250
    activatedSoundOnHitNoDamage:
      path: /Audio/Items/Defib/defib_zap.ogg
      params:
        variation: 0.250
        volume: -10
    activatedDamage:
      types:
        Blunt: 8
        Shock: 16

