- type: entity
  parent: [ClothingOuterHardsuitBase, BaseEngineeringContraband]
  id: ClothingOuterHardsuitAtmosOld
  name: atmos hardsuit # Pirate
  description: An old atmospheric hardsuit. It looks like it has seen better days, but it still provides good fire protection. Feels heavy.
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/OuterClothing/Hardsuits/atmospherics_old.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/OuterClothing/Hardsuits/atmospherics_old.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.02
    lowPressureMultiplier: 1000
  - type: TemperatureProtection
    heatingCoefficient: 0.001
    coolingCoefficient: 0.001
  - type: FireProtection
    reduction: 0.95
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.7
        Radiation: 0.1
  - type: ClothingSpeedModifier
    walkModifier: 0.65
    sprintModifier: 0.65
  - type: HeldSpeedModifier
  - type: ToggleableClothing # Goobstation - Modsuits change
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitAtmosOld
  - type: DamageOnShootProtection #imp # Pirate V
    slots: OUTERCLOTHING
    damageProtection:
      flatReductions:
        Blunt: 3 # Pirate ^

# Ад Нюпенка

- type: entity
  parent: ClothingOuterHardsuitBase
  id: ClothingOuterHardsuitSecuritySolarian
  name: Соларіанський войдсуїт
  suffix: SAN
  description: Спеціальний войдсуїт, розрахований на збереження носія від екстремальних зовнішніх умов.
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/OuterClothing/Hardsuits/SolarianSecVoidSuit.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/OuterClothing/Hardsuits/SolarianSecVoidSuit.rsi
  - type: PressureProtection
    highPressureMultiplier: 0.05
    lowPressureMultiplier: 1000
  - type: ExplosionResistance
    damageCoefficient: 0.65
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.8
        Radiation: 0.6
        Caustic: 0.5
  - type: ClothingSpeedModifier
    sprintModifier: 0.85
    walkModifier: 0.85
  - type: HeldSpeedModifier
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingHeadHelmetHardsuitSecuritySolarian
  - type: ModifyDelayedKnockdown
    delayDelta: 2
    knockdownTimeDelta: -2
  - type: StaminaResistance
    damageCoefficient: 0.6
