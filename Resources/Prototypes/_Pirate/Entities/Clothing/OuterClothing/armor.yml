  - type: Sprite
    sprite: _Pirate/Clothing/OuterClothing/Armor/security_cadet.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/OuterClothing/Armor/security_cadet.rsi

- type: entity
  parent: ClothingOuterArmorBase
