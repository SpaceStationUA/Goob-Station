- type: entity
  parent: BaseItem
  id: ArmorPlateSpeed
  name: "полегшена бронеплита"
  description: "Бронемодуль із полегшених сталевих і пластикових пластин. Збільшує швидкість, але робить власника вразливішим до більшості видів шкоди."
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/ArmorPlate/armor_plates.rsi
    state: speed
  - type: Item
    sprite: _Pirate/Clothing/ArmorPlate/armor_plates.rsi
    size: Normal
  - type: ArmorPlateItem
    maxDurability: 25
    walkSpeedModifier: 1.1
    sprintSpeedModifier: 1.1
    staminaDamageMultiplier: 2
    absorptionRatios:
      Heat: -0.2 # Pirate: amplification ratios are negative and must use a concrete damage type locally.
      Piercing: -0.2
      Blunt: -0.2
      Slash: -0.2
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
