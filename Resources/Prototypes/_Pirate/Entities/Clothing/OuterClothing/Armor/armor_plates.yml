- type: entity
  parent: BaseItem
  id: ArmorPlateBlunt_Slash
  name: "ударно-різальна бронеплита"
  description: "Бронемодуль із додаткових пласталевих пластин та ударопоглинального пластику. Захищає від ударів і порізів, але вразливий до опіків."
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/ArmorPlate/armor_plates.rsi
    state: blunt_slash
  - type: Item
    sprite: _Pirate/Clothing/ArmorPlate/armor_plates.rsi
    size: Normal
  - type: ArmorPlateItem
    maxDurability: 50
    walkSpeedModifier: 0.95
    sprintSpeedModifier: 0.95
    staminaDamageMultiplier: 1.0
    absorptionRatios:
      Blunt: 0.7
      Slash: 0.7
      Heat: -0.2 # Pirate: amplification ratios are negative and must use a concrete damage type locally.
  - type: Damageable
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

