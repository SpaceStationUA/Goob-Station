# HECU combat vests. Armour is tuned against the web vest worn by the HECU ghost role.

- type: entity
  abstract: true
  parent: [ClothingOuterStorageBase, AllowSuitStorageClothing, BaseMajorContraband]
  id: ClothingOuterArmorHECUBase
  components:
  - type: Stainable
    clothingVisuals:
      outerClothing:
      - sprite: _Pirate/Effects/blood.rsi
        state: armorblood
    iconVisuals:
    - sprite: _Pirate/Effects/blood.rsi
      state: armorbloodicon
  - type: ModifyDelayedKnockdown
    delayDelta: 2.5
    knockdownTimeDelta: -2.5
  - type: StaminaResistance
    damageCoefficient: 0.6
  - type: EmpShieldClothing # shields the wearer and everything they carry; matters for the IPC squad

# Basic combat vest - web vest protection plus acid proofing.
- type: entity
  parent: ClothingOuterArmorHECUBase
  id: ClothingOuterArmorHECU
  name: combat vest
  description: Vest designed to take heavy beating and probably keep the user alive in the process.
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/combat_vest.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/combat_vest.rsi
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    coverage:
    - Chest
    - Groin
    modifiers:
      coefficients:
        Blunt: 0.4
        Slash: 0.4
        Piercing: 0.2
        Heat: 0.8
        Caustic: 0.8
  - type: ExplosionResistance
    damageCoefficient: 0.9

- type: entity
  parent: ClothingOuterArmorHECU
  id: ClothingOuterArmorHECUMedic
  name: corpsman combat vest
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/combat_vest_medic.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/combat_vest_medic.rsi

- type: entity
  parent: ClothingOuterArmorHECU
  id: ClothingOuterArmorHECUBlack
  name: black combat vest
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/combat_vest_black.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/combat_vest_black.rsi

- type: entity
  parent: ClothingOuterArmorHECU
  id: ClothingOuterArmorHECUMedicBlack
  name: black corpsman combat vest
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/combat_vest_medic_black.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/combat_vest_medic_black.rsi

# Powered combat vest (PCV Mk. II), the premium set: better than the basic combat vest on every value, with
# full-body plating for arm and leg coverage. This variant has no power or auto-medic systems.
- type: entity
  parent: ClothingOuterArmorHECUBase
  id: ClothingOuterArmorHECUPowered
  name: powered combat vest
  description: An electrically charged piece of body armor, the power stiffens the suit's fibers to provide a layer of resilient armor in response to trauma received from kinetic force. The concentration of mass in the lower rear side from the onboard computer makes your ass feel heavy.
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/powered_vest.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/powered_vest.rsi
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.4
      OrganDamage: 0.4
      BoneDamage: 0.4
      VeinsDamage: 0
      NerveDamage: 0
    coverage:
    - Chest
    - Groin
    - Arm
    - Leg
    modifiers:
      coefficients:
        Blunt: 0.35
        Slash: 0.35
        Piercing: 0.15
        Heat: 0.65
        Caustic: 0.65
        Radiation: 0.7
  - type: ExplosionResistance
    damageCoefficient: 0.75
  - type: StaminaResistance
    damageCoefficient: 0.5
  - type: StaticPrice
    price: 250

- type: entity
  parent: ClothingOuterArmorHECUPowered
  id: ClothingOuterArmorHECUPoweredMedic
  name: corpsman powered combat vest
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/powered_vest_medic.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/powered_vest_medic.rsi

- type: entity
  parent: ClothingOuterArmorHECUPowered
  id: ClothingOuterArmorHECUPoweredBlack
  name: black powered combat vest
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/powered_vest_black.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/powered_vest_black.rsi

- type: entity
  parent: ClothingOuterArmorHECUPowered
  id: ClothingOuterArmorHECUPoweredMedicBlack
  name: black corpsman powered combat vest
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/powered_vest_medic_black.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/OuterClothing/Armor/HECU/powered_vest_medic_black.rsi
