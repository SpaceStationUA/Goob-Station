- type: entity
  parent: [ RingBase, GoldRingBase ]
  id: RingBloodDiamond
  name: blood diamond ring
  description: A ring of pure gold with a beautiful blood-red diamond in its center. The maker's mark reads "brothers S&K - jewelry factory".
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Hands/Rings/blood.rsi
    state: icon
  - type: Clothing
    sprite: _Pirate/Clothing/Hands/Rings/blood.rsi
  - type: StaticPrice
    price: 800 # gold 400 + stone 400

