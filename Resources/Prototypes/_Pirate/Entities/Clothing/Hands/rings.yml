- type: entity
  parent: [ RingBase, GoldRingBase ]
  id: RingBloodDiamond
  name: blood diamond ring
  description: A gold band with a deep red diamond. Under a lamp the stone looks almost black.
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Hands/Rings/blood.rsi
    state: icon
  - type: Clothing
    sprite: _Pirate/Clothing/Hands/Rings/blood.rsi
  - type: StaticPrice
    price: 800 # gold 400 + stone 400

