- type: entity
  abstract: true
  parent: ClothingNeckBase
  id: ClothingNeckStorageBase
  components:
  - type: Storage
    maxItemSize: Normal
    defaultStorageOrientation: Vertical
    grid:
    - 0,0,7,1
  - type: Item
    size: Ginormous
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
        ents: []
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface

- type: entity
  parent: [ ClothingNeckBase, BaseCommandContraband ]
  id: ClothingNeckCloakCMOCoat
  name: chief medical officer's embroidered off-coat
  description: A finely embroidered coat worn imposingly as a cloak over your shoulders. Cuts a dashing figure befitting the finest mind in medicine.
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Neck/Cloaks/cmo_offcoat.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Neck/Cloaks/cmo_offcoat.rsi


- type: entity
  parent: [ ClothingNeckBase, BaseCommandContraband ]
  id: ClothingNeckCloakRDCoat
  name: research director's embroidered off-coat
  description: A finely embroidered coat worn imposingly as a cloak over your shoulders. Cuts a dashing figure befitting the brightest minds in R&D.
  components:
  - type: Sprite
