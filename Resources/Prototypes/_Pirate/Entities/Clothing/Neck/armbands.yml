- type: entity
  abstract: true
  parent: ClothingNeckBase
  id: ClothingNeckArmbandBase
  components:
  - type: Item
    size: Tiny
  - type: ClothingAccessory
    category: Armband
  - type: Butcherable
    butcherDelay: 1.0
    butcheringType: Knife
    spawned:
    - id: MaterialCloth1
      amount: 1
  - type: PhysicalComposition
    materialComposition:
      Cloth: 50
  - type: StaticPrice
    price: 10

- type: entity
  abstract: true
  id: ClothingNeckArmbandSideBase
  components:
  - type: ArmbandSide
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ArmbandSideVisuals.Flipped:
        enum.ArmbandSideLayers.Base:
          True: { state: flipped-icon }
          False: { state: icon }

# Greyscale sprites allow tinting.
- type: entity
  abstract: true
  id: ClothingNeckArmbandPaintableBase
  components:
  - type: SprayPaintable

- type: entity
  parent: [ ClothingNeckArmbandBase, ClothingNeckArmbandSideBase, ClothingNeckArmbandPaintableBase ]
  id: ClothingNeckArmband
  name: armband
  description: A plain cloth band worn around the upper arm.
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Neck/Armbands/colorable.rsi
    layers:
    - state: icon
      map: [ "enum.ArmbandSideLayers.Base" ]
  - type: Clothing
    sprite: _Pirate/Clothing/Neck/Armbands/colorable.rsi
  - type: Construction
    graph: PirateArmband
    node: ClothingNeckArmband

