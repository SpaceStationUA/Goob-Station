- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckEnsembleSecurityOfficer
  name: ансамбль офіцера СБ
  description: "Почесна відзнака за багаторічну службу, відданість правопорядку та неабияку витримку. Центральне командування нагадує: нагрудна камера має бути увімкнена, СОП - дотриманий, а прохання про другий шанс не є підставою для його надання."
  suffix: DO NOT MAP
  components:
  - type: Item
    size: Small
    heldPrefix: both
  - type: Sprite
    sprite: _Pirate/Clothing/Neck/Ensembles/officer.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Neck/Ensembles/officer.rsi
    equippedPrefix: both
    slots:
    - Neck
  - type: ItemSwitch
    state: both
    showLabel: true
    states:
      both: !type:ItemSwitchState
        verb: both
        sprite:
          sprite: _Pirate/Clothing/Neck/Ensembles/officer.rsi
          state: icon
      mantle: !type:ItemSwitchState
        verb: mantle
        sprite:
          sprite: _Pirate/Clothing/Neck/Ensembles/officer.rsi
          state: mantle-icon
      cloak: !type:ItemSwitchState
        verb: cloak
        sprite:
          sprite: _Pirate/Clothing/Neck/Ensembles/officer.rsi
          state: cloak-icon
