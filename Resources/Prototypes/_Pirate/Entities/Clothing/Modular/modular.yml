  id: ClothingModularControllerSafeguard
  name: "контролер вартового МОД-костюма"
  description: "Удосконалений охоронний контролер від «Ападайн Текнолоджіз». Належить голові служби безпеки."
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Modular/Safeguard/control.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Modular/Safeguard/control.rsi
  - type: ContainerFill
    containers:
      suit_core: *core-slot-plasma
      suit_part:
        - ClothingModularHelmetSafeguard
        - ClothingModularChestPlateSafeguard
        - ClothingModularGauntletsSafeguard
        - ClothingModularBootsSafeguard
  - type: ModularSuit
    activeComponents:
      head:
        - type: PressureProtection
          highPressureMultiplier: 0.45
          lowPressureMultiplier: 1000
        - type: TemperatureProtection
          heatingCoefficient: 0.1
          coolingCoefficient: 0.1
      outerClothing:
        - type: PressureProtection
          highPressureMultiplier: 0.45
          lowPressureMultiplier: 1000
        - type: TemperatureProtection
          heatingCoefficient: 0.01
          coolingCoefficient: 0.01

- type: entity
  parent: ClothingModularHelmetBase
  id: ClothingModularHelmetSafeguard
  name: "шолом вартового МОД-костюма"
  description: "Удосконалений охоронний шолом із золотим візором. Підкреслює авторитет і забезпечує чудовий захист."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Modular/Safeguard/helmet.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Modular/Safeguard/helmet.rsi
  - type: ModularSuitPart
    verbIcon:
      sprite: _Pirate/Clothing/Modular/Safeguard/helmet.rsi
      state: icon-sealed
  - type: ToggleableVisuals
    clothingVisuals:
      head:
      - state: sealed-equipped-HELMET
      - state: visor-unshaded
        shader: unshaded
        color: "#facb3e"
      head-reptilian:
      - state: sealed-equipped-HELMET-reptilian
      - state: visor-unshaded-reptilian
        shader: unshaded
        color: "#facb3e"
      head-vox:
      - state: sealed-equipped-HELMET-vox
      - state: visor-unshaded-vox
        shader: unshaded
        color: "#facb3e"
  - type: PointLight
    color: "#facb3e"
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Piercing: 0.9
        Heat: 0.9

