  id: ClothingModularControllerPrototype
  name: "прототип контролера МОД-костюма"
  description: "Прототип модульного костюма, що живиться від локомотивів. Хоч він зручний і просторий, він усе ще громіздкий та енергетично неефективний."
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Modular/Prototype/control.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Modular/Prototype/control.rsi
  - type: ContainerFill
    containers:
      suit_core: *core-slot
      suit_part:
        - ClothingModularHelmetPrototype
        - ClothingModularChestPlatePrototype
        - ClothingModularGauntletsPrototype
        - ClothingModularBootsPrototype
  - type: ModularSuit
    activeComponents:
