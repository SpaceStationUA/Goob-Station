# Standard
- type: entity
  parent: ClothingModularControllerBase
  id: ClothingModularControllerStandard
  name: "стандартний контролер МОД-костюма"
  description: "Стандартний контролер модульних костюмів від «Накамура Інжиніринг». Керує розподілом живлення та інтеграцією модулів."
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Modular/Standard/control.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Modular/Standard/control.rsi
  - type: ContainerFill
    containers:
      suit_core: &core-slot #<-- &
        - ModularSuitCoreStandard
      suit_part:
        - ClothingModularHelmetStandard
        - ClothingModularChestPlateStandard
        - ClothingModularGauntletsStandard
        - ClothingModularBootsStandard

- type: entity
  parent: ClothingModularHelmetBase
  id: ClothingModularHelmetStandard
  name: "стандартний шолом МОД-костюма"
  description: "Герметичний шолом із базовим захистом. Оснащений висувним візором із бірюзовим підсвічуванням."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Modular/Standard/helmet.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Modular/Standard/helmet.rsi
  - type: ModularSuitPart
    verbIcon:
      sprite: _Pirate/Clothing/Modular/Standard/helmet.rsi
      state: icon-sealed
  - type: ToggleableVisuals
    clothingVisuals:
      head:
      - state: sealed-equipped-HELMET
      - state: visor-unshaded
        shader: unshaded
        color: "#79f8e6"
      head-reptilian:
      - state: sealed-equipped-HELMET-reptilian
      - state: visor-unshaded-reptilian
        shader: unshaded
        color: "#79f8e6"
      head-vox:
      - state: sealed-equipped-HELMET-vox
      - state: visor-unshaded-vox
        shader: unshaded
        color: "#79f8e6"
  - type: PointLight
