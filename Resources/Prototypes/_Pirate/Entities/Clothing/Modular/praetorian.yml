      gloves-vox:
      - state: sealed-equipped-HAND-vox
      - state: sealed-equipped-HAND-unshaded-vox
        shader: unshaded
  - type: Insulated

- type: entity
  parent: ClothingModularBootsBase
  id: ClothingModularBootsPraetorian
  name: "чоботи МОД-костюма «Преторіанець»"
  description: "Посилені чоботи модульного костюма «Преторіанець», розраховані на швидке пересування."
  categories: [ HideSpawnMenu ]
  components:
