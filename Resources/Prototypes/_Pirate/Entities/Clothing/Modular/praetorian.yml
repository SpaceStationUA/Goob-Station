# Pirate: Praetorian visuals and protection adapted to the new modular suit system.
- type: entity
  parent: [ ClothingModularControllerBase, BaseCentcommContraband ]
  id: ClothingModularControllerPraetorian
  name: "контролер МОД-костюма «Преторіанець»"
  description: "Передовий контролер модульного костюма «Нанотрейзен», розроблений для офіцерів «Синього щита»."
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Modular/Praetorian/control.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Modular/Praetorian/control.rsi
    clothingVisuals:
      back:
      - state: equipped-BACKPACK
      back-resomi:
      - state: equipped-BACKPACK-resomi
  - type: ToggleableVisuals
    clothingVisuals:
      back:
      - state: sealed-equipped-BACKPACK
      back-resomi:
      - state: sealed-equipped-BACKPACK-resomi
  - type: ContainerFill
    containers:
      suit_core:
        - ModularSuitCoreInfinite
      suit_part:
        - ClothingModularHelmetPraetorian
        - ClothingModularChestPlatePraetorian
        - ClothingModularGauntletsPraetorian
        - ClothingModularBootsPraetorian
  - type: ModularSuit
    activeComponents:
      head:
        - type: PressureProtection
          highPressureMultiplier: 0.05
          lowPressureMultiplier: 1000
        - type: TemperatureProtection
          heatingCoefficient: 0.1
          coolingCoefficient: 0.1
      outerClothing:
        - type: PressureProtection
          highPressureMultiplier: 0.05
          lowPressureMultiplier: 1000
        - type: TemperatureProtection
          heatingCoefficient: 0.01
          coolingCoefficient: 0.01
  - type: ClothingSpeedModifier
    walkModifier: 0.75
    sprintModifier: 0.75

- type: entity
  parent: ClothingModularHelmetBase
  id: ClothingModularHelmetPraetorian
  name: "шолом МОД-костюма «Преторіанець»"
  description: "Найсучасніший шолом, розроблений «Нанотрейзен» для захисту офіцерів «Синього щита»."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Modular/Praetorian/helmet.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Modular/Praetorian/helmet.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
      head-reptilian:
      - state: equipped-HELMET-reptilian
      head-vox:
      - state: equipped-HELMET-vox
      head-resomi:
      - state: equipped-HELMET-resomi
      head-vulpkanin:
      - state: equipped-HELMET-vulpkanin
  - type: ModularSuitPart
    verbIcon:
      sprite: _Pirate/Clothing/Modular/Praetorian/helmet.rsi
      state: icon-sealed
  - type: ToggleableVisuals
    clothingVisuals:
      head:
      - state: sealed-equipped-HELMET
      - state: visor-unshaded
        shader: unshaded
      head-reptilian:
      - state: sealed-equipped-HELMET-reptilian
      - state: visor-unshaded-reptilian
        shader: unshaded
      head-vox:
      - state: sealed-equipped-HELMET-vox
      - state: visor-unshaded-vox
        shader: unshaded
      head-resomi:
      - state: sealed-equipped-HELMET-resomi
      head-vulpkanin:
      - state: sealed-equipped-HELMET-vulpkanin
      - state: visor-unshaded-vulpkanin
        shader: unshaded
  - type: Armor
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.55
        Slash: 0.55
        Piercing: 0.5
        Radiation: 0.5
        Heat: 0.5
        Caustic: 0.5
  - type: FlashImmunity
  - type: FlashSoundSuppression
  - type: PointLight
    color: "#4d7ae3"

- type: entity
  parent: ClothingModularChestPlateBase
  id: ClothingModularChestPlatePraetorian
  name: "нагрудник МОД-костюма «Преторіанець»"
  description: "Високоміцний нагрудник із силовими сервоприводами, створений для захисту офіцерів «Синього щита»."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Modular/Praetorian/chestplate.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Modular/Praetorian/chestplate.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
      outerClothing-reptilian:
      - state: equipped-OUTERCLOTHING-reptilian
      outerClothing-vox:
      - state: equipped-OUTERCLOTHING-vox
      outerClothing-resomi:
      - state: equipped-OUTERCLOTHING-resomi
  - type: ModularSuitPart
    verbIcon:
      sprite: _Pirate/Clothing/Modular/Praetorian/chestplate.rsi
      state: icon-sealed
  - type: ToggleableVisuals
    clothingVisuals:
      outerClothing:
      - state: sealed-equipped-OUTERCLOTHING
      outerClothing-reptilian:
      - state: sealed-equipped-OUTERCLOTHING-reptilian
      outerClothing-vox:
      - state: sealed-equipped-OUTERCLOTHING-vox
      outerClothing-resomi:
      - state: sealed-equipped-OUTERCLOTHING-resomi
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Hand
    - Leg
    - Foot
    - Tail
    - Other
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.45
        Radiation: 0.5
        Heat: 0.45
        Caustic: 0.5
  - type: StaminaResistance
    damageCoefficient: 0.9
  - type: FireProtection
    reduction: 0.5
  - type: ModifyDelayedKnockdown
    delayDelta: 2
    knockdownTimeDelta: -2
  - type: ExplosionResistance
    damageCoefficient: 0.45

- type: entity
  parent: ClothingModularGauntletsBase
  id: ClothingModularGauntletsPraetorian
  name: "рукавиці МОД-костюма «Преторіанець»"
  description: "Повністю ізольовані рукавиці модульного костюма «Преторіанець»."
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Modular/Praetorian/gauntlets.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Modular/Praetorian/gauntlets.rsi
    clothingVisuals:
      gloves:
      - state: equipped-HAND
      gloves-vox:
      - state: equipped-HAND-vox
  - type: ModularSuitPart
    verbIcon:
      sprite: _Pirate/Clothing/Modular/Praetorian/gauntlets.rsi
      state: icon-sealed
  - type: ToggleableVisuals
    clothingVisuals:
      gloves:
      - state: sealed-equipped-HAND
