- type: entity
  parent: [ ClothingModularControllerLockedBase, ClothingModularControllerPraetorian ]
  id: ClothingModularControllerPraetorianPreassembled
  suffix: Preassembled
  components:
  - type: ModularSuitPreassembled
    modules:
    - PaperDispenserSuitModule
    - EMPShieldAdvancedSuitModule
    - JetpackAdvancedSuitModule
    - ArmorBossterSuitModule
    - MagnetAdvancedSuitModule
    - RadiationShieldSuitModule
    - WeldingSuitModule
    - StorageHoldingSuitModule
    - AdvancedFlashlightSuitModuleAqua
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMicroreactor
