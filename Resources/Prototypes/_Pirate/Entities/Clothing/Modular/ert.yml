- type: entity
  parent: ClothingModularControllerBase
  id: ClothingModularControllerERTLeader
  name: ERT leader's modsuit controller
  description: A modular suit control unit issued to the leader of an emergency response team.
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Modular/ResponsoryLeader/control.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Modular/ResponsoryLeader/control.rsi
  - type: ContainerFill
    containers:
      suit_core:
        - ModularSuitCoreInfinite
      suit_part:
        - ClothingModularHelmetERTLeader
        - ClothingModularChestPlateERTLeader
        - ClothingModularGauntletsERTLeader
        - ClothingModularBootsERTLeader
  - type: ModularSuit
    activeComponents:
      head:
        - type: PressureProtection
          highPressureMultiplier: 0.08
          lowPressureMultiplier: 1000
        - type: TemperatureProtection
          heatingCoefficient: 0.1
          coolingCoefficient: 0.1
      outerClothing:
        - type: PressureProtection
          highPressureMultiplier: 0.05
          lowPressureMultiplier: 1000
        - type: TemperatureProtection
          heatingCoefficient: 0.01
          coolingCoefficient: 0.01
  - type: ClothingSpeedModifier
    walkModifier: 0.9
    sprintModifier: 0.9

- type: entity
  parent: ClothingModularHelmetBase
  id: ClothingModularHelmetERTLeader
  name: ERT leader's modsuit helmet
  description: A sealed response helmet issued to the leader of an emergency response team.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Modular/ResponsoryLeader/helmet.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Modular/ResponsoryLeader/helmet.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
      head-vox:
      - state: equipped-HELMET-vox
      head-reptilian:
      - state: equipped-HELMET-reptilian
      head-vulpkanin:
      - state: equipped-HELMET-reptilian
  - type: ModularSuitPart
    verbIcon:
      sprite: _Pirate/Clothing/Modular/ResponsoryLeader/helmet.rsi
      state: icon-sealed
  - type: ToggleableVisuals
    clothingVisuals:
      head:
      - state: sealed-equipped-HELMET
      - state: visor-unshaded
        shader: unshaded
        color: "#addbff"
      head-vox:
      - state: sealed-equipped-HELMET-vox
      - state: visor-unshaded-vox
        shader: unshaded
        color: "#addbff"
      head-reptilian:
      - state: sealed-equipped-HELMET-reptilian
      - state: visor-unshaded-reptilian
        shader: unshaded
        color: "#addbff"
      head-vulpkanin:
      - state: sealed-equipped-HELMET-reptilian
      - state: visor-unshaded-reptilian
        shader: unshaded
        color: "#addbff"
  - type: PointLight
    color: "#addbff"
  - type: IdentityBlocker
  - type: FireProtection
    reduction: 0.2
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.6
      OrganDamage: 0.6
      BoneDamage: 0.6
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.4
        Slash: 0.4
        Piercing: 0.35
        Heat: 0.5
        Radiation: 0.2
        Caustic: 0.4

- type: entity
  parent: ClothingModularChestPlateBase
  id: ClothingModularChestPlateERTLeader
  name: ERT leader's modsuit chestplate
  description: A reinforced response chestplate issued to the leader of an emergency response team.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Modular/ResponsoryLeader/chestplate.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Modular/ResponsoryLeader/chestplate.rsi
    clothingVisuals:
      outerClothing:
      - state: equipped-OUTERCLOTHING
      outerClothing-vox:
      - state: equipped-OUTERCLOTHING-vox
      outerClothing-reptilian:
      - state: equipped-OUTERCLOTHING-reptilian
  - type: ToggleableVisuals
    clothingVisuals:
      outerClothing:
      - state: sealed-equipped-OUTERCLOTHING
      outerClothing-vox:
      - state: sealed-equipped-OUTERCLOTHING-vox
      outerClothing-reptilian:
      - state: sealed-equipped-OUTERCLOTHING-reptilian
  - type: ModularSuitPart
    verbIcon:
      sprite: _Pirate/Clothing/Modular/ResponsoryLeader/chestplate.rsi
      state: icon-sealed
  - type: Armor
    traumaDeductions:
      Dismemberment: 0.6
      OrganDamage: 0.6
      BoneDamage: 0.6
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.39
        Slash: 0.39
        Piercing: 0.33
        Heat: 0.5
        Radiation: 0.22
        Caustic: 0.44
  - type: ExplosionResistance
    damageCoefficient: 0.5
  - type: StaminaResistance
    damageCoefficient: 0.35
  - type: FireProtection
    reduction: 0.75
  - type: DamageOnShootProtection
    slots: OUTERCLOTHING
    damageProtection:
      flatReductions:
        Blunt: 10
  - type: ModifyDelayedKnockdown
    delayDelta: 3
    knockdownTimeDelta: -3

