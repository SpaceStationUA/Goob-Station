- type: entity
  parent: [ ClothingModularControllerLockedBase, ClothingModularControllerERTLeader ]
  id: ClothingModularControllerERTLeaderPreassembled
  suffix: Preassembled
  components:
  - type: ModularSuitPreassembled
    modules:
    - EnergyShieldAdvancedSuitModule
    - HolsterSuitModule
    - ArmorBossterSuitModule
