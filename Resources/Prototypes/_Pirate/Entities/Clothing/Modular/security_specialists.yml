- type: entity
  parent: [ ClothingModularControllerLockedBase, ClothingModularControllerWarden ]
  id: ClothingModularControllerWardenPreassembled
  suffix: Preassembled
  components:
  - type: ModularSuitPreassembled
    modules:
    - MagnetSuitModule
    - ArmorBossterSuitModule
    - VisorSecuritySuitModule
    - StorageSuitModule
    - FlashlightSuitModuleCyan
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHigh

