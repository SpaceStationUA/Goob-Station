- type: entity
  parent: ClothingModularControllerSecurity
  id: ClothingModularControllerWarden
  name: warden modsuit controller
  description: A security controller tuned for the brig's overseer. The riot plating of the warden's hardsuit, on a modular frame.
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Modular/Warden/control.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Modular/Warden/control.rsi
  - type: ContainerFill
    containers:
      suit_core:
        - ModularSuitCoreStandard
      suit_part:
        - ClothingModularHelmetWarden
        - ClothingModularChestPlateWarden
        - ClothingModularGauntletsWarden
        - ClothingModularBootsWarden
  - type: StealTarget # Both warden suits satisfy this objective.
    stealGroup: ClothingOuterHardsuitWarden

- type: entity
  parent: ClothingModularHelmetSecurity
  id: ClothingModularHelmetWarden
  name: warden modsuit helmet
  description: A domed riot helmet with a cyan visor. Oddly comfortable.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Modular/Warden/helmet.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Modular/Warden/helmet.rsi
  - type: ModularSuitPart
    verbIcon:
      sprite: _Pirate/Clothing/Modular/Warden/helmet.rsi
      state: icon-sealed
  - type: ToggleableVisuals
    clothingVisuals:
      head:
      - state: sealed-equipped-HELMET
      - state: visor-unshaded
        shader: unshaded
      head-reptilian:
      - state: sealed-equipped-HELMET-reptilian
      - state: visor-unshaded-reptilian
        shader: unshaded
      head-vox:
      - state: sealed-equipped-HELMET-vox
      - state: visor-unshaded-vox
        shader: unshaded
      head-vulpkanin:
      - state: sealed-equipped-HELMET-vulpkanin
      - state: visor-unshaded-vulpkanin
        shader: unshaded
      head-feroxi:
      - state: sealed-equipped-HELMET-feroxi
      - state: visor-unshaded-feroxi
        shader: unshaded
      head-hydrakin:
      - state: sealed-equipped-HELMET-hydrakin
      - state: visor-unshaded-hydrakin
        shader: unshaded
  - type: PointLight
    color: "#00bfff"

- type: entity
  parent: ClothingModularChestPlateSecurity
  id: ClothingModularChestPlateWarden
  name: warden modsuit chestplate
  description: The warden's riot chestplate, cut into retractable segments.
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Modular/Warden/chestplate.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Modular/Warden/chestplate.rsi
  - type: ModularSuitPart
    verbIcon:
      sprite: _Pirate/Clothing/Modular/Warden/chestplate.rsi
      state: icon-sealed

