- type: entity
  parent: [ ClothingModularControllerLockedBase, ClothingModularControllerMercenary ]
  id: ClothingModularControllerMercenaryPreassembled
  suffix: Preassembled
  components:
  - type: ModularSuitPreassembled
    modules:
    - MagnetSuitModule
    - ArmorBossterSuitModule
    - StorageSyndicateSuitModule
    - AdvancedFlashlightSuitModuleDarkOrange
    - JetpackSuitModule
    - ApparatusSuitModule
    - HolsterSuitModule
    - GPSSuitModule
    - TetherSuitModule
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellHyper
