  components:
  - type: StorageFill
    contents:
    - id: ArmorPlatePierce

- type: entity
  abstract: true
  parent: ClothingArmorPlate
  id: ClothingArmorPlateHeat
  components:
  - type: StorageFill
    contents:
    - id: ArmorPlateHeat

- type: entity
  abstract: true
  parent: ClothingArmorPlate
  id: ClothingArmorPlateSpeed
  components:
  - type: StorageFill
    contents:
    - id: ArmorPlateSpeed
