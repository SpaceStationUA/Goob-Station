- type: entity
  parent: [UnsensoredClothingUniformBase, ClothingUniformFoldableBase, BaseSyndicateContraband]
  id: ClothingUniformJumpsuitSyndieTactical
  name: "тактичний гольф"
  description: "Обтислий гольф кольору Синдикату з чорними штанами-карго. Успіхів у суперечках щодо лояльності в цьому вбранні."
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Uniforms/SynDrobe/tacticalturtleneck.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Uniforms/SynDrobe/tacticalturtleneck.rsi
  - type: Armor
    coverage:
    - Chest
    - Groin
    - Arm
    - Leg
    modifiers:
      coefficients:
        Blunt: 0.9
        Slash: 0.9
        Heat: 0.5
        Caustic: 0.6
  - type: StaticPrice
    price: 50

