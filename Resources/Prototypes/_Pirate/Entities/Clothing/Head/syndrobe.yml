- type: entity
  parent: [ClothingHeadBase, BaseFoldable, BaseSyndicateContraband]
  id: ClothingHeadHatSyndieEngineTechCover
  name: "утилітарна кепка техніка двигунів"
  description: "Утилітарна кепка для техніка двигунів; на ній є мітка з написом «IP-DS-2»."
  components:
  - type: Clothing
    sprite: _Pirate/Clothing/Head/SynDrobe/enginetechcover.rsi
    stripDelay: 2
  - type: Appearance
  - type: Foldable
    canFoldInsideContainer: true
    foldVerbText: fold-flip-verb
    unfoldVerbText: fold-flip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: flipped
  - type: Sprite
    sprite: _Pirate/Clothing/Head/SynDrobe/enginetechcover.rsi
    layers:
    - state: icon
      map: ["unfoldedLayer"]
    - state: icon-flipped
      map: ["foldedLayer"]
      visible: false
  - type: Armor
    coverage:
    - Head
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.75
        Shock: 0.65
        Heat: 0.75
        Caustic: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.75

- type: entity
  parent: [ClothingHeadBase, BaseSyndicateContraband]
  id: ClothingHeadHatBeretSyndieBrig
  name: "берет офіцера бригади"
  description: "Стильний і захисний берет виробництва «Інтердайн Фармасьютикалс» за сприяння «Горлексських мародерів»."
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Head/SynDrobe/brigofficerberet.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Head/SynDrobe/brigofficerberet.rsi
    stripDelay: 2
  - type: Armor
    coverage:
    - Head
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.75
        Shock: 0.65
        Heat: 0.75
        Caustic: 0.5
  - type: ExplosionResistance
    damageCoefficient: 0.75
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon
