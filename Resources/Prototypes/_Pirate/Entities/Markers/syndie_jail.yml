- type: entity
  parent: WarpPoint
  id: WarpPointSyndieJail
  suffix: Syndie Jail
  components:
  - type: WarpPoint
    location: Syndie Jail
  - type: ExtractionBeacon
    whitelist:
      components:
      - MobState
  - type: ExtractionAnnouncement
    channel: Cybersun
    message: extraction-announcement-hostage
    senderName: extraction-announcement-sender
  # Announcements must not depend on the base telecom server being intact and powered.
  - type: TelecomExempt

- type: entity
  parent: MarkerBase
  id: MarkerSyndieJailLoot
  name: syndie fulton loot beacon
  components:
  - type: Sprite
    layers:
    - sprite: Markers/cross.rsi
      state: green
    - sprite: Objects/Consumable/Drinks/golden_cup.rsi
      state: icon
  - type: ExtractionBeacon
    blacklist:
      components:
      - MobState
  - type: ExtractionAnnouncement
    channel: Cybersun
    message: extraction-announcement-loot
    senderName: extraction-announcement-sender
  - type: TelecomExempt
