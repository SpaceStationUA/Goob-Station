- type: entity
  name: "кортикальний бурильник"
  parent: SimpleSpaceMobBase
  id: MobCorticalBorer
  description: "Паразитичний черв, що проникає в мозок носія та відкладає яйця."
  components:
  - type: GhostRole
    makeSentient: true
    allowSpeech: false
    allowMovement: true
    name: cortical-borer-ghostrole-name
    description: cortical-borer-ghostrole-desc
    rules: cortical-borer-ghostrole-rules
    mindRoles:
    - MindRoleCorticalBorer
  - type: GhostTakeoverAvailable
  - type: Sprite
    drawdepth: SmallMobs
    sprite: _Pirate/Mobs/Aliens/cortical_borer.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: cortical_borer
  - type: DamageStateVisuals
    states:
      Alive:
        Base: cortical_borer
      Dead:
        Base: dead
  - type: Item
    size: Tiny
    heldPrefix: 0
  - type: Physics
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 100
        mask:
        - SmallMobMask
        layer:
        - SmallMobLayer
  - type: MobState
  - type: MobThresholds
    thresholds:
      0: Alive
      20: Dead
  - type: Barotrauma
    damage:
      types:
        Blunt: 0.15
  - type: Bloodstream
    bloodlossDamage:
      types:
        Bloodloss: 0.5
    bloodlossHealDamage:
      types:
        Bloodloss: -1
    bleedReductionAmount: 2
  - type: MovementSpeedModifier
    baseWalkSpeed: 1.9
    baseSprintSpeed: 7.5
  - type: Tag
    tags:
    - Meat
    - VimPilot
  - type: ThermalVision
    lightRadius: 15
    activateSound: null
    deactivateSound: null
  - type: NightVision
    color: "#808080"
    activateSound: null
    deactivateSound: null
  - type: CorticalBorer
    eggProto: CorticalBorerEgg
    addOnInfest:
    - type: PressureImmunity
    removeOnInfest:
    - type: CanEscapeInventory
  - type: UserInterface
    interfaces:
      enum.CorticalBorerDispenserUiKey.Key:
        type: CorticalBorerDispenserBoundUserInterface
      enum.HealthAnalyzerUiKey.Key:
        type: HealthAnalyzerBoundUserInterface
  - type: CollectiveMind
    channels:
    - CorticalBorer
    defaultChannel: CorticalBorer
  - type: Speech
    enabled: false
  # Pirate: keep borer speech on the standard font while retaining universal understanding.
  - type: LanguageSpeaker
    currentLanguage: TauCetiBasic
  - type: LanguageKnowledge
    speaks:
    - TauCetiBasic
    understands:
    - TauCetiBasic
  - type: HealthAnalyzer
    scanningEndSound:
      path: /Audio/Voice/Slime/slime_squish.ogg
    maxScanRange: 0.5
  - type: CanEscapeInventory
  - type: GuideHelp
    guides:
    - CorticalBorerGuide
  - type: Body
    thermalVisibility: false
  - type: UniversalLanguageSpeaker

- type: entity
  parent: BaseItem
  id: CorticalBorerEgg
  name: "яйце кортикального бурильника"
  description: "Воно тривожно вологе й м'яке."
  components:
  - type: Sprite
    sprite: _Pirate/Mobs/Aliens/cortical_borer_egg.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: GhostRole
    name: cortical-borer-ghostrole-name
    description: cortical-borer-ghostrole-desc
    rules: cortical-borer-ghostrole-rules
    mindRoles:
    - MindRoleCorticalBorer
  - type: GhostRoleMobSpawner
    prototype: MobCorticalBorer
  - type: Damageable
    damageContainer: Biological
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: desecration
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: GuideHelp
    guides:
    - CorticalBorerGuide
