# --- /tg/ gas reactions (gas_reactions.dm) ---
# Hyper-Nobilium suppresses ALL other gas reactions when >= 5 moles and temperature > 20K
# (port of the pre-check in /tg/ gas_mixture.react()). High priority so it runs first.
- type: gasReaction
  id: HyperNobliumSuppression
  priority: 1000
  minimumTemperature: 20
  effects:
  - !type:HyperNobliumSuppressionReaction

- type: gasReaction
  id: HyperNobliumFormation
  priority: 2
  maximumTemperature: 15.0
  minimumTemperature: 2.7
  minimumRequirements:
    Nitrogen: 10
    Tritium: 5
  effects:
  - !type:HyperNobliumFormationReaction

- type: gasReaction
  id: AntiNobliumReplication
  priority: 2
  minimumTemperature: 20.0
  minimumRequirements:
    AntiNoblium: 0.25
  effects:
  - !type:AntiNobliumReplicationReaction

- type: gasReaction
  id: HydrogenFire
  priority: -1
  minimumTemperature: 373.149 # Same as Atmospherics.FireMinimumTemperatureToExist
  minimumRequirements:
    Oxygen: 0.01
    Hydrogen: 0.01
  effects:
  - !type:HydrogenFireReaction

# --- /tg/ gases: Proto-Nitrate, Zauker, Miasma, Halon (gas_reactions.dm) ---

- type: gasReaction
  id: HalonOxygenAbsorption
  priority: 3 # PRE_FORMATION in /tg/ (priority 1, runs first) - SS14 sorts descending, so mirror it high
  minimumTemperature: 343.149 # T0C + 70
  minimumRequirements:
    Halon: 0.01
    Oxygen: 0.01
  effects:
  - !type:HalonOxygenAbsorptionReaction

- type: gasReaction
  id: ProtoNitrateHydrogenResponse
  priority: 3 # PRE_FORMATION in /tg/ (runs first)
  minimumRequirements:
    ProtoNitrate: 0.01
    Hydrogen: 150
  effects:
  - !type:ProtoNitrateHydrogenResponseReaction

- type: gasReaction
  id: ProtoNitrateTritiumResponse
  priority: 3 # PRE_FORMATION in /tg/ (runs first)
  minimumTemperature: 150
  maximumTemperature: 340
  minimumRequirements:
    ProtoNitrate: 0.01
    Tritium: 0.01
  effects:
  - !type:ProtoNitrateTritiumResponseReaction

- type: gasReaction
  id: ProtoNitrateBzase
  priority: 3 # PRE_FORMATION in /tg/ (runs first)
  minimumTemperature: 260
  maximumTemperature: 280
  minimumRequirements:
    ProtoNitrate: 0.01
    BZ: 0.01
  effects:
  - !type:ProtoNitrateBzaseReaction

- type: gasReaction
  id: ZaukerFormation
  priority: 2 # FORMATION in /tg/
  minimumTemperature: 50000
  maximumTemperature: 75000
  minimumRequirements:
    HyperNoblium: 0.01
    Nitrium: 0.01
  effects:
  - !type:ZaukerFormationReaction

- type: gasReaction
  id: ProtoNitrateFormation
  priority: 2 # FORMATION in /tg/
  minimumTemperature: 5000
  maximumTemperature: 10000
  minimumRequirements:
    Pluoxium: 0.01
    Hydrogen: 0.01
  effects:
  - !type:ProtoNitrateFormationReaction

- type: gasReaction
  id: MiasmaSterilization
  priority: 1 # POST_FORMATION in /tg/ (runs after formation, before fires)
  minimumTemperature: 443.149 # FireMinimumTemperatureToExist + 70
  minimumRequirements:
    Miasma: 0.01
  effects:
  - !type:MiasmaSterilizationReaction

- type: gasReaction
  id: ZaukerDecomposition
  priority: 1 # POST_FORMATION in /tg/
  minimumRequirements:
    Zauker: 0.01
    Nitrogen: 0.01
  effects:
  - !type:ZaukerDecompositionReaction
