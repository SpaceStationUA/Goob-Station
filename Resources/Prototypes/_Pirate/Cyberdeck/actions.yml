- type: entity
  id: ActionCyberdeckHack
  parent: BaseAction
  name: "Зламати пристрій"
  description: "Зламайте електроніку в полі зору за допомогою імпланта кібердеки. Деякі цілі можуть вибухнути."
  components:
  - type: Action
    itemIconStyle: BigAction
    icon:
      sprite: /Textures/_Pirate/Actions/cyberdeck.rsi
      state: hack
    priority: -24
  - type: TargetAction
    range: 20
  - type: EntityTargetAction
    event: !type:CyberdeckHackActionEvent
    rotateOnUse: false

- type: entity
  id: ActionCyberdeckVision
  parent: BaseMentalAction
  name: "Активувати кіберзір"
  description: "Під'єднайте мозок до мережі станції та спроєктуйте себе в неї."
  components:
  - type: Action
    useDelay: 2
    startDelay: true
    icon:
      sprite: /Textures/_Pirate/Actions/cyberdeck.rsi
      state: vision
    priority: -25
  - type: InstantAction
    event: !type:CyberdeckVisionEvent

- type: entity
  id: ActionCyberdeckVisionReturn
  parent: BaseMentalAction
  name: "Повернутися"
  description: "Від'єднайтеся від мережі станції та поверніться у своє тіло."
  components:
  - type: Action
    useDelay: 2
    startDelay: true
    icon:
      sprite: /Textures/_Pirate/Actions/cyberdeck.rsi
      state: return
    priority: -25
  - type: InstantAction
    event: !type:CyberdeckVisionReturnEvent
