- type: entity
  id: MagazineBoxMagnumEnsnaring
  parent: [BaseMagazineBoxMagnumExtended, BaseSecurityContraband] # Omu, add security contra tag
  name: ammunition box (.45 magnum ensnaring)
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumEnsnaring
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: incendiary #i changed just color because it almost white
      color: "#cfff77"

- type: entity
  id: MagazineBoxMagnumFlash
  parent: [BaseMagazineBoxMagnumExtended, BaseSecurityContraband] # Omu, add security contra tag
  name: ammunition box (.45 magnum flash)
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeMagnumFlash
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: incendiary
      color: "#fff94d" # Omu end, uncomment this all.

- type: entity # Omu start, uncomment this all.
  id: BaseMagazineBoxMagnumExtended
  parent: BaseMagazineBoxMagnum
  abstract: true
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeMagnum
    proto: CartridgeMagnum
    capacity: 16
