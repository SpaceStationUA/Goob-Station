- type: entity
  parent: BaseObjective
  id: SkiaReapObjective
  components:
  - type: Objective
    difficulty: 1.5
    issuer: objective-issuer-skia
    unique: false
    icon:
      sprite: Mobs/Ghosts/ghost_human.rsi
      state: icon
  - type: RoleRequirement
    roles:
    - SkiaRole
  - type: KillPersonCondition
    requireDead: true
  - type: TargetObjective
    title: objective-condition-reap-soul-title
  - type: PickRandomPerson
    filters:
    - !type:ObjectiveImmuneFilter
    - !type:TargetObjectiveMindFilter
      blacklist:
        components:
        - KillPersonCondition
  - type: SkiaRerollAfterCompletion
    rerollObjectivePrototype: SkiaReapObjective
    rerollObjectiveMessage: objective-condition-reap-soul-reroll-message
