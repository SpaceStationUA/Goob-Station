- type: entity
  parent: BaseGameRule
  id: SkiaSpawn
  components:
  - type: GameRule
    chaosScore: 100 # Pirate - Secret+ requires a chaos score for fireable rules.
  - type: StationEvent
    weight: 5
    duration: null
    earliestStart: 25
    reoccurrenceDelay: 5
    minimumPlayers: 30
  - type: AntagSpawner
    prototype: MobSkia
  - type: SkiaSpawnRule
  - type: AntagObjectives
    objectives:
    - SkiaReapObjective
  - type: AntagSelection
    agentName: skia-round-end-name
    definitions:
    - spawnerPrototype: SpawnPointSkia
      min: 1
      max: 1
      pickPlayer: false
      mindRoles:
      - MindRoleSkia
      components:
      - type: EmitSoundOnSpawn
        sound: /Audio/_Pirate/Skia/Effects/creepyshriek.ogg
      - type: SkiaBreakLightsOnSpawn
        radius: 10
  - type: Tag
    tags:
    - MidroundAntag
