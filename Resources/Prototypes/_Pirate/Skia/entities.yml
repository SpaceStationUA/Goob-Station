- type: entity
  parent: [ SimpleSpaceMobBase, FlyingMobBase, MobCombat ]
  id: MobSkia
  components:
  - type: Sprite
    drawdepth: Mobs
    sprite: _Pirate/Skia/Mobs/skia.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: skia
  - type: Stealth
    lastVisibility: 0.8
  - type: DamageStateVisuals
    states:
      Alive:
        Base: skia
      Dead:
        Base: dead
  - type: SlowOnDamage
    speedModifierThresholds:
      100: 0.9
  - type: MobState
    allowedStates:
    - Alive
    - Dead
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Dead
  - type: Damageable
    damageContainer: BiologicalMetaphysical
    damageModifierSet: SkiaSpirit
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 160
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: MovementSpeedModifier
    baseWalkSpeed: 2.25
    baseSprintSpeed: 3.75
  - type: NoSlip
  - type: MovedByPressure
    enabled: false
  - type: CombatMode
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 90
    animation: WeaponArcSkiaLunge
    wideAnimation: WeaponArcSkiaSwipe
    wideAnimationRotation: -90
    swingLeft: true
    attackRate: 1.0
    range: 2.0
    altDisarm: false
    damage:
      types:
        Slash: 19
        Piercing: 8
        Soul: 8
  - type: NpcFactionMember
    factions:
    - SimpleHostile
  - type: Tag
    tags:
    - TaserImmune
  - type: Speech
    speechVerb: Ghost
  - type: Emoting
  - type: Insulated
  - type: SkiaLightReactive
    manual: true
  - type: SkiaLightLevelHealth
    darkThreshold: 0.3
    lightThreshold: 0.7
    darkDamage:
      types:
        Blunt: -0.69
        Piercing: -0.69
        Slash: -0.69
        Heat: -0.69
        Poison: -0.69
        Asphyxiation: -0.36
        Bloodloss: -0.36
        Cellular: -0.69
        Soul: -0.14
    lightDamage:
      types:
        Blunt: 1.5
        Piercing: 1.5
        Slash: 1.5
    healWhenDead: true
    darkMovementSpeedMultiplier: 1.25
    lightMovementSpeedMultiplier: 1.0
  - type: SkiaLightLevelDamageMult
    lightReceivedMultiplier: 1.5
    lightDealtMultiplier: 0.5
  - type: SkiaResurrectWhenAble
    timeToResurrect: 30.0
    resurrectDesc: skia-resurrecting-desc
  - type: Bloodstream
    maxBleedAmount: 0
  - type: SkiaScream
    radius: 7.0
    penetratingRadius: 2.0
  - type: SkiaTechnokineticPulse
    range: 5.0
    energyConsumption: 20000
    disableDuration: 20.0
  - type: Jaunt
    jauntAction: ActionSkiaJaunt
  - type: VentCrawler
    enterDelay: 0.5
  - type: Butcherable
    spawned:
    - id: Ectoplasm
      amount: 1
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 2.5
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: NightVision
    drawOverlay: false
  - type: SkiaEmbedImmune
    immuneTo:
      components:
      - SkiaFlareGunPellet

- type: entity
  parent: ClothingHeadBase
  id: ClothingHeadHatHoodSkiaHood
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Pirate/Skia/Clothing/Head/Hoods/skia_hoodie.rsi
  - type: Clothing
    sprite: _Pirate/Skia/Clothing/Head/Hoods/skia_hoodie.rsi
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: HideLayerClothing
    slots:
    - Hair

- type: entity
  parent: ClothingOuterBaseToggleable
  id: ClothingOuterHoodieSkia
  components:
  - type: Sprite
    sprite: _Pirate/Skia/Clothing/OuterClothing/Misc/skia_hoodie.rsi
  - type: Clothing
    sprite: _Pirate/Skia/Clothing/OuterClothing/Misc/skia_hoodie.rsi
  - type: ToggleableClothing
    clothingPrototypes:
      head: ClothingHeadHatHoodSkiaHood
  - type: Construction
    graph: SkiaHoodie
    node: skiaHoodie
  - type: Tag
    tags:
    - Hoodie
    - WhitelistChameleon

- type: entity
  categories: [ HideSpawnMenu, Spawner ]
  parent: BaseAntagSpawner
  id: SpawnPointSkia
  components:
  - type: GhostRole
    name: ghost-role-information-skia-name
    description: ghost-role-information-skia-description
    rules: ghost-role-information-skia-rules
    mindRoles:
    - MindRoleSkia
