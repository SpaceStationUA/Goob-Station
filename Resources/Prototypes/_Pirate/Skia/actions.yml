    icon:
      sprite: _Goobstation/Wizard/actions.rsi
      state: jaunt
  - type: InstantAction
    event: !type:PolymorphSpellEvent
      protoId: Jaunt

- type: entity
  id: ActionTechnokineticPulse
  components:
  - type: Action
    icon:
      sprite: _Pirate/Skia/Actions/technokineticpulse.rsi
      state: technokinetic-pulse
    useDelay: 60
  - type: InstantAction
    event: !type:SkiaTechnokineticPulseActionEvent
