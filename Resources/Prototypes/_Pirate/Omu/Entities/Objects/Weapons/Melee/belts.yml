# Pirate: ported from OmuStation d61692d693fd1870b2a00e26f25cbfda27b6c49e.

- type: entity
  id: WaistBeltSergeantBelt
  parent: [BaseSecurityContraband, DisciplinaryBeltBase]
  name: disciplinary belt
  description: A very heavy belt. "Look what you've done! Cadet, give me five NOW!"
  components:
  # sprites
  - type: Sprite
    sprite: _Pirate/Omu/Clothing/Belt/sergeantdisciplinary.rsi
    state: icon
  - type: Clothing
    sprite: _Pirate/Omu/Clothing/Belt/sergeantdisciplinary.rsi
  #Hurty hurts
  - type: MeleeWeapon
    wideAnimationRotation: -135
    bluntStaminaDamageFactor: 1.5
    angle: 0
    damage:
      types:
        Blunt: 12
    attackRate: 0.7
    soundHit:
      path: /Audio/_Goobstation/Weapons/Baton/woodhit.ogg
      params:
        variation: 0.25
  - type: TelescopicBaton
  - type: KnockdownOnHit
    duration: .1
    dropItems: false
  - type: StaminaDamageOnHit
    damage: 12
  - type: UseDelay
    delays:
      default:
        length: 1
  - type: UseDelayBlockMelee
    delays:
    - default

- type: entity
  id: DisciplinaryBeltBase
  parent: ClothingBeltBase
  abstract: true
  components:
  # overriding default equip and unequip sounds
  - type: Clothing
    equipSound:
       path: /Audio/_Pirate/Omu/Items/Belts/BeltBuckle.ogg
       params:
         volume: -3
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Pirate/Omu/Items/Belts/BeltPickup.ogg
      params:
        volume: -3
  - type: EmoteOnMeleeHit
    emoteChance: 1
    emotes:
    - Scream
  - type: EmitSoundOnUse
    sound:
      path: /Audio/_Pirate/Omu/Items/Belts/BeltSnap.ogg
      params:
        maxDistance: 15
  - type: UseDelay
    delay: 1
