- type: entity
  id: ClothingBeltExtractionRigBSO
  parent: [ClothingBeltStorageBase, BaseCentcommContraband]
  name: blueshield officer's extraction rig
  description: A more modern design of the rigs used by salvagers with even more pockets and pouches, worn by Blueshield Officers which like to focus on efficient extraction.
  components:
  - type: Sprite
    sprite: _Pirate/Omu/Clothing/Belt/blueshieldextractionwebbing.rsi
  - type: Clothing
    sprite: _Pirate/Omu/Clothing/Belt/blueshieldextractionwebbing.rsi
  - type: Storage
    grid:
    - 0,0,9,1 # 20 squares of space, least of all of the options (chembag has 24, the chest rig has 21), cus it can store anything. Also funny long line.

