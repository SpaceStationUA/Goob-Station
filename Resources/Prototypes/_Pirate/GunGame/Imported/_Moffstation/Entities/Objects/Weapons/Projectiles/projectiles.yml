- type: entity
  parent: GrapplingHook
  id: ChainSickle
  name: chain sickle
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: _Pirate/GunGame/Imported/_Moffstation/Objects/Weapons/Guns/Launchers/chainsickle.rsi
  - type: Ammo
    muzzleFlash: null
  - type: Projectile
    deleteOnCollide: false
    penetrationThreshold: 1000
    damage:
      types:
        Slash: 20
    soundHit:
      path: "/Audio/_Pirate/GunGame/Imported/_Moffstation/Surgery/retractor2.ogg"
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.1,0,0.1" # Asymmetric - favors the pointy side
        mask:
        - Impassable
        - BulletImpassable
