- type: entity
  parent: WeaponGrapplingGun
  id: WeaponNinjaChainSickle
  categories: [HideSpawnMenu]
  name: chain sickle
  description: A sickle attached to a websilk chain. The Spider Clan embodies the ancient ways, even as they steal the future.
  components:
  - type: GrapplingGun
    reelRate: 7.5 # Fast reeling - can move very quickly in combat with this
    cycleSound: /Audio/_Pirate/GunGame/Imported/_Moffstation/Surgery/retractor1.ogg
    ropeSprite:
      sprite: _Pirate/GunGame/Imported/_Moffstation/Objects/Weapons/Guns/Launchers/chainsickle.rsi
      state: rope
  - type: EmbeddableProjectile
    sound: /Audio/Weapons/bolathrow.ogg
    offset: -0.15,0.0
  - type: LandAtCursor
  - type: Ensnaring
    freeTime: 2.0
    breakoutTime: 30 # punishing chains
    walkSpeed: 0.8
    sprintSpeed: 0.9
    staminaDamage: 100
    canThrowTrigger: true
    canMoveBreakout: true
    maxEnsnares: 1
  - type: Gun
    soundGunshot: /Audio/Weapons/utilityknifeopen.ogg
    fireRate: 1.0
    soundEmpty: /Audio/_Pirate/GunGame/Imported/_Moffstation/Surgery/retractor1.ogg
  - type: Item
    size: Small
    shape:
    - 0,1,0,1
    - 0,0,1,0
    storedOffset: 0,-6
  - type: BasicEntityAmmoProvider
    proto: ChainSickle
    capacity: 1
  - type: Sprite
    sprite: _Pirate/GunGame/Imported/_Moffstation/Objects/Weapons/Guns/Launchers/chainsickle.rsi
    state: base
  - type: UseDelay
    delay: 0.5
