# Role and event

- type: antag
  id: ListeningPost
  name: roles-antag-listening-post-name
  antagonist: true
  objective: roles-antag-listening-post-objective
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 72h
  - !type:DepartmentTimeRequirement
    department: Security
    time: 11.1h
  - !type:DepartmentTimeRequirement
    department: Civilian
    time: 11.1h
  - !type:DepartmentTimeRequirement
    department: Command
    time: 11.1h

- type: entity
  parent: BaseMindRoleAntag
  id: MindRoleListeningPost
  name: Listening Post Role
  components:
  - type: MindRole
    roleType: TeamAntagonist
    subtype: role-subtype-lpo
    antagPrototype: ListeningPost
    exclusiveAntag: true
  - type: ListeningPostRole

- type: entity
  categories: [ HideSpawnMenu, Spawner ]
  parent: BaseAntagSpawner
  id: SpawnPointGhostSyndicateListener
  components:
  - type: GhostRole
    name: ghost-role-information-listeningop-name
    description: ghost-role-information-listeningop-description
    rules: ghost-role-information-listeningop-rules
    mindRoles:
    - MindRoleListeningPost

- type: entity
  parent: BaseGameRule
  id: ListeningPost
  components:
  - type: GameRule
    chaosScore: 300
  - type: StationEvent
    earliestStart: 30
    weight: 4
    minimumPlayers: 25
    maxOccurrences: 1
    duration: null
    chaos:
      Hostile: 20
      Friend: 20
    eventType: HostilesSpawn
  # Pirate: PrecognitionResult is unavailable in the local psionics implementation.
  - type: RuleGrids
  - type: LoadFarGridRule
    path: /Maps/_Pirate/Nonstations/listening_post.yml
    distanceModifier: 13
  - type: DebrisSpawnerRule
    count: 6
    distanceModifier: 3
  - type: AntagLoadProfileRule
  - type: AntagSelection
    agentName: listening-post-round-end-agent-name
    definitions:
    - spawnerPrototype: SpawnPointGhostSyndicateListener
      min: 2
      max: 2
      pickPlayer: false
      startingGear: SyndicateListenerGear
      roleLoadout:
      - RoleSurvivalStandard
      components:
      - type: RandomHumanoidAppearance
        randomizeName: false
      - type: RandomMetadata
        nameSegments:
        - NamesDeathCommando
      - type: AutoImplant
        implants:
        - DeathAcidifierImplant
      - type: NpcFactionMember
        factions:
        - Syndicate
      # Pirate: Binary is a collective-mind channel here, not a radio channel.
      - type: ReceiveOnlyCollectiveMind
        channel: Binary
      - type: TargetObjectiveImmune
      mindRoles:
      - MindRoleListeningPost
  - type: DynamicRuleCost
    cost: 50

# Operative equipment

- type: startingGear
  id: SyndicateListenerGear
  equipment:
