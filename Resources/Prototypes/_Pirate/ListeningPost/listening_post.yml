    gloves: ClothingHandsGlovesCombat
    shoes: ClothingShoesSlippers
    id: SyndiListeningPostPDA
    back: ClothingBackpackSyndicate
    pocket1: AgentIDCard
    pocket2: HandheldStationMapRecordsTablet

- type: entity
  parent: ClothingHeadsetAltSyndicate
  id: ClothingHeadsetAltSyndicateListening
  components:
  - type: ContainerFill
    containers:
      key_slots:
      - EncryptionKeySyndie
      - EncryptionKeyStationMaster
  - type: Sprite
    sprite: _Pirate/Clothing/Ears/Headsets/syndicate_listening.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Ears/Headsets/syndicate_listening.rsi

- type: entity
  parent: SyndiPDA
  id: SyndiListeningPostPDA
  components:
  - type: Pda
    id: SyndicateIDCard
    penSlot:
      startingItem: CyberPen
      whitelist:
        tags:
        - Write
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType: !type:String
        pda-syndi-agent
  - type: Sprite
    layers:
    - sprite: _Pirate/Objects/Devices/pda_syndi_agent.rsi
      state: pda-syndi-agent
      map: [ "enum.PdaVisualLayers.Base" ]
    - state: light_overlay
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: unshaded
      visible: false
    - state: id_overlay
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: unshaded
      visible: false
    - state: insert_overlay
      map: [ "enum.PdaVisualLayers.Pen" ]
  - type: Icon
    sprite: _Pirate/Objects/Devices/pda_syndi_agent.rsi
    state: pda-syndi-agent

- type: entity
  parent: ClothingBeltUtility
  id: ClothingBeltSyndicateUtility
  components:
  - type: Sprite
    sprite: _Pirate/Clothing/Belt/syndbelt_overlay.rsi
  - type: Clothing
    sprite: _Pirate/Clothing/Belt/syndbelt_overlay.rsi

# Listening post machines

- type: entity
  parent: ComputerCrewMonitoring
  id: ComputerCrewMonitoringSyndicate
  suffix: Syndicate, Long Range
  # Pirate: DeltaV's mapper-only MappingCategories component is unavailable here.
  components:
  - type: LongRangeCrewMonitor

- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: SyndicateMonitoringServer
  components:
  - type: Sprite
    sprite: Structures/Machines/server.rsi
    snapCardinals: true
    layers:
    - state: server-off
    - state: server-on
      visible: false
      map: [ "enum.PowerDeviceVisualLayers.Powered" ]
    - state: variant-crew
    - state: server_o
      map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
  - type: Machine
    board: CrewMonitoringServerMachineCircuitboard
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: WiresPanel
  - type: WiresVisuals
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: LongRangeCrewMonitoringServer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 5
    enabled: false
    sound:
      path: /Audio/Ambience/Objects/server_fans.ogg

- type: entity
  parent: FaxMachineBase
  id: FaxMachineListeningSyndie
  suffix: Syndicate
  components:
  - type: Sprite
    sprite: _Pirate/Structures/Machines/syndicate_fax_machine.rsi
    layers:
    - state: icon
      map: [ "base" ]
      color: "#a3a3a3"
  - type: FaxMachine
    name: "Невідомо?"
    responsePings: false
  - type: Emagged

