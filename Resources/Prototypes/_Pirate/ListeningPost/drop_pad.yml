- type: sourcePort
  id: SyndicateDropPad
  name: signal-port-name-syndicate-drop-pad
  description: signal-port-description-syndicate-drop-pad
  defaultLinks: [ SyndicateDropPad ]

- type: sinkPort
  id: SyndicateDropPad
  name: signal-port-name-syndicate-drop-pad
  description: signal-port-description-syndicate-drop-pad

- type: entity
  parent: MarkerBase
  id: SyndicateDropAnnouncer
  name: "Верховне командування Синдикату"
  categories: [ HideSpawnMenu ]

- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: SyndicateDropPad
  name: "блюспейс-пускова платформа"
  description: "Завантажте ящик або валізу, а потім дозвольте диспетчерській консолі перекинути їх через сектор. Транслює сигнал достатньо гучно, тож використовувати її двічі поспіль — це просити, щоб вас знайшли."
  components:
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Transform
    anchored: true
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.00"
        density: 190
        mask:
          - MachineMask
  - type: Sprite
    sprite: _Pirate/Structures/Machines/syndicate_drop_pad.rsi
    drawdepth: HighFloorObjects
    layers:
    - state: lpad-idle-off
      map: [ "enum.SyndicateDropPadLayers.Base" ]
    - state: lpad-idle
      map: [ "enum.SyndicateDropPadLayers.Beam" ]
      shader: unshaded
  - type: Appearance
  - type: AnimationPlayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: DeviceLinkSink
    ports:
    - SyndicateDropPad
  - type: ApcPowerReceiver
    powerLoad: 1000
  - type: SyndicateDropPad
    whitelist:
      tags:
      - Crate
      - Briefcase
    anchorOnArrival:
      tags:
      - Briefcase
    arrivalComponents:
    - type: Appearance
    - type: SubFloorHide
    - type: Anchorable
    - type: CollideOnAnchor
    - type: AnchoredStorageFilter
      blacklist:
        components:
        - HumanoidAppearance
    - type: BlockAnchorOn
      blacklist:
        components:
        - AnchoredStorageFilter
  - type: Machine
    board: SyndicateDropPadMachineCircuitboard
  - type: CollideOnAnchor
  - type: PointLight
    radius: 1.4
    energy: 2.0
    color: "#f71713"
    enabled: false
  - type: LitOnPowered

- type: entity
  parent: [ BaseMachineCircuitboard, BaseSyndicateContraband ]
  id: SyndicateDropPadMachineCircuitboard
  name: "друкована плата блюспейс-пускової платформи"
  description: "Друкована плата машини для блюспейс-пускової платформи."
  components:
  - type: Sprite
    state: supply
  - type: MachineBoard
    prototype: SyndicateDropPad
    stackRequirements:
      Manipulator: 2
      Steel: 5
      BSCrystal: 2
