# Curated internet-radio stations for the Pirate PDA radio app.
#
# HARD REQUIREMENTS (do not add a station that breaks these):
#   * url MUST be https:// (res:// pages are a Secure context; http is
#     blocked as mixed content).
#   * the stream MUST be an open codec (Ogg Vorbis / Opus / FLAC-in-Ogg).
#     Stock CEF ships no MP3/AAC decoders, so an MP3/AAC stream fails with
#     NotSupportedError.
#   * every URL below was byte-verified (OggS magic) with a live range GET
#     on 2026-09-20.
#
# One entry per station: Lassul's .ogg/.opus mounts all carry the same
# program, so only one is listed. Sources found via radio-browser.info
# (community directory) and verified by hand.
#
# These load offline and are always offered; the server additionally queries
# radio-browser.info for more Ogg stations when
# pirate.radio_remote_catalog is on, and only offers remote ones whose
# stream still answers with Ogg magic bytes.

- type: radioStation
  id: lassul-radio
  label: Lassul Radio
  genre: various / eclectic
  url: https://radio.lassul.us/radio.ogg
  featured: true

