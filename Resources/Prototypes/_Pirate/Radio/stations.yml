# ---- Server-relayed stations (transcoded from MP3/AAC) ----
#
# These streams are MP3/AAC, which stock CEF cannot decode. The server
# fetches them, transcodes to Opus/WebM and relays the bytes over the game
# connection; requires pirate.radio_ffmpeg_path to be set on the server.
# Each URL was byte-verified (MPEG sync / ADTS sync) with a live GET on
# 2026-09-20. Note: ffmpeg follows redirects, so 302 hops (laut.fm) work.

