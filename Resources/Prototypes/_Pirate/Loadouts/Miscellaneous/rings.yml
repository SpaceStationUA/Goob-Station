# Rings go in the gloves slot. A ring is equipped after the other loadout items:
# it is attached to the gloves if there are gloves, and worn on the hand if there are none.

- type: loadout
  id: LoadoutRingGold
  equipment:
    gloves: GoldRing

- type: loadout
  id: LoadoutRingSilver
  equipment:
    gloves: SilverRing

- type: loadout
  id: LoadoutRingGoldDiamond
  equipment:
    gloves: GoldRingDiamond

- type: loadout
  id: LoadoutRingSilverDiamond
  equipment:
    gloves: SilverRingDiamond

- type: loadout
  id: LoadoutRingGoldGem
  equipment:
    gloves: GoldRingGem

- type: loadout
  id: LoadoutRingSilverGem
  equipment:
    gloves: SilverRingGem

- type: loadout
  id: LoadoutRingBloodDiamond
  equipment:
    gloves: RingBloodDiamond

- type: loadout
  id: LoadoutRingEmerald
  equipment:
    gloves: RingEmerald

- type: loadout
  id: LoadoutRingPlasma
  equipment:
    gloves: RingPlasma

- type: loadout
  id: LoadoutRingTurkenite
  equipment:
    gloves: RingTurkenite

- type: loadout
  id: LoadoutRingSignet
  equipment:
    gloves: RingSignet

- type: loadout
  id: LoadoutRingMasonic
  equipment:
    gloves: RingMasonic

- type: loadoutGroup
  id: Rings
  name: loadout-group-rings
  minLimit: 0
