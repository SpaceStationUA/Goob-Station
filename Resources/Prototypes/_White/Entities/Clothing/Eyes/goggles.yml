# Night Vision Goggles

- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesNightVisionGoggles
  name: "окуляри нічного бачення"
  description: "Тепер ви можете бачити в темряві!"
  components:
  - type: Sprite
    sprite: _White/Clothing/Eyes/Goggles/nightvision.rsi
  - type: Clothing
    sprite: _White/Clothing/Eyes/Goggles/nightvision.rsi
  - type: MonolithNightVision # Gen 2 dual tube
    relayOverlay: true
    goggleEffect: true
    action: MonolithToggleNightVision
    viewCircleRadius: 400
    viewCircleCount: 2
    viewCircleSpacing: 280
    phosphorColor: "#00FF00"
    lightingColor: "#FFFFFF26"
    amplification: 10
  - type: IdentityBlocker
    coverage: EYES

# Mono start
# I used these for testing. You can use them for adding them to your suits.
- type: entity
  parent: ClothingEyesNightVisionGoggles
  id: ClothingEyesNightVisionGogglesGen1
  name: "окуляри нічного бачення (покоління 1)"
  suffix: DEBUG
  components:
  - type: MonolithNightVision
    action: MonolithToggleNightVision
    viewCircleRadius: 400
    viewCircleCount: 1
    viewCircleSpacing: 280
    phosphorColor: "#00FF00"
    amplification: 6

- type: entity
  parent: ClothingEyesNightVisionGoggles
  id: ClothingEyesNightVisionGogglesGen2
  name: "окуляри нічного бачення (покоління 2)"
  suffix: DEBUG
  components:
  - type: MonolithNightVision
    action: MonolithToggleNightVision
    viewCircleRadius: 400
    viewCircleCount: 2
    viewCircleSpacing: 280
    phosphorColor: "#00FF00"
    amplification: 10

- type: entity
  parent: ClothingEyesNightVisionGoggles
  id: ClothingEyesNightVisionGogglesGen3
  name: "окуляри нічного бачення (покоління 3)"
  suffix: DEBUG
  components:
  - type: MonolithNightVision
    action: MonolithToggleNightVision
    viewCircleRadius: 450
    viewCircleCount: 2
    viewCircleSpacing: 280
    phosphorColor: "#00FF00"
    amplification: 14

- type: entity
  parent: ClothingEyesNightVisionGoggles
  id: ClothingEyesNightVisionGogglesGen4
  name: "окуляри нічного бачення (покоління 4)"
  suffix: DEBUG
  components:
  - type: MonolithNightVision
    action: MonolithToggleNightVision
    viewCircleRadius: 400
    viewCircleCount: 4
    viewCircleSpacing: 260
    phosphorColor: "#41D7D9"
    amplification: 18
# Mono end

- type: entity
  parent: [ClothingEyesNightVisionGoggles, ShowMedicalIcons, BaseSyndicateContraband]
  id: ClothingEyesNightVisionGogglesSyndie
  name: "окуляри нічного бачення синдикату"
  description: "Високотехнологічні окуляри нічного бачення. Мають технологію медичного аналізу."
  components:
  - type: Sprite
    sprite: _White/Clothing/Eyes/Goggles/snightvision.rsi
  - type: Clothing
    sprite: _White/Clothing/Eyes/Goggles/snightvision.rsi

- type: entity
  parent: ClothingEyesNightVisionGogglesSyndie
  id: ClothingEyesNightVisionGogglesNukie
  suffix: "NukeOps"
  components:
  - type: ShowSyndicateIcons
  - type: MonolithNightVision # Gen 3
    viewCircleRadius: 450
    viewCircleCount: 2
    viewCircleSpacing: 280
    phosphorColor: "#00FF00"
    amplification: 14

# Thermal Vision Goggles

- type: entity
  parent: ClothingEyesBase
  id: ClothingEyesThermalVisionGoggles
  name: "тепловізійні окуляри"
  description: "Тепер ви можете бачити всіх!"
  components:
  - type: Sprite
    sprite: _White/Clothing/Eyes/Goggles/thermal.rsi
  - type: Clothing
    sprite: _White/Clothing/Eyes/Goggles/thermal.rsi
  - type: ThermalVision
    flashDurationMultiplier: 2
    pulseTime: 2
    isEquipment: true
    toggleAction: PulseThermalVision
  - type: IdentityBlocker
    coverage: EYES

- type: entity
  parent: [ClothingEyesBase, BaseSyndicateContraband]
  id: ClothingEyesThermalVisionGogglesSyndie
  name: "тепловізійні окуляри"
  description: "Високотехнологічні тепловізійні окуляри."
  components:
  - type: Sprite
    sprite: _White/Clothing/Eyes/Goggles/sthermals.rsi
  - type: Clothing
    sprite: _White/Clothing/Eyes/Goggles/sthermals.rsi
  - type: ThermalVision
    flashDurationMultiplier: 2
    isEquipment: true
    toggleAction: ToggleThermalVision
  - type: IdentityBlocker
    coverage: EYES
  - type: ChameleonClothing #Goobstation start
    slot: [eyes]
    default: ClothingEyesThermalVisionGogglesSyndie  
  - type: UserInterface
    interfaces:
      enum.ChameleonUiKey.Key:
        type: ChameleonBoundUserInterface #Goobstation end

- type: entity
  parent: ClothingEyesThermalVisionGogglesSyndie
  id: ClothingEyesThermalVisionGogglesNukie
  suffix: "NukeOps"
  components:
  - type: ShowSyndicateIcons
  - type: ShowJobIcons
  - type: ShowMindShieldIcons
