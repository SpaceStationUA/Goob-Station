    species: Thaven
    # Pirate: Keep the character-setup dummy aligned with the in-game sprite.
    markingsDisplacement:
      Hair:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Thaven/displacement.rsi
            state: head
      FacialHair:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Thaven/displacement.rsi
            state: head
  - type: Inventory
    # Pirate: Match the dummy's inventory offsets to the real Thaven body.
    speciesId: thaven
    templateId: thaven
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Thaven/displacement.rsi
            state: jumpsuit
      outerClothing:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Thaven/displacement.rsi
            state: outerclothing_hardsuit
      head:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Thaven/displacement.rsi
            state: head
      gloves:
        sizeMaps:
          32:
            sprite: _MACRO/Mobs/Species/Thaven/displacement.rsi
            state: hands
