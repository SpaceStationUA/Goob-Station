- type: entity
  abstract: true
  parent: BaseItem
  id: BaseDiodeDisc
  components:
  - type: Sprite
    sprite: _Omu/Objects/Tools/diodedisc.rsi
    state: icon
  - type: DiodeDisc

- type: entity
  parent: BaseDiodeDisc
  id: DiodeDiscElectroDisruptive
  name: "електродестабілізаційний діодний диск"
  description: "Діодний диск для використання в емітері. Спричиняє в суперматерії подію виправлення причинності, завдяки чому вона відновлює свою цілісність."
  components:
  - type: DiodeDisc
    newBolt: EmitterBoltElectroDisruptive
    componentsToAdd:
    - type: UpgradedMachine
      upgrade: emitter-electro-disrutpive

- type: entity
  parent: BaseDiodeDisc
  id: DiodeDiscElectroBehavioural
  name: "електроповедінковий діодний диск"
  description: "Діодний диск для використання в емітері. Спричиняє в суперматерії каскадну подію причинності, яка пошкоджує її, але значно збільшує вихід енергії. Також позитивно впливає на здоров'я пацієнтів!"
  components:
  - type: DiodeDisc
    newBolt: EmitterBoltElectroBehavioural
    componentsToAdd:
    - type: UpgradedMachine
      upgrade: emitter-electro-behavioural

- type: entity
  name: "промінь емітера"
  id: EmitterBoltElectroDisruptive
  parent: EmitterBolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags:
    - EmitterBolt
  - type: Projectile
    damage:
      types:
        Heat: 14
        Blunt: 6
  - type: AngeringProjectile
    integDamage: -1
    energyDamage: -60

- type: entity
  name: "промінь емітера"
  id: EmitterBoltElectroBehavioural
  parent: EmitterBolt
  categories: [ HideSpawnMenu ]
  components:
  - type: Tag
    tags:
    - EmitterBolt
  - type: Projectile
    damage:
      types:
        Heat: -5
        Blunt: -2
  - type: AngeringProjectile
    integDamage: 1
    energyDamage: 100
