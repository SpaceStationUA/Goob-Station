# Syndicate dead drop
- type: entity
  parent: MarkerBase
  id: SyndieDeadDropSpawner
  name: "Верховне командування Синдикату" # Used for radio announcement
  categories: [ HideSpawnMenu ]
  components:
  - type: EntityTableSpawner
    table: !type:AllSelector
      children:
      - id: BriefcaseSyndieDeadDrop
      - id: EffectFlashRedspace

- type: entity
  parent: [ BaseSubfloorAnchorStorageAnchored, BriefcaseSyndie, BaseSyndicateContraband ]
  id: BriefcaseSyndieDeadDrop
  name: "портфель Синдикату"
  suffix: Dead Drop, Do Not Map
  components:
  - type: EntityTableContainerFill
    containers:
      storagebase: !type:GroupSelector
        rolls: !type:RangeNumberSelector
          range: 3, 4
        children:
        # Weapons
        - id: ClothingHandsKnuckleDustersSyndicate
        - id: ThrowingKnife
          amount: 2
        # Grenades
        - id: SmokeGrenade
        - id: EmpGrenade
        - id: C4
        # Clothing
        - id: ClothingShoesBootsMagSyndie
        - id: SyndicateIDCardAgent
        - id: ClothingMaskGasSyndicate
        - id: ClothingShoesChameleonNoSlips
        # Tools
        - id: ChameleonProjector
        - id: CameraBug
        - id: SyndicateJawsOfLife
        - id: RadioJammer
        - id: AccessBreaker
        - id: CyberPen
        - id: EncryptionKeyBinarySyndicate
        # Chemicals
        - id: Hypopen
        - id: Stimpack
        - id: CombatMedipen
        - id: VestineChemistryVial
        - id: CigPackSyndicate
        # Fun
        - id: SyndicatePersonalAI
        - id: RubberStampSyndicate
        - id: UplinkLighterBox
        - id: BalloonOperative
        - id: SpaceCash5000
