# Eight-layer parallax sets for the journey sectors. Generated by space-journey-design/gen/build_sets.py;
# regenerate them rather than editing these numbers by hand.
#
# Far layers track the camera and near layers stay fixed in the world, so the near ones shift most as
# the player walks. Scroll is the travel motion and is multiplied by warp speed. Drift is the slow
# motion at rest and is not affected by speed.

- type: parallax
  id: JourneyGenBlue
  sectorName: journey-sector-kel-terus
  sectorDescription: journey-sector-kel-terus-description
  layers:
  # far: nebula haze and distant stars
  - texture:
      !type:ImageParallaxTextureSource
      path: "/Textures/_Pirate/Parallaxes/Journey/gen/blue_L1_far.png"
    slowness: 0.9
    scale: "1.6, 1.6"
    scrolling: "0, 0.015"
  # far: small rocks and crystals
  - texture:
      !type:ImageParallaxTextureSource
      path: "/Textures/_Pirate/Parallaxes/Journey/gen/blue_L1r_far.png"
    slowness: 0.8
    scale: "1.6, 1.6"
    scrolling: "0, 0.020"
  # under the mid nebula: small objects the haze covers
  - texture:
      !type:ImageParallaxTextureSource
      path: "/Textures/_Pirate/Parallaxes/Journey/gen/blue_L1b_under.png"
    slowness: 0.7
    scale: "1.6, 1.6"
    scrolling: "0, 0.030"
  # mid: nebula with crystals
  - texture:
      !type:ImageParallaxTextureSource
      path: "/Textures/_Pirate/Parallaxes/Journey/gen/blue_L2_mid.png"
    slowness: 0.58
    scale: "1.6, 1.6"
    scrolling: "0, 0.040"
  # mid, drifting: asteroids
  - texture:
      !type:ImageParallaxTextureSource
      path: "/Textures/_Pirate/Parallaxes/Journey/gen/blue_L2b_drift.png"
    slowness: 0.46
    scale: "1.6, 1.6"
    scrolling: "0, 0.050"
    drift: "0.008, 0"
  # mid: crystals and rocks
  - texture:
      !type:ImageParallaxTextureSource
      path: "/Textures/_Pirate/Parallaxes/Journey/gen/blue_L2c_mid.png"
    slowness: 0.36
    scale: "1.6, 1.6"
    scrolling: "0, 0.060"
    drift: "-0.006, 0.003"
  # near: large crystals
  - texture:
      !type:ImageParallaxTextureSource
      path: "/Textures/_Pirate/Parallaxes/Journey/gen/blue_L3_near.png"
    slowness: 0.16
    scale: "1.6, 1.6"
    scrolling: "0, 0.080"
    drift: "-0.012, 0.006"
  # near, drifting: large rocks
  - texture:
      !type:ImageParallaxTextureSource
      path: "/Textures/_Pirate/Parallaxes/Journey/gen/blue_L3b_near.png"
    slowness: 0.06
    scale: "1.6, 1.6"
    scrolling: "0, 0.100"
    drift: "0.015, -0.008"

