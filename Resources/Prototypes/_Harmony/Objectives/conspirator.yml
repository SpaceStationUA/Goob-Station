- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseConspiratorObjective
  components:
  - type: Objective
    issuer: conspirator-objective-issuer
    difficulty: 0
  - type: RoleRequirement
    roles:
    - ConspiratorRole
  - type: CodeCondition
    completed: true

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorUnionObjective
  name: "Силоміць захопити контроль над відділом"
  description: "Візьміть відділ під безпосередній контроль і проголосіть незалежність від Нанотрейзен."
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Melee/stunprod.rsi
      state: stunprod_off

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorGameshowObjective
  name: "Провести смертельне ігрове шоу"
  description: "Змусьте екіпаж узяти участь в ігровому шоу з неймовірно високими ставками."
  components:
  - type: Objective
    icon:
      sprite: Structures/Machines/computers.rsi
      state: television

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorTechnologyObjective
  name: "Захопити всі технології станції"
  description: "Покажіть екіпажу переваги простішого життя. Адже лише ви гідні технологічних див."
  components:
  - type: Objective
    icon:
      sprite: Structures/Machines/autolathe.rsi
      state: icon

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorArmsObjective
  name: "Роззброїти Службу безпеки й озброїтися самим"
  description: "Заберіть зброю у Служби безпеки та роздайте її собі. Їм не можна довіряти зброю."
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Guns/Pistols/mk58.rsi
      state: icon

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorThiefObjective
  name: "Здійснити найбільше пограбування всіх часів"
  description: "Увійдіть в історію завдяки тому, що викрадете з цієї станції."
  components:
  - type: Objective
    icon:
      sprite: Objects/Tools/thief_beacon.rsi
      state: extraction_point

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorMafiaObjective
  name: "Заснувати злочинну родину"
  description: "Очоліть злочинний світ цієї станції та здобудьте репутацію угруповання, якого всі остерігаються."
  components:
  - type: Objective
    icon:
      sprite: Clothing/Hands/Gloves/Color/black.rsi
      state: icon

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorArrestObjective
  name: "Обманом змусити Службу безпеки заарештувати невинних"
  description: "Продемонструйте їхню некомпетентність, показавши, як легко їх ошукати."
  components:
  - type: Objective
    icon:
      sprite: Objects/Weapons/Melee/stunbaton.rsi
      state: stunbaton_on

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorCameraObjective
  name: "Зруйнувати систему тотального нагляду"
  description: "Поверніть працівникам Нанотрейзен право на приватність."
  components:
  - type: Objective
    icon:
      sprite: Mobs/Silicon/station_ai.rsi
      state: ai_camera

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorDismantleObjective
  name: "Демонтувати всі бар'єри"
  description: "Жодна перешкода не має стояти на вашому шляху."
  components:
  - type: Objective
    icon:
      sprite: Structures/Holo/security.rsi
      state: icon

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorInfightingObjective
  name: "Посварити командування між собою"
  description: "Розладнайте роботу командування станції, спричинивши внутрішню ворожнечу, і скористайтеся хаосом."
  components:
  - type: Objective
    icon:
      sprite: Clothing/Head/Hats/capcap.rsi
      state: icon

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorRemoveObjective
  name: "Ліквідувати відділ"
  description: "На цій станції забагато відділів. Зменште їхню кількість будь-якими засобами."
  components:
  - type: Objective
    icon:
      sprite: Structures/Shuttles/thruster.rsi
      state: base

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorHostageObjective
  name: "Взяти командування в заручники"
  description: "Візьміть командування в заручники й вимагайте за них непомірний викуп."
  components:
  - type: Objective
    icon:
      sprite: Objects/Misc/handcuffs.rsi
      state: handcuff

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorSwapObjective
  name: "Поміняти місцями два відділи"
  description: "Повністю поміняйте місцями два відділи разом із персоналом та обладнанням."
  components:
  - type: Objective
    icon:
      sprite: Objects/Tools/wrench.rsi
      state: icon

- type: entity
  parent: BaseConspiratorObjective
  id: ConspiratorProductivityObjective
  name: "Саботувати продуктивність"
  description: "Грошовий потік має зупинитися. Екіпаж не повинен працювати. Ви маєте їх зупинити."
  components:
  - type: Objective
    icon:
      sprite: Objects/Consumable/Food/snacks.rsi
      state: chips-trash

- type: entity
  parent: [BaseConspiratorObjective, BaseLivingObjective]
  id: ConspiratorEvacObjective
  name: "Втекти до Центкому живим і вільним на евакуаційному шатлі"
  description: "Увесь екіпаж має вибратися живим і вільним."
  components:
  - type: Objective
    icon:
      sprite: Structures/Furniture/chairs.rsi
      state: shuttle
  - type: EscapeShuttleCondition
