# Pirate: Ported from upstream PR #34 (SpaceStationUA/Goob-Station)
- type: entity
  id: AnoigoPowerEntity
  categories: [ HideSpawnMenu ]
  components:
  - type: AnoigoPower

- type: entity
  id: HealingWordEntity
  categories: [ HideSpawnMenu ]
  components:
  - type: HealingWord
    healingAmount:
      groups: # These all get divided by the number of damage types in the group. So they're all -2.5.
        Genetic: -2.5
        Toxin: -5
        Airloss: -5
        Brute: -7.5
        Burn: -10
    rotReduction: 10
    useDelay: 1
    doRevive: false
    powerPoolAdditions:
      RevivifyPowerEntity: 2

- type: entity
  id: RevivifyPowerEntity
  categories: [ HideSpawnMenu ]
  components:
  - type: RevivifyPower
    healingAmount:
      groups: # These all get divided by the number of damage types in the group. So they're all -15.
        Genetic: -15
        Toxin: -30
        Airloss: -60 # Except airloss, which heals 30 per type
        Brute: -45
        Burn: -60
    rotReduction: 60
    useDelay: 8
    doRevive: true

- type: entity
  id: DarkSwapPowerEntity
  categories: [ HideSpawnMenu ]
  components:
  - type: DarkSwapPower

- type: entity
  id: AssayPowerEntity
  categories: [ HideSpawnMenu ]
  components:
  - type: AssayPower

- type: entity
  id: ShadeskipPowerEntity
  categories: [ HideSpawnMenu ]
  components:
  - type: ShadeskipPower
    powerPoolAdditions:
      DarkSwapPowerEntity: 2

# Temporary shadow kudzu left behind by DarkSwap. Despawns after 2 minutes.
- type: entity
  id: ShadowKudzuDarkSwap
  parent: ShadowKudzuWeak
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 120
