  - type: TargetAction
    range: 2
    checkCanAccess: false
  - type: EntityTargetAction
    canTargetSelf: true
    event: !type:AssayPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionShadeskip
  name: Shadeskip
  description: Cover the surrounding area in shadow kudzu.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: shadeskip
    useDelay: 45
    checkCanInteract: false
  - type: InstantAction
    event: !type:ShadeskipPowerActionEvent
