    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: anoigo
    useDelay: 40
    checkCanInteract: false
  - type: TargetAction
    range: 6
    checkCanAccess: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:AnoigoPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionHealingWord
  name: Healing Word
  description: Heal the wounds of a nearby target.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: healing_word
    useDelay: 10
    checkCanInteract: false
  - type: TargetAction
    range: 6
    checkCanAccess: false
  - type: EntityTargetAction
    canTargetSelf: true
    event: !type:HealingWordActionEvent
  - type: ForceSpeech
    speechText: healing-word-begin

- type: entity
