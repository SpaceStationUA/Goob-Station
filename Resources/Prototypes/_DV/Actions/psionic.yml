  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: revivify
    useDelay: 120
    checkCanInteract: false
  - type: TargetAction
    range: 2
    checkCanAccess: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:RevivifyPowerActionEvent
  - type: ForceSpeech
    speechText: revivify-begin

- type: entity
  parent: BasePsionicAction
  id: ActionDarkSwap
  name: "Темний Обмін"
  description: "Переходить у тіньовий вимір, щоб проходити крізь перешкоди."
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: darkswap
    useDelay: 10
    checkCanInteract: false
