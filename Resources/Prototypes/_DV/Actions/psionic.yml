- type: entity
  abstract: true
  parent: BaseAction
  id: BasePsionicAction
  components:
  - type: Action
    itemIconStyle: BigAction
    startDelay: true

- type: entity
  parent: BasePsionicAction
  id: ActionDispel
  name: "Розсіювання"
  description: "Розсіює викликаних істот, таких як фамільяри або силові стіни."
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: dispel
    useDelay: 45
    checkCanInteract: false
  - type: TargetAction
    range: 6
    checkCanAccess: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:DispelPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionMassSleep
  name: "Масове присипляння"
  description: "Присипляє цілі в невеликій області."
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: mass_sleep
    useDelay: 60
    checkCanInteract: false
  - type: TargetAction
    checkCanAccess: false
    range: -1 # You can cast it anywhere on your screen.
  - type: WorldTargetAction
    event: !type:MassSleepPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionMindSwapPsionic
  name: "Обмін розумом"
  description: "Обмінятися розумом з ціллю. Будь-хто може повернутися назад через 20 секунд."
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: mind_swap
    useDelay: 240
    checkCanInteract: false
  - type: TargetAction
    checkCanAccess: false
    range: 8
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:MindSwapPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionMindSwapReturn
  name: "Повернути обмін розумом"
  description: "Повернутися до свого початкового тіла."
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: mind_swap_return
    useDelay: 20
    checkCanInteract: false
  - type: InstantAction
    event: !type:MindSwappedReturnPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionNoosphericZap
  name: "Ноосферний розряд"
  description: "Б'є ціль струмом, приголомшуючи її та змушуючи затинатися."
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: noospheric_zap
    useDelay: 100
    checkCanInteract: false
  - type: TargetAction
    range: 5
  - type: EntityTargetAction
    event: !type:NoosphericZapPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionPyrokinesis
  name: "Пірокінез"
  description: "Підпалити легкозаймисту ціль."
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: pyrokinesis
    useDelay: 50
  - type: TargetAction
    range: 6
    checkCanAccess: false
  - type: EntityTargetAction
    event: !type:PyrokinesisPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionMetapsionicPulse
  name: "Метапсіонічний імпульс"
  description: "Надсилає ментальний імпульс навколо себе, щоб виявити псіоніків поблизу."
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: metapsionic
    useDelay: 45
    checkCanInteract: false
  - type: InstantAction
    event: !type:MetapsionicPulsePowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionEruption
  name: "Псіонічний вибух"
  description: "Вивільняє потужний псіонічний вибух, що знищує вас і все навколо."
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: eruption
    useDelay: 45
    checkCanInteract: false
  - type: InstantAction
    event: !type:PsionicEruptionPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionPsionicRegeneration
  name: "Псіонічна регенерація"
  description: "Вичавіть із природного метаболізму все можливе, щоб підживити здатність тіла до відновлення."
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: regeneration
    useDelay: 120
    checkCanInteract: false
  - type: InstantAction
    event: !type:PsionicRegenerationPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionTelegnosis
  name: "Телегнозис"
  description: "Створити телегностичну проєкцію для дистанційного спостереження за речами."
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: telegnosis
    useDelay: 150
    checkCanInteract: false
  - type: InstantAction
    event: !type:TelegnosisPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionPsychokineticScream
  name: "Психокінетичний крик"
  description: "Видає пронизливий крик, що розбиває всі джерела світла поблизу."
  components:
  - type: Action
    icon: { sprite: _DV/Actions/shatterlights.rsi, state: shatter-lights }
    useDelay: 60
  - type: InstantAction
    event: !type:PsychokineticScreamPowerActionEvent

# Pirate: Ported from upstream PR #34 (SpaceStationUA/Goob-Station)
