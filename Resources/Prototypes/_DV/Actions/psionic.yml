- type: entity
  parent: BasePsionicAction
  id: ActionAssay
  name: Assay
  description: Scan a target to learn about their psionic abilities.
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
