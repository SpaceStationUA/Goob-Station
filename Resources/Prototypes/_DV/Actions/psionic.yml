    event: !type:DarkSwapPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionAssay
  name: "Аналіз"
  description: "Сканує ціль, щоб дізнатися про її псіонічні здібності."
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: assay
    useDelay: 45
    checkCanInteract: false
  - type: TargetAction
    range: 2
    checkCanAccess: false
  - type: EntityTargetAction
    canTargetSelf: true
    event: !type:AssayPowerActionEvent

- type: entity
  parent: BasePsionicAction
  id: ActionShadeskip
  name: "Тіньовий Крок"
  description: "Вкриває навколишню місцевість тіньовим кудзу."
  components:
  - type: Action
    icon:
      sprite: _DV/Interface/Actions/actions_psionics.rsi
      state: shadeskip
    useDelay: 45
    checkCanInteract: false
  - type: InstantAction
    event: !type:ShadeskipPowerActionEvent
