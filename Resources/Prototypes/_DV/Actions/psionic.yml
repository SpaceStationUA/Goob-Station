    checkCanAccess: false
  - type: EntityTargetAction
    canTargetSelf: false
    event: !type:RevivifyPowerActionEvent
  - type: ForceSpeech
    speechText: revivify-begin

- type: entity
  parent: BasePsionicAction
  id: ActionDarkSwap
  name: DarkSwap
