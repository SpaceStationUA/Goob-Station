### ASTRAL PROJECTION
- type: entity
  parent: [ Incorporeal, BaseMob ]
  id: MobCosmicAstralProjection
  name: "астральна проєкція"
  description: "Ні тут, ні там."
  components:
  - type: ActionGrant
    actions:
    - ActionCosmicReturn
  - type: Input
    context: "ghost"
  - type: Spectral
  - type: MovementSpeedModifier
    baseWalkSpeed: 4
    baseSprintSpeed: 4
  - type: Sprite
    sprite: _DV/CosmicCult/Mobs/astralform.rsi
    layers:
    - state: base-body
      shader: unshaded
    drawdepth: Ghosts
  - type: NoSlip
  - type: CosmicAstralBody
  - type: Eye
    drawFov: false
    visMask:
    - Normal
    - Ghost
  - type: SSDIndicator
  - type: StatusIcon
    bounds: -0.5,-0.5,0.5,0.5
  - type: MindContainer
  - type: MindExaminable
  - type: Examiner
  - type: ContentEye
    maxZoom: 1.2, 1.2
  - type: CEZLevelGhostMover # Pirate: multiz
  - type: Speech
    enabled: false
  - type: PointLight
    color: "#42a4ae"
    radius: 2
    energy: 3.5
    softness: 1
    castShadows: false
  - type: LightBehaviour
    behaviours:
     - !type:FadeBehaviour
       interpolate: Linear
       minDuration: 5.5
       maxDuration: 5.5
       startValue: 2
       endValue: 3.5
       property: Energy
       enabled: true
       isLooped: true
       reverseWhenFinished: true
  - type: IntrinsicRadioReceiver
  - type: ActiveRadio
    channels:
    - CosmicRadio
  - type: Visibility
    layer: 2 #ghost vis layer

# Pirate: multiz - shared base for hovering cosmic mobs
- type: entity
  abstract: true # Pirate: multiz - shared movement base
  parent: [ BaseSimpleMob ]
  id: BaseMobCosmicAscended # Pirate: multiz - shared movement base
  components:
  - type: Puller
    needsHands: false
  - type: MovementSpeedModifier
    baseWalkSpeed: 6
    baseSprintSpeed: 6
    weightlessModifier: 1.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        density: 50
        mask:
        - FlyingMobMask
        layer:
        - FlyingMobLayer
  - type: Physics
    bodyStatus: InAir
  - type: NoSlip
  - type: CanMoveInAir
  - type: MovementIgnoreGravity # Pirate: multiz - fly in zero gravity
  - type: CEZLevelPhysicsExempt # Pirate: multiz - prevent falling through openings
  - type: Eye
    drawFov: true
  - type: ContentEye
    maxZoom: 1.2, 1.2
  - type: Speech
    speechVerb: Ghost
  - type: TypingIndicator
    proto: CosmicTyping
  - type: PointLight
    color: "#42a4ae"
    radius: 2
    energy: 2
    softness: 1
    castShadows: false
  - type: LightBehaviour
    behaviours:
     - !type:FadeBehaviour
       interpolate: Linear
       minDuration: 5.5
       maxDuration: 5.5
       startValue: 0.5
       endValue: 2
       property: Energy
       enabled: true
       isLooped: true
       reverseWhenFinished: true

- type: entity
  parent: BaseMobCosmicAscended # Pirate: multiz - inherit z-level flight
  id: MobCosmicAstralAscended
  name: "астральний піднесений"
  description: "Трансцендентний, піднесений."
  components:
  - type: Sprite
    sprite: _DV/CosmicCult/Mobs/astralform.rsi
    layers:
    - state: effect-underlay
      shader: unshaded
    - state: ascended-body
      shader: unshaded
  - type: CEZLevelGhostMover # Pirate: multiz - unrestricted z-movement

- type: entity
  parent: BaseMobCosmicAscended # Pirate: multiz - inherit z-level flight
  id: MobCosmicCustodian
  name: "згубний доглядач"
  description: "Мерзота, створена зі згубної маси. Вона ширяє з невагомою, тривожною грацією."
  components:
  - type: CEZLevelContextualMover # Pirate: multiz - openings-only z-movement
  - type: MovementSpeedModifier
    baseWalkSpeed: 3
    baseSprintSpeed: 3
    weightlessModifier: 1
  - type: Sprite
    sprite: _DV/CosmicCult/Mobs/custodian.rsi
    layers:
    - map: [ "enum.DamageStateVisualLayers.Base" ]
      state: custodian
    - map: [ "enum.DamageStateVisualLayers.BaseUnshaded" ]
      state: custodian_unshaded
      shader: unshaded
  - type: DamageStateVisuals
    states:
      Alive:
        Base: custodian
        BaseUnshaded: custodian_unshaded
      Dead:
        Base: dead
        BaseUnshaded: dead_unshaded

