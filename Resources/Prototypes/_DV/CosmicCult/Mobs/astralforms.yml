- type: entity
  parent: BaseMobCosmicAscended # Pirate: multiz - inherit z-level flight
  id: MobCosmicLodestar
  name: "згубна провідна зоря"
  description: "Мерзота, створена зі згубної маси. Усередині жевріє пекуче світло."
  components:
