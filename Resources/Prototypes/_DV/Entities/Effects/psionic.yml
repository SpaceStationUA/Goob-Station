# We need to copy paste the entire thing because we don't want Electrified component on that thang.
- type: entity
  name: lightning
  id: PsionicLightning
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: /Textures/Effects/lightning.rsi
    drawdepth: Effects
    layers:
    - state: "lightning_1"
      shader: unshaded
  - type: Physics
    canCollide: false
  - type: Lightning
  - type: PointLight
    enabled: true
    color: "#4080FF"
    radius: 3.5
    softness: 1
    autoRot: true
    castShadows: false
  - type: Beam
    sound: /Audio/Effects/Lightning/lightningshock.ogg
  - type: TimedDespawn
    lifetime: 3
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  # Pirate: source CMEffectScreech uses RMC overlay/shader components that are not part of this psionics port.
  id: CMEffectScreech
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 3.2
  - type: Sprite
    sprite: _RMC14/Effects/xeno_screech.rsi
    noRot: true
    state: screech
    drawdepth: Effects
  - type: EffectVisuals
  - type: Tag
    tags:
    - HideContextMenu

- type: entity
  # Pirate: source Foxfire component belongs to unported kitsune mechanics; glimmer only needs the spawned light.
  parent: BaseStructureDynamic
  id: Foxfire
  name: foxfire
  description: An oddly cool wisp of flame giving off a comfortable glow.
  components:
  - type: Sprite
    noRot: true
    drawdepth: Effects
    sprite: _DV/Structures/Specific/Species/Kitsune/foxfire.rsi
    state: foxfire
  - type: PointLight
    radius: 3
    energy: 2
    color: "#ffffff87"
    castShadows: false
  - type: Transform
    anchored: false
  - type: Physics
    canCollide: false
    bodyType: Static
    bodyStatus: InAir
  - type: Anchorable
    flags:
    - None
  - type: InteractionOutline
