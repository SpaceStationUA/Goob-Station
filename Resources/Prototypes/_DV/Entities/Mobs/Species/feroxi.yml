- type: entity
  parent: BaseMobSpeciesOrganic
  id: BaseMobFeroxi
  name: Urist McFin
  save: false
  abstract: true
  components:
  - type: HumanoidAppearance
    species: Feroxi
    hideLayersOnEquip:
    - Snout
    undergarmentBottom: UndergarmentBottomBoxersReptilian # todo marty doesn't fit needs adjusting
  - type: Hunger
  # - type: Carriable # ShibaStation - disabled because broken, for now.
  - type: Thirst
    baseDecayRate: 0.25 # Goobstation base rate changed, 2 times more than base
  - type: Icon
    sprite: _Goobstation/Mobs/Species/Feroxi/parts.rsi #RedTerror Goob Resprite
    state: full
  - type: Body
    prototype: Feroxi
  - type: Speech
    speechSounds: Tenor
    speechVerb: Feroxi
    allowedEmotes: [ "Gnash", "Thump" ] #goob edit
  - type: Vocal
    sounds:
      Male: MaleFeroxi
      Female: FemaleFeroxi
      Unsexed: MaleFeroxi
  - type: BodyEmotes #goob edit
    soundsId: FeroxiBodyEmotes
  - type: Sprite
    netsync: false
    noRot: true
    drawdepth: Mobs
    layers:
      - map: [ "enum.HumanoidVisualLayers.TailBehind" ] # Pirate - port Floofstation custom layers
      - map: [ "enum.HumanoidVisualLayers.Chest" ]
      - map: [ "enum.HumanoidVisualLayers.Groin" ]
      - map: [ "enum.HumanoidVisualLayers.Head" ]
      - map: [ "enum.HumanoidVisualLayers.Snout" ]
      - map: [ "enum.HumanoidVisualLayers.Eyes" ]
      - map: [ "enum.HumanoidVisualLayers.RArm" ]
      - map: [ "enum.HumanoidVisualLayers.LArm" ]
      - map: [ "enum.HumanoidVisualLayers.RLeg" ]
      - map: [ "enum.HumanoidVisualLayers.LLeg" ]
      - shader: StencilClear
        sprite: Mobs/Species/Human/parts.rsi #PJB on stencil clear being on the left leg: "...this is 'fine'" -https://github.com/space-wizards/space-station-14/pull/12217#issuecomment-1291677115
        # its fine, but its still very stupid that it has to be done like this instead of allowing sprites to just directly insert a stencil clear.
        # sprite refactor when
        state: l_leg
      - map: [ "enum.HumanoidVisualLayers.UndergarmentBottom" ]
      - map: [ "enum.HumanoidVisualLayers.UndergarmentTop" ]
      - map: [ "jumpsuit" ]
      - map: [ "enum.HumanoidVisualLayers.LHand" ]
      - map: [ "enum.HumanoidVisualLayers.RHand" ]
      - map: [ "enum.HumanoidVisualLayers.LFoot" ]
      - map: [ "enum.HumanoidVisualLayers.RFoot" ]
      - map: [ "enum.HumanoidVisualLayers.Handcuffs" ]
        color: "#ffffff"
        sprite: Objects/Misc/handcuffs.rsi
        state: body-overlay-2
        visible: false
      - map: [ "enum.HumanoidVisualLayers.Face" ] # Goob 120
      - map: [ "id" ]
      - map: [ "gloves" ]
      - map: [ "shoes" ]
      - map: [ "ears" ]
      - map: [ "outerClothing" ]
      - map: [ "culteyes" ] # Pirate - Blood Cult
        sprite: "_Pirate/BloodCult/Effects/culteyes.rsi"
        state: "human"
        shader: unshaded
        visible: false
      - map: [ "belt" ] # Goob
      - map: [ "eyes" ]
      - map: [ "neck" ]
      - map: [ "back" ]
      - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
      - map: [ "maskalt" ] # Goob - alt mask gooblayer below hair
      - map: [ "enum.HumanoidVisualLayers.Hair" ]
      - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
      - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
      - map: [ "enum.HumanoidVisualLayers.Tail" ]
      - map: [ "enum.HumanoidVisualLayers.TailOversuit" ] # Pirate - port Floofstation custom layers
      - map: [ "mask" ]
      - map: [ "head" ]
      - map: [ "pocket1" ]
      - map: [ "pocket2" ]
      - map: [ "clownedon" ] # Dynamically generated
        sprite: "_DV/Effects/creampie.rsi"
        state: "creampie_feroxi"
        visible: false
      - map: [ "culthalo" ] # Pirate - Blood Cult
        sprite: "_Pirate/BloodCult/Effects/halo.rsi"
        state: "halo"
        shader: unshaded
        visible: false
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Effects/bite.ogg
    angle: 30
    animation: WeaponArcBite
    damage:
      types:
        Piercing: 7 # oooh scary extra damage~
  - type: Perishable
  - type: Damageable
    damageModifierSet: Feroxi
  - type: TypingIndicator
    proto: feroxi
  - type: FeroxiDehydrate
    hydratedMetabolizer: Feroxi
    dehydratedMetabolizer: FeroxiDehydrated
    dehydrationThreshold: 150
  # Pirate: port shark vision
  - type: SharkVision
    pulseTime: 5
    activateSound: null
    deactivateSound: null
  # Pirate: port shark vision end
  - type: WaterAdapted # Pirate: feroxi water adaptation
  - type: FeroxiUnderwater # Pirate: feroxi underwater
  - type: ClawFootsteps # Pirate: claw footsteps
  - type: LanguageKnowledge # The Den, give Feroxi their own language.
    speaks:
    - TauCetiBasic
    - Nehina
    understands:
    - TauCetiBasic
    - Nehina
  - type: Inventory
    speciesId: feroxi
    femaleDisplacements: # Goob-Feroxi-Resprite-Start
      jumpsuit:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: jumpsuit-female
      shoes: # Pirate: feroxi-specific shoes displacement (was shared reptilian map)
        sizeMaps:
          32:
            sprite: _Pirate/Mobs/Species/Feroxi/displacement.rsi
            state: shoes
      #region Pirate: feroxi outerclothing displacement
      # Full-body outerwear (hardsuits/modsuits) covers the legs, which are reshaped
      # on the Goob feroxi resprite. Reuses the hand-authored jumpsuit warp.
      # Repeated in femaleDisplacements because a non-empty femaleDisplacements
      # replaces the unsexed map wholesale per slot.
      outerClothing:
        sizeMaps:
          32:
            sprite: _Pirate/Mobs/Species/Feroxi/displacement.rsi
            state: outerclothing
      #endregion Pirate: feroxi outerclothing displacement
    displacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: _White/Mobs/Species/displacement.rsi
            state: jumpsuit
      shoes: # Pirate: feroxi-specific shoes displacement (was shared reptilian map)
        sizeMaps:
          32:
            sprite: _Pirate/Mobs/Species/Feroxi/displacement.rsi
            state: shoes
      #region Pirate: feroxi outerclothing displacement
      outerClothing:
        sizeMaps:
          32:
            sprite: _Pirate/Mobs/Species/Feroxi/displacement.rsi
            state: outerclothing
      #endregion Pirate: feroxi outerclothing displacement
    # Goob-Feroxi-Resprite-End

