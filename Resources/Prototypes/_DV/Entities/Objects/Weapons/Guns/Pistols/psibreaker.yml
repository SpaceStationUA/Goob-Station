- type: entity
  name: "псі-брейкер"
  parent: [ BaseWeaponPistol, BaseMantisContraband]
  id: WeaponPistolPsiBreaker
  description: "Невеликий яскравий пістолет із мармуровим руків'ям. Не дає жодної тактичної переваги. Використовує набої .35 auto."
  components:
  - type: Sprite
    sprite: _DV/Objects/Weapons/Guns/Pistols/psibreaker.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    fireRate: 3.5
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
  - type: Clothing
    sprite: _DV/Objects/Weapons/Guns/Pistols/psibreaker.rsi
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        # Pirate: keep the existing .35 Cryptobiolin ammo until the full Delta-V .38 Lernaea stack is ported.
        startingItem: MagazinePistolCryptobiolin
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - MagazinePistol
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgePistolCryptobiolin
        priority: 1
        whitelist:
          tags:
            - CartridgePistol
