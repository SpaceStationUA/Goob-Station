- type: entity
  parent: BasePsionCrystal
  id: PsionCrystalHeal
  name: "цілющий кристал"
  description: "Невеликий псіонічний кристал. Коли тримаєш його, рани здаються не такими загрозливими."
  components:
  - type: Sprite
    color: "#7ee081"
  - type: AddComponentsImplant
    componentsToAdd:
    - type: HealingWord
      healingAmount:
        groups:
          Genetic: -2.5
          Toxin: -5
          Airloss: -5
          Brute: -7.5
          Burn: -10
      rotReduction: 10
      useDelay: 1
      doRevive: false

- type: entity
  parent: BasePsionCrystal
  id: PsionCrystalRevivify
  name: "кристал воскресіння"
  description: "Невеликий псіонічний кристал. Він пульсує в ритмі самого життя."
  components:
  - type: Sprite
    color: "#4fe0ff"
  - type: AddComponentsImplant
    componentsToAdd:
    - type: RevivifyPower
      healingAmount:
        groups:
          Genetic: -15
          Toxin: -30
          Airloss: -60
          Brute: -45
          Burn: -60
      rotReduction: 60
      useDelay: 8
      doRevive: true

