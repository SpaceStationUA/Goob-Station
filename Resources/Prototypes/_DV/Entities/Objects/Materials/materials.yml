# Pirate: Ported from upstream PR #34 (SpaceStationUA/Goob-Station)
- type: entity
  parent: BasePsionCrystal
  id: PsionCrystalAnoigo
  name: anoigo crystal
  description: A small psionic crystal. Doors seem to swing open at your approach.
  components:
  - type: Sprite
    color: "#d4c9a0"
  - type: AddComponentsImplant
    componentsToAdd:
    - type: AnoigoPower

- type: entity
  parent: BasePsionCrystal
  id: PsionCrystalHeal
  name: healing crystal
  description: A small psionic crystal. Wounds seem less threatening while holding it.
  components:
  - type: Sprite
    color: "#7ee081"
  - type: AddComponentsImplant
    componentsToAdd:
    - type: HealingWord
      healingAmount:
        groups:
          Genetic: -2.5
          Toxin: -5
          Airloss: -5
          Brute: -7.5
          Burn: -10
      rotReduction: 10
      useDelay: 1
      doRevive: false

- type: entity
  parent: BasePsionCrystal
  id: PsionCrystalRevivify
  name: revivify crystal
  description: A small psionic crystal. It hums with the pulse of life itself.
  components:
  - type: Sprite
    color: "#4fe0ff"
  - type: AddComponentsImplant
    componentsToAdd:
    - type: RevivifyPower
      healingAmount:
        groups:
          Genetic: -15
          Toxin: -30
          Airloss: -60
          Brute: -45
          Burn: -60
      rotReduction: 60
      useDelay: 8
      doRevive: true

