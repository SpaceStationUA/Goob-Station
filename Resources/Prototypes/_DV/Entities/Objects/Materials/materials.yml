- type: entity
  parent: MaterialBase
  id: MaterialBluespace
  name: bluespace crystal
  suffix: Full
  components:
  - type: Sprite
    sprite: Nyanotrasen/Objects/Materials/materials.rsi
    layers:
    - state: bluespace_3
      map: ["base"]
  - type: Appearance
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      Bluespace: 100
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - BluespaceCrystal
    - RawMaterial
  - type: Stack
    stackType: Bluespace
    baseLayer: base
    layerStates:
    - bluespace
    - bluespace_2
    - bluespace_3
    count: 5

- type: entity
  parent: MaterialBluespace
  id: MaterialBluespace1
  suffix: 1
  components:
  - type: Sprite
    layers:
    - state: bluespace
      map: ["base"]
  - type: Stack
    count: 1

- type: entity
  parent: MaterialBluespace
  id: CrystalNormality # this is 1 not full because other stuff may assume its single
  name: normality crystal
  suffix: 1
  description: It looks... normal.
  components:
  - type: Sprite
    layers:
    - state: bluespace
      map: ["base"]
    color: gray
  - type: PhysicalComposition
    materialComposition:
      NormalityCrystal: 100
  - type: Stack
    stackType: NormalityCrystal
    count: 1
  - type: Tag
    tags:
    - NormalityCrystal

- type: entity
  parent: CrystalNormality
  id: CrystalNormality5
  suffix: 5
  components:
  - type: Sprite
    layers:
    - state: bluespace_3
      map: ["base"]
  - type: Stack
    count: 5

- type: entity
  parent: BaseItem
  id: BasePsionCrystal
  name: psion crystal
  categories: [ HideSpawnMenu ]
  description: A small crystal of attuned psionic energy.
  components:
  - type: Sprite
    sprite: _DV/Objects/Materials/psicrystal.rsi
    state: psicrystal
  - type: SubdermalImplant
  - type: Tag
    tags:
    - SubdermalImplant
  - type: DVInsertableImplant
    implanterName: psion-crystal-implanter-name
    implanterDescription: psion-crystal-implanter-description

- type: entity
  parent: BasePsionCrystal
  id: PsionCrystalZap
  name: zap crystal
  description: A small psionic crystal humming with electricity.
  components:
  - type: Sprite
    color: "#ebd039"
  - type: AddComponentsImplant
    componentsToAdd:
    - type: NoosphericZapPower

- type: entity
