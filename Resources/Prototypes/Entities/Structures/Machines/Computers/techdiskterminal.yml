- type: entity
  parent: BaseComputer
  id: ComputerTechnologyDiskTerminal
  name: tech disk terminal
  description: A terminal used to print out technology disks.
  components:
  - type: Sprite
    noRot: true
    sprite: Structures/Machines/tech_disk_printer.rsi
    layers:
    - map: ["computerLayerBody"]
      state: icon
    - map: ["computerLayerScreen"]
      state: unshaded
  # Pirate edit start
  - type: GenericVisualizer
    visuals:
      enum.ComputerVisuals.Powered:
        computerLayerScreen:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
        computerLayerKeys:
          True: { visible: true, shader: unshaded }
          False: { visible: true, shader: shaded }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: false }
          False: { visible: true }
      enum.EdgeConnectionVisuals.ConnectionMask:
        computerLayerBody:
          None: { state: icon, sprite: Structures/Machines/tech_disk_printer.rsi }
          East: { state: icon, sprite: Structures/Machines/tech_disk_printer.rsi }
          West: { state: icon, sprite: Structures/Machines/tech_disk_printer.rsi }
          East, West: { state: icon, sprite: Structures/Machines/tech_disk_printer.rsi }
  # Pirate edit end
  - type: DiskConsole
  - type: ResearchClient
  - type: ActivatableUI
    key: enum.DiskConsoleUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
      enum.DiskConsoleUiKey.Key:
        type: DiskConsoleBoundUserInterface
      enum.ResearchClientUiKey.Key:
        type: ResearchClientBoundUserInterface
  - type: ExtensionCableReceiver
  - type: Computer
    board: TechDiskComputerCircuitboard
  - type: PointLight
    radius: 0.8
    energy: 0.5
    color: "#b53ca1"

- type: weightedRandom
  id: TechDiskTierWeights
  weights:
    1: 25
    2: 10
    3: 1

- type: weightedRandom
  id: RareTechDiskTierWeights
  weights:
    2: 19
    3: 1
