- type: entity
  id: BannerBase
  parent: BaseStructureDynamic
  name: base banner
  description: It's the concept of a banner, you shouldn't be seeing this.
  abstract: true
  components:
  - type: Sprite
    sprite: Structures/Decoration/banner.rsi
    state: banner
    noRot: true
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.2
        density: 190
        mask:
        - MachineMask
        layer:
        - Opaque
        - MidImpassable
        - HighImpassable
        - BulletImpassable
  - type: InteractionOutline
  - type: Damageable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  id: BannerNanotrasen
  parent: BannerBaseTP # Pirate edit
  name: nanotrasen banner
  description: A banner displaying the Nanotrasen logo. It looks rather cheap.
  components:
  - type: Sprite
  # Pirate edit start
    sprite: _Pirate/Structures/Banners/banner.rsi
    layers:
    - state: banner
      map: ["unfoldedLayer"]
    - sprite: _Pirate/Structures/Banners/rolled.rsi
      state: banner-rolled
      map: ["foldedLayer"]
      visible: false
  # Pirate edit end
  - type: Construction # Frontier
    graph: BannersGraph # Frontier
    node: BannerNanotrasenNode # Frontier

