- type: entity
  abstract: true
  parent: Clothing
  id: ClothingHandsBase
  components:
  - type: Sprite
    state: icon
  - type: Clothing
    slots: [gloves]
  # Goobstation edit start
    equipSound:
      path: /Audio/_Goobstation/Items/handling/generic_equip2.ogg
      params:
        volume: -4
  # Goobstation edit end
  - type: Edible
    requiresSpecialDigestion: true
  - type: Item
    size: Small
    storedRotation: -90
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Fiber
          Quantity: 10
      #region Pirate: stains
      stain:
        maxVol: 10
      #endregion Pirate: stains
  - type: Tag
    tags:
    - ClothMade
    - WhitelistChameleon
  #region Pirate: stains
  - type: Appearance
  - type: Stainable
    clothingVisuals:
      gloves:
      - sprite: _Pirate/Effects/blood.rsi
        state: gloveblood
    iconVisuals:
    - sprite: _Pirate/Effects/blood.rsi
      state: glovebloodicon
  #endregion Pirate: stains
  #region Pirate: wetness
  - type: Wettable
  # Sealed gloves (deployed modsuit gauntlets) are watertight. Plain gloves have no ModPart
  # so this blocker is skipped for them and they still get wet normally.
  - type: WetnessBlocker
    slots: [GLOVES]
    requiresSealed: true
  #endregion Pirate: wetness
  #region Pirate: clothing accessories
  - type: ClothingAccessoryHolder
    limits:
      Ring: 1
  #endregion Pirate: clothing accessories
  - type: DamageOnInteractProtection
    damageProtection:
      flatReductions:
        Heat: 5 # the average lightbulb only does around four damage!
  - type: Armor # provide minimal covering to your hands
    coverage:
    - Hand
    modifiers:
      coefficients:
        Blunt: 0.95
        Slash: 0.95
        Piercing: 0.95

- type: entity
  abstract: true
  parent: ClothingHandsBase
  id: ClothingHandsButcherable
  components:
  - type: Butcherable
    butcheringType: Knife
    spawned:
    - id: MaterialCloth1
      amount: 1
  - type: PhysicalComposition # 50% of the amount of cloth you'd obtain upon butchering
    materialComposition:
      Cloth: 50
  - type: Tag
    tags:
    - ClothMade
    - Recyclable
    - WhitelistChameleon

# gloves that cover the fingertips and have synthetic fibers
- type: entity
  abstract: true
  parent: ClothingHandsButcherable
  id: ClothingHandsGlovesSyntheticBase
  components:
  - type: Fiber
    fiberMaterial: fibers-synthetic
  - type: FingerprintMask

- type: entity
  abstract: true
  parent: BaseItem
  id: RingBase
  components:
  - type: Clothing
    slots: [ gloves, neck ]
    sprite: _Pirate/Clothing/Hands/Rings/rings.rsi # Pirate: rings - worn on the hand
  - type: Sprite
    sprite: _Pirate/Clothing/Hands/Rings/rings.rsi # Pirate: rings - new sprites
  - type: Appearance
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - Ring
  - type: ClothingAccessory # Pirate: clothing accessories
    category: Ring # Pirate: clothing accessories

- type: entity
  abstract: true
  id: GoldRingBase
  components:
  - type: PhysicalComposition #Goobstation
    materialComposition:
      Gold: 200
  - type: StaticPrice
    price: 400 # Pirate: rings - sell price

- type: entity
  abstract: true
  id: SilverRingBase
  name: silver ring
  description: A plain band of sterling silver. # Pirate: ring descriptions
  components:
    - type: PhysicalComposition
      materialComposition:
        Silver: 200 # 2 bars
    - type: StaticPrice
      price: 200 # Pirate: rings - sell price
