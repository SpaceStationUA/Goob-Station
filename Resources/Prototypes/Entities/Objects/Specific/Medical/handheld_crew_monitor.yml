- type: entity
  name: "ручний монітор екіпажу"
#  categories: [ DoNotMap ] # Goobstation
  parent: [ BaseHandheldComputer, BaseMedicalContraband ] # Goobstation
  # CMO-only bud, don't add more. # Goobstation - no lmao
  id: HandheldCrewMonitor
  description: "Ручний монітор екіпажу, що відображає стан датчиків скафандра."
  components:
  - type: Item
    heldPrefix: scanner
    storedSprite:
      state: icon
      sprite: Objects/Specific/Medical/handheldcrewmonitor.rsi
  - type: Sprite
    sprite: Objects/Specific/Medical/handheldcrewmonitor.rsi
    layers:
      - state: icon
      - state: scanner
        shader: unshaded
  - type: ActivatableUI
    key: enum.CrewMonitoringUIKey.Key
  - type: UserInterface
    interfaces:
      enum.CrewMonitoringUIKey.Key:
        type: CrewMonitoringBoundUserInterface
  - type: CrewMonitoringConsole
    departments: []
  - type: PdaBorderColor
    borderColor: "#C9CFE3"
    accentVColor: "#609EFF"
  - type: CrewMonitoringUiVisuals
    themeColor: "#609EFF"
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: CrewMonitor
  - type: WirelessNetworkConnection
    range: 500
  - type: StationLimitedNetwork
  - type: StaticPrice
    price: 500
  - type: Tag
    tags:
    - HandheldCrewMonitor # Goobstation - start
    # - HighRiskItem
  # - type: StealTarget
  #   stealGroup: HandheldCrewMonitor # Goobstation - end

- type: entity
  id: HandheldCrewMonitorEmpty
  parent: HandheldCrewMonitor
  suffix: Empty
  components:
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
