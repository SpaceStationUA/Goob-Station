- type: shader
  id: DisplacedStencilDraw
  kind: source
  path: "/Textures/Shaders/displacement.swsl"
  stencil:
    ref: 1
    op: Keep
    func: NotEqual
  params:
    displacementSize: 127
    displacementMapScale: 1, 1 # Pirate: square frames remain unchanged by default.
    displacementMapTexelSize: 0.03125, 0.03125 # Pirate

- type: shader
  id: DisplacedDraw
  kind: source
  path: "/Textures/Shaders/displacement.swsl"
  params:
    displacementSize: 127
    displacementMapScale: 1, 1 # Pirate
    displacementMapTexelSize: 0.03125, 0.03125 # Pirate
