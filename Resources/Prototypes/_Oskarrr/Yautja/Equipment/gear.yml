- type: entity
  parent: BaseItem
  id: GoobYautjaHuntingTrap
  name: "мисливська пастка"
  description: "Компактна пастка-міна яутжа. Постав і активуй — наступив: 50 Slash і відрубує стопу."
  suffix: Yautja
  components:
  - type: Sprite
    sprite: _Oskarrr/Yautja/yautja_items.rsi
    drawdepth: Items
    layers:
    - state: yauttrap0
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Item
    size: Small
  - type: YautjaHuntingTrap
  - type: ItemToggle
    soundActivate:
      path: /Audio/Weapons/click.ogg
      params:
        maxDistance: 1
    popupActivate: yautja-hunting-trap-armed
  - type: Armable
    examineTextArmed: yautja-hunting-trap-examine-armed
    examineTextNotArmed: yautja-hunting-trap-examine-unarmed
  - type: UseDelay
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: yauttrap1 }
          False: { state: yauttrap0 }
  - type: StepTrigger
    intersectRatio: 0.2
    requiredTriggeredSpeed: 0
    stepOn: true
    triggerGroups:
      types:
      - Landmine
  - type: TriggerOnStepTrigger
  - type: PreventableStepTrigger
  - type: EmitSoundOnTrigger
    positional: true
    sound:
      path: /Audio/Items/snap.ogg
  - type: Pullable
  - type: Physics
    bodyType: Dynamic
  - type: CollisionWake
    enabled: false
  - type: Fixtures
    fixtures:
      slips:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        hard: false
        layer:
        - LowImpassable
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.2,-0.2,0.2,0.2"
        density: 30
        mask:
        - ItemMask
  - type: Rotatable

