# Far Horizons: the ground-side planetary shield generator. Place it on a planet's
# surface (admin: `spawnentity CEPlanetShieldGenerator`), wire it to the HV grid,
# and it will chew 2 GW into a buffer, spin up, and raise the planet's field —
# blocking all shuttle descents until it's EMP'd, bombed mid-spinup, or starved.

- type: entity
  parent: BaseStructure
  id: CEPlanetShieldGenerator
  name: planetary shield generator
  description: A superstructure that draws enough power to kill a leviathan in a single shot continually and uses it to project a full-planet shield. [color=red]You really shouldn't be standing next to this...[/color]
  components:
  - type: Sprite
    sprite: Objects/Power/powersink.rsi
    scale: 3, 3
    layers:
    - state: powersink
    - state: control_on
      shader: unshaded
      map: ["enum.CEShieldGeneratorVisuals.Stage"]
      visible: false
      color: "#7FD4FF"
      sprite: _Pirate/Structures/ShuttleComponents/shield.rsi
  - type: GenericVisualizer
    visuals:
      enum.CEShieldGeneratorVisuals.Stage:
        enum.CEShieldGeneratorVisuals.Stage:
          Active: { visible: true }
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-2.45,-2.45,2.45,2.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - WallLayer
  - type: PowerConsumer
    voltage: High
    drawRate: 1000000 # 1 MW — heavy for a station grid, still a lot of power.
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower
  - type: CEShieldGenerator
  - type: ActivatableUI
    key: enum.CEShieldGeneratorUiKey.Key
  - type: UserInterface
    interfaces:
      enum.CEShieldGeneratorUiKey.Key:
        type: CEShieldGeneratorBoundUserInterface
  - type: Appearance
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 1200
        behaviors:
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
