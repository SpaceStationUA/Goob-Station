# Far Horizons: hand-placed planets. Manual planets can either use a predefined sprite
# (like the CE author's nauvis) or a procedural star system shader — see CEPlanetComponent.
# Procedural star system planets (shader-based) are spawned by the star system itself,
# and CEPlanetNauvis is spawned alongside them as a predetermined planet.

- type: entity
  id: CEPlanetBase
  abstract: true
  name: planet
  description: A planet floating in space. Land on it, or just admire it from afar.
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
  - type: CEPlanet
    sprite:
      sprite: _FarHorizons/Planets/nauvis.rsi
      state: planet

- type: entity
  parent: CEPlanetBase
  id: CEPlanetNauvis
  name: Nauvis
  description: The third rock from a certain sun. If you can read this, someone forgot to replace the description.
  components:
  - type: CEPlanet
    spinRate: 0.02
  - type: FTLBeacon

# The star system's volcanic world: its ground layer is the lavaland map (outpost, ruins,
# megafauna, ores) generated alongside space maps, so miners can fly to it and descend
# onto the surface. Spawned by the star system, never by hand.
- type: entity
  parent: CEPlanetBase
  id: CEPlanetLavaland
  name: Lavaland
  description: A scorched volcanic world. The ash storms are the least of your worries.
  categories: [ HideSpawnMenu ]
  components:
  - type: CEPlanet
    sprite:
      sprite: _FarHorizons/Planets/lavaland.rsi
      state: planet
    spinRate: 0.005
  - type: FTLBeacon

# The distant syndicate world: its ground layer is the nukie outpost map loaded by the
# nukeops rule, and a permanent red field keeps everyone but syndicate ships out.
- type: entity
  parent: CEPlanetBase
  id: CEPlanetNukie
  name: Nukie
  description: A red and angry world. The field over it is not for your benefit.
  categories: [ HideSpawnMenu ]
  components:
  - type: CEPlanet
    sprite:
      sprite: _FarHorizons/Planets/nukie.rsi
      state: planet
    spinRate: 0.008
    hideFromMaps: true
  - type: CEPlanetShield
    active: true
    shieldColor: "#e03c3c"
    whitelist:
      tags:
      - Syndicate
  - type: FTLBeacon
