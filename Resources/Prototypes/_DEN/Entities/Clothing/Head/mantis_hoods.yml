- type: entity
  parent: [ClothingHeadHatFezMantis, BaseFoldable]
  id: ClothingHeadHoodMantisDark
  name: dark mantis hood
  description: "A gloomy hood that sits low on the head, ornamented with magenta tassles. It matches your cloak nicely, though it can be worn on its own. You can lower it to rest more comfortably atop your shoulders."
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hoods/mantis_hood_dark.rsi
    layers:
    - state: icon
      map: ["unfoldedLayer"]
    - state: icon-folded
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hoods/mantis_hood_dark.rsi
  - type: Appearance
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide
    #clothingSlots: # Aurora: Not in this fork
    #- ears
  - type: Foldable
    canFoldInsideContainer: true
    foldVerbText: fold-verb
    unfoldVerbText: unfold-verb
  - type: FoldableClothing
    foldedEquippedPrefix: folded


- type: entity # A separate loadout option that starts lowered; parents to the fez so it doesn't hide hair while lowered
  parent: [ClothingHeadHatFezMantis, BaseFoldable]
  id: ClothingHeadHoodMantisDarkFolded
  name: dark mantis hood
  suffix: Lowered
  description: "A gloomy hood that sits low on the head, ornamented with magenta tassles. It matches your cloak nicely, though it can be worn on its own. It keeps sliding back onto your shoulders, but you can always raise it back up."
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hoods/mantis_hood_dark.rsi
    layers:
    - state: icon
      map: ["unfoldedLayer"]
    - state: icon-folded
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hoods/mantis_hood_dark.rsi
    equippedPrefix: folded
  - type: Appearance
  - type: Foldable
    folded: true
    canFoldInsideContainer: true
    foldVerbText: fold-verb
    unfoldVerbText: unfold-verb
  - type: FoldableClothing
    foldedEquippedPrefix: folded
