- type: entity
  parent: [ClothingHeadHatFezMantis, BaseFoldable]
  id: ClothingHeadHoodMantisDark
  name: "темний каптур псіо-екстрасенса"
  description: "Похмурий каптур, що низько сидить на голові, прикрашений пурпуровими китицями. Він пасує до вашого плаща, хоча його можна носити й окремо. Його можна опустити, щоб зручніше влаштувати на плечах."
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hoods/mantis_hood_dark.rsi
    layers:
    - state: icon
      map: ["unfoldedLayer"]
    - state: icon-folded
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hoods/mantis_hood_dark.rsi
  - type: Appearance
  - type: HideLayerClothing
    slots:
    - Hair
    - HeadTop
    - HeadSide
    #clothingSlots: # Aurora: Not in this fork
    #- ears
  - type: Foldable
    canFoldInsideContainer: true
    foldVerbText: fold-verb
    unfoldVerbText: unfold-verb
  - type: FoldableClothing
    foldedEquippedPrefix: folded


- type: entity # A separate loadout option that starts lowered; parents to the fez so it doesn't hide hair while lowered
  parent: [ClothingHeadHatFezMantis, BaseFoldable]
  id: ClothingHeadHoodMantisDarkFolded
  name: "темний каптур псіо-екстрасенса"
  suffix: Lowered
  description: "Похмурий каптур, що низько сидить на голові, прикрашений пурпуровими китицями. Він пасує до вашого плаща, хоча його можна носити й окремо. Він постійно сповзає на плечі, але його завжди можна знову підняти."
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Head/Hoods/mantis_hood_dark.rsi
    layers:
    - state: icon
      map: ["unfoldedLayer"]
    - state: icon-folded
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    sprite: _DEN/Clothing/Head/Hoods/mantis_hood_dark.rsi
    equippedPrefix: folded
  - type: Appearance
  - type: Foldable
    folded: true
    canFoldInsideContainer: true
    foldVerbText: fold-verb
    unfoldVerbText: unfold-verb
  - type: FoldableClothing
    foldedEquippedPrefix: folded
