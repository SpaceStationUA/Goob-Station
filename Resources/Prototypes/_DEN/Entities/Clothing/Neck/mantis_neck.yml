- type: entity
  parent: [ClothingNeckBase, BaseFoldable]
  id: ClothingNeckCloakMantisDark
  name: dark mantis cloak
  description: "A billowing cloak that you can bundle around yourself, if you feel your traditional uniforms are too revealing. The brooch is a Greek psi."
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Neck/Cloaks/mantis_cloak_dark.rsi
    layers:
    - state: icon
      map: ["unfoldedLayer"]
    - state: icon-folded
      map: ["foldedLayer"]
      visible: false
  - type: Appearance
  - type: Clothing
    sprite: _DEN/Clothing/Neck/Cloaks/mantis_cloak_dark.rsi
  - type: Tag
    tags:
    - WhitelistChameleon
    - MantisBeltStorable
  - type: Foldable
    canFoldInsideContainer: true
    foldVerbText: fold-verb
    unfoldVerbText: unfold-verb
  - type: FoldableClothing
    foldedEquippedPrefix: folded


- type: entity # So chameleon clothes can select the folded sprite
  parent: ClothingNeckCloakMantisDark
  id: ClothingNeckCloakMantisDarkFolded
  suffix: Bundled
  components:
  - type: Foldable
    folded: true
  - type: Clothing
    equippedPrefix: folded


- type: entity
  parent: [ClothingNeckBase, BaseFoldable]
  id: ClothingNeckMantleMantisOrnate
  name: ornate mantis mantle
  description: "A long, finely-woven mantle generously decorated with tassles. It can easily be worn on either shoulder."
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Neck/Mantles/mantis_mantle_airy.rsi
    layers:
    - state: icon
      map: ["unfoldedLayer"]
    - state: icon-flipped
      map: ["foldedLayer"]
      visible: false
  - type: Appearance
  - type: Clothing
    sprite: _DEN/Clothing/Neck/Mantles/mantis_mantle_airy.rsi
  - type: Tag
    tags:
    - WhitelistChameleon
    - MantisBeltStorable
  - type: Foldable
    canFoldInsideContainer: true
    foldVerbText: fold-flip-verb
    unfoldVerbText: fold-flip-verb
  - type: FoldableClothing
    foldedEquippedPrefix: flipped


- type: entity # So chameleon clothes can select the folded sprite
  parent: ClothingNeckMantleMantisOrnate
  id: ClothingNeckMantleMantisOrnateFlipped
  suffix: Flipped
  components:
  - type: Foldable
    folded: true
  - type: Clothing
    equippedPrefix: flipped


- type: entity
  parent: [ClothingNeckBase, BaseAntiPsionicWeapon, BaseMantisContraband]
  id: ClothingNeckMantisPendulum
  name: mantis pendulum
  description: "A mnemolith eye on a sturdy electrum chain, used to test psionic ability. It grows uncomfortably hot in the wielder's hand if the subject lacks the gift. Basically harmless, though its use tends to annoy the crew, so do consider asking first. The chain is long enough to clasp around your neck, should you feel inclined."
  components:
  - type: ItemToggle # You can toggle swinging it back and forth, though it's just cosmetic
    verbToggleOn: item-toggle-swingstart
    verbToggleOff: item-toggle-swingstop
    predictable: false
    soundActivate:
      path: /Audio/Effects/toss.ogg
      params:
        volume: -6
        pitch: 1.3
        variation: 0.05
    soundDeactivate:
      path: /Audio/Effects/weak_hit2.ogg
      params:
        volume: -9
        pitch: 1.3
        variation: 0.05
  - type: UseDelay
    delay: 0.92 # This is just under one swing animation
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: null # Swinging it only changes the inhand sprites
    replaceMode: true # Only show the swinging sprite while toggled
    inhandVisuals:
      left:
      - state: swinging-inhand-left
      right:
      - state: swinging-inhand-right
  - type: Sprite
    sprite: _DEN/Clothing/Neck/Misc/mantispendulum.rsi
  - type: Item
    sprite: _DEN/Clothing/Neck/Misc/mantispendulum.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Neck/Misc/mantispendulum.rsi
  - type: AntiPsionicWeapon
    punish: true # The only weapon that keeps the punish - it's how you test for the gift
    punishChance: 1
    punishStatusEffects: false # Pirate - the pendulum only says the message, it no longer shakes you or knocks you over
    punishMessage: mantis-pendulum-hot-message # Pirate - tells the wielder the test result
    modifiers: # Required field in this fork's component - this block replaces the base's, so it must be re-specified
      coefficients:
        Blunt: 1.25
        Slash: 1.25
        Piercing: 1.25
        Heat: 1.25
        Cold: 1.25
        Holy: 1.25
  - type: MeleeWeapon
    attackRate: .6666
    maxTargets: 1
    angle: 90
    soundHit:
      path: /Audio/_DEN/Effects/crystaltap3.ogg
      params:
        volume: -6
        variation: 0.05
    damage:
      types: # Melee damage (per the description, it's for testing psionic ability, not fighting)
        Blunt: 1 # 1.5 DPS, or 1.88 DPS against psions
        Holy: 0.5 # 2.81 total DPS against psionic supernaturals
  - type: Tag
    tags:
    - WhitelistChameleon
    - MantisBeltStorable

# Mantis wolfskin (TheDen PR #2669 port)
- type: entity
  parent: Clothing # It's not edible or butcherable!
  id: ClothingNeckCloakMantisShroud
  name: mantis wolfskin
  description: "A heavy traveler's cloak adorned with a charm-laden necklace, built to turn wind, rain, and dust alike. The origins of the name are lost to history, but the association with hunting remains."
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Neck/Cloaks/mantis_shroud.rsi
    state: icon
  - type: Item
    sprite: _DEN/Clothing/Neck/Cloaks/mantis_shroud.rsi
    size: Small
  - type: Clothing
    quickEquip: true
    slots:
    - neck
  - type: Tag
    tags:
    - WhitelistChameleon
    - MantisBeltStorable
  - type: ToggleableClothing
    clothingPrototypes: # This fork's component uses the dict form (see chaplain hood)
      head: ClothingHeadHatMantisShroud
  - type: ContainerContainer
    containers:
      toggleable-clothing: !type:Container {}
