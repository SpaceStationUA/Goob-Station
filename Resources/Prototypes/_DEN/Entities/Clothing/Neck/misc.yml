- type: entity
  parent: ClothingNeckBase # starcup - no leashing, no folding
  id: ClothingNeckCowBellCollar
  name: cowbell collar
  description: A way to inform others about the presence of livestock, or just to annoy everyone around you!
  components:
    - type: Sprite
      sprite: _DEN/Clothing/Neck/Collars/collar_cowbell.rsi
    - type: Clothing
      sprite: _DEN/Clothing/Neck/Collars/collar_cowbell.rsi
#   begin starcup: replace EmitsSoundOnMove
#    - type: EmitsSoundOnMove
#      soundCollection:
#        collection: CowbellRings
    - type: UseDelay # TODO - when Den finishes their rebase, ditch this and nab EmitSound
      delay: 0.5
    - type: EmitSoundOnLand
      sound: &CowbellSound
        collection: CowbellRings
        params:
          variation: 0.07
          volume: -5
    - type: EmitSoundOnActivate
      sound: *CowbellSound
    - type: EmitSoundOnTrigger
      sound: *CowbellSound
    - type: EmitSoundOnCollide
      sound: *CowbellSound
#   end starcup

- type: entity
  parent: ClothingNeckBase # starcup - no leashing, no folding
