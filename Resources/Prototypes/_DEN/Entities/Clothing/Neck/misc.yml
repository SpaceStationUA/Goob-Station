  - type: Sprite
    sprite: _DEN/Clothing/Neck/Collars/colorable_collar.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Neck/Collars/colorable_collar.rsi

- type: entity
  parent: ClothingNeckBase # Floof - reparented # starcup - no leashing, no folding
  id: ClothingNeckBellCollar
  name: bell collar
#  description: A way to inform others about your presence, or just to annoy everyone around you!
  description: A fashionable accessory for making sure everyone knows you're here.
  components:
  - type: Sprite
    sprite: _DEN/Clothing/Neck/Collars/collar_bell.rsi
  - type: Clothing
    sprite: _DEN/Clothing/Neck/Collars/collar_bell.rsi
#   begin starcup: replace EmitsSoundOnMove
#  - type: EmitsSoundOnMove
#    soundCollection:
#      collection: FootstepJester
  - type: UseDelay # TODO - when Den finishes their rebase, ditch this and nab EmitSound
    delay: 0.5
  - type: EmitSoundOnLand
    sound: &JingleSound
      collection: FootstepJester
      params:
        variation: 0.07
        volume: -5
  - type: EmitSoundOnActivate
    sound: *JingleSound
  - type: EmitSoundOnTrigger
    sound: *JingleSound
  - type: EmitSoundOnCollide
    sound: *JingleSound
#   end starcup
