# Ported from TheDenSS14/TheDen (jukebox.yml, monitors_televisions.yml, chargers.yml, beds.yml).

# --- Jukebox ---

- type: entity
  parent: Jukebox
  id: SomberJukebox
  name: "похмуре радіо"
  description: "Смугасте радіо з амарантового дерева. Вам тут не потрібен цілий клятий музичний автомат. Це було б несмаком."
  components:
  - type: Sprite
    sprite: _DEN/Structures/Machines/somberjukebox.rsi
    snapCardinals: true
    noRot: true
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 3
            max: 3
          SheetSteel1: # TheDen: ScrapElectrum (not in this fork)
            min: 1
            max: 3
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.21875,-0.0625,0.21875,0.21875"
        hard: false
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
        density: 100

# --- Television ---

- type: entity
  parent: ComputerTelevision
  id: ComputerSomberTelevision
  name: "похмурий телевізор"
  description: "Смугастий телевізор з амарантового дерева. Він схожий на дорогий антикваріат, але екран такий малий і квадратний, що це важко оцінити. З якоїсь причини він має нульовий канал, де показують лише зернисті зображення фруктів, що обертаються."
  components:
  - type: Sprite
    sprite: _DEN/Structures/Machines/computers.rsi
    layers:
    - map: ["computerLayerBody"]
      state: sombertelevision
    - map: ["computerLayerScreen"]
      state: sombertelevision-on
  - type: EtherealLight
  - type: PointLight
    radius: 2
    energy: 4
    color: "#4dc4ff"
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.28125,-0.15625,0.28125,0.3125"
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
        density: 200
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 3
            max: 3
          SheetSteel1: # TheDen: ScrapElectrum (not in this fork)
            min: 1
            max: 3

# --- Power Cell Recharger ---

- type: entity
  parent: PowerCellRecharger
  id: SomberPowerCellRecharger
  name: "похмура оргонна піраміда"
  suffix: Cell Recharger
  description: "Ретельно виготовлена ейдолітова піраміда для заряджання батарей. Її грані вирівняно з геомантичною точністю, недосяжною для більшості людей. Мантиси наполягають, що вона спрямовує ноосферний потік, хоча клубок дротів усередині натякає: це може бути звичайний зарядний пристрій, замаскований під окультний артефакт. Хай там як, працює справно."
  components:
  - type: Sprite
    sprite: _DEN/Structures/Power/somber_cell_recharger.rsi
    snapCardinals: true
    noRot: true
  - type: Charger
    chargeRate: 20
  - type: PointLight
    enabled: true
    radius: 1.4
    energy: 1.4
    color: "#d9418d"
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: StaticPrice
    price: 2000
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1: # TheDen: MaterialEidolite1 + ScrapElectrum (not in this fork)
            min: 3
            max: 3

# --- Psych Bed ---

- type: entity
  parent: PsychBed
  id: SomberPsychBed
  name: "похмура кушетка"
  description: "Технічно це шезлонг, тобто французькою «довге крісло», але відпочивати на ньому й справді зручно."
  components:
  - type: Sprite
    sprite: _DEN/Structures/Furniture/furniture.rsi
    state: somberpsychbed
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 3
            max: 3
          SheetSteel1: # TheDen: ScrapElectrum (not in this fork)
            min: 1
            max: 3
