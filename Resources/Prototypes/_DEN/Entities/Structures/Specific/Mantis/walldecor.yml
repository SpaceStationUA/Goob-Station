# Ported from TheDenSS14/TheDen (Specific/Mantis/walldecor.yml).

- type: entity
  parent: BaseSignDirectional
  id: WallDecorSomberPsi
  name: "електрумова псі"
  description: "Грецька літера псі, що символізує Ноосферу та псіо-екстрасенса, який за нею наглядає."
  components:
  - type: Sprite
    sprite: _DEN/Structures/Specific/Mantis/walldecor.rsi
    state: psi
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak

- type: entity
  parent: WallDecorSomberPsi
  id: WallDecorSomberEye
  name: "електрумове око"
  description: "Око з електруму, що символізує розум і прикрашене пурпуровими китицями."
  components:
  - type: Sprite
    state: eye

- type: entity
  parent: WallDecorSomberPsi
  id: WallDecorSomberHereticTrophy
  name: "трофей псіо-екстрасенса"
  description: "Уламки розбитого потойбічного клинка, закріплені як трофей. На табличці написано: «Так закінчать усі, хто шукає місце за межею»"
  components:
  - type: Sprite
    layers:
      - state: heretictrophy
      - state: heretictrophy-subtleglow # 2% opacity layer for faint glow in the dark
        shader: unshaded
      - state: heretictrophy-glow
        shader: unshaded
  - type: PointLight
    radius: 1.5 # Ideally so dark you only barely see it
    energy: 3
    color: "#ffd069" # Same color the cosmos heretic sickle glows, but these are just broken fragments
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
  # - type: GuideHelp # MantisGuide isn't ported to this fork
  #   guides: [ MantisGuide ]
