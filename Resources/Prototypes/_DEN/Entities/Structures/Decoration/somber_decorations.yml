# Ported from TheDenSS14/TheDen (fireplace.yml, mannequin.yml, mirror.yml, dresser.yml).

# --- Fireplace ---

- type: entity
  parent: Fireplace
  id: SomberFireplace
  name: "похмурий електрумовий камін"
  description: "Авангардний камін у формі ока; його бездимне псіонічне полум’я хвилюється, мов рідина."
  components:
  - type: Sprite
    noRot: true
    sprite: _DEN/Structures/Decoration/somberfireplace.rsi
    layers:
      - state: fireplace
      - state: fireplacefestive
        map: ["christmas"]
        visible: false
      - state: fireplace_fire4
        shader: unshaded
      - state: fireplace_glow
        shader: unshaded
  - type: Appearance
  - type: HolidayVisuals
    holidays:
      festive:
      - FestiveSeason
  - type: GenericVisualizer
    visuals:
      enum.HolidayVisuals.Holiday:
        christmas:
          festive: { visible: true }
  - type: AmbientSound
    volume: -6
    range: 5
    sound:
      path: /Audio/Ambience/Objects/fireplace.ogg
  - type: PointLight
    radius: 4
    energy: 6
    color: "#4dc4ff"
  - type: AlwaysHot
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1: # TheDen: ScrapElectrum (not in this fork)
            min: 3
            max: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.05,0.1,0.05,0.35"
        hard: true
        density: 200
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable
        - BulletImpassable

# --- Hanging Brazier ---

- type: entity
  parent: BaseSignDirectional
  id: SomberHangingBrazier
  name: "похмура підвісна жаровня"
  description: "Електрумова жаровня, чиє бездимне псіонічне полум’я хвилюється, мов рідина."
  placement:
    mode: WallmountLight
  components:
  - type: Sprite
    drawdepth: SmallObjects
    noRot: true
    sprite: _DEN/Structures/Decoration/somberhangingbrazier.rsi
    layers:
      - state: fireplace
      - state: fireplacefestive
        map: ["christmas"]
        visible: false
      - state: fireplace_fire4
        shader: unshaded
      - state: fireplace_glow
        shader: unshaded
  - type: Appearance
  - type: HolidayVisuals
    holidays:
      festive:
      - FestiveSeason
  - type: GenericVisualizer
    visuals:
      enum.HolidayVisuals.Holiday:
        christmas:
          festive: { visible: true }
  - type: PointLight
    radius: 3
    energy: 4
    softness: 1.1
    color: "#4dc4ff"
  - type: StaticPrice
    price: 125
  - type: AlwaysHot
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1: # TheDen: ScrapElectrum (not in this fork)
            min: 1
            max: 3

# --- Mannequin ---

- type: entity
  parent: Mannequin
  id: SomberMannequin
  name: "похмурий манекен"
  description: "Похмурий манекен з електрумовими очима, що викликають лише легке занепокоєння. Призначений для демонстрації одягу."
  components:
  - type: Sprite
    sprite: _DEN/Structures/Decoration/mannequin.rsi
    state: sombermannequin
    noRot: true
    layers:
    - map: [ "mannequin" ]
      sprite: _DEN/Structures/Decoration/mannequin.rsi
      state: sombermannequin
    - map: [ "jumpsuit" ]
    - map: [ "outerClothing" ]
    - map: [ "eyes" ]
    - map: [ "neck" ]
    - map: [ "back" ]
    - map: [ "mask" ]
    - map: [ "head" ]
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: Inorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 3
            max: 3
          SheetSteel1: # TheDen: ScrapElectrum (not in this fork)
            min: 1
            max: 3
      - !type:EmptyAllContainersBehaviour

# --- Mirror ---

- type: entity
  parent: Mirror
  id: SomberMirror
  name: "похмуре електрумове дзеркало"
  description: "Блискуче електрумове дзеркало з полірованою підкладкою з мю-металу, що захищає від псіонічного ясновидіння. Спокійна мить наодинці."
  components:
  - type: Sprite
    sprite: _DEN/Structures/Wallmounts/mirror.rsi
    state: sombermirror

