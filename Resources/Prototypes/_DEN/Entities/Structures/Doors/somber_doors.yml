# Ported from TheDenSS14/TheDen (_DEN/Entities/Structures/Doors/MaterialDoors/material_doors.yml).

- type: entity
  parent: BaseMaterialDoorNavMap
  id: SomberAmaranthDoor
  name: "похмурі амарантові двері"
  description: "Двері з екзотичної, надзвичайно міцної деревини. Її також називають «пурпуровим серцем» або, помилково, палісандром."
  components:
  - type: Door
    openSound:
      path: /Audio/Effects/door_open.ogg
    closeSound:
      path: /Audio/Effects/door_close.ogg
  - type: Sprite
    sprite: _DEN/Structures/Doors/MineralDoors/amaranth_door.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Wood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1: # TheDen: ScrapElectrum (not in this fork)
            min: 1
            max: 3
          MaterialWoodPlank1:
            min: 3
            max: 3
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy

- type: entity
  parent: BaseMaterialDoorNavMap
  id: SomberMnemolithDoor
  name: "похмурі мнемолітові двері"
  description: "Двері з мнемоліту, темного склоподібного каменю, що утворюється під час сильних ноосферних бур."
  components:
  - type: Sprite
    sprite: _DEN/Structures/Doors/MineralDoors/mnemolith_door.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1: # TheDen: MaterialMnemolith1 (not in this fork)
            min: 3
            max: 5
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
