# Ported from TheDenSS14/TheDen (_DEN/Entities/Structures/furniture/Tables/tables.yml).

- type: entity
  parent: TableBase
  id: SomberTable
  name: "похмурий стіл"
  description: "Дорогий стіл із похмурого візерунчастого дерева з електрумовими акцентами."
  components:
  - type: Sprite
    sprite: _DEN/Structures/Furniture/Tables/somberwoodtable.rsi
  - type: Icon
    sprite: _DEN/Structures/Furniture/Tables/somberwoodtable.rsi
    state: full
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: Inorganic
  - type: Tag
    tags:
    - Wooden
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank:
            min: 3
            max: 3
          SheetSteel1: # TheDen: ScrapElectrum (not in this fork)
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepWood

- type: entity
  parent: SomberTable
  id: SomberCounter
  name: "похмурий прилавок"
  description: "Дорогий прилавок із похмурого візерунчастого дерева з електрумовими акцентами."
  components:
  - type: Sprite
    sprite: _DEN/Structures/Furniture/Tables/somberwoodcounter.rsi
  - type: Icon
    sprite: _DEN/Structures/Furniture/Tables/somberwoodcounter.rsi
    state: full
