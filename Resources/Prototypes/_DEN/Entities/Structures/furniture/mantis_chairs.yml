# Ported from TheDenSS14/TheDen (_DEN/Entities/Structures/furniture/chairs.yml,
# mantis section). ScrapElectrum drop -> SheetSteel1 (electrum scrap isn't in this fork).

- type: entity
  parent: VehicleWheelchair
  id: SomberChairLeatherMantisWheelchair
  name: "крісло псіо-екстрасенса"
  description: "М’яке шкіряне офісне крісло з прихованими дивними блюспейс-механізмами, завдяки яким воно стискається в електрумову кулю. Воно ширяє над самою підлогою, а керувати ним можна псіонічним впливом."
  placement:
    mode: SnapgridCenter
  components:
  - type: Foldable
    canFoldInsideContainer: false
  - type: Sprite
    sprite: _DEN/Structures/Specific/Mantis/mantischair.rsi
    state: vehicle
  - type: Item
    size: Huge
  - type: Damageable
    damageModifierSet: StrongMetallic
    damageContainer: Inorganic
  - type: StaticPrice
    price: 125
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 300
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroyHeavy
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialWoodPlank1:
            min: 3
            max: 3
          SheetSteel1: # TheDen: ScrapElectrum (not in this fork)
            min: 3
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]

- type: entity
  parent: SomberChairLeatherMantisWheelchair
  id: SomberChairLeatherMantisWheelchairFolded
  name: "зв’язане крісло псіо-екстрасенса"
  suffix: Folded, Not Tabletop
  description: "Електрумова куля з прихованими дивними блюспейс-механізмами, завдяки яким вона розкладається в м’яке шкіряне офісне крісло. Корисне для псіо-екстрасенсів з обмеженою мобільністю або просто як універсальні офісні меблі."
  placement:
    mode: PlaceFree
  components:
  - type: Sprite
    sprite: _DEN/Structures/Specific/Mantis/mantischair.rsi
    state: vehicle_folded
  - type: Item
    size: Small
  - type: Foldable
    folded: true
  - type: Tag
    tags:
    - MantisBeltStorable
    - DoorBumpOpener
