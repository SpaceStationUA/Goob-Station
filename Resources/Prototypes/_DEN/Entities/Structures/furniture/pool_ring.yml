- type: entity
  abstract: true
  parent: [SeatBase, BaseItem]
  id: BaseSwimRing
  name: "плавальне кільце"
  description: "Також відоме як надувний круг, внутрішня камера або водяний пончик. Надувна гумова іграшка для відпочинку на воді."
  components:
  - type: Sprite
    sprite: _DEN/Structures/Furniture/pool_ring.rsi
  - type: Item
    size: Normal
  - type: Clothing # DeltaV
    slots:
    - belt
  - type: Strap
    buckleOffset: "0,0.1"

