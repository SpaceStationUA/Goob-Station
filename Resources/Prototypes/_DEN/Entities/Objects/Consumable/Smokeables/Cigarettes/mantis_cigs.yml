# Ported from TheDenSS14/TheDen (Resources/Prototypes/_DEN/Entities/Objects/Consumable/Smokables/Cigarettes/)
# Adapted for this fork: MnemolithReagent isn't in this fork (commented out - the cigarette is just
# a fancy smoke now).

- type: entity
  id: CigaretteMnemolith
  parent: Cigarette
  name: mnemolith cigarette
  description: "The smoke clings to your thoughts, enhancing your awareness of the noosphere."
  components:
  - type: Smokable
    inhaleAmount: 0.05 # The default value, included here for reference if mnemolith is rebalanced
  - type: Sprite
    sprite: _DEN/Objects/Consumable/Smokeables/Cigarettes/cigarettemantis.rsi
  - type: Item
    sprite: _DEN/Objects/Consumable/Smokeables/Cigarettes/cigarettemantis.rsi
  - type: Clothing
    sprite: _DEN/Objects/Consumable/Smokeables/Cigarettes/cigarettemantis.rsi
  - type: SolutionContainerManager
    solutions:
      smokable:
        maxVol: 30
        reagents:
          - ReagentId: Nicotine
            Quantity: 10
          # - ReagentId: MnemolithReagent # Not in this fork
          #   Quantity: 20
  - type: Extractable
    grindableSolutionName: smokable
  - type: Tag
    tags:
    - Cigarette
    - Trash
    - Smokable

- type: entity
  id: CigPackMnemolith
  parent: CigPackBase
  name: Mnemolith Cigarettes
  description: "Cigarettes containing powdered mnemolith, used by mantes to heighten their extrasensory perception. Potential psychological impact aside, there are no known lasting effects."
  components:
  - type: Sprite
    sprite: _DEN/Objects/Consumable/Smokeables/Cigarettes/Packs/mantis.rsi
    layers:
    - state: closed
    - state: open
      map: ["openLayer"]
      visible: false
    - state: cig1
      map: ["cig1"]
      sprite: _DEN/Objects/Consumable/Smokeables/Cigarettes/Packs/mantis-visualizer.rsi
      visible: false
    - state: cig2
      map: ["cig2"]
      sprite: _DEN/Objects/Consumable/Smokeables/Cigarettes/Packs/mantis-visualizer.rsi
      visible: false
    - state: cig3
      map: ["cig3"]
      sprite: _DEN/Objects/Consumable/Smokeables/Cigarettes/Packs/mantis-visualizer.rsi
      visible: false
    - state: cig4
      map: ["cig4"]
      sprite: _DEN/Objects/Consumable/Smokeables/Cigarettes/Packs/mantis-visualizer.rsi
      visible: false
    - state: cig5
      map: ["cig5"]
      sprite: _DEN/Objects/Consumable/Smokeables/Cigarettes/Packs/mantis-visualizer.rsi
      visible: false
    - state: cig6
      map: ["cig6"]
      sprite: _DEN/Objects/Consumable/Smokeables/Cigarettes/Packs/mantis-visualizer.rsi
      visible: false
  - type: Item
    sprite: _DEN/Objects/Consumable/Smokeables/Cigarettes/Packs/mantis.rsi
  - type: EntityTableContainerFill
    containers:
      storagebase:
        id: CigaretteMnemolith
        amount: 10
  - type: Tag
    tags:
    - CigPack
    - Trash
