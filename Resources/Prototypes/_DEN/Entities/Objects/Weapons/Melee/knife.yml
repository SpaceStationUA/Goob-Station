# Ported from TheDenSS14/TheDen (Resources/Prototypes/_DEN/Entities/Objects/Weapons/Melee/knife.yml)
# Adapted for this fork: item-toggle-spin / item-toggle-catch verb loc strings added in _Pirate locale.

- type: entity
  parent: BaseKnife
  id: BaseKnifeSpinnable # Don't use this for items that actually do something mechanical when you press Z, and you have to make the animated sprites yourself
  abstract: true
  components:
  - type: Sprite
    state: icon
  - type: ItemToggle # You can toggle spinning it around your finger, though it's just cosmetic
    verbToggleOn: item-toggle-spin
    verbToggleOff: item-toggle-catch
    predictable: false
    soundActivate:
      path: /Audio/Effects/toss.ogg # Spin
      params:
        volume: -6
        pitch: 1.1 # I'm using 1.1 for normal knives, 0.9 for large knives, and 1.3 for tiny knives
        variation: 0.05
    soundDeactivate:
      path: /Audio/Effects/weak_hit2.ogg # Catch
      params:
        volume: -9
        pitch: 1.1 # Same as above
        variation: 0.05
  - type: UseDelay
    delay: 0.5 # This is just under one spin animation, presuming it has 8 frames that are 0.07 delay each, so you can spam Z to spin it exactly one time
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: null # Spinning it only changes the inhand sprites
    replaceMode: true # The original inhand sprite won't remain visible when spinning (port of TheDen's ReplaceMode)
    inhandVisuals:
      left:
      - state: spinning-inhand-left
      right:
      - state: spinning-inhand-right

- type: entity
  parent: [BaseKnifeSpinnable, BaseKnife]
  id: TailorsKnife
  name: "кравецький ніж"
  description: "Простий клиноподібний ніж для розрізання тканини. Отвір у руків’ї достатньо великий, щоб обертати ніж на пальці, хоча це не має жодної мети."
  components:
  - type: ItemToggle
    soundActivate:
      path: /Audio/Effects/toss.ogg # Spin
      params:
        volume: -6
        pitch: 1.3
        variation: 0.05
    soundDeactivate:
      path: /Audio/Effects/weak_hit2.ogg # Catch
      params:
        volume: -9
        pitch: 1.3
        variation: 0.05
  - type: Sprite
    sprite: _DEN/Objects/Weapons/Melee/tailorsknife.rsi
  - type: Item
    sprite: _DEN/Objects/Weapons/Melee/tailorsknife.rsi
  - type: MeleeWeapon # Shiv stats
    wideAnimationRotation: 180
    attackRate: .9
    # heavyRateModifier: 1.5 # Not present in this fork's MeleeWeaponComponent
    # heavyDamageBaseModifier: 1.1 # Not present in this fork's MeleeWeaponComponent
    range: 1.4
    damage:
      types:
        Slash: 5.5
  - type: EmbeddableProjectile
    removalTime: 2
  - type: LandAtCursor
  - type: DisarmMalus
    malus: 0.225
  - type: ThrowingAngle
    angle: 180

- type: entity
  parent: [TailorsKnife, BaseAntiPsionicWeapon, BaseMantisContraband]
  id: MantisTailorsKnife
  name: "равель"
  description: "Мнемолітовий кравецький ніж, імовірно вкрадений у того, хто розробляв ці нові уніформи. Ах ти, щуре. Отвір у руків’ї достатньо великий, щоб обертати ніж на пальці, хоча це не має жодної мети."
  components:
  - type: Sprite
    sprite: _DEN/Objects/Weapons/Melee/Mantis/mantistailorsknife.rsi
  - type: Item
    sprite: _DEN/Objects/Weapons/Melee/Mantis/mantistailorsknife.rsi
  - type: MeleeWeapon
    damage:
      types:
        Slash: 5.5 # 6.11 DPS (same as Shiv), or 7.64 DPS against psions (same as Crowbar)
        Holy: 2.75 # 11.25 total DPS against psionic supernaturals
  - type: Tag
    tags:
    - Knife
    - MantisBeltStorable

- type: entity
  parent: [BaseKnifeSpinnable, CombatKnife, BaseAntiPsionicWeapon, BaseMantisContraband]
  id: MantisMeleeKnife
  name: "атаме"
  description: "Мнемолітовий ніж у формі кігтя, на звороті якого розташовані зубці для ламання мечів — хоча досі незрозуміло, хто саме оголює клинки проти псіо-екстрасенсів. Кільце для пальця покращує хват і дає змогу безцільно крутити ніж, хоча це не має тактичної користі. Смертоносний проти псіонічних і потойбічних загроз."
  components:
  - type: Sprite
    sprite: _DEN/Objects/Weapons/Melee/Mantis/mantisknife.rsi
  - type: Item
    sprite: _DEN/Objects/Weapons/Melee/Mantis/mantisknife.rsi
    storedSprite: null # To override CombatKnife
  - type: MeleeWeapon
    attackRate: 1.0
    angle: 40 # Standard knife swing, here for reference
    damage:
      types:
        Slash: 15 # 15 DPS (Slash only), or 18.75 against psions (1.25×)
        Holy: 7 # 22 total base DPS, or 27.5 against psionic supernaturals (1.25×)
  - type: DisarmMalus
    malus: 0.3 # A third harder to disarm than CombatKnife due to the finger ring
  - type: Tag
    tags:
    - Knife
    - MantisKnife
    - MantisBeltStorable

- type: entity
  parent: [BaseKnifeSpinnable, CombatKnife, BaseAntiPsionicWeapon, BaseMantisContraband]
  id: MantisMeleeSickle
  name: "боліна"
  description: "Важкий мнемолітовий серп з ейдолітовим оком, створений як жорстокіший побратим атаме для широких, методичних ударів. Кільце для пальця дає змогу безцільно крутити серп, хоча це не має тактичної користі. Смертоносний проти псіонічних і потойбічних загроз."
  components:
  - type: ItemToggle
    soundActivate:
      path: /Audio/Effects/toss.ogg # Spin
      params:
        volume: -6
        pitch: 0.9
        variation: 0.05
    soundDeactivate:
      path: /Audio/Effects/weak_hit2.ogg # Catch
      params:
        volume: -9
        pitch: 0.9
        variation: 0.05
  - type: Sprite
    sprite: _DEN/Objects/Weapons/Melee/Mantis/mantissickle.rsi
  - type: Item
    size: Normal
    sprite: _DEN/Objects/Weapons/Melee/Mantis/mantissickle-inhands-64x.rsi
    storedSprite: null # To override CombatKnife
  - type: MeleeWeapon
    attackRate: 0.85
    angle: 60 # Swings a little wider than the athame, but easier to disarm
    damage:
      types:
        Slash: 20 # 17 DPS (Slash only), or 21.25 against psions (1.25×)
        Holy: 10 # 25.5 total base DPS, or 31.875 against psionic supernaturals (1.25×)
  - type: DisarmMalus
    malus: 0.1125 # Half as hard to disarm as CombatKnife, too big for the finger ring to help
  - type: MeleeThrowOnHit # Just a tiny knockback to look cool, barely moves anything
    speed: 3
    distance: 0.5 # lifetime isn't in this fork, distance is the knockback range
  - type: Tag
    tags:
    - Knife
    - MantisSickle
    - MantisBeltStorable
