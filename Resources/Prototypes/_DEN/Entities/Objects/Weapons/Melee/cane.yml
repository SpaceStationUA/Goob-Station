# Ported from TheDenSS14/TheDen (Resources/Prototypes/_DEN/Entities/Objects/Weapons/Melee/cane.yml)
# Adapted for this fork:
# - CaneBase doesn't exist here, so it parents the local Cane (keeps MobilityAid etc.).
# - ItemToggleDamageOtherOnHit / ItemToggleEmbeddableProjectile / ItemToggleEmbedPassiveDamage don't
#   exist here, so the raised-cane throw/embed gimmick is commented out below.
# - rapierhit.ogg is not in this fork's _DEN audio, so the standard /Audio/Weapons/Melee/rapierhit.ogg is used.
- type: entity
  parent: [Cane, BaseAntiPsionicWeapon, BaseMantisContraband]
  id: MantisMeleeCane
  name: gnomon
  description: "An amaranth cane crowned with an eidolite crystal. If flipped in the hand, the needle-sharp mnemolith tip serves as a thrusting weapon. A refined accessory, practical for mantes with limited mobility. Deadly when wielded against psionic and otherworldly threats."
  components:
  - type: Item
    sprite: _DEN/Objects/Weapons/Melee/Mantis/mantiscane.rsi
    size: Normal
    shape:
    - 0,0,1,1 # To override the default cane size
  - type: Sprite
    sprite: _DEN/Objects/Weapons/Melee/Mantis/mantiscane.rsi
    layers:
    - state: icon
      map: ["icon"]
    - state: icon-raised
      map: ["icon-raised"]
      visible: false
  - type: Appearance
  - type: ToggleableVisuals
    replaceMode: true # The original inhand sprite won't remain visible when raised (port of TheDen's ReplaceMode)
    spriteLayer: icon-raised
    inhandVisuals:
      left:
      - state: raised-inhand-left
        map: ["left-raised"]
      right:
      - state: raised-inhand-right
        map: ["right-raised"]
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        icon:
          True: { visible: false }
          False: { visible: true }
        icon-raised:
          True: { visible: true }
          False: { visible: false }
  - type: ItemToggle
    verbToggleOn: item-toggle-raise
    verbToggleOff: item-toggle-lower
    predictable: false
    soundActivate:
      path: /Audio/_DEN/Weapons/Melee/rapiermiss.ogg
      params:
        volume: -5
        pitch: 1.1
        variation: 0.05
    soundDeactivate:
      path: /Audio/_DEN/Weapons/Melee/rapiermiss.ogg
      params:
        volume: -5
        pitch: 0.9
        variation: 0.05
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types: # If you flip it, you stab them with the point
        Piercing: 10 # 6.67 DPS (Piercing only), or 13.33 against psions (2.0×)
        Holy: 5 # 10 total base DPS, or 20 against psionic supernaturals (2.0×)
    activatedSoundOnHit:
      path: /Audio/Weapons/bladeslice.ogg # rapierhit.ogg isn't in this fork
      params:
        variation: 0.05
    activatedSoundOnHitNoDamage:
      path: /Audio/_DEN/Weapons/Melee/rapiermiss.ogg
      params:
        variation: 0.05
    activatedSoundOnSwing:
      path: /Audio/_DEN/Weapons/Melee/rapiermiss.ogg
      params:
        variation: 0.05
    deactivatedSoundOnHit:
      collection: WeakHit
      params:
        variation: 0.05
    deactivatedSoundOnHitNoDamage:
      collection: WeakHit
      params:
        variation: 0.05
  - type: UseDelay
    delay: 0.5 # Just a small one so you don't hit it twice accidentally
  - type: MeleeWeapon
    attackRate: .6666
    wideAnimationRotation: -135
    damage:
      types: # If you don't flip it, you just bonk them
        Blunt: 5 # 7.5 DPS (same as Crowbar)
  - type: AntiPsionicWeapon # To override the +25% blunt damage against psions, because the bonking part isn't made of mnemolith
    modifiers:
      coefficients:
        Piercing: 2.0
        Holy: 2.0
  # - type: ItemToggleDamageOtherOnHit # Not in this fork
  # - type: ItemToggleEmbeddableProjectile # Not in this fork
  #   activatedEmbedOnThrow: true
  #   activatedSound: /Audio/Weapons/star_hit.ogg
  #   activatedRemovalTime: 2
  # - type: ItemToggleEmbedPassiveDamage # Not in this fork
  - type: ThrowingAngle
    angle: -135
  - type: StaminaDamageOnHit
    damage: 0 # Override the cane's default
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 0 # Override the cane's default
  - type: Tag
    tags:
    - MantisCane
    - MantisBeltStorable
