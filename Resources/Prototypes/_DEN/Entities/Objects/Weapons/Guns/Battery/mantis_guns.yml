# Ported from TheDenSS14/TheDen (Resources/Prototypes/_DEN/Entities/Objects/Weapons/Guns/Battery/battery_guns.yml, Mantis section only)
# Adapted for this fork:
# - These guns take the caster cells as "magazines" (MagazineAmmoProvider + gun_magazine ItemSlot), the same
#   pattern this fork's energy weapons (BaseWeaponCustomCell / EnergySpeedloader) use.
# - TheDen's ProjectileBatteryAmmoProvider on the caster cells is replaced by the local BatteryAmmoProvider
#   (which fires projectile protos here).
# - fireOnDropChance and the bolt-open animation states aren't supported in this fork's GunComponent, dropped.
# - GuideHelp (MantisGuide) commented out - no such guide entry in this fork.

- type: entity
  parent: [BaseItem, BaseMantisContraband]
  id: BaseMantisRanged # Lorewise, they use altered and contained anomaly cores to generate physical ammo
  abstract: true # But codewise, they're just battery guns that look and sound like they're shooting ballistics
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Item
    size: Normal # Defaults to a 2x2 square
  - type: Clothing
    quickEquip: false
    slots:
    - suitStorage
  - type: Gun
    soundEmpty:
      path: /Audio/_DV/Weapons/Guns/Empty/dry_fire.ogg
      params:
        volume: -5
        variation: 0.05
  - type: MagazineAmmoProvider
  - type: MagazineVisuals
    magState: mag
    zeroVisible: true
  - type: AmmoCounter
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: null
        whitelist:
          tags:
          - MantisCaster
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: Appearance
  - type: Execution
  - type: MeleeWeapon
    attackRate: 1.2
    damage:
      types:
        Blunt: 7.5
    wideAnimationRotation: 90
    soundHit:
      collection: MetalThud
  - type: ThrowingAngle
    angle: -90
    angularVelocity: true
  - type: Tag
    tags:
    - MantisBeltStorable

- type: entity
  parent: BaseMantisRanged
  id: MantisRangedPistol
  name: "ОКК-П12 «Калліста»"
  description: "Витончена ручна зброя псіо-екстрасенса, яку цінують за збалансованість і невимушену точність. Вона використовує спеціальні магазини, що називаються «кастерами», кожен із яких містить ядро аномалії, що безперервно формує власні кулі. Постачається з кастерами для вигнання та заглушення, призначеними для боротьби з надприродними загрозами й бунтівними псіоніками. Розроблена для Зовнішньої Палати Круцибла на спеціальне замовлення."
  components:
  - type: Sprite
    sprite: _DEN/Objects/Weapons/Guns/Battery/Mantis/mantis-pistol.rsi
  - type: Item
    sprite: _DEN/Objects/Weapons/Guns/Battery/Mantis/mantis-pistol.rsi
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Clothing
    sprite: _DEN/Objects/Weapons/Guns/Battery/Mantis/mantis-pistol.rsi
    slots:
    - Belt
    - suitStorage
  - type: Gun
    fireRate: 5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/pistol.ogg
      params:
        volume: -1
  - type: MagazineVisuals
    steps: 13
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MantisCasterPistolHoly
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        whitelist:
          tags:
          - MantisCasterPistol
  - type: Tag
    tags:
    - Sidearm
    - MantisBeltStorable

- type: entity
  parent: BaseMantisRanged
  id: MantisRangedRevolver
  name: "ОКК-П06 «Харон»"
  description: "Позолочений револьвер псіо-екстрасенса, створений для виваженого контролю та важких, прицільних ударів. Він використовує спеціальні барабани, що називаються «кастерами», кожен із яких містить ядро аномалії, що безперервно формує власні кулі. Постачається з кастерами для вигнання та заглушення, призначеними для боротьби з надприродними загрозами й бунтівними псіоніками. Розроблений для Зовнішньої Палати Круцибла на спеціальне замовлення."
  components:
  - type: Sprite
    sprite: _DEN/Objects/Weapons/Guns/Battery/Mantis/mantis-revolver.rsi
  - type: Item
    sprite: _DEN/Objects/Weapons/Guns/Battery/Mantis/mantis-revolver.rsi
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Clothing
    sprite: _DEN/Objects/Weapons/Guns/Battery/Mantis/mantis-revolver.rsi
    slots:
    - Belt
    - suitStorage
  - type: Gun
    fireRate: 2
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
      params:
        volume: -1
  - type: MagazineVisuals
    steps: 7
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MantisCasterRevolverHoly
        insertSound: /Audio/Weapons/Guns/Misc/revolver_spin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        whitelist:
          tags:
          - MantisCasterRevolver
  - type: Tag
    tags:
    - Sidearm
    - MantisBeltStorable

