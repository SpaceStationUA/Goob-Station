# Ported from TheDenSS14/TheDen (Resources/Prototypes/_DEN/Entities/Objects/Weapons/Guns/Ammunition/Cells/casters.yml)
# Adapted for this fork:
# - TheDen's ProjectileBatteryAmmoProvider is replaced by the local BatteryAmmoProvider (fires projectile protos here).
# - TheDen's PowerCellVisuals charge-level system doesn't exist here; the casters use the local
#   BatteryVisuals + GenericVisualizer pattern instead (glow shown while charged, hidden when empty).
#   The charge level is shown by the gun's MagazineVisuals mag-N states.
# - PowerCell `levels` field doesn't exist here.
# - BaseRivalCompanyContraband doesn't exist here, so the lethal casters parent BaseSyndicateContraband instead.

# Base items
- type: entity
  parent: [BaseItem, BaseMantisContraband]
  id: BaseMantisCaster
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.PowerCellVisualLayers.Base" ]
    - state: o1 # The glow layer is hidden by GenericVisualizer when the charge is depleted
      map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      shader: unshaded
  - type: Item
    size: Small
  - type: Battery # Nonlethal casters have the same maxCharge, and the fireCost varies per gun
    pricePerJoule: 0
    maxCharge: 120 # One third of PowerCellSmall in case they accidentally plug into something
    startingCharge: 120 # Not intended to be a particularly useful power source if so
  - type: EmpImmune
  - type: PowerCell
  - type: Appearance
  - type: BatteryVisuals
  - type: BatterySelfRecharger # No AutoRecharge bool in this fork - having the component recharges the cell
    autoRechargeRate: 4 # Takes 30 seconds to charge itself back to full, comparable to WeaponAdvancedLaser (but with special ammo that doesn't hurt player characters) # If this needs balanced, consider adding autoRechargePause and autoRechargePauseTime instead of just lowering it
  - type: BatteryAmmoProvider
    proto: BulletMantisCapgun # Inherited by BaseMantisCasterCapgun
    fireCost: 24 # Can fire 5 times, takes 6 seconds to recharge 1 shot (shotgun values used here as an example)
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerCellVisualLayers.Unshaded:
          Full: { visible: true }
          Neither: { visible: true }
          Empty: { visible: false }
  - type: Tag
    tags:
      - MantisCaster
      - MantisBeltStorable

- type: entity
  parent: BaseMantisCaster
  id: BaseMantisCasterLethal # Variant base for the lethal versions
  description: "A rock anomaly core harnessed as a self-replenishing ammo source. It forms diamond shards into lethal projectiles, each one perfectly faceted and catastrophically illegal. The caster is heavy and cold in the hand, as if it knows what it's for."
  abstract: true
  components:
  - type: Battery
    maxCharge: 600 # These have 5x the maxCharge so that they take 30 seconds to refill in a cell recharger, and good luck doing that under fire
    startingCharge: 600 # The guns still fire as many times as usual, because lethal casters also have 5x the fireCost
  - type: BatterySelfRecharger
    autoRechargeRate: 10 # Takes 60 seconds to charge itself back to full, so it's useless for prolonged standoffs (use other weapons for those!) # If this needs balanced, consider adding autoRechargePause and autoRechargePauseTime instead of just lowering it

- type: entity
  parent: BaseMantisCaster
  id: BaseMantisCasterCapgun # Variant base without glowing bullets and a 3x longer recharge rate
  description: "An exotic anomaly core harnessed as a self-replenishing ammo source. It generates harmless percussion caps suitable for drills and training. Despite the playful construction, the device still radiates the faint, uncanny energy of all anomaly tech."
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.PowerCellVisualLayers.Base" ]
    - state: o2
      map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      shader: shaded
  - type: BatterySelfRecharger
    autoRechargeRate: 1 # Takes 2 minutes to charge itself back to full, so people aren't too annoying with the capguns


- type: entity
  parent: BaseMantisCaster
  id: BaseMantisCasterPistol
