- type: entity
  parent: [BaseItem, BaseMantisContraband] # Just an item - not an ammo cell like the finished casters
  id: MantisCasterRevolverFrame
  name: "револьверний каркас кастера"
  description: "Незаряджений каркас псіонічного кастера з порожньою камерою, готовий до злиття із сумісним осердям аномалії."
  components:
  - type: Sprite
    sprite: _DEN/Objects/Weapons/Guns/Ammunition/Magazine/Battery/Mantis/mantis-revolver-frame.rsi
    layers:
    - state: base
      map: [ "enum.PowerCellVisualLayers.Base" ]
    - state: o6
      map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      shader: shaded
  - type: Item
    size: Small
    storedRotation: 90
  - type: Tag
    tags:
    - MantisCaster
    - MantisCasterRevolver
    - MantisCasterFrame
    - MantisCasterFrameRevolver
    - MantisBeltStorable

