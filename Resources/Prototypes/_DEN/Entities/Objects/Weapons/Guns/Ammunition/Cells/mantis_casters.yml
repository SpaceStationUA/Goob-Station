# Cryptobiolin casters
- type: entity
  parent: BaseMantisCasterPistol
  id: MantisCasterPistolCrypto
  name: "пістолет-кастер (глушіння)"
  description: "Рідке ядро аномалії використано як самовідновне джерело боєприпасів. Кожна куля несе відміряну краплю криптобіоліну, яка під час влучання приглушує ноосферний зв'язок і придушує псіоніку більш ніж на півтори хвилини. Повного магазину вистачає загалом на дев'ятнадцять хвилин. Створений для знешкодження агресивних псіоніків без заподіяння шкоди."
  components:
  - type: Sprite
    sprite: _DEN/Objects/Weapons/Guns/Ammunition/Magazine/Battery/Mantis/mantis-pistol-cryptobiolin.rsi
  - type: BatteryAmmoProvider
    proto: BulletMantisCrypto
  - type: Construction
    graph: MantisCasterPistolFuse
    node: crypto
    deconstructionTarget: null # Pirate: one-way fuse graph has no "start" node, so deconstruction is disabled.

