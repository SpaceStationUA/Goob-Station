# Boxes

- type: entity
  parent: BoxCardboard
  id: BoxSprayPaintBase
  name: box of spray paints (#{$color})
  components:
  - type: Sprite
    sprite: Objects/Storage/boxes.rsi
    state: box
  - type: Storage
    grid:
    - 0,0,7,2
    whitelist:
      tags:
      - SprayPainter
  - type: Item
    heldPrefix: box
  - type: Label
    currentLabel: Spray Paints
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SprayPaintCanBase
          amount: 4
        - id: SprayPaintCanRed
          amount: 4
        - id: SprayPaintCanGreen
          amount: 4
        - id: SprayPaintCanBlue
          amount: 4
        - id: SprayPaintCanYellow
          amount: 4
        - id: SprayPaintCanBlack
          amount: 4
        - id: SprayPaintCanWhite
          amount: 4
        - id: SprayPaintCanGrey
          amount: 4
        - id: SprayPaintCanOrange
          amount: 4
        - id: SprayPaintCanPurple
          amount: 4
        - id: SprayPaintCanBrown
          amount: 4
        - id: SprayPaintCanCopper
          amount: 4

# Crates

- type: entity
  parent: CratePlastic
  id: CrateFunSwimRings
  name: swim ring crate
  description: A crate containing eight swim rings, for your beach party occasions!
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: SwimRingRainbow
        - id: SwimRingTrans
        - !type:NestedSelector
          tableId: RandomSwimRingTable
          rolls: !type:ConstantNumberSelector
            value: 6

- type: entityTable
  id: RandomSwimRingTable
  table: !type:GroupSelector
    children:
    - id: SwimRingBlack
    - id: SwimRingBlue
    - id: SwimRingCyan
    - id: SwimRingGreen
    - id: SwimRingMagenta
    - id: SwimRingPink
    - id: SwimRingPurple
    - id: SwimRingRainbow
    - id: SwimRingRed
    - id: SwimRingTrans
    - id: SwimRingYellow
