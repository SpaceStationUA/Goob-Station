- type: entity
  name: "медіпен виживання"
  parent: ChemicalMedipen
  id: SurvivalMedipen
  description: "Містить суміш потужних лікувальних хімікатів. Повільно лікує пошкодження та стабілізує температуру тіла. Ви можете отримати передозування, якщо використаєте більше одного поспіль."
  components:
  - type: Sprite
    sprite: /Textures/_Lavaland/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: survivalpen
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: survivalpen_empty
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 40
        reagents:
          - ReagentId: MinersSalve
            Quantity: 20
          - ReagentId: Leporazine
            Quantity: 10
          - ReagentId: Epinephrine
            Quantity: 10

# doesn't get any better than this
- type: entity
  name: "люксовий медіпен"
  parent: ChemicalMedipen
  id: LuxuryMedipen
  description: "Містить потужні хімікати, що допомагають досліджувати суворі середовища. Хімікати відносно шкідливі та менш ефективні поза умовами низького тиску."
  components:
  - type: Sprite
    sprite: /Textures/_Lavaland/Objects/Specific/Medical/luxmedipen.rsi
    layers:
    - state: luxpen
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: luxpen_empty
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 50
        reagents:
        - ReagentId: Luxurium
          Quantity: 20
        - ReagentId: Leporazine
          Quantity: 10
        - ReagentId: Epinephrine
          Quantity: 10
        - ReagentId: TranexamicAcid
          Quantity: 10
