- type: entity
  parent: [ BaseKnife, BaseMantisContraband ]
  id: AntiPsychicKnife
  name: anti-psychic knife
  description: A special knife designed for killing psychics.
  components:
  - type: MeleeWeapon
    attackRate: .6666
    damage:
      types:
        Slash: 10
        Holy: 5
  - type: StaminaDamageOnHit
    damage: 0
  - type: AntiPsionicWeapon
    modifiers:
      coefficients:
        Blunt: 1.2
        Slash: 1.2
        Piercing: 1.2
        Holy: 1.2
  # Pirate: the knife delivers Cryptobiolin on hit, psionically insulating the target.
  - type: SolutionContainerManager
    solutions:
      melee:
        maxVol: 15
        reagents:
        - ReagentId: Cryptobiolin
          Quantity: 15
  - type: MeleeChemicalInjector
    transferAmount: 5
    solution: melee
  - type: RefillableSolution
    solution: melee
  - type: InjectableSolution
    solution: melee
  - type: Sprite
    sprite: Nyanotrasen/Objects/Weapons/Melee/anti_psychic_knife.rsi
    state: icon
  - type: Item
    sprite: Nyanotrasen/Objects/Weapons/Melee/anti_psychic_knife.rsi
    storedSprite:
      state: icon
      sprite: Nyanotrasen/Objects/Weapons/Melee/anti_psychic_knife.rsi
  - type: Tag
    tags:
    - ForensicBeltEquip
    - HighRiskItem
