- type: species
  id: SlimePerson
  name: species-name-slime
  roundStart: true
  prototype: MobSlimePerson
  sprites: MobSlimeSprites
  defaultSkinTone: "#b8b8b8"
  markingLimits: MobSlimeMarkingLimits
  dollPrototype: MobSlimePersonDummy
  skinColoration: Hues

- type: speciesBaseSprites
  id: MobSlimeSprites
  sprites:
    TailBehind: MobHumanoidAnyMarking # floof
    TailOversuit: MobHumanoidAnyMarking # floof
    Special: MobSlimeMarkingFollowSkin #Pirate Changes
    Face: MobHumanoidAnyMarking
    Head: MobSlimeHead
    Hair: MobSlimeMarkingFollowSkin
    FacialHair: MobSlimeMarkingFollowSkin
    UndergarmentTop: MobHumanoidAnyMarking
    UndergarmentBottom: MobHumanoidAnyMarking
    Chest: MobSlimeChest
    Groin: MobSlimeGroin
    Eyes: MobHumanoidEyes
    LArm: MobSlimeLArm
    RArm: MobSlimeRArm
    LHand: MobSlimeLHand
    RHand: MobSlimeRHand
    LLeg: MobSlimeLLeg
    RLeg: MobSlimeRLeg
    LFoot: MobSlimeLFoot
    RFoot: MobSlimeRFoot
    Tail: MobSlimeMarkingFollowSkin #Pirate Changes start
    HeadSide: MobSlimeMarkingFollowSkin #Pirate Changes end
    # Pirate: slime morph - host layers for copied race features (ears/horns, snouts, wings).
    # Routed to an "any marking" base sprite so the mimic system controls their colors directly.
    HeadTop: MobSlimeMarkingBlend # Pirate: slime morph
    Snout: MobSlimeMarkingBlend # Pirate: slime morph
    Wings: MobSlimeMarkingBlend # Pirate: slime morph

- type: markingPoints
  id: MobSlimeMarkingLimits
  points:
    # Pirate - Trauma Station hair gradients
    HairSpecial:
      points: 1
      required: false
    FacialHairSpecial:
      points: 1
      required: false
    Hair:
      points: 1
      required: false
    HeadSide:
      points: 3
      required: false
    FacialHair:
      points: 1
      required: false
    Chest:
      points: 8
      required: false
    UndergarmentBottom: # Goob
      points: 1
      required: false
    UndergarmentTop: # Goob
      points: 1
      required: false
    RightLeg:
      points: 2
      required: false
    RightFoot:
      points: 2
      required: false
    LeftLeg:
      points: 2
      required: false
    LeftFoot:
      points: 2
      required: false
    RightArm:
      points: 2
      required: false
    RightHand:
      points: 2
      required: false
    LeftArm:
      points: 2
      required: false
    LeftHand:
      points: 2
      required: false
    Tail:
      points: 1
      required: false
    # PIRATE START
    Face:
      points: 3
      required: false
    # PIRATE END
    # Pirate: slime morph - marking points for copied race features so mimicked parts fit.
    HeadTop:
      points: 3
      required: false
    Snout:
      points: 1
      required: false
    Wings:
      points: 1
      required: false
    Head:
      points: 3
      required: false
    Groin:
      points: 2
      required: false
    Overlay: # Pirate: slime morph - let morph menu offer tattoos/bandages (Накладання)
      points: 4
      required: false
    # Pirate: slime morph end

- type: humanoidBaseSprite
  id: MobSlimeMarkingFollowSkin
  markingsMatchSkin: true
  layerAlpha: 0.75

# Pirate: slime morph - empty base sprite (markings keep their own colors). The slime morph
# system writes pre-tinted, translucent colors onto copied markings, so this must NOT match skin.
- type: humanoidBaseSprite
  id: MobSlimeMarkingBlend

- type: humanoidBaseSprite
