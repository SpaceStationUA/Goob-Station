<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pirate Radio</title>
<style>
  :root {
    --bg: #14100b;
    --panel: #1f1810;
    --panel2: #2a2015;
    --accent: #d4a017;
    --accent2: #ffcf4d;
    --text: #e8dcc4;
    --dim: #9a8a6c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #app { display: flex; flex-direction: column; height: 100%; }

  #now {
    padding: 10px 12px;
    background: linear-gradient(180deg, var(--panel2), var(--panel));
    border-bottom: 1px solid #000;
    display: flex; align-items: center; gap: 10px;
  }
  #eq { width: 26px; height: 22px; display: flex; align-items: flex-end; gap: 3px; }
  #eq i {
    display: block; width: 4px; background: var(--accent2);
    height: 4px; border-radius: 1px;
    animation: bounce 900ms ease-in-out infinite;
  }
  #eq i:nth-child(2) { animation-delay: 150ms; }
  #eq i:nth-child(3) { animation-delay: 320ms; }
  #eq i:nth-child(4) { animation-delay: 470ms; }
  #eq.paused i { animation-play-state: paused; height: 4px !important; opacity: .4; }
  @keyframes bounce { 0%,100% { height: 4px; } 50% { height: 20px; } }

  #meta { flex: 1; min-width: 0; }
  #station { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #genre { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { font-size: 11px; color: var(--dim); }

  #controls { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid #000; }
  button {
    background: var(--panel2); color: var(--text);
    border: 1px solid #000; border-radius: 4px;
    padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #3a2c1c; }
  button:active { background: var(--accent); color: #000; }
  button.primary { background: var(--accent); color: #000; font-weight: 600; }
  #vol { flex: 1; accent-color: var(--accent); }

  #tabs { display: flex; border-bottom: 1px solid #000; }
  #tabs .tab {
    flex: 1; text-align: center; padding: 7px 0;
    font-size: 12px; color: var(--dim); cursor: pointer;
    background: var(--panel);
  }
  #tabs .tab.active { background: var(--panel2); color: var(--accent2); font-weight: 600; }

  #list { flex: 1; overflow-y: auto; padding: 6px; }
  .station {
    padding: 7px 10px; border-radius: 4px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .station:hover { background: var(--panel2); }
  .station.active { background: var(--accent); color: #000; }
  .station.active .g { color: #4a3600; }
  .station.dead { opacity: .35; cursor: default; }
  .station .name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .station .g { font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42%; }
  .star { color: var(--accent2); cursor: pointer; padding: 0 2px; font-size: 14px; flex: none; }
  .star.off { color: var(--dim); }
  .station.active .star { color: #000; }
  .genre {
    padding: 8px 10px; border-radius: 4px; cursor: pointer;
    display: flex; align-items: center; gap: 8px;
  }
  .genre:hover { background: var(--panel2); }
  .genre .gname { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
  .genre .cnt { font-size: 11px; color: var(--dim); }
  #back { padding: 6px 10px; font-size: 12px; color: var(--dim); cursor: pointer; flex: none; }
  #back:hover { color: var(--accent2); }
  #list::-webkit-scrollbar { width: 8px; }
  #list::-webkit-scrollbar-thumb { background: #3a2c1c; border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <div id="now">
    <div id="eq" class="paused"><i></i><i></i><i></i><i></i></div>
    <div id="meta">
      <div id="station">Pirate Radio</div>
      <div id="genre">pick a station</div>
    </div>
    <div id="status">idle</div>
  </div>
  <div id="controls">
    <button id="play" class="primary">&#9654; Play</button>
    <button id="stop">&#9632; Stop</button>
    <input id="vol" type="range" min="0" max="100" value="70">
    <span id="volpct" style="font-size:11px;color:var(--dim);width:30px;text-align:right">70%</span>
  </div>
  <div id="tabs">
    <div class="tab active" data-tab="stations">Stations</div>
    <div class="tab" data-tab="genres">Genres</div>
  </div>
  <div id="list"></div>
</div>

<script>
(function () {
  "use strict";

  var audio = new Audio();
  audio.preload = "none";
  // NOTE: no crossOrigin attribute. It would switch the media fetch into
  // CORS mode, and stream servers without Access-Control-Allow-Origin
  // (most Icecast endpoints) would fail to load - request goes out,
  // playback rejects. Plain no-cors media playback is all we need.

  var stations = [];
  var starred = {};   // id -> true (session only)
  var broken = {};    // id -> true (failed to play this session)
  var currentId = "";
  var playing = false;
  var tab = "stations";
  var genre = null;   // selected genre key in the Genres tab

  function report(action, data) {
    // Hidden-iframe navigation bridge (same as the arcade): a same-document
    // location.hash change does NOT trigger CEF's BeforeBrowse, so clicks
    // would silently never reach the game. The iframe navigation does, and
    // the C# side cancels it before any load happens.
    try {
      var tx = "r" + Date.now() + "_" + (window.__radioN = (window.__radioN || 0) + 1);
      var f = document.createElement("iframe");
      f.style.display = "none";
      f.src = "res://webres/_Pirate/WebUI/TV/tui_bridge/" + encodeURIComponent(tx) +
        "?action=" + encodeURIComponent(action) +
        (data ? ("&data=" + encodeURIComponent(JSON.stringify(data))) : "");
      document.documentElement.appendChild(f);
      setTimeout(function () { f.remove(); }, 2500);
    } catch (e) { /* ignore */ }
  }

  function el(id) { return document.getElementById(id); }

  function escapeHtml(t) {
    return String(t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Remote entries carry comma-separated tag lists; pinned ones a short
  // genre line. Split on commas; group case-insensitively, display as-is.
  function genresOf(s) {
    var out = [];
    String(s.genre || "").split(",").forEach(function (g) {
      g = g.trim();
      if (g.length > 0 && out.map(function (x) { return x.toLowerCase(); }).indexOf(g.toLowerCase()) < 0)
        out.push(g);
    });
    return out;
  }

  function stationRow(s, opts) {
    opts = opts || {};
    var row = document.createElement("div");
    row.className = "station" +
      (s.id === currentId && playing ? " active" : "") +
      (broken[s.id] ? " dead" : "");
    row.title = escapeHtml(s.label);

    var star = document.createElement("span");
    star.className = "star" + (starred[s.id] ? "" : " off");
    star.textContent = starred[s.id] ? "\u2605" : "\u2606";
    star.addEventListener("click", function (e) {
      e.stopPropagation();
      if (starred[s.id]) { delete starred[s.id]; } else { starred[s.id] = true; }
      render();
    });
    row.appendChild(star);

    var name = document.createElement("span");
    name.className = "name";
    name.textContent = s.label;
    row.appendChild(name);

    if (!opts.noGenre) {
      var g = document.createElement("span");
      g.className = "g";
      g.textContent = s.genre || "";
      row.appendChild(g);
    }

    if (broken[s.id]) {
      var dead = document.createElement("span");
      dead.className = "g";
      dead.textContent = "unavailable";
      row.appendChild(dead);
    } else {
      row.addEventListener("click", function () { select(s.id); });
    }
    return row;
  }

  function render() {
    var list = el("list");
    list.innerHTML = "";
    var playingGenre = false;

    if (tab === "genres") {
      if (genre == null) {
        var groups = {};
        stations.forEach(function (s) {
          if (broken[s.id]) return;
          genresOf(s).forEach(function (g) {
            var k = g.toLowerCase();
            if (!groups[k]) groups[k] = { name: g, count: 0 };
            groups[k].count++;
          });
        });
        var gs = Object.keys(groups).map(function (k) { return groups[k]; });
        gs.sort(function (a, b) { return b.count - a.count || a.name.localeCompare(b.name); });
        gs.forEach(function (g) {
          var row = document.createElement("div");
          row.className = "genre";
          var n = document.createElement("span");
          n.className = "gname";
          n.textContent = g.name;
          var c = document.createElement("span");
          c.className = "cnt";
          c.textContent = g.count + "";
          row.appendChild(n);
          row.appendChild(c);
          row.addEventListener("click", function () { genre = g.name.toLowerCase(); render(); });
          list.appendChild(row);
        });
      } else {
        playingGenre = true;
        var back = document.createElement("div");
        back.id = "back";
        back.textContent = "\u2190 all genres";
        back.addEventListener("click", function () { genre = null; render(); });
        list.appendChild(back);
        var inGenre = stations.filter(function (s) {
          return !broken[s.id] && genresOf(s).map(function (x) { return x.toLowerCase(); }).indexOf(genre) >= 0;
        });
        inGenre.sort(function (a, b) {
          return (starred[b.id] ? 1 : 0) - (starred[a.id] ? 1 : 0);
        });
        inGenre.forEach(function (s) { list.appendChild(stationRow(s, {})); });
      }
    } else {
      var ordered = stations.slice().sort(function (a, b) {
        return (starred[b.id] ? 1 : 0) - (starred[a.id] ? 1 : 0) ||
               (b.featured ? 1 : 0) - (a.featured ? 1 : 0);
      });
      ordered.forEach(function (s) { list.appendChild(stationRow(s, {})); });
    }
  }

  function select(id) {
    if (broken[id]) return;
    if (playing && id === currentId) { stop(true); return; }
    // Play locally right away: this runs inside the click's user-gesture
    // window, which Chromium's autoplay policy requires. The server report
    // is a notification, not a round trip (state echoes are deduped).
    play(id);
    report("play", { id: id });
  }

  function play(id) {
    var s = null;
    for (var i = 0; i < stations.length; i++) {
      if (stations[i].id === id) { s = stations[i]; break; }
    }
    if (!s) return;
    currentId = id;
    playing = true;
    el("station").textContent = s.label;
    el("genre").textContent = s.genre || "";
    el("status").textContent = "tuning...";
    el("eq").classList.remove("paused");
    el("play").classList.remove("primary");
    audio.src = s.url;
    audio.load();
    var p = audio.play();
    if (p && p.catch) {
      p.catch(function (e) {
        el("status").textContent = "cannot play: " + (e && e.name ? e.name : "unknown");
        playing = false;
        el("eq").classList.add("paused");
        el("play").classList.add("primary");
      });
    }
    render();
  }

  function stop(reportStop) {
    playing = false;
    currentId = "";
    audio.pause();
    audio.removeAttribute("src");
    audio.load();
    el("station").textContent = "Pirate Radio";
    el("genre").textContent = "pick a station";
    el("status").textContent = "idle";
    el("eq").classList.add("paused");
    el("play").classList.add("primary");
    render();
    if (reportStop) { report("stop", {}); }
  }

  audio.addEventListener("playing", function () { el("status").textContent = "on air"; });
  audio.addEventListener("waiting", function () { el("status").textContent = "buffering"; });
  audio.addEventListener("error", function () {
    if (!playing) return;
    // Remember the failure for this session and grey the station out, so a
    // dead stream does not keep looking playable in the picker.
    broken[currentId] = true;
    el("status").textContent = "stream error";
    el("eq").classList.add("paused");
    render();
  });

  el("play").addEventListener("click", function () {
    if (playing) { stop(true); }
    else if (currentId && !broken[currentId]) { select(currentId); }
    else {
      var next = stations.filter(function (s) { return !broken[s.id]; });
      if (next.length > 0) { select(next[0].id); }
    }
  });
  el("stop").addEventListener("click", function () { stop(true); });
  el("vol").addEventListener("input", function () {
    var v = Number(el("vol").value);
    audio.volume = v / 100;
    el("volpct").textContent = v + "%";
    report("volume", { v: v });
  });

  audio.volume = Number(el("vol").value) / 100;

  Array.prototype.forEach.call(document.querySelectorAll("#tabs .tab"), function (t) {
    t.addEventListener("click", function () {
      tab = t.getAttribute("data-tab");
      genre = null;
      Array.prototype.forEach.call(document.querySelectorAll("#tabs .tab"), function (x) {
        x.classList.toggle("active", x === t);
      });
      render();
    });
  });

  // ---- bridge from C# ----
  window.__radioSetCatalog = function (json) {
    try {
      var data = typeof json === "string" ? JSON.parse(json) : json;
      stations = data.stations || data;
      if (data.volume != null) {
        el("vol").value = data.volume;
        audio.volume = data.volume / 100;
        el("volpct").textContent = data.volume + "%";
      }
      render();
    } catch (e) { /* ignore */ }
  };

  window.__radioSetState = function (json) {
    try {
      var s = typeof json === "string" ? JSON.parse(json) : json;
      if (!s.playing) { stop(false); return; }
      // Already playing this station locally: the echo is our own report
      // coming back - do not restart the stream.
      if (playing && s.stationId === currentId) { return; }
      if (s.stationId && !broken[s.stationId]) { play(s.stationId); }
    } catch (e) { /* ignore */ }
  };

  report("ready", {});
})();
</script>
</body>
</html>
