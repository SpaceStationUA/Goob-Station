<!doctype html>
<!-- Pirate WebArcade spectator screen: draws relayed frames from the
     seated player's capture hook. Pure engine-side: no network. -->
<meta http-equiv="Content-Type" content="text/html;charset=utf-8">
<title>Спостерігач</title>
<style>
  html, body { margin:0; height:100%; background:#100c08; }
  .w { position:fixed; inset:0; display:flex; flex-direction:column;
       justify-content:center; align-items:center; }
  .s { color:#d8c878; font:14px/1.3 monospace; margin-bottom:8px; opacity:.8; }
  img { max-width:100%; max-height:100%; image-rendering:auto; display:none; }
  .idle { color:#6a5a44; font:16px monospace; }
</style>
<div class="w">
  <div class="s">НАГЛЯД</div>
  <div class="idle" id="idle">чекаю трансляцію від гравця…</div>
  <img id="pic">
</div>
<script>
  window.__tuiFrame = function (data) {
    var idle = document.getElementById('idle');
    if (idle) idle.style.display = 'none';
    var pic = document.getElementById('pic');
    pic.style.display = 'block';
    pic.src = 'data:image/jpeg;base64,' + data;
  };
  window.__tuiStatus = function (text) {
    document.getElementById('idle').style.display = 'block';
    document.getElementById('idle').textContent = text;
    if (text.length === 0) {
      document.getElementById('idle').style.display = 'none';
    }
  };
</script>
