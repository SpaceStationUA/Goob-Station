- type: entity
  parent: BaseStructure
  id: BlacksmithAnvil
  name: ковадло
  description: Важке металеве ковадло для кування. Завантажте сталь і куйте — електрика не потрібна.
  components:
  - type: InteractionOutline
  - type: Sprite
    noRot: true
    sprite: _Oskarrr/blacksmith/anvil.rsi
    state: anvil
  - type: Icon
    sprite: _Oskarrr/blacksmith/anvil.rsi
    state: anvil
  - type: Appearance
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 150
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Anchorable
  - type: Construction
    graph: BlacksmithAnvil
    node: anvil
  - type: Lathe
    idleState: anvil
    runningState: anvil
    staticPacks:
    - BlacksmithAnvilStatic
  - type: BlacksmithAnvil
  - type: MaterialStorage
    connectToSilo: false
    whitelist:
      tags:
      - Sheet
      - Ingot
      - RawMaterial
  - type: ActivatableUI
    key: enum.LatheUiKey.Key
  - type: UserInterface
    interfaces:
      enum.LatheUiKey.Key:
        type: LatheBoundUserInterface
