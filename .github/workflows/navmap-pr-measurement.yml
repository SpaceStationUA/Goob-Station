# SPDX-License-Identifier: AGPL-3.0-or-later
name: Navigation map PR measurement
on: pull_request
permissions:
  contents: read
jobs:
  compare:
    if: github.head_ref == 'perf/pirate-navmap-deltas'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      DOTNET_TieredCompilation: 0
    steps:
      - uses: actions/checkout@v4.2.2
      - run: git submodule update --init --recursive
      - uses: space-wizards/submodule-dependency@v0.1.5
      - run: git -C RobustToolbox submodule update --init --recursive
      - uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Content.IntegrationTests/Content.IntegrationTests.csproj
      - name: Measure the same fixture against both revisions
        shell: bash
        run: |
          git fetch --depth=1 --no-recurse-submodules origin "$BASE_SHA"
          files=(Content.{Server,Client}/Pinpointer/NavMapSystem.cs Content.Shared/Pinpointer/{NavMapComponent,SharedNavMapSystem}.cs)
          for revision in baseline candidate; do
            if [[ "$revision" == baseline ]]; then source="$BASE_SHA"; else source=HEAD; fi
            git restore --source="$source" -- "${files[@]}"
            dotnet build Content.IntegrationTests/Content.IntegrationTests.csproj -c DebugOpt --no-restore /m
            export PIRATE_NAVMAP_BENCH_OUTPUT="$RUNNER_TEMP/navmap-$revision.json"
            dotnet test bin/Content.IntegrationTests/Content.IntegrationTests.dll --filter 'FullyQualifiedName=Content.IntegrationTests.Tests._Pirate.Pinpointer.NavMapMeasurementTest.MeasureDelta' --logger 'console;verbosity=detailed' -- NUnit.ConsoleOut=1
            test -s "$PIRATE_NAVMAP_BENCH_OUTPUT"
            jq -c --arg revision "$revision" '. + {$revision}' "$PIRATE_NAVMAP_BENCH_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: navmap-comparison
          path: ${{ runner.temp }}/navmap-*.json
          if-no-files-found: error
          retention-days: 30
