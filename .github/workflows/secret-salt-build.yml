# SPDX-License-Identifier: AGPL-3.0-or-later
# Branch-only compile check for the Secret Salt 1.4 development work.
# No deployment, releases, privileged tokens, or gameplay configuration changes.
name: Secret Salt 1.4 Build

on:
  push:
    branches:
      - feature/secret-salt-1.4
    paths:
      - 'Content.Goobstation.Server/StationEvents/SecretPlus/SecretSaltPlusSystem.cs'
      - 'Content.Goobstation.Server/StationEvents/SecretPlus/SecretSaltPlusComponent.cs'
      - 'Content.Goobstation.Server/StationEvents/SecretPlus/SecretSaltPlusDiscordSender.cs'
      - 'Content.Goobstation.Common/CCVar/CCVars.Goob.cs'
      - 'Content.Goobstation.Common/SecretSalt/SecretSaltFeedbackSubmission.cs'
      - 'Content.Goobstation.Server/StationEvents/SecretPlus/SecretSaltFeedbackTracker.cs'
      - 'Content.IntegrationTests/Tests/GameRules/SecretSaltFeedbackTest.cs'
      - 'Content.IntegrationTests/Tests/GameRules/SecretSaltTelemetryTest.cs'
      - 'Content.IntegrationTests/Tests/GameRules/SecretSaltDiscordSenderTest.cs'
      - '.github/workflows/secret-salt-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-salt-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout and submodules
        uses: actions/checkout@v4.2.2
      - name: Initialize submodules
        run: git submodule update --init --recursive
      - name: Pull engine updates
        uses: space-wizards/submodule-dependency@v0.1.5
      - name: Initialize engine submodules
        run: |
          cd RobustToolbox/
          git submodule update --init --recursive
      - name: Set up .NET
        uses: actions/setup-dotnet@v4.1.0
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Compile
        run: dotnet build --configuration DebugOpt --no-restore /m
      - name: Test Secret Salt telemetry and rule starts
        timeout-minutes: 30
        env:
          DOTNET_gcServer: '1'
        run: |
          dotnet test --no-build --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj \
            --filter "FullyQualifiedName~Content.IntegrationTests.Tests.GameRules.SecretSaltTelemetryTest|FullyQualifiedName~Content.IntegrationTests.Tests.GameRules.SecretStartsTest|FullyQualifiedName~Content.IntegrationTests.Tests.GameRules.SecretSaltDiscordSenderTest|FullyQualifiedName~Content.IntegrationTests.Tests.GameRules.SecretSaltFeedbackTest" \
            --logger "console;verbosity=detailed" -- NUnit.ConsoleOut=0
