# SPDX-License-Identifier: AGPL-3.0-or-later
# Pirate: publication stays disabled until the operator enables PUBLISH_ENABLED.
name: Publish

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to CDN (requires PUBLISH_ENABLED)
        type: boolean
        default: false
  schedule:
    - cron: '0 10 * * *'

permissions:
  contents: read

concurrency:
  group: pirate-publish
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'SpaceStationUA/Goob-Station' && (github.event_name == 'workflow_dispatch' || (github.ref == 'refs/heads/master' && vars.PUBLISH_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install publish dependencies
        run: python -m pip install requests
      - name: Get engine tags
        run: git -C RobustToolbox fetch --tags --force
      - name: Restore
        run: dotnet restore
      - name: Build packaging
        run: dotnet build Content.Packaging --configuration Release --no-restore /m
      - name: Package server
        run: dotnet run --project Content.Packaging --configuration Release --no-build -- server --platform linux-x64
      - name: Package client
        run: dotnet run --project Content.Packaging --configuration Release --no-build -- client --no-wipe-release
      - uses: actions/upload-artifact@v4
        with:
          name: pirate-release
          path: release/*.zip
          retention-days: 7
      - name: Publish through restricted SSH tunnel
        if: github.ref == 'refs/heads/master' && vars.PUBLISH_ENABLED == 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          PUBLISH_SSH_KEY: ${{ secrets.PUBLISH_SSH_KEY }}
          PUBLISH_SSH_KNOWN_HOSTS: ${{ secrets.PUBLISH_SSH_KNOWN_HOSTS }}
          ROBUST_CDN_URL: http://127.0.0.1:27691/
          FORK_ID: pirate-ua
        run: |
          set -euo pipefail
          : "${PUBLISH_TOKEN:?Missing PUBLISH_TOKEN}"
          : "${PUBLISH_SSH_KEY:?Missing PUBLISH_SSH_KEY}"
          : "${PUBLISH_SSH_KNOWN_HOSTS:?Missing PUBLISH_SSH_KNOWN_HOSTS}"
          key="$RUNNER_TEMP/publish.key"
          hosts="$RUNNER_TEMP/publish.known_hosts"
          control="$RUNNER_TEMP/publish.sock"
          umask 077
          printf '%s\n' "$PUBLISH_SSH_KEY" > "$key"
          printf '%s\n' "$PUBLISH_SSH_KNOWN_HOSTS" > "$hosts"
          trap 'ssh -S "$control" -O exit ss14-publish@31.14.17.169 || true; rm -f "$key" "$hosts"' EXIT
          ssh -fNM -S "$control" -i "$key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o ExitOnForwardFailure=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -L 127.0.0.1:27691:127.0.0.1:27691 ss14-publish@31.14.17.169
          python Tools/publish_multi_request.py
